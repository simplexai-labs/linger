name: CI

# The repository gate runs on every pull request and merge-queue build; each
# app's fast check runs only when its paths change; the web check is split
# into a static job and two test shards. An unchanged app's job is skipped,
# which GitHub reports as success for its required check; a failed path
# filter makes every app check fail instead of skipping. A merge-queue build
# checks the paths its whole group changes, on top of the latest main. Pushes
# to main run every check. scripts/check-plan.mjs maps paths to checks, here
# and in `make check`. Only jobs that use BASE check out full history. CI runs
# the computer daemon's Go unit tests, and on Windows builds every daemon
# package and tests only its Windows launcher, CLI, config, local-model and
# process packages; the rest of check-computer (TS and process
# tests) and the heavier suites (node-services, voice-runtime, integration,
# containers and E2E) stay local: run `make check BASE=<target-ref>` and the
# targets in the Makefile before you open a pull request.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Keep PR and merge-queue runs cancelling stale work while letting main
  # pushes finish so shared node_modules, Go, and lint caches persist.
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  # BASE reaches commitlint, the changed-file lints, the built-in Skill
  # immutability check and the doc-comment lint.
  BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}

jobs:
  changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      web: ${{ steps.filter.outputs.web }}
      packages: ${{ steps.filter.outputs.packages }}
      teamhub-cli: ${{ steps.filter.outputs.teamhub-cli }}
      installer: ${{ steps.filter.outputs.installer }}
      desktop: ${{ steps.filter.outputs.desktop }}
      contracts: ${{ steps.filter.outputs.contracts }}
      teamhub: ${{ steps.filter.outputs.teamhub }}
      computer-go: ${{ steps.filter.outputs.computer-go }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = pull_request ]; then
            changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          elif [ "${{ github.event_name }}" = merge_group ]; then
            # Everything the queued group changes on top of the main it builds on.
            changed=$(git diff --name-only "${{ github.event.merge_group.base_sha }}" HEAD)
          else
            changed=ALL
          fi
          # scripts/check-plan.mjs maps paths to checks for CI and `make
          # check`; it uses only Node builtins, so the runner's Node runs it.
          printf '%s\n' "$changed" | node scripts/check-plan.mjs --files-from - --format github >>"$GITHUB_OUTPUT"

  repository-gate:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          go: false
          # Runs on every push to main, so it alone saves the node_modules
          # entry the other jobs restore.
          save-node-modules: ${{ github.event_name == 'push' }}
      - run: make check-repository-gate BASE="$BASE"

  web-static:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          go: false
      - run: make check-web-static BASE="$BASE"

  web-tests:
    name: web tests (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          go: false
      - run: make check-web-tests SHARD=${{ matrix.shard }}/2

  # Reports the required `check (web)` context from the split web jobs. When
  # web paths changed, every web job must succeed (an unexpected skip fails);
  # otherwise they must have been skipped. A failed path filter always fails.
  web:
    name: check (web)
    needs: [changes, web-static, web-tests]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft != true) }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WEB_CHANGED: ${{ needs.changes.outputs.web }}
          WEB_STATIC_RESULT: ${{ needs.web-static.result }}
          WEB_TESTS_RESULT: ${{ needs.web-tests.result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != success ]; then
            echo "changes job result: $CHANGES_RESULT" >&2
            exit 1
          fi
          status=0
          for job in web-static:"$WEB_STATIC_RESULT" web-tests:"$WEB_TESTS_RESULT"; do
            name=${job%%:*}
            result=${job#*:}
            if [ "$WEB_CHANGED" = true ]; then
              [ "$result" = success ] && continue
            else
              [ "$result" = success ] || [ "$result" = skipped ] && continue
            fi
            echo "$name job result: $result (web changed: $WEB_CHANGED)" >&2
            status=1
          done
          exit "$status"

  packages:
    name: check (packages)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft != true) && (needs.changes.result != 'success' || needs.changes.outputs.packages == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/check
        with:
          app: packages
          changes-result: ${{ needs.changes.result }}

  teamhub_cli:
    name: check (teamhub-cli)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft != true) && (needs.changes.result != 'success' || needs.changes.outputs['teamhub-cli'] == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/check
        with:
          app: teamhub-cli
          changes-result: ${{ needs.changes.result }}

  installer:
    name: check (installer)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft != true) && (needs.changes.result != 'success' || needs.changes.outputs.installer == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/check
        with:
          app: installer
          changes-result: ${{ needs.changes.result }}

  desktop:
    name: check (desktop)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft != true) && (needs.changes.result != 'success' || needs.changes.outputs.desktop == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/check
        with:
          app: desktop
          changes-result: ${{ needs.changes.result }}

  contracts:
    name: check (contracts)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft != true) && (needs.changes.result != 'success' || needs.changes.outputs.contracts == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/check
        with:
          app: contracts
          changes-result: ${{ needs.changes.result }}

  teamhub:
    name: check (teamhub)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft != true) && (needs.changes.result != 'success' || needs.changes.outputs.teamhub == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/check
        with:
          app: teamhub
          changes-result: ${{ needs.changes.result }}

  computer_go:
    name: check (computer-go)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft != true) && (needs.changes.result != 'success' || needs.changes.outputs['computer-go'] == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/check
        with:
          app: computer-go
          changes-result: ${{ needs.changes.result }}
      # The Codex and Claude Code the pinned localmodels kit installs, so a
      # Daemon change or a kit pin that breaks the managed Runtimes fails this
      # required check. The daily canaries cover the newest releases.
      - id: pins
        run: jq -r '.localmodelsTool.runtimeVersions | "codex=\(.codex)", "claude=\(.claude)"' apps/desktop/distribution/linux-x64.json >>"$GITHUB_OUTPUT"
      - uses: ./.github/actions/native-runtimes
        id: runtimes
        with:
          codex: ${{ steps.pins.outputs.codex }}
          claude: ${{ steps.pins.outputs.claude }}
      - name: Native compatibility of the pinned Runtimes
        env:
          LINGER_CODEX_COMPAT_EXECUTABLE: ${{ steps.runtimes.outputs.codex-executable }}
          LINGER_CLAUDE_COMPAT_EXECUTABLE: ${{ steps.runtimes.outputs.claude-executable }}
        run: |
          set -euo pipefail
          (cd apps/computer/local-daemon && go test ./internal/provider -count=1 -v \
            -run '^(TestNativeCodexAuthenticationWithoutAuthFile|TestNativeClaudeAuthenticationDoesNotCallModel|TestNativeClaudeFirstRunResume)$')
          pnpm --filter @linger/computer exec vitest run --config vitest.config.ts tests/codex-native-compat.test.ts

  # The daemon ships on Windows, and its Windows-only files build and run only
  # there. The same paths as check (computer-go) select it.
  computer_go_windows:
    name: check (computer-go-windows)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft != true) && (needs.changes.result != 'success' || needs.changes.outputs['computer-go'] == 'true') }}
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: apps/computer/local-daemon
    steps:
      - name: Fail when the path filter failed
        if: needs.changes.result != 'success'
        working-directory: .
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: |
          echo "::error::The changes job did not succeed ($CHANGES_RESULT); no check can be skipped."
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/computer/local-daemon/go.mod
          cache: false
      # Same cache policy as the Linux Go checks: pull requests restore main's
      # latest entry and only pushes to main save.
      - name: Point the Go caches at the runner temp directory
        run: |
          echo "GOCACHE=$RUNNER_TEMP/go-build" >>"$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod" >>"$GITHUB_ENV"
      - id: gomod
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/go-mod
          key: gomod-Windows-${{ runner.arch }}-${{ hashFiles('apps/computer/local-daemon/go.sum') }}
          restore-keys: gomod-Windows-${{ runner.arch }}-
      - uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/go-build
          key: go-computer-go-windows-${{ hashFiles('apps/computer/local-daemon/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-computer-go-windows-${{ hashFiles('apps/computer/local-daemon/go.sum') }}-
            go-computer-go-windows-
      # Backdating lets the prune before the save keep only the entries this
      # run used, as in the Linux Go checks.
      - if: github.event_name == 'push'
        run: |
          cache=$(cygpath -u "$GOCACHE")
          if [ -d "$cache" ]; then
            find "$cache" -type f -exec touch -m -d '2 hours ago' {} +
          fi
      # Builds every package and test for Windows, then runs the packages that
      # hold the Windows launcher, process Job, CLI and overlay path code.
      - run: go test -run '^$' ./...
      - run: go test ./cmd/linger-computer-launcher ./internal/computercli ./internal/computerconfig ./internal/localmodels ./internal/process
      # A failed run saves unpruned; the next successful push prunes.
      - if: success() && github.event_name == 'push'
        run: |
          cache=$(cygpath -u "$GOCACHE")
          if [ -d "$cache" ]; then
            find "$cache" -type f -mmin +60 -delete
          fi
      - uses: actions/cache/save@v6
        if: success() && github.event_name == 'push' && steps.gomod.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/go-mod
          key: ${{ steps.gomod.outputs.cache-primary-key }}
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && github.event_name == 'push' }}
        with:
          path: ${{ runner.temp }}/go-build
          key: go-computer-go-windows-${{ hashFiles('apps/computer/local-daemon/go.sum') }}-${{ github.sha }}
