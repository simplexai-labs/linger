name: Desktop release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-native-lifecycle:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/computer/local-daemon/go.mod
          cache: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run Windows installer lifecycle
        shell: pwsh
        run: |
          $testTemp = 'C:\LingerNativeCI'
          New-Item -ItemType Directory -Force $testTemp | Out-Null
          $env:TEMP = $testTemp
          $env:TMP = $testTemp
          $env:LINGER_TEST_PWSH = (Get-Command pwsh).Source
          pnpm exec vitest run --no-file-parallelism scripts/local-computer-windows-native.test.ts 2>&1 | Tee-Object -FilePath native-lifecycle.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-native-lifecycle-log
          path: native-lifecycle.log
          if-no-files-found: ignore
          retention-days: 14
