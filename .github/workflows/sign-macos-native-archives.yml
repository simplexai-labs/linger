name: Sign macOS native archives

# A new PostgreSQL or voice tools archive for macOS (darwin-arm64 or darwin-x64)
# holds Mach-O files with only the linker's ad-hoc signature (or unsigned), and
# Apple refuses to notarize an app that bundles one. Run this on the branch that
# pins the new archive: it signs those files with the release's Developer ID
# secrets, uploads the signed archives to the native-deps prerelease beside the
# originals, and keeps the updated distribution/darwin-*.json files as the
# `distribution` artifact for the branch owner to commit (`gh run download
# <run-id> -n distribution -D apps/desktop/distribution`). It pushes nothing: a
# commit pushed with the workflow's token would not start the pull request's
# checks. docs/desktop-release.md#bundled-archives describes the flow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sign-macos-native-archives
  cancel-in-progress: false

env:
  LINGER_NATIVE_DEPS_URL: ${{ secrets.LINGER_NATIVE_DEPS_URL || vars.LINGER_NATIVE_DEPS_URL || 'https://github.com/simplexai-labs/linger/releases/download/native-deps' }}
  LINGER_NATIVE_POSTGRES_DIR: ${{ github.workspace }}/.linger-runtime/native-archives
  # The rcodesign the Desktop release workflow pins.
  APPLE_CODESIGN_VERSION: 0.29.0
  APPLE_CODESIGN_SHA256: dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002

jobs:
  sign:
    runs-on: ubuntu-24.04
    permissions:
      # Uploads the signed archives to the native-deps prerelease.
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Install rcodesign
        run: |
          set -euo pipefail
          name="apple-codesign-$APPLE_CODESIGN_VERSION-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/rcodesign.tar.gz" \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F$APPLE_CODESIGN_VERSION/$name.tar.gz"
          echo "$APPLE_CODESIGN_SHA256  $RUNNER_TEMP/rcodesign.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/rcodesign.tar.gz" -C "$RUNNER_TEMP"
          echo "RCODESIGN=$RUNNER_TEMP/$name/rcodesign" >>"$GITHUB_ENV"
      - name: Fetch the pinned archives
        run: |
          set -euo pipefail
          for target in darwin-arm64 darwin-x64; do
            scripts/ci/desktop-release.sh fetch-native "$target"
          done
      - name: Sign
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$MACOS_DEVELOPER_ID_P12_BASE64" ]; then
            echo "::error::MACOS_DEVELOPER_ID_P12_BASE64 is not set; see docs/desktop-release.md"
            exit 1
          fi
          umask 077
          keys="$RUNNER_TEMP/signing"
          mkdir -p "$keys"
          base64 -d <<<"$MACOS_DEVELOPER_ID_P12_BASE64" >"$keys/developer-id.p12"
          printf '%s' "$MACOS_DEVELOPER_ID_PASSWORD" >"$keys/developer-id.password"
          for target in darwin-arm64 darwin-x64; do
            python3 apps/desktop/packaging/mac/sign_native_archives.py \
              --distribution "apps/desktop/distribution/$target.json" \
              --developer-id "$keys/developer-id.p12" \
              --password-file "$keys/developer-id.password" \
              --dir "$LINGER_NATIVE_POSTGRES_DIR" --rcodesign "$RCODESIGN"
          done
      - name: Remove signing files
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"
      - name: Upload the signed archives
        id: upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          changed=false
          mkdir -p "$RUNNER_TEMP/distribution"
          for target in darwin-arm64 darwin-x64; do
            dist="apps/desktop/distribution/$target.json"
            if git diff --quiet -- "$dist"; then
              continue
            fi
            changed=true
            cp "$dist" "$RUNNER_TEMP/distribution/$target.json"
            git show "HEAD:$dist" >"$RUNNER_TEMP/before-$target.json"
            node -e '
              const fs = require("fs");
              const files = (f) => { const d = JSON.parse(fs.readFileSync(f, "utf8"));
                return [...d.nativeSources, ...(d.voiceTools ?? [])].flatMap((s) => s.file ? [s.file] : []); };
              const before = new Set(files(process.argv[1]));
              for (const file of files(process.argv[2])) if (!before.has(file)) console.log(require("path").basename(file));
            ' "$RUNNER_TEMP/before-$target.json" "$dist" >"$RUNNER_TEMP/new-archives-$target"
            while read -r name; do
              [ -n "$name" ] || continue
              gh release upload native-deps "$LINGER_NATIVE_POSTGRES_DIR/$name" --repo "$GITHUB_REPOSITORY" --clobber
            done <"$RUNNER_TEMP/new-archives-$target"
          done
          echo "changed=$changed" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: steps.upload.outputs.changed == 'true'
        with:
          name: distribution
          path: ${{ runner.temp }}/distribution/*.json
      - name: Summary
        env:
          CHANGED: ${{ steps.upload.outputs.changed }}
        run: |
          {
            if [ "$CHANGED" = true ]; then
              echo "Signed archives uploaded to native-deps. Commit the new pins on \`$GITHUB_REF_NAME\`:"
              echo
              echo '```sh'
              echo "gh run download $GITHUB_RUN_ID --repo $GITHUB_REPOSITORY -n distribution -D apps/desktop/distribution"
              echo '```'
            else
              echo "Every pinned macOS archive is already signed; nothing to commit."
            fi
          } >>"$GITHUB_STEP_SUMMARY"
