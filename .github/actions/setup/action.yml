name: Set up the toolchain
description: The repository's pinned Node, pnpm and Go, a workspace install, and a BASE that shares history with HEAD; the node, install and go inputs turn off the parts a check does not use.

inputs:
  node:
    description: Set up Node. Checks that run no JavaScript pass false.
    default: "true"
  install:
    description: Set up pnpm and install workspace dependencies; needs node. Checks that only run Node scripts with builtin modules pass false.
    default: "true"
  go:
    description: Set up Go. Checks that build or run no Go pass false.
    default: "true"

runs:
  using: composite
  steps:
    # A push's `before` shares no history with HEAD after a branch's first push
    # (all zeros) or a force push that replaced the history. The checks then
    # compare HEAD with itself: the changed-file checks have nothing to check and
    # every whole-tree check still runs.
    - shell: bash
      run: |
        if ! git merge-base "$BASE" HEAD >/dev/null 2>&1; then
          echo "::notice::BASE $BASE shares no history with HEAD; the changed-file checks compare HEAD with itself."
          echo "BASE=$(git rev-parse HEAD)" >>"$GITHUB_ENV"
        fi
    # The runner image ships neither pinned version, and setup-node and
    # setup-go spend about 8 s and 15 s copying a download into the tool cache.
    # Restoring that tool cache directory takes a few seconds. The entries hold
    # only the pinned release, so their keys are the versions.
    - id: versions
      shell: bash
      run: |
        echo "node=$(tr -d '[:space:]' <.node-version)" >>"$GITHUB_OUTPUT"
        # setup-go@v5 installs the go.mod `go` directive (a full x.y.z here) and
        # ignores `toolchain`. Change this together with any setup-go bump, or
        # the restored directory stops matching the one setup-go looks for.
        echo "go=$(sed -n 's/^go //p' apps/teamhub/go.mod)" >>"$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      if: inputs.node == 'true'
      with:
        path: ${{ runner.tool_cache }}/node/${{ steps.versions.outputs.node }}
        key: toolcache-node-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.node }}
    - uses: actions/cache@v4
      if: inputs.go == 'true'
      with:
        path: ${{ runner.tool_cache }}/go/${{ steps.versions.outputs.go }}
        key: toolcache-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.go }}
    # Reads the version from packageManager in package.json.
    - uses: pnpm/action-setup@v4
      if: inputs.install == 'true'
    - uses: actions/setup-node@v4
      if: inputs.node == 'true'
      with:
        node-version-file: .node-version
        cache: ${{ inputs.install == 'true' && 'pnpm' || '' }}
    # The caller caches Go per job: setup-go's one shared entry is saved by
    # whichever job finishes first, often one that compiled no Go, and its key
    # never changes while go.sum stays the same.
    - uses: actions/setup-go@v5
      if: inputs.go == 'true'
      with:
        go-version-file: apps/teamhub/go.mod
        cache: false
    # No install scripts: none of the checks that run here loads a native addon.
    - shell: bash
      if: inputs.install == 'true'
      run: pnpm install --frozen-lockfile --ignore-scripts
