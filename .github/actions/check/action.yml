name: Check app
description: Set up the toolchain and caches for one app and run its fast check.

inputs:
  app:
    description: The app whose `make check-<app>` target runs.
    required: true
  changes-result:
    description: The changes job's result. The job runs when the path filter failed, so this step can fail it instead of letting a skip pass.
    required: true

runs:
  using: composite
  steps:
    # GitHub does not enforce required composite inputs, so anything but an
    # explicit success fails, a missing input included.
    - name: Fail when the path filter failed
      if: inputs.changes-result != 'success'
      shell: bash
      env:
        CHANGES_RESULT: ${{ inputs.changes-result }}
      run: |
        echo "::error::The changes job did not succeed (${CHANGES_RESULT:-not passed}); no check can be skipped."
        exit 1
    # TeamHub runs only Go. Computer Go tests exercise the workspace's pinned
    # QuickJS engine through the managed Node runtime.
    # Each Go check keeps its own build cache (~/.cache/go-build) per app and
    # SHA, so one job's save never replaces another's, while ~/go/pkg/mod is
    # shared across all Go jobs and workflows and saved once per go.sum change
    # by the teamhub push job on main. Pull requests and merge-queue builds
    # restore main's latest entries; only pushes to main save, and a successful
    # push keeps only the build cache entries its own run used.
    - id: plan
      shell: bash
      env:
        APP: ${{ inputs.app }}
        GO_SUM_HASH: ${{ hashFiles('apps/teamhub/go.sum', 'apps/computer/local-daemon/go.sum', 'contracts/generated/go/go.sum') }}
      run: |
        set -euo pipefail
        case "$APP" in
          teamhub) is_go=true node=false install=false ;;
          computer-go | desktop | contracts) is_go=true node=true install=true ;;
          packages | teamhub-cli | installer) is_go=false node=true install=true ;;
          *)
            echo "::error::Unknown app: $APP"
            exit 1
            ;;
        esac
        {
          echo "is_go=$is_go"
          echo "node=$node"
          echo "install=$install"
          echo "go_sum_hash=$GO_SUM_HASH"
          echo "app_prefix=go-$APP-$RUNNER_OS-"
          echo "prefix=go-$APP-$RUNNER_OS-$GO_SUM_HASH-"
        } >>"$GITHUB_OUTPUT"
    - uses: ./.github/actions/setup
      with:
        node: ${{ steps.plan.outputs.node }}
        install: ${{ steps.plan.outputs.install }}
        go: ${{ steps.plan.outputs.is_go }}
    # Cache GOMODCACHE once across all Go jobs and workflows, keyed only by
    # go.sum so main pushes do not duplicate ~350 MB of modules per app and SHA.
    - id: gomod
      uses: actions/cache/restore@v6
      if: steps.plan.outputs.is_go == 'true'
      with:
        path: ~/go/pkg/mod
        key: gomod-${{ runner.os }}-${{ runner.arch }}-${{ steps.plan.outputs.go_sum_hash }}
        restore-keys: gomod-${{ runner.os }}-${{ runner.arch }}-
    - uses: actions/cache/restore@v6
      if: steps.plan.outputs.is_go == 'true'
      with:
        path: ~/.cache/go-build
        key: ${{ steps.plan.outputs.prefix }}${{ github.sha }}
        restore-keys: |
          ${{ steps.plan.outputs.prefix }}
          ${{ steps.plan.outputs.app_prefix }}
    # Go refreshes an entry's mtime on use only when it is over an hour old, so
    # backdating everything makes the entries this run uses the only recent
    # ones. The cache is content-addressed: pruning can only cause misses,
    # never wrong results.
    - if: github.event_name == 'push' && steps.plan.outputs.is_go == 'true'
      shell: bash
      run: |
        if [ -d ~/.cache/go-build ]; then
          find ~/.cache/go-build -type f -exec touch -m -d '2 hours ago' {} +
        fi
    # Pinned golangci-lint and sqlc binaries; building them takes about 60 s
    # each. Their file names carry the tool and Go versions, and the key
    # hashes the files that pin both, so a version bump misses and rebuilds.
    - uses: actions/cache@v6
      if: inputs.app == 'teamhub'
      with:
        path: apps/teamhub/.tools/bin
        key: teamhub-tools-${{ runner.os }}-${{ hashFiles('apps/teamhub/Makefile', 'apps/teamhub/go.mod') }}
    # A cold golangci-lint analysis cache costs about 115 s. Pull requests
    # restore main's latest entry; only pushes save, so they never write one.
    - uses: actions/cache/restore@v6
      if: inputs.app == 'teamhub'
      with:
        path: ~/.cache/golangci-lint
        key: golangci-lint-${{ runner.os }}-${{ hashFiles('apps/teamhub/go.sum', '.golangci.yml') }}-${{ github.sha }}
        restore-keys: |
          golangci-lint-${{ runner.os }}-${{ hashFiles('apps/teamhub/go.sum', '.golangci.yml') }}-
    # BASE comes from the workflow env.
    - shell: bash
      env:
        APP: ${{ inputs.app }}
      run: make "check-$APP" BASE="$BASE"
    # A failed run saves unpruned; the next successful push prunes.
    - if: success() && github.event_name == 'push' && steps.plan.outputs.is_go == 'true'
      shell: bash
      run: |
        if [ -d ~/.cache/go-build ]; then
          find ~/.cache/go-build -type f -mmin +60 -delete
        fi
    # Populate the shared GOMODCACHE once per go.sum change from the teamhub
    # push job (which always runs on main) after downloading the remaining Go
    # modules so desktop, computer-go, contracts and desktop-release share it.
    - name: Populate shared Go module cache
      if: success() && github.event_name == 'push' && inputs.app == 'teamhub' && steps.gomod.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        (cd apps/computer/local-daemon && go mod download)
        (cd contracts/generated/go && go mod download)
    - uses: actions/cache/save@v6
      if: success() && github.event_name == 'push' && inputs.app == 'teamhub' && steps.gomod.outputs.cache-hit != 'true'
      with:
        path: ~/go/pkg/mod
        key: ${{ steps.gomod.outputs.cache-primary-key }}
    - uses: actions/cache/save@v6
      if: ${{ !cancelled() && github.event_name == 'push' && inputs.app == 'teamhub' }}
      with:
        path: ~/.cache/golangci-lint
        key: golangci-lint-${{ runner.os }}-${{ hashFiles('apps/teamhub/go.sum', '.golangci.yml') }}-${{ github.sha }}
    - uses: actions/cache/save@v6
      if: ${{ !cancelled() && github.event_name == 'push' && steps.plan.outputs.is_go == 'true' }}
      with:
        path: ~/.cache/go-build
        key: ${{ steps.plan.outputs.prefix }}${{ github.sha }}
