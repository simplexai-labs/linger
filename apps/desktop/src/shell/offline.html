<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src app:; form-action app:"
    />
    <title>Linger</title>
    <style>
      :root {
        --canvas: #f6f6f6;
        --surface: #ffffff;
        --ink: #202020;
        --body: #404040;
        --muted: #737373;
        --border: #e5e5e5;
        --border-strong: #d4d4d4;
        --action: #202020;
        --action-hover: #303030;
        --danger: #d92d20;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--canvas);
        color: var(--body);
        font:
          14px/1.55 Inter,
          -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          "Microsoft YaHei",
          "Noto Sans CJK SC",
          system-ui,
          sans-serif;
      }
      main {
        width: min(420px, 100%);
        padding: 36px 32px 28px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
      }
      .mark {
        position: relative;
        width: 52px;
        height: 52px;
        margin-bottom: 20px;
      }
      .mark img {
        width: 52px;
        height: 52px;
      }
      [data-mode="updating"] .actions,
      [data-mode="updating"] #reason,
      [data-mode="updating"] .code,
      [data-mode="starting"] .actions,
      [data-mode="failed"] #edit,
      [data-mode="failed"] .countdown {
        display: none;
      }
      /* Minimal centered updating layout: pure light radial canvas, no card chrome. */
      body[data-mode="updating"] {
        background: radial-gradient(
          circle at 50% 42%,
          #ffffff 0%,
          #fafaf9 58%,
          #f5f5f3 100%
        );
      }
      body[data-mode="updating"] main {
        width: auto;
        max-width: 420px;
        padding: 0;
        background: transparent;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        transform: translateY(-18px);
      }
      body[data-mode="updating"] .mark {
        width: 64px;
        height: 64px;
        margin-bottom: 20px;
        border-radius: 15px;
        overflow: hidden;
        box-shadow:
          0 14px 32px rgba(20, 20, 16, 0.11),
          0 2px 6px rgba(20, 20, 16, 0.06);
      }
      body[data-mode="updating"] .mark img {
        width: 64px;
        height: 64px;
        display: block;
      }
      body[data-mode="updating"] h1 {
        margin: 0 0 18px;
        color: #1a1a16;
        font-size: 15px;
        font-weight: 560;
        letter-spacing: -0.01em;
      }
      .update-progress {
        display: none;
      }
      body[data-mode="updating"] .update-progress {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .progress-track {
        position: relative;
        width: 248px;
        height: 4px;
        border-radius: 999px;
        background: #e9e9e5;
        overflow: hidden;
      }
      .progress-fill {
        position: relative;
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: #1a1a16;
        transition:
          width 260ms cubic-bezier(0.22, 1, 0.36, 1),
          background-color 200ms ease;
        overflow: hidden;
      }
      .progress-fill::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(255, 255, 255, 0.28) 50%,
          transparent 100%
        );
        transform: translateX(-100%);
        animation: update-shimmer 1.6s ease-in-out infinite;
      }
      body[data-mode="updating"][data-tone="rollback"] .progress-fill {
        background: #b5320a;
      }
      body[data-mode="updating"][data-tone="rollback"] .progress-fill::after {
        animation: none;
      }
      @keyframes update-shimmer {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }
      .progress-status {
        margin: 0;
        color: #78776e;
        font-size: 12.5px;
        line-height: 1.5;
        font-variant-numeric: tabular-nums;
      }
      body[data-mode="updating"][data-tone="rollback"] .progress-status {
        color: #b5320a;
      }
      /* Show Logs and Save Diagnostics belong to the start failure only. */
      body:not([data-mode="failed"]) .failed-only {
        display: none;
      }
      [data-mode="failed"] #reason {
        max-height: 40vh;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        user-select: text;
        -webkit-user-select: text;
      }
      h1 {
        margin: 0 0 6px;
        color: var(--ink);
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      .host {
        color: var(--body);
        font-weight: 500;
        word-break: break-all;
      }
      .code {
        display: inline-block;
        margin-top: 14px;
        padding: 2px 8px;
        border-radius: 6px;
        background: #f3f3f3;
        color: var(--muted);
        font:
          12px/1.6 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      .code:empty {
        display: none;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 12px;
        margin-top: 24px;
      }
      button,
      .link {
        height: 36px;
        white-space: nowrap;
        padding: 0 16px;
        border-radius: 8px;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button.primary {
        border: 0;
        background: var(--action);
        color: #fff;
      }
      button.primary:hover {
        background: var(--action-hover);
      }
      .link {
        padding: 0 4px;
        border: 0;
        background: none;
        color: var(--body);
      }
      .link:hover {
        color: var(--ink);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .countdown {
        margin-left: auto;
        color: var(--muted);
        font-size: 12px;
      }
      form {
        display: none;
        margin-top: 24px;
      }
      [data-mode="setup"] form,
      .editing form {
        display: block;
      }
      .editing .actions,
      [data-mode="setup"] .actions {
        display: none;
      }
      label {
        display: block;
        margin-bottom: 6px;
        color: var(--body);
        font-size: 13px;
        font-weight: 500;
      }
      input {
        width: 100%;
        height: 38px;
        padding: 0 12px;
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        color: var(--ink);
        font: inherit;
        outline: none;
      }
      input:focus {
        border-color: var(--ink);
        box-shadow: 0 0 0 3px rgba(32, 32, 32, 0.08);
      }
      form .row {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }
      form .row button {
        flex: none;
      }
      .hint {
        margin-top: 8px;
        font-size: 12px;
      }
      .invalid {
        color: var(--danger);
      }
      button:focus-visible,
      .link:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body data-mode="offline">
    <main>
      <div class="mark">
        <img src="app://offline/logo.png" alt="" />
      </div>
      <h1 id="title" data-t="unreachableTitle"></h1>
      <p id="reason"></p>
      <div class="update-progress" id="update-progress">
        <div
          class="progress-track"
          id="progress-track"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <p class="progress-status" id="progress-status"></p>
      </div>
      <span class="code" id="code"></span>
      <div class="actions">
        <button
          class="primary"
          id="retry"
          type="button"
          data-t="tryAgain"
        ></button>
        <button
          class="link"
          id="edit"
          type="button"
          data-t="changeServer"
        ></button>
        <button
          class="link failed-only"
          id="logs"
          type="button"
          data-t="showLogs"
        ></button>
        <button
          class="link failed-only"
          id="diagnostics"
          type="button"
          data-t="saveDiagnostics"
        ></button>
        <button
          class="link failed-only"
          id="send"
          type="button"
          data-t="sendDiagnostics"
          hidden
        ></button>
        <button
          class="link failed-only"
          id="reset"
          type="button"
          data-t="setUpAgain"
        ></button>
        <span class="countdown" id="countdown"></span>
      </div>
      <form action="app://offline/connect" method="get" id="form">
        <label for="server" data-t="serverAddress"></label>
        <input
          id="server"
          name="server"
          placeholder="https://linger.example.com"
          autocomplete="url"
          spellcheck="false"
          required
        />
        <p class="hint" id="hint" data-t="serverHint"></p>
        <div class="row">
          <button class="primary" type="submit" data-t="connect"></button>
          <button
            class="link"
            id="cancel"
            type="button"
            data-t="cancel"
          ></button>
        </div>
      </form>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      const params = new URLSearchParams(location.search);
      const server = params.get("server") ?? "";
      const error = params.get("error") ?? "";
      const connect = (value) => {
        location.href =
          "app://offline/connect?server=" + encodeURIComponent(value);
      };
      $("server").value = server;
      const local = ["updating", "starting", "failed"].find((mode) =>
        params.has(mode),
      );
      let shellProgressTimer;
      const setUpdateProgress = ({ title, detail, percent, tone } = {}) => {
        if (shellProgressTimer) {
          clearInterval(shellProgressTimer);
          shellProgressTimer = undefined;
        }
        document.body.dataset.mode = "updating";
        document.body.dataset.tone =
          tone === "rollback" ? "rollback" : "normal";
        if (typeof title === "string" && title) $("title").textContent = title;
        const pct =
          typeof percent === "number" && Number.isFinite(percent)
            ? Math.max(0, Math.min(100, Math.round(percent)))
            : undefined;
        if (pct !== undefined) {
          $("progress-fill").style.width = `${pct}%`;
          $("progress-track").setAttribute("aria-valuenow", String(pct));
        }
        if (typeof detail === "string") {
          $("progress-status").textContent =
            pct !== undefined && tone !== "rollback"
              ? `${detail} · ${pct}%`
              : detail;
        }
      };
      window.__lingerSetUpdateProgress = setUpdateProgress;

      if (local === "updating") {
        const rawPercent = params.get("percent");
        const parsedPercent =
          rawPercent !== null && rawPercent !== "" ? Number(rawPercent) : NaN;
        const initialTitle = params.get("title") || t("updatingTitle");
        const initialDetail = params.get("detail") || t("updating");
        const initialTone =
          params.get("tone") === "rollback" ? "rollback" : "normal";
        if (Number.isFinite(parsedPercent)) {
          setUpdateProgress({
            title: initialTitle,
            detail: initialDetail,
            percent: parsedPercent,
            tone: initialTone,
          });
        } else {
          // Legacy Shell update without explicit percentage: smooth visual glide.
          let synthetic = 18;
          setUpdateProgress({
            title: initialTitle,
            detail: initialDetail,
            percent: synthetic,
            tone: initialTone,
          });
          shellProgressTimer = setInterval(() => {
            synthetic = Math.min(
              88,
              synthetic + Math.max(1, Math.round((90 - synthetic) * 0.12)),
            );
            $("progress-fill").style.width = `${synthetic}%`;
            $("progress-track").setAttribute(
              "aria-valuenow",
              String(synthetic),
            );
            $("progress-status").textContent =
              `${initialDetail} · ${synthetic}%`;
            if (synthetic >= 88) {
              clearInterval(shellProgressTimer);
              shellProgressTimer = undefined;
            }
          }, 900);
        }
      } else if (local === "starting") {
        document.body.dataset.mode = "starting";
        $("title").textContent = t("startingTitle");
        $("reason").textContent = t("starting");
      } else if (local === "failed") {
        document.body.dataset.mode = "failed";
        $("title").textContent = t("failedTitle");
        $("reason").textContent = params.get("failed");
      } else if (!server) {
        document.body.dataset.mode = "setup";
        $("title").textContent = t("setupTitle");
        $("reason").textContent = t("setup");
        // Setup, where Linger can also be installed on this computer.
        $("cancel").textContent = t("backToSetup");
        $("server").focus();
      } else {
        $("reason").replaceChildren(
          ...tSpans("unreachable", { host: new URL(server).host }),
        );
        $("code").textContent = error;
      }
      // An address that is not one comes as a code, worded here; any other
      // text that is not a network error code shows as it is.
      if (error && !error.startsWith("ERR_")) {
        $("hint").textContent =
          error === "invalid-server" ? t("invalidServer") : error;
        $("hint").classList.add("invalid");
        if (server) document.body.classList.add("editing");
      }
      $("retry").addEventListener("click", () => {
        if (local === "failed") location.href = "app://offline/restart";
        else connect(server);
      });
      // Opens the log folder or saves the diagnostics zip and shows it.
      $("logs").addEventListener("click", () => {
        location.href = "app://offline/logs";
      });
      $("diagnostics").addEventListener("click", () => {
        location.href = "app://offline/diagnostics";
      });
      // Asks before sending, in a dialog of the main process.
      $("send").hidden = !params.has("send");
      $("send").addEventListener("click", () => {
        location.href = "app://offline/send";
      });
      $("edit").addEventListener("click", () => {
        document.body.classList.add("editing");
        $("server").select();
      });
      $("reset").addEventListener("click", () => {
        location.href = "app://offline/reset";
      });
      $("cancel").addEventListener("click", () => {
        if (document.body.dataset.mode === "setup")
          location.href = "app://offline/setup";
        else document.body.classList.remove("editing");
      });
      // Retry on its own while the user is not editing.
      if (server && !local) {
        let left = 15;
        const tick = () => {
          if (document.body.classList.contains("editing")) {
            $("countdown").textContent = "";
            return;
          }
          left -= 1;
          if (left <= 0) return connect(server);
          $("countdown").textContent = t("retrying", { seconds: left });
        };
        tick();
        setInterval(tick, 1000);
      }
    </script>
  </body>
</html>
