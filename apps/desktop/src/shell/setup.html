              type="button"
              data-t="cancel"
            ></button>
          </div>
        </form>
      </div>
    </main>

    <script>
      const setup = window.lingerSetup;
      const $ = (id) => document.getElementById(id);
      // The steps of connecting to a team server.
      const ORDER = ["server", "signin", "connect", "permissions"];
      const check = '<svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>';
      let state;
      let step;
      // The one action in flight; every control waits for it.
      let pending = null;
      // Whether the full failure message is unfolded.
      let detailsOpen = false;
      let shownDiagnostics;

      // What each macOS permission is for, and what goes wrong without it.
      const PERMISSIONS = {
        "full-disk": { about: "fullDiskAbout", missing: "fullDiskMissing" },
        folders: { about: "userFoldersAbout", missing: "userFoldersMissing" },
        automation: { about: "automationAbout", missing: "automationMissing" },
      };

      // The runtimes setup names.
      const RUNTIMES = {
        recommended: "",
        codex: "Codex",
        claude: "Claude Code",
        pi: "Pi",
      };
      // The installing steps, as the main process reports them; it says
      // which of them this installation shows.
      const ALL_STEPS = [
        ["prepare", () => t("stepPrepare")],
        // A version is an identifier, so its digits stay as they are.
        [
          "download",
          () => t("stepDownload", { version: String(state.version) }),
        ],
        ["services", () => t("stepServices")],
        ["workspace", () => t("stepWorkspace")],
        [
          "signin",
          () => {
            const runtime = RUNTIMES[state.localServer.signIn?.runtime];
            return runtime
              ? t("stepSignIn", { runtime })
              : t("stepSignInRuntime");
          },
        ],
        ["connect", () => t("stepConnect")],
        ["agents", () => t("stepAgents")],
      ];
      const gigabytes = (bytes) => Math.round(bytes / 1024 ** 3) + " GB";
      // Download sizes: MB below a gigabyte, one decimal GB above.
      const size = (bytes) =>
        bytes < 1024 ** 3
          ? Math.max(0, Math.round(bytes / 1024 ** 2)) + " MB"
          : (bytes / 1024 ** 3).toFixed(1) + " GB";
      const duration = (seconds) => {
        const minutes = Math.round(seconds / 60);
        if (minutes < 1) return t("lessThanMinuteLeft");
        if (minutes < 60) return t("minutesLeft", { minutes });
        const hours = Math.floor(minutes / 60);
        return minutes % 60
          ? t("hoursMinutesLeft", { hours, minutes: minutes % 60 })
          : t("hoursLeft", { hours });
      };
      // A download as the localmodels tool or the installer counts it: how
      // much of how much, what remains, and the rate and time left when the
      // source reports a rate. A count of one file of several says only
      // that file's bytes, since nothing says what remains after it.
      const transferParts = (transfer) => {
        const { completed, total, bytesPerSecond: rate, partial } = transfer;
        const left = total && !partial ? total - completed : undefined;
        const amount = total
          ? t("amountOf", { done: size(completed), total: size(total) })
          : size(completed);
        return [
          partial ? t("thisFile", { amount }) : amount,
          left !== undefined && t("amountLeft", { size: size(left) }),
          rate > 0 && size(rate) + "/s",
          rate > 0 && left !== undefined && duration(left / rate),
        ].filter(Boolean);
      };
      // Long folders keep their start and their end.
      const shortPath = (value) =>
        value.length <= 46
          ? value
          : value.slice(0, 18) + "…" + value.slice(-27);
      // Why the installation stopped: in the page's words when the main
      // process names the reason, else the message it passed on.
      const failureText = (local) =>
        local.failure === "runtime_lookup_timed_out"
          ? t("runtimeLookupTimedOut")
          : local.failure === "runtime_lookup_unreachable"
            ? t("runtimeLookupUnreachable")
            : local.message;
      // What step 2 offers first: the local model when the localmodels tool
      // picked it for this computer and no subscription runtime is signed
      // in already; else the subscription. BYOK is never the advice.
      const defaults = () => {
        const local = state.localServer;
        const models = local.localModels;
        const signedIn = (local.runtimes ?? []).some(
          (row) => row.runtime !== "pi" && row.signedIn,
        );
        return models.state === "checked" &&
          models.recommendation === "local-models" &&
          models.eligible &&
          models.model &&
          !signedIn &&
          !modelBehind(local)
          ? "local"
          : "subscription";
      };
      // The source picked on step 1: local, subscription or byok.
      let source;
      // Whether the person picked it; until then it follows defaults().
      let picked = false;
      // Where the welcome is: checking this computer, choosing a source, or
      // the chosen source's settings.
      let stage;
      let slowCheck = false;
      let slowTimer = 0;
      let motionTimer = 0;
      let runtimesAsked = false;
      // More options: the install location and app keys.
      let options = false;
      // Also download the local model in the background.
      let background = false;
      // The sign-in a new installation creates, and the sheet's draft of it.
      let credentials = null;
      let editing = null;
      // What a runtime row just copied: { runtime, what }.
      let runtimeCopied;
      const enterStage = (next, motion) => {
        const section = document.querySelector('[data-step="welcome"]');
        stage = next;
        section.dataset.stage = next;
        clearTimeout(motionTimer);
        if (motion) {
          section.dataset.motion = motion;
          motionTimer = setTimeout(() => delete section.dataset.motion, 320);
        } else delete section.dataset.motion;
        clearTimeout(slowTimer);
        slowCheck = false;
        // A check that runs long offers a way on without it.
        if (next === "checking")
          slowTimer = setTimeout(() => {
            slowCheck = true;
            render();
          }, 8000);
      };
      // Moves between the welcome's stages and says where it went.
      const setStage = (next, motion) => {
        enterStage(next, motion);
        render();
        $("welcome-title").focus({ preventScroll: true });
        $("welcome-live").textContent = $("welcome-title").textContent;
      };
      // The local model still downloading after the person left its wait.
      const modelBehind = (local) =>
        local.backgroundModel?.state === "downloading" &&
        local.phase === "idle";
      const modelPercent = (model) =>
        model?.total
          ? Math.min(99, Math.floor((model.completed / model.total) * 100))
          : 0;
      const runtimeRows = (local) =>
        Object.fromEntries(
          (local.runtimes ?? []).map((row) => [row.runtime, row]),
        );
      // A generated password: four groups of five characters that cannot
      // be mistaken for one another, drawn without bias.
      const PASSWORD_ALPHABET =
        "abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      const generatePassword = () => {
        const chars = [];
        const limit = 256 - (256 % PASSWORD_ALPHABET.length);
        while (chars.length < 20) {
          for (const byte of crypto.getRandomValues(new Uint8Array(32))) {
            if (byte >= limit || chars.length === 20) continue;
            chars.push(PASSWORD_ALPHABET[byte % PASSWORD_ALPHABET.length]);
          }
        }
        return [0, 5, 10, 15]
          .map((at) => chars.slice(at, at + 5).join(""))
          .join("-");
      };
      const freshCredentials = () => ({
        email: "owner@linger.local",
        password: generatePassword(),
        generated: true,
      });
      // The server's rules for an owner sign-in
      // (packages/local-installation/src/account.ts).
      const OWNER_EMAIL =
        /^[a-z0-9!#$%&'*+/=?^_`{|}~-]+(?:\.[a-z0-9!#$%&'*+/=?^_`{|}~-]+)*@[a-z0-9](?:[a-z0-9-]*[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)+$/;
      const EMAIL_PROBLEMS = new Set(["emailInvalid", "emailTooLong"]);
      const PASSWORD_PROBLEMS = new Set([
        "passwordTooShort",
        "passwordTooLong",
        "passwordControl",
      ]);
      const credentialsProblem = (draft) => {
        const email = draft.email.trim().toLowerCase();
        if (email.length > 320 || email.indexOf("@") > 100)
          return "emailTooLong";
        if (!OWNER_EMAIL.test(email)) return "emailInvalid";
        if (draft.password.length < 8) return "passwordTooShort";
        if (draft.password.length > 256) return "passwordTooLong";
        if (/\p{Cc}/u.test(draft.password)) return "passwordControl";
        if (draft.password !== draft.confirm) return "passwordMismatch";
        return "";
      };
      // BYOK. Requests go to the base URL + path + endpoint, used verbatim;
      // path and endpoint are optional, and a grey value is the default that
      // is sent. The wire format follows the end of that address, else the
      // runtime's own, so Bifrost passes the runtime's requests through.
      // Nothing probes: Test sends one request to that one address.
      // Keep these format endings, runtime defaults and path validation in
      // sync with packages/service-kit/src/byok-endpoint.ts (source of truth).
      const BYOK_FORMATS = {
        "openai-chat": {
          suffix: "/chat/completions",
          label: "OpenAI Chat Completions",
        },
        "openai-responses": { suffix: "/responses", label: "OpenAI Responses" },
        anthropic: { suffix: "/messages", label: "Anthropic Messages" },
      };
      const RUNTIME_FORMATS = {
        claude: "anthropic",
        codex: "openai-responses",
        pi: "openai-chat",
      };
      const DEFAULT_PATH = "/v1";
      const PATH_OPTIONS = [
        { value: "/v1", label: t("pathMostProviders") },
        { value: "/api/paas/v4", label: t("pathZhipu") },
        { value: "/api/v3", label: t("pathVolcano") },
        { value: "/v1beta/openai", label: "Gemini" },
        { value: "", label: t("pathNone") },
      ];
      const ENDPOINT_OPTIONS = [
        ...Object.values(BYOK_FORMATS).map((format) => ({
          value: format.suffix,
          label: format.label,
        })),
        { value: "", label: t("endpointNone") },
      ];
      // What the installer accepts as a path or endpoint: empty, or whole
      // segments, so neither can change the base URL's host.
      const BYOK_URL_PATH = /^(\/[^/?#\s\\]+)*$/;
      const ICONS = {
        refresh:
          '<svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 6.4A5.3 5.3 0 0 0 3.4 4.6M2.8 9.6a5.3 5.3 0 0 0 9.8 1.8M3.2 2.2v2.6h2.6M12.8 13.8v-2.6h-2.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        chevron:
          '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2.5 3.8 5 6.3l2.5-2.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        selected:
          '<svg class="opt-check" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="m3.5 8.5 3 3 6-7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        ok: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m5.2 8.2 1.9 1.9 3.7-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        err: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 4.6v4.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11.2" r="0.9" fill="currentColor"/></svg>',
        close:
          '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="m2 2 6 6M8 2 2 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
      };
      const esc = (value) =>
        String(value).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const urlHtml = (url) => '<span class="url">' + esc(url) + "</span>";
      // A message with <url> spans, as HTML for the places that build it.
      const tHtml = (name, values) =>
        tSpans(name, values)
          .map((node) =>
            typeof node === "string" ? esc(node) : node.outerHTML,
          )
          .join("");
      const contextLabel = (tokens) =>
        tokens >= 1024 ** 2
          ? Math.round((tokens / 1024 ** 2) * 10) / 10 + "M"
          : Math.round(tokens / 1024) + "k";
      // A typed path gains its leading slash and loses trailing ones.
      const normalizePath = (value) => {
        const trimmed = value.trim().replace(/\/+$/, "");
        return trimmed && !trimmed.startsWith("/") ? "/" + trimmed : trimmed;
      };
      // An IPC error's own message, without Electron's prefix.
      const ipcMessage = (error) =>
        String(error?.message ?? error).replace(
          /^Error invoking remote method '[^']+': (Error: )?/,
          "",
        );
      // Asks the main process to test or list an endpoint. The answer comes
      // back in the state the command returns; nothing else waits for it.
      const byokAsk = async (command, field) => {
        try {
          state = await setup.run(command);
          return (
            state.localServer[field] ?? {
              state: "failed",
              message: t("noAnswer"),
            }
          );
        } catch (error) {
          return { state: "failed", message: ipcMessage(error) };
        }
      };

      // A combobox: type anything, or pick a suggestion from its list.
      const combos = [];
      const closeCombos = () => {
        for (const combo of combos) combo.open = false;
      };
      const combobox = (root, cfg) => {
        root.classList.add("cb");
        root.innerHTML = `
          <input class="cb-input" id="${cfg.id}" role="combobox"
            aria-autocomplete="none" aria-expanded="false"
            aria-controls="${cfg.id}-menu" autocomplete="off" spellcheck="false"
            placeholder="${esc(cfg.placeholder)}" aria-label="${esc(cfg.label)}" />
          <button type="button" class="cb-caret" tabindex="-1"
            aria-label="${esc(t("showSuggestions", { field: cfg.label }))}">${ICONS.chevron}</button>
          <div class="cb-menu" id="${cfg.id}-menu" role="listbox"
            aria-label="${esc(cfg.label)}" hidden></div>`;
        const input = root.querySelector(".cb-input");
        const caret = root.querySelector(".cb-caret");
        const menu = root.querySelector(".cb-menu");
        const combo = { root, input, open: false };
        let menuHtml = "";
        const openMenu = (focusFirst) => {
          closeCombos();
          combo.open = true;
          render();
          if (focusFirst)
            (
              menu.querySelector('[aria-selected="true"]') ||
              menu.querySelector("button")
            )?.focus();
        };
        input.addEventListener("input", () => {
          cfg.set(input.value);
          combo.open = false;
          render();
        });
        input.addEventListener("blur", () => {
          cfg.commit();
          render();
        });
        input.addEventListener("keydown", (event) => {
          if (event.key === "ArrowDown") {
            event.preventDefault();
            openMenu(true);
          } else if (event.key === "Enter") {
            // Commits the value; inside a form it does not submit it.
            event.preventDefault();
            cfg.commit();
            closeCombos();
            render();
          }
        });
        caret.addEventListener("mousedown", (event) => event.preventDefault());
        caret.addEventListener("click", () => {
          if (combo.open) {
            closeCombos();
            render();
          } else {
            openMenu(false);
            input.focus();
          }
        });
        menu.addEventListener("mousedown", (event) => event.preventDefault());
        menu.addEventListener("click", (event) => {
          const option = event.target.closest("[data-value]");
          if (!option) return;
          cfg.set(option.dataset.value);
          cfg.commit();
          closeCombos();
          render();
          input.focus();
        });
        menu.addEventListener("keydown", (event) => {
          if (event.key !== "ArrowDown" && event.key !== "ArrowUp") return;
          event.preventDefault();
          const options = [...menu.querySelectorAll("button")];
          const at = options.indexOf(document.activeElement);
          const step = event.key === "ArrowDown" ? 1 : -1;
          options[(at + step + options.length) % options.length]?.focus();
        });
        combo.sync = () => {
          const value = cfg.get();
          if (input.value !== value) input.value = value;
          root.dataset.default = String(Boolean(cfg.isDefault?.()));
          root.dataset.open = String(combo.open);
          input.setAttribute("aria-expanded", String(combo.open));
          menu.hidden = !combo.open;
          if (!combo.open) {
            menuHtml = "";
            return;
          }
          const option = (item) => `
            <button type="button" role="option" data-value="${esc(item.value)}"
              aria-selected="${item.value === value}">
              <span class="opt-main">${item.value ? esc(item.value) : "-"}</span>
              ${
                item.label || item.tag
                  ? `<span class="opt-label">${esc(item.label || "")}${
                      item.tag ? `<em>${esc(item.tag)}</em>` : ""
                    }</span>`
                  : ""
              }
              ${ICONS.selected}
            </button>`;
          // Notes are HTML their callers escaped.
          const html =
            (cfg.heading ? `<div class="cb-head">${cfg.heading}</div>` : "") +
            cfg
              .items()
              .map((item) =>
                item.note === undefined
                  ? option(item)
                  : `<div class="cb-note" data-tone="${item.tone || ""}">${item.note}</div>`,
              )
              .join("");
          if (html !== menuHtml) {
            menu.innerHTML = html;
            menuHtml = html;
          }
        };
        combos.push(combo);
        return combo;
      };

      // The BYOK fields, built once for the setup form and once for the
      // sign-in dialog. runtimeOf() names the runtime the endpoint serves,
      // which picks the default endpoint and format; changed() runs on every
      // edit.
      const byokForms = [];
      const byokFields = (root, prefix, runtimeOf, changed) => {
        root.innerHTML = `
          <div class="ep">
            <span class="ep-base-wrap"><input class="ep-base" id="${prefix}-url"
              type="url" autocomplete="off" spellcheck="false"
              aria-label="${esc(t("baseUrl"))}"
              placeholder="${esc(t("baseUrlPlaceholder"))}" /></span>
            <div></div>
            <div></div>
          </div>
          <input class="byok-key" id="${prefix}-key" type="password"
            autocomplete="off" spellcheck="false" aria-label="${esc(t("apiKey"))}"
            placeholder="${esc(t("apiKeyPlaceholder"))}" />
          <div class="model-row">
            <div class="standalone"></div>
            <button type="button" class="change list-btn" id="${prefix}-list"
              aria-label="${esc(t("listModels"))}" title="${esc(t("listModels"))}">${ICONS.refresh}</button>
            <button type="button" class="change test-btn" id="${prefix}-test">${esc(t("test"))}</button>
            <div class="byok-toast" id="${prefix}-toast" role="status"
              aria-live="polite" hidden></div>
          </div>
          <div class="byok-status" id="${prefix}-status" aria-live="polite"></div>`;
        const blank = () => ({
          baseUrl: "",
          path: DEFAULT_PATH,
          // null follows the runtime's default.
          endpoint: null,
          apiKey: "",
          modelId: "",
        });
        let f = blank();
        // The latest test and model listing; each sequence number drops an
        // answer to a request the fields have changed since.
        let check = null;
        let models = null;
        let checkSeq = 0;
        let modelSeq = 0;
        let toast = null;
        let toastTimer = 0;
        let toastShown = "";

        const defaultEndpoint = () =>
          BYOK_FORMATS[RUNTIME_FORMATS[runtimeOf()]].suffix;
        const endpointValue = () => f.endpoint ?? defaultEndpoint();
        const baseUrl = () => f.baseUrl.trim().replace(/\/+$/, "");
        const apiRoot = () => baseUrl() + normalizePath(f.path);
        const requestUrl = () => apiRoot() + normalizePath(endpointValue());
        const modelsUrl = () => apiRoot() + "/models";
        const format = () => {
          const url = requestUrl();
          for (const [protocol, { suffix }] of Object.entries(BYOK_FORMATS))
            if (url.endsWith(suffix)) return { protocol, fromUrl: true };
          return { protocol: RUNTIME_FORMATS[runtimeOf()], fromUrl: false };
        };
        const validParts = () =>
          [normalizePath(f.path), normalizePath(endpointValue())].every(
            (part) => part.length <= 256 && BYOK_URL_PATH.test(part),
          );
        const addressed = () => baseUrl() !== "" && validParts();
        const complete = () => addressed() && f.modelId.trim() !== "";
        const endpoint = () => {
          const apiKey = f.apiKey.trim();
          return {
            baseUrl: baseUrl(),
            path: normalizePath(f.path),
            endpoint: normalizePath(endpointValue()),
            protocol: format().protocol,
            ...(apiKey ? { apiKey } : {}),
          };
        };

        // The test result floats under Test: a success fades on its own, a
        // failure stays until dismissed or the fields change.
        const showToast = () => {
          clearTimeout(toastTimer);
          toast = { leaving: false };
          if (check?.state === "ready")
            toastTimer = setTimeout(hideToast, 3500);
        };
        const hideToast = () => {
          clearTimeout(toastTimer);
          if (!toast || toast.leaving) return;
          toast.leaving = true;
          render();
          toastTimer = setTimeout(() => {
            toast = null;
            render();
          }, 200);
        };
        const resetResults = (all) => {
          checkSeq += 1;
          check = null;
          clearTimeout(toastTimer);
          toast = null;
          if (all) {
            modelSeq += 1;
            models = null;
          }
        };
        const edit = (next, all) => {
          f = { ...f, ...next };
          resetResults(all);
          changed();
        };

        const base = root.querySelector(".ep-base");
        base.addEventListener("input", () => {
          edit({ baseUrl: base.value }, true);
          render();
        });
        base.addEventListener("blur", () => {
          if (baseUrl() !== f.baseUrl) f = { ...f, baseUrl: baseUrl() };
          base.scrollLeft = 0;
          render();
        });
        const [pathBox, endpointBox] = root.querySelectorAll(".ep > div");
        const path = combobox(pathBox, {
          id: prefix + "-path",
          label: t("path"),
          heading: esc(t("pathHeading")),
          placeholder: "-",
          get: () => f.path,
          set: (value) => edit({ path: value }, true),
          commit: () => {
            f = { ...f, path: normalizePath(f.path) };
          },
          isDefault: () => f.path === DEFAULT_PATH,
          items: () =>
            PATH_OPTIONS.map((option) => ({
              ...option,
              tag: option.value === DEFAULT_PATH ? t("defaultTag") : "",
            })),
        });

        document.body.append(canvas);
        const ratio = devicePixelRatio || 1;
        const width = innerWidth;
        const height = innerHeight;
        canvas.width = width * ratio;
        canvas.height = height * ratio;
        const ctx = canvas.getContext("2d");
        ctx.scale(ratio, ratio);
        const colors = [
          "#1b1b19",
          "#f2c94c",
          "#eb5757",
          "#2f9e44",
          "#2d9cdb",
          "#bb6bd9",
          "#f2994a",

        for (const side of [-1, 1])
          for (let i = 0; i < 90; i++) {
            const angle =
              ((side < 0 ? 60 : 120) + (Math.random() - 0.5) * 40) *
              (Math.PI / 180);
            const speed = 9 + Math.random() * 9;
            pieces.push({
              x: side < 0 ? -10 : width + 10,
              y: height * 0.75,
              vx: Math.cos(angle) * speed,
              vy: -Math.sin(angle) * speed,
              size: 5 + Math.random() * 5,
              spin: Math.random() * Math.PI,
              turn: (Math.random() - 0.5) * 0.3,
              wobble: Math.random() * 10,
              color: colors[i % colors.length],
              round: Math.random() < 0.3,

          const age = (now - begun) / 1000;
          ctx.clearRect(0, 0, width, height);
          ctx.globalAlpha = Math.min(1, Math.max(0, 3.2 - age));
          for (const p of pieces) {

        const working = Object.values(rows).find(
          (row) => row.state === "installing" || row.state === "signing_in",
        );
        const settings = available && stage === "settings";
        const choosing = available && stage === "choose";
        const checkingStage = available && stage === "checking";

        // The bar above the title: Back, the badge or the local model's
        // progress, and More options.
        $("stage-bar").hidden = !available;
        $("source-back").hidden = !settings;
        $("model-behind").hidden = !behind;
        $("welcome-eyebrow").hidden = behind;
        if (behind) {
          const percent = modelPercent(local.backgroundModel);
          $("model-behind-fill").style.width = percent + "%";
          $("model-behind-text").textContent = t("modelBehind", { percent });
        }
        $("local-customize").hidden = !settings;
        $("local-customize").setAttribute("aria-expanded", String(options));
        $("local-customize").textContent = t(
          options ? "fewerOptions" : "moreOptions",
        );

        const NAMES = {
          local: t("localModel"),
          byok: "BYOK",
          subscription: t("subscription"),
        };
        $("welcome-title").textContent = settings
          ? NAMES[source]
          : t("welcomeTitle");
        $("welcome-lead").textContent = !available
          ? t("welcomeLeadTeam")
          : !settings
            ? t("welcomeLeadLocal")
            : source === "local"
              ? models.gpu
                ? t("leadLocalGpu", { gpu: models.gpu })
                : t("leadLocal")
              : source === "byok"
                ? t("leadByok")
                : t("leadSubscription");

        // Checking: what runs now, and a way on when it runs long.
        $("welcome-checking").hidden = !checkingStage;
        const fetching = checking ? models.download : undefined;
        const now =
          '<span class="spinner"></span>' +
          esc(t(fetching ? "downloadingTools" : "checkingComputer"));
        if ($("checking-now").innerHTML !== now)
          $("checking-now").innerHTML = now;
        $("checking-why").textContent = slowCheck
          ? t("checkingSlow")
          : fetching
            ? transferParts(fetching).join(" · ")
            : t("checkingWhy");
        $("checking-skip").hidden = !slowCheck;

        $("local-setup").hidden = !choosing && !settings;
        $("source-grid").hidden = !choosing;
        $("source-panel").hidden = !settings || options;
        $("local-options").hidden = !settings || !options;

        // The cards. Recommended marks the advice once the check gave it;
        // a card that cannot be picked says why in its place.
        const localCard = document.querySelector(
          '.source-card[data-value="local"]',
        );
        const pill = behind
          ? ["pillDownloading", false]
          : checking
            ? ["pillChecking", false]
            : held
              ? ["pillOnHold", true]
              : !model
                ? ["pillUnavailable", false]
                : undefined;
        $("source-local-pill").hidden = !pill;
        if (pill) {
          $("source-local-pill").textContent = t(pill[0]);
          $("source-local-pill").dataset.warn = String(pill[1]);
        }
        $("source-local-meta").textContent = behind
          ? t("localMetaBehind", {
              percent: modelPercent(local.backgroundModel),
            })
          : checking
            ? t("checkingComputer")
            : model
              ? [
                  model.name,
                  model.downloadBytes != null && size(model.downloadBytes),
                ]
                  .filter(Boolean)
                  .join(" · ")
              : held
                ? heldLine(models)
                : t("localNotAvailable");
        $("source-sub-meta").textContent = signedIn.length
          ? t("subMetaSignedIn", {
              runtimes: signedIn.map((runtime) => RUNTIMES[runtime]).join(", "),
            })
          : t("subMetaNone");
        for (const card of document.querySelectorAll(".source-card")) {
          const value = card.dataset.value;
          const off = value === "local" && !localUsable;
          card.disabled = busy || off;
          card.setAttribute("aria-checked", String(source === value));
          // One card takes Tab; the arrows move between them.
          card.tabIndex = source === value ? 0 : -1;
          card.querySelector(".source-rec").hidden =
            !known || off || value !== recommended;
        }
        if (localCard.disabled && source === "local" && !busy)
          localCard.tabIndex = 0;

        // Why the local model cannot be picked, under the cards.
        const unavailableText = known
          ? models.state === "checked"
            ? reasonsText(models, false)
            : t("cannotCheck")
          : "";
        $("plan-why").textContent = !choosing
          ? ""
          : behind || model
            ? ""
            : held
              ? t("heldWhy", { reasons: reasonsText(models, true) })
              : unavailableText;
        $("plan-why").hidden = !$("plan-why").textContent;
        renderDriver(local, models, busy, choosing && !behind);

        // The featured model, on the first step when it is the one this
        // computer would run, and with the local model's settings.
        const shown = model || heldModel;
        const featured = Boolean(shown?.featuredInkling);
        const featuredPick = Boolean(model?.featuredInkling) && !behind;
        $("featured-spotlight").hidden =
          !choosing || !featuredPick || recommended !== "local";
        $("featured-spotlight").dataset.recommended = "true";
        $("featured-spotlight-note").textContent = t("featuredModelSelected");
        $("featured-spotlight-link").textContent = t("learnMoreLink");

        // Step 2: the chosen source.
        $("local-row").hidden = source !== "local";
        $("subscription-row").hidden = source !== "subscription";
        $("byok-row").hidden = source !== "byok";
        if (shown) {
          $("local-model-name").textContent = shown.name;
          $("local-model-needs").textContent = [
            shown.downloadBytes != null &&
              t("downloadAmount", { size: gigabytes(shown.downloadBytes) }),
            shown.diskBytes != null &&
              t("diskAmount", { size: gigabytes(shown.diskBytes) }),
            // The whole stack's memory, so more than the model's own on
            // the Local models page.
            shown.memoryBytes != null &&
              t("memoryWithServices", { size: gigabytes(shown.memoryBytes) }),
          ]
            .filter(Boolean)
            .join(" · ");
        } else {
          $("local-model-name").textContent = t(
            held ? "localOnHold" : "localNotAvailable",
          );
          $("local-model-needs").textContent = held
            ? reasonsText(models, true)
            : unavailableText;
        }
        $("local-wait").textContent = held ? heldLine(models) : t("localWait");
        $("local-model-featured").hidden = !featured;
        $("local-spotlight").hidden = !shown;
        $("local-spotlight").dataset.recommended = String(featured);
        $("local-spotlight-text").textContent = t(
          featured ? "featuredModelSpecs" : "featuredModelCustomizeNote",
        );
        $("local-spotlight-link").textContent = t(
          featured ? "learnMoreLink" : "thinkingMachinesLink",
        );
        renderRuntimes(rows, busy, signedIn);
        mainByok.sync(busy);
        // The local model can come along in the background, off unless
        // chosen, on a computer that runs it.
        const offerBackground =
          source !== "local" && Boolean(model) && !held && !behind;
        if (!offerBackground) background = false;
        $("background-row").hidden = !offerBackground;
        $("background-model").checked = background;
        $("background-model").disabled = busy;
        $("background-model-detail").textContent = model
          ? t("backgroundDetail", {
              model: model.name,
              size: size(model.downloadBytes ?? 0),
            })
          : "";
        $("credentials-row").hidden = !credentials;
        if (credentials)
          $("credentials-sub").textContent = t(
            credentials.generated
              ? "credentialsGenerated"
              : "credentialsCustom",
            { email: credentials.email },
          );
        $("credentials-edit").disabled = busy;
        renderCredentials();

        // Location and app keys, behind More options.
        const location = local.location;
        $("location-sub").textContent =
          location.error || shortPath(location.path);
        $("location-sub").title = location.error || location.path;
        $("location-sub").dataset.warn = String(!!location.error);
        $("location-reset").hidden = !location.custom && !location.error;
        for (const input of document.querySelectorAll("[data-key]")) {
          const provider = input.dataset.key;
          const saved = local.keys[provider];
          const removing = keys[provider] === "";
          input.placeholder = t(
            removing ? "keyRemovedOnInstall" : saved ? "keySaved" : "apiKey",
          );
          const remove = document.querySelector(`[data-remove="${provider}"]`);
          // Kept in place so the inputs line up.
          remove.style.visibility =
            saved || keys[provider] ? "visible" : "hidden";
          remove.textContent = t(removing ? "keep" : "remove");
        }
        $("keys-note").textContent = t("keysNote");

        // The button and what it does. Continue opens the settings; Install
        // waits for what the source needs.
        $("source-continue").hidden = !choosing;
        $("source-continue").disabled =
          busy || (source === "local" && !localUsable);
        $("local-install").hidden = !settings;
        $("get-started").hidden = available;
        const ready =
          source === "local"
            ? localUsable && !held
            : source === "byok"
              ? mainByok.complete()
              : signedIn.length > 0;
        $("local-install").disabled =
          busy || !ready || Boolean(working) || Boolean(location.error);
        const label = esc(t(behind ? "continueSetup" : "install"));
        if ($("local-install-label").innerHTML !== label)
          $("local-install-label").innerHTML = label;
        const also =
          background && model
            ? t("planAlsoModel", { model: model.name })
            : behind
              ? t("planModelKeeps")
              : "";
        const order = ["codex", "claude"].filter((runtime) =>
          signedIn.includes(runtime),
        );
        $("plan-line").hidden = !available || checkingStage;
        $("plan-line").textContent = !settings
          ? t("planNothingYet")
          : [
              source === "local"
                ? model
                  ? t("planLocal", {
                      model: model.name,
                      size: size(model.downloadBytes ?? 0),
                    })
                  : ""
                : source === "byok"
                  ? t("planByok")
                  : working
                    ? t("planWaitRuntime", {
                        runtime: RUNTIMES[working.runtime],
                      })
                    : order.length === 2
                      ? t("planBoth", {
                          first: RUNTIMES[order[0]],
                          second: RUNTIMES[order[1]],
                        })
                      : order.length
                        ? t("planRuntime", { runtime: RUNTIMES[order[0]] })
                        : t("planSignInFirst"),
              source !== "local" && also,
            ]
              .filter(Boolean)
              .join(" ");
        $("team").hidden = !available || settings || checkingStage;
      };

      // NVIDIA driver help for a local model held by the driver.
      const renderDriver = (local, models, busy, visible) => {
        const held = models.state === "checked" && !!models.blockedNow;
        const canRecheck =
          held ||
          (models.state === "checked" &&
            !models.eligible &&
            !!models.reasons?.some((reason) =>
              RECHECKABLE_REASONS.has(reason.code),
            ));
        const showDriverActions =
          visible &&
          models.state === "checked" &&
          !models.eligible &&
          cudaDriverHeld(models);
        const nvidiaApp =
          state.platform === "win32"
            ? (state.driverUpdate?.nvidiaApp ?? "none")
            : "none";
        const directDriverInstall =
          state.platform === "win32" &&
          Boolean(state.driverUpdate?.directInstallSupported);
        const driverInstallState = state.driverUpdate?.installState ?? {
          phase: "idle",
        };
        const driverInstalling =
          driverInstallState.phase === "downloading" ||
          driverInstallState.phase === "verifying" ||
          driverInstallState.phase === "installing";
        let driverStatusText = "";
        if (driverInstallState.phase === "downloading") {
          driverStatusText =
            driverInstallState.totalBytes != null
              ? t("driverDownloadingSize", {
                  version: driverInstallState.version,
                  done: size(driverInstallState.completedBytes),
                  total: size(driverInstallState.totalBytes),
                })
              : t("driverDownloading", { version: driverInstallState.version });
        } else if (driverInstallState.phase === "verifying") {
          driverStatusText = t("driverVerifying", {
            version: driverInstallState.version,
          });
        } else if (driverInstallState.phase === "installing") {
          driverStatusText = t("driverInstalling", {
            version: driverInstallState.version,
          });
        } else if (driverInstallState.phase === "reboot_required") {
          driverStatusText = t("driverRebootRequired", {
            version: driverInstallState.version,
          });
        } else if (driverInstallState.phase === "completed") {
          driverStatusText = t("driverInstallComplete", {
            version: driverInstallState.version,
          });
        } else if (driverInstallState.phase === "failed") {
          driverStatusText = t(
            driverInstallState.code === "UAC_CANCELLED"
              ? "driverUacCancelled"
              : driverInstallState.code === "SIGNATURE_INVALID"
                ? "driverSignatureInvalid"
                : driverInstallState.code === "UNSUPPORTED_GPU"
                  ? "driverUnsupportedGpu"
                  : "driverInstallFailed",
          );
        }
        $("local-driver-status").hidden =
          !showDriverActions || !driverStatusText;
        $("local-driver-status").textContent = driverStatusText;
        $("local-driver-install").hidden =
          !showDriverActions || !directDriverInstall;
        $("local-driver-install").disabled = busy || driverInstalling;
        $("local-driver-action").hidden = !showDriverActions;
        $("local-driver-action").disabled = busy || driverInstalling;
        $("local-driver-action").textContent = t(
          nvidiaApp === "nvidia_app"
            ? "openNvidiaApp"
            : nvidiaApp === "geforce_experience"
              ? "openGeForceExperience"
              : "downloadNvidiaDriver",
        );
        $("local-driver-guide").hidden = !showDriverActions;
        $("local-driver-guide").disabled = busy;
        $("local-recheck").hidden = !visible || !canRecheck;
        $("local-recheck").disabled = busy || driverInstalling;
        $("local-plan-actions").hidden =
          $("local-recheck").hidden && !showDriverActions;
      };

      // Each runtime row: what it is on this computer, and the one thing
      // left to do on the right.
      const PLAN_OF = { claude: "planClaude", codex: "planCodex" };
      const renderRuntimes = (rows, busy, signedIn) => {
        // With both signed in, Codex is the default; with one, that one.
        const primary = signedIn.includes("codex") ? "codex" : signedIn[0];
        for (const el of document.querySelectorAll(".choice.runtime")) {
          const runtime = el.dataset.runtime;
          const pi = runtime === "pi";
          const row = rows[runtime] ?? {
            runtime,
            installed: false,
            signedIn: false,
            state: "checking",
          };
          const plan = pi ? "" : t(PLAN_OF[runtime]);
          const idle = row.state === "idle";
          const installing = row.state === "installing";
          const signing = row.state === "signing_in";
          const done = pi ? row.installed : row.signedIn;
          const version = row.version ? " · " + row.version : "";
          const sub = el.querySelector("[data-runtime-sub]");
          sub.dataset.warn = String(Boolean(row.failed) && idle);
          sub.textContent =
            row.state === "checking"
              ? t("rtChecking")
              : installing
                ? t("rtInstalling")
                : signing
                  ? t("rtSigningIn", { plan })
                  : row.failed === "install"
                    ? row.message || t("rtInstallFailed")
                    : row.failed === "signin"
                      ? row.message || t("signInFailed")
                      : pi
                        ? row.installed
                          ? t("rtPiInstalled") + version
                          : t("rtPiNotInstalled")
                        : row.signedIn
                          ? t("rtSignedInWith", { plan }) + version
                          : row.installed
                            ? t("rtSignInWith", { plan }) + version
                            : t("rtNotInstalled", { plan });
          sub.title = sub.textContent;
          const rec = el.querySelector(".runtime-rec");
          if (rec) rec.hidden = runtime !== primary || signedIn.length < 2;
          const install = el.querySelector("[data-runtime-install]");
          install.hidden = !idle || row.installed;
          install.textContent = t(
            row.failed === "install" ? "tryAgain" : "install",
          );
          install.disabled = busy;
          const signin = el.querySelector("[data-runtime-signin]");
          if (signin) {
            signin.hidden = !idle || !row.installed || row.signedIn;
            signin.textContent = t(
              row.failed === "signin" ? "tryAgain" : "signIn",
            );
            signin.disabled = busy;
          }
          const progress = el.querySelector(".runtime-progress");
          progress.hidden = !installing;
          if (installing) {
            const { completed = 0, total } = row.install ?? {};
            const percent = total
              ? Math.min(100, Math.round((completed / total) * 100))
              : undefined;
            progress.setAttribute(
              "aria-label",
              t("installingRuntime", { runtime: RUNTIMES[runtime] }),
            );
            if (percent === undefined)
              progress.removeAttribute("aria-valuenow");
            else progress.setAttribute("aria-valuenow", String(percent));
            progress.querySelector(".fill").style.width =
              Math.max(4, percent ?? 30) + "%";
            progress.querySelector(".pct").textContent =
              percent === undefined ? size(completed) : percent + "%";
          }
          el.querySelector(".runtime-wait")?.toggleAttribute(
            "hidden",
            !signing,
          );
          const cancel = el.querySelector("[data-runtime-cancel]");
          cancel.hidden = !installing && !signing;
          cancel.disabled = busy;
          const badge = el.querySelector("[data-runtime-done]");
          badge.hidden = !idle || !done;
          const badgeHtml = check + esc(t(pi ? "installedBadge" : "signedIn"));
          if (badge.innerHTML !== badgeHtml) badge.innerHTML = badgeHtml;
          // The link and code for a browser that did not open, and a
          // pasted code for Claude Code's page.
          const extra = el.querySelector("[data-runtime-extra]");
          if (!extra) continue;
          const signIn = signing ? (row.signIn ?? {}) : {};
          extra.hidden = !signing || !signIn.url;
          extra.querySelector("[data-runtime-code]").hidden =
            !signIn.deviceCode;
          extra.querySelector("[data-runtime-code-value]").textContent =
            signIn.deviceCode ?? "";
          const copiedHere = runtimeCopied?.runtime === runtime;
          for (const copy of extra.querySelectorAll("[data-runtime-copy]")) {
            const what = copy.dataset.runtimeCopy;
            if (what === "code") copy.hidden = !signIn.deviceCode;
            copy.textContent = t(
              copiedHere && runtimeCopied.what === what
                ? "copied"
                : what === "url"
                  ? "copyLink"
                  : "copyCode",
            );
          }
          const paste = extra.querySelector("[data-runtime-paste]");
          if (paste) paste.hidden = !signIn.acceptsCode;
          const device = extra.querySelector("[data-runtime-device]");
          if (device) device.hidden = Boolean(signIn.deviceCode);
        }
      };

      // The sign-in email and password: shown in a sheet over step 2, where
      // they can be changed; checked the way the server checks them.
      const renderCredentials = () => {
        const sheet = $("credentials-sheet");
        sheet.hidden = !editing;
        if (!editing) return;
        const problem = credentialsProblem(editing);
        const shownProblem = editing.tried ? problem : "";
        $("credentials-error").textContent = shownProblem
          ? t(shownProblem)
          : "";
        $("credentials-email").setAttribute(
          "aria-invalid",
          String(editing.tried && EMAIL_PROBLEMS.has(problem)),
        );
        $("credentials-password").setAttribute(
          "aria-invalid",
          String(editing.tried && PASSWORD_PROBLEMS.has(problem)),
        );
        $("credentials-confirm").setAttribute(
          "aria-invalid",
          String(editing.tried && problem === "passwordMismatch"),
        );
        $("credentials-password").type = editing.visible ? "text" : "password";
        $("credentials-confirm").type = editing.visible ? "text" : "password";
        $("credentials-show").textContent = t(
          editing.visible ? "hide" : "show",
        );
        $("credentials-show").setAttribute(
          "aria-label",
          t(editing.visible ? "hidePassword" : "showPassword"),
        );
      };

      const renderLocal = (busy) => {
        const local = state.localServer;
        renderWelcome(local, busy);

        // Installing. A restart after a reboot shows here as starting.
        const failed = local.phase === "failed";
        const starting = local.phase === "preparing";
        $("installing-title").textContent = t(
          failed
            ? "installStopped"
            : starting
              ? "startingLinger"
              : "installingTitle",
        );
        const modelOn = local.backgroundModel?.state === "downloading";
        $("installing-plan").textContent = failed
          ? t("dataKept")
          : t(modelOn ? "takesMinutesModel" : "takesMinutes");
        // The local model's wait offers another source meanwhile; the model
        // keeps downloading.
        $("local-model-leave").hidden = !(
          local.source === "local" &&
          local.phase === "installing" &&
          local.transfer
        );
        const section = document.querySelector('[data-step="installing"]');
        const steps = ALL_STEPS.filter(([id]) => local.steps.includes(id));
        section.dataset.failed = String(failed);
        const at = Math.max(
          0,
          steps.findIndex(([id]) => id === local.step),
        );
        startAttempt(local);
        const percent = Math.round(shownProgress(local, at) * 100);
        $("installing-fill").style.width = Math.max(2, percent) + "%";
        $("installing-bar").setAttribute("aria-valuenow", String(percent));
        timeStep(local, at);
        $("installing-step").textContent = failed
          ? steps[at][1]()
          : starting
            ? t(
                local.preparing === "updating"
                  ? "preparingUpdate"
                  : "preparingStart",
              )
            : t("stepRunning", { step: steps[at][1]() });
        $("installing-count").textContent = starting ? "" : percent + "%";
        // A download under way: what it is and how far, in the counts the
        // installer passes on from the localmodels tool.
        const transfer = !failed && !starting ? local.transfer : undefined;
        $("installing-transfer").hidden = !transfer;
        $("installing-transfer-label").textContent = transfer
          ? transfer.label
          : "";
        // Each part stays on one line, so a wrap falls between parts.
        $("installing-transfer-bytes").replaceChildren(
          ...(transfer ? transferParts(transfer) : []).flatMap((text, i) => {
            const part = document.createElement("span");
            part.textContent = text;
            return i ? [" · ", part] : [part];
          }),
        );
        // A step that runs a while with the bar standing still says what
        // it is waiting on.
        const waiting =
          !failed && !starting && !transfer && local.waiting === "runtime";
        $("installing-waiting").hidden = !waiting;
        $("installing-waiting").textContent = waiting
          ? t("waitingRuntime")
          : "";
        $("installing-checks").hidden = starting;
        const checks = $("installing-checks");
        if (checks.children.length !== steps.length)
          checks.replaceChildren(
            ...steps.map(() => {
              const item = document.createElement("li");
              item.innerHTML =
                '<span class="dot">' +
                check +
                '</span><span></span><span class="time"></span>';
              return item;
            }),
          );
        steps.forEach(([, label], index) => {
          const item = checks.children[index];
          item.dataset.state =
            local.phase === "ready" || index < at
              ? "done"
              : index === at
                ? failed
                  ? "failed"
                  : "now"
                : "";
          item.children[1].textContent = label();
          item.lastChild.textContent = stepTime(index, item.dataset.state);
        });
        const problem = $("installing-error");
        const message = failed ? failureText(local) : "";
        if (problem.textContent !== message) {
          problem.textContent = message;
          detailsOpen = false;
        }
        // Folded first to see whether the message overflows the fold.
        problem.classList.add("folded");
        const long = failed && problem.scrollHeight > problem.clientHeight + 1;
        problem.classList.toggle("folded", long && !detailsOpen);
        $("installing-more").hidden = !long;
        $("installing-more").textContent = t(
          detailsOpen ? "hideDetails" : "showDetails",
        );
        $("installing-diagnostics").hidden = !failed;
        // A new save result replaces the note; a failed "Show Logs" writes
        // its own error there and stays until the next result.
        const saved = state.diagnostics;
        const savedKey = saved && JSON.stringify(saved);
        if (saved && savedKey !== shownDiagnostics)
          $("diagnostics-note").textContent = saved.error
            ? saved.error
            : t("savedDiagnostics", { file: saved.file });
        shownDiagnostics = savedKey;
        $("installing-actions").hidden = !failed;
        renderSignIn(local, busy);
        renderSend();
        // Each failure brings its message and actions into view once.
        if (failed && revealed !== local.attempt) {
          revealed = local.attempt;
          requestAnimationFrame(() =>
            $("installing-actions").scrollIntoView({ block: "nearest" }),
          );
        }
        $("ready-lead").textContent = t(
          local.backgroundModel?.state === "downloading"
            ? "readyLeadModel"
            : "readyLead",
        );
        renderAccount(local.account);
        $("legacy-note").hidden = !local.legacyBackup;
        $("legacy-note").textContent = local.legacyBackup
          ? t("legacyNote", { folder: local.legacyBackup })
          : "";
      };

      // The password stays masked until Show; the main process copies it
      // and the email.
      let copied;
      const renderAccount = (account) => {
        $("account").hidden = !account;
        if (!account) return;
        const error = account.error ?? "";
        $("account-error").textContent = error;
        $("account-error").hidden = !error;

      // Send Diagnostics, while a diagnostics server is set up.
      const fileSize = (bytes) =>

      let copiedReport;
      const renderSend = () => {
        const send = state.diagnosticsSend;

          sending: "sendSending",
          sent: "sendSent",
          failed: "sendFailed",

        $("send-title").textContent = t(title, { host: send.host });

            '<span class="spinner"></span>' + esc(t("sendCollecting"));

            phase === "confirm"
              ? t("sendConfirmLead", {
                  count: send.files.length,
                  size: fileSize(send.bytes),
                  host: send.host,
                })
              : phase === "sending"
                ? t("sendUploading", {
                    host: send.host,
                    percent: Math.floor(
                      (send.sent / Math.max(1, send.total)) * 100,
                    ),
                  })
                : phase === "sent"
                  ? t("sendSentLead")
                  : send.retry

                    : t("sendByHand");
        const files = $("send-files");
        files.hidden = phase !== "confirm";
        if (
          phase === "confirm" &&
          files.dataset.shown !== send.files.join("\n")

        const primary = {
          confirm: "send",
          sent: copiedReport === send.reportId ? "copied" : "copyReportId",

      // Runs one command at a time; errors land next to the step.
      const run = async (command, errorId) => {
        if (pending !== null) return;
        pending = command.op;

        if (errorId === "runtime-signin-error") signInError = "";
        else if (errorId) $(errorId).textContent = "";
        render();
        try {
          state = await setup.run(command);
          return true;
        } catch (error) {
          if (errorId === "runtime-signin-error")
            signInError = ipcMessage(error);
          else if (errorId) $(errorId).textContent = ipcMessage(error);
          return false;
        } finally {
          pending = null;
          render();
        }
      };

      for (const el of document.querySelectorAll("[data-go]"))

                  ? "pi"
                  : "subscription",
            ...(byokPayload ? { byok: byokPayload } : {}),
            ...(Object.keys(keys).length ? { keys } : {}),
            ...(background && chosen !== "local" ? { background: true } : {}),
            // Sent again on Try Again until the installation has it.
            ...(credentials && local.ownerAccount === "new"

      const clearKeys = () => {

        remove.addEventListener("click", () => {
          const provider = remove.dataset.remove;

            current === undefined && state.localServer.keys[provider]

              : rest;
          render();
        });
      $("local-customize").addEventListener("click", () => {
        options = !options;
        render();
      });
      // The source cards: a click picks, a double click or Enter goes on,
      // and the arrows move between them.
      const cards = [...document.querySelectorAll(".source-card")];
      const pick = (value) => {
        picked = true;
        source = value;
        render();
      };
      for (const card of cards) {
        card.addEventListener("click", () => {

        });

          if (!card.disabled && !$("source-continue").disabled)
            setStage("settings", "forward");
        });

          const forward =
            event.key === "ArrowRight" || event.key === "ArrowDown";
          const backward = event.key === "ArrowLeft" || event.key === "ArrowUp";
          if (event.key === "Enter") {
            event.preventDefault();
            if (!card.disabled) pick(card.dataset.value);
            if (!$("source-continue").disabled) setStage("settings", "forward");

          if (!forward && !backward) return;
          event.preventDefault();
          const open = cards.filter((other) => !other.disabled);
          const at = open.indexOf(card);
          const next =
            open[(at + (forward ? 1 : -1) + open.length) % open.length];

          pick(next.dataset.value);
          next.focus();

        setStage("settings", "forward"),
      );

        options = false;
        setStage("choose", "back");
      });

        setStage("choose", "reveal"),
      );
      document.addEventListener("keydown", (event) => {

          event.key !== "Escape" ||

        )

      });

      });

      for (const row of document.querySelectorAll(".choice.runtime")) {

          .querySelector("[data-runtime-install]")
          .addEventListener("click", () =>

          .querySelector("[data-runtime-signin]")
          ?.addEventListener("click", () =>
            runtimeRun({ op: "local.runtime.signin", runtime }),
          );

          .querySelector("[data-runtime-cancel]")
          .addEventListener("click", () =>
            runtimeRun({ op: "local.runtime.cancel", runtime }),
          );

            const code = input.value.trim();
            if (!code) return;

      // The sign-in sheet edits a draft; Done keeps it, Cancel drops it.
      const closeCredentials = () => {
        editing = null;
        render();

      };
      $("credentials-edit").addEventListener("click", () => {
        if (!credentials) return;

          email: credentials.email,
          password: credentials.password,

          tried: false,
        };

        $("credentials-password").value = editing.password;

        $("credentials-email").focus();
      });

        ["credentials-email", "email"],
        ["credentials-password", "password"],
        ["credentials-confirm", "confirm"],
      ])
        $(id).addEventListener("input", () => {

          editing = { ...editing, [field]: $(id).value };
          render();
        });

        editing = { ...editing, visible: !editing.visible };
        render();
      });

          ...editing,
          password,

          generated: password,
        };

        $("credentials-confirm").value = password;

      });

        credentials = {
          email,

          generated:

      });

      $("credentials-sheet").addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;

      });

      // From the local model's wait: install another source instead while
      // the model downloads on.
      for (const leave of document.querySelectorAll("[data-leave]"))
        leave.addEventListener("click", async () => {
          if (!(await run({ op: "local.leave-local" }, "leave-error"))) return;
          picked = true;
          source = leave.dataset.leave;
          options = false;
          show("welcome");
          setStage("settings", "forward");
        });
      $("location-change").addEventListener("click", () =>
        run({ op: "local.location.pick" }),
      );
      $("location-reset").addEventListener("click", () =>
        run({ op: "local.location.reset" }),
      );
      $("local-recheck").addEventListener("click", () =>
        run({ op: "local.recheck" }, "local-error"),
      );
      $("local-driver-install").addEventListener("click", () => {
        const models = state?.localServer?.localModels;
        const reason =
          models?.state === "checked"
            ? models.reasons?.find(
                (entry) =>
                  entry.code === "cuda-driver-update-required" ||
                  entry.code === "cuda-driver-version-unknown",
              )
            : undefined;
        void run(
          {
            op: "driver.start-install",
            ...(reason?.requiredCudaVersion
              ? { requiredCuda: reason.requiredCudaVersion }
              : {}),
          },
          "local-error",
        );
      });
      $("local-driver-action").addEventListener("click", () => {
        const nvidiaApp =
          state?.platform === "win32"
            ? (state.driverUpdate?.nvidiaApp ?? "none")
            : "none";

              op: "external.open",

            },
            "local-error",
          );

      $("local-driver-guide").addEventListener("click", () =>
        run(
          {
            op: "external.open",
            url: window.lingerSetup.nvidiaDriverGuideUrl,
          },
          "local-error",
        ),
      );
      const openFeaturedAnnouncement = () =>
        run(
          {

            url: window.lingerSetup.featuredAnnouncementUrl,

          "local-error",

      $("featured-spotlight-link").addEventListener(
        "click",
        openFeaturedAnnouncement,
      );
      $("local-spotlight-link").addEventListener(
        "click",
        openFeaturedAnnouncement,
      );
      $("open").addEventListener("click", () => run({ op: "finish" }));
      $("account-show").addEventListener("click", () =>
        run({
          op: "local.account.show",
          on: !state.localServer.account?.password,
        }),

        ["account-copy", "password"],
        ["account-copy-email", "email"],
      ])
        $(id).addEventListener("click", async () => {

        run({ op: "local.account.reveal" }),

      $("signin").addEventListener("click", () => {
        if (state.signedIn) return show("connect");
        if (pending !== null && pending !== "signin.open") return;
        // Stays pending until the main window reports a session.
        pending = "signin.open";
        render();
        setup.run({ op: "signin.open" }).catch(() => {
          pending = null;
          render();
        });
      });
      $("connect").addEventListener("click", async () => {
        if (state.enrolled) return show("permissions");
        if (await run({ op: "computer.connect" }, "connect-error"))
          show("permissions");
      });
      $("notify").addEventListener("click", async () => {
        if (await run({ op: "notifications.test" }, "permissions-error"))
          $("notify").textContent = t("testSent");
      });
      $("folder").addEventListener("click", () =>
        run({ op: "folder.add" }, "permissions-error"),
      );
      for (const id of Object.keys(PERMISSIONS))
        $("perm-" + id).addEventListener("click", () => {
          const status = state.permissions?.[id] ?? "unknown";
          run(
            id === "full-disk" || status === "denied"
              ? { op: "permission.settings", id }
              : { op: "permission.request", id },
            "permissions-error",
          );
        });
      $("sleep").addEventListener("click", () =>
        run(
          { op: "prevent-sleep.set", on: !state.preventSleep },
          "permissions-error",
        ),
      );
      $("login").addEventListener("click", () =>
        run(
          { op: "open-at-login.set", on: !state.openAtLogin },
          "permissions-error",
        ),
      );
      $("finish").addEventListener("click", () => run({ op: "finish" }));

      setup.onState((next) => {
        const signedInNow = next.signedIn && !state?.signedIn;
        const localReady =
          next.localServer.phase === "ready" &&
          state?.localServer.phase !== "ready";
        state = next;
        if (pending === "signin.open" && next.signedIn) pending = null;
        if (localReady && step === "installing") show("ready");
        else if (signedInNow && step === "signin") show("connect");
        else render();
      });
      setup.getState().then((initial) => {
        state = initial;
        const phase = initial.localServer.phase;
        show(
          ["preparing", "installing", "failed"].includes(phase)
            ? "installing"
            : initial.enrolled
              ? "permissions"
              : initial.signedIn
                ? "connect"
                : "welcome",
        );
      });
    </script>
  </body>
</html>
