    <script>
      const setup = window.lingerSetup;
      const $ = (id) => document.getElementById(id);
      // The steps of connecting to a team server.
      const ORDER = ["server", "signin", "connect", "permissions"];
      const check = '<svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>';
      // A signed-in tick in a soft green disc.
      const CHECK =
        '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="rgba(63,138,76,.11)" stroke="none"/><path d="M7.8 12.3 10.6 15 16.3 9.2" fill="none" stroke="#3f8a4c" stroke-width="1.7"/></svg>';
      const RADIO =
        '<svg viewBox="0 0 12 12"><path d="M2.5 6.2 5 8.6 9.6 3.6" fill="none" stroke="#fff" stroke-width="1.8"/></svg>';
      const ORB_LAYERS =
        '<i class="o-base"></i><i class="o-fill"></i><i class="o-solid"></i><i class="o-shade"></i><i class="o-ring"></i><i class="o-arc"></i>';
      for (const orb of document.querySelectorAll(".orb"))
        orb.insertAdjacentHTML("afterbegin", ORB_LAYERS);
      for (const radio of document.querySelectorAll(".radio"))
        radio.innerHTML = RADIO;

      // Motion moves only transform and opacity. With reduced motion it
      // fades briefly instead: nothing flies, bounces, breathes or drifts.
      const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const EASE = "cubic-bezier(0.22, 1, 0.36, 1)";
      const EASE_IO = "cubic-bezier(0.65, 0.05, 0.25, 1)";
      // A soft spring: a few percent past the end, then settled.
      const SPRING =
        "linear(0, 0.06 3%, 0.24 7%, 0.52 13%, 0.78 20%, 0.93 27%, 1.01 34%, 1.035 41%, 1.03 48%, 1.012 58%, 1 70%, 0.998 82%, 1)";
      // A Web Animation where the page has them (jsdom has none).
      const anim = (el, frames, options) =>
        el && typeof el.animate === "function"
          ? el.animate(frames, { fill: "backwards", ...options })
          : null;
      const fadeIn = (el, delay = 0) =>
        anim(el, [{ opacity: 0 }, { opacity: 1 }], {
          duration: 150,
          delay,
          easing: "linear",
        });
      // Arriving elements rise in, from the side they come from, one after
      // another.
      const enter = (els, base = 0, gap = 75, dx = 0) =>
        els.forEach((el, i) =>
          REDUCE
            ? fadeIn(el)
            : anim(
                el,
                [
                  { opacity: 0, transform: `translate(${dx}px, 10px)` },
                  { opacity: 1, transform: "none" },
                ],
                { duration: 520, delay: base + i * gap, easing: EASE },
              ),
        );
      // The orb's colour for each source.
      const KIND = { local: "", byok: " k-byok", subscription: " k-sub" };
      const kindOf = (el) =>
        [...el.classList]
          .filter((name) => name.startsWith("k-"))
          .map((name) => " " + name)
          .join("");
      // Flies a copy of an orb from one place to another along a gentle
      // arc, scaling as it goes; the destination shows once it lands. The
      // copy is drawn at the larger size, so it never scales up blurred.
      const flyOrb = (from, kind, toEl, duration, big = false) => {
        if (REDUCE || !from?.width || typeof toEl?.animate !== "function")
          return;
        const to = toEl.getBoundingClientRect();
        if (!to.width) return;
        const base = Math.max(from.width, to.width);
        const orb = document.createElement("span");
        orb.className = "orb" + kind + (big ? " big" : "");
        orb.style.setProperty("--s", base + "px");
        orb.innerHTML = ORB_LAYERS;
        $("flyer").append(orb);
        toEl.style.opacity = "0";
        const k0 = from.width / base;
        const k1 = to.width / base;
        const dx = to.left - from.left;
        const dy = to.top - from.top;
        // The control point lifts the path into a soft curve.
        const cx = dx * 0.2;
        const cy = dy * 0.9 - 24;
        const frames = [];
        for (let i = 0; i <= 12; i++) {
          const p = i / 12;
          const x = from.left + 2 * p * (1 - p) * cx + p * p * dx;
          const y = from.top + 2 * p * (1 - p) * cy + p * p * dy;
          const s = k0 + (k1 - k0) * p;
          frames.push({ transform: `translate(${x}px, ${y}px) scale(${s})` });
        }
        const flight = orb.animate(frames, {
          duration,
          easing: SPRING,
          fill: "forwards",
        });
        const land = () => {
          toEl.style.opacity = "";
          orb.remove();
          anim(toEl, [{ transform: "scale(1.08)" }, { transform: "none" }], {
            duration: 420,
            easing: EASE,
          });
        };
        flight.finished.then(land, land);
      };
      // What moves in on the welcome's current stage.
      const stageParts = () =>
        [...document.querySelectorAll("#wz-stage [data-in]")].filter(
          (el) => !el.closest("[hidden]"),
        );
      const selectedOrb = () =>
        document.querySelector('.source-card[aria-checked="true"] .orb');

      // The local models the picker offers, in the page's words. The
      // quality peers are the ones docs/local-inference.md names.
      const GB = 1024 ** 3;
      const MAC_SIZES = [16, 24, 32, 36, 48, 64, 96, 128, 192, 256, 512];
      const QUALITY_PEERS = [
        [/^inkling-2-mini/, "≈ Sonnet 4.6"],
        [/^spark-x2\.6-4b-q4km/, "≈ Gemini 2.5 Pro"],
        [/^qwen3\.8-flash-next-iq2xs/, "≈ Opus 4.6"],
      ];
      const onMac = () => state.platform === "darwin";
      const qualityText = (option) => {
        const peer = QUALITY_PEERS.find(([pattern]) =>
          pattern.test(option.library ?? ""),
        );
        if (peer) return peer[1];
        const score = option.quality;
        if (score == null) return "–";
        return t(
          score >= 60
            ? "qualityCutting"
            : score >= 50
              ? "qualityFrontier"
              : score >= 35
                ? "qualityCapable"
                : "qualityEveryday",
        );
      };
      const speedText = (option) =>
        option.decodeTokS != null
          ? "~" + Math.round(option.decodeTokS) + " tok/s"
          : "–";
      const paramsText = (option) =>
        option.parameters
          ? option.activeParameters
            ? t("moeParams", {
                total: option.parameters,
                active: option.activeParameters,
              })
            : option.parameters
          : "";
      // Two builds of one model: the larger download is the standard one.
      const buildText = (option, options) => {
        const same = options.filter((other) => other.name === option.name);
        if (same.length < 2) return "";
        const largest = Math.max(...same.map((other) => other.downloadBytes));
        return t(option.downloadBytes === largest ? "standard" : "compact");
      };
      const whyText = (option) =>
        t(
          (option.role === "smartest"
            ? "whySmartest"
            : option.role === "fastest"
              ? "whyFastest"
              : "whyFits") + (onMac() ? "Mac" : "Computer"),
        );
      // What a model too large for this computer needs: memory as a
      // computer is sold with it, of which a model may use three quarters.
      const needsText = (option, total) => {
        if (!option.tooLarge) return t("needsFreeMemory");
        const wanted = (option.needsMemoryBytes ?? option.memoryBytes) / 0.75;
        const size =
          MAC_SIZES.find(
            (gb) => gb * GB >= wanted && (!total || gb * GB > total),
          ) ?? Math.ceil(wanted / GB);
        return t(onMac() ? "needsMac" : "needsComputer", {
          size: String(size),
        });
      };
      let state;
      let step;
      // The one action in flight; every control waits for it.
      let pending = null;
      let shownDiagnostics;

      // What each macOS permission is for, and what goes wrong without it.
      const PERMISSIONS = {
        "full-disk": { about: "fullDiskAbout", missing: "fullDiskMissing" },
        folders: { about: "userFoldersAbout", missing: "userFoldersMissing" },
        automation: { about: "automationAbout", missing: "automationMissing" },
      };

      // The runtimes setup names.
      const RUNTIMES = {
        recommended: "",
        codex: "Codex",
        claude: "Claude Code",
        pi: "Pi",
      };
      // The installing steps, as the main process reports them; it says
      // which of them this installation shows.
      const ALL_STEPS = [
        ["prepare", () => t("stepPrepare")],
        ["download", () => t("stepDownload")],
        ["services", () => t("stepServices")],
        ["workspace", () => t("stepWorkspace")],
        [
          "signin",
          () => {
            const runtime = RUNTIMES[state.localServer.signIn?.runtime];
            return runtime
              ? t("stepSignIn", { runtime })
              : t("stepSignInRuntime");
          },
        ],
        ["connect", () => t("stepConnect")],
        ["agents", () => t("stepAgents")],
      ];
      const gigabytes = (bytes) => Math.round(bytes / 1024 ** 3) + " GB";
      // Download sizes: MB below a gigabyte, one decimal GB above.
      const size = (bytes) =>
        bytes < 1024 ** 3
          ? Math.max(0, Math.round(bytes / 1024 ** 2)) + " MB"
          : (bytes / 1024 ** 3).toFixed(1) + " GB";
      // How far a download is: how much of how much. A count of one file
      // of several says only that file's bytes.
      const transferAmount = ({ completed, total, partial }) => {
        const amount = total
          ? t("amountOf", { done: size(completed), total: size(total) })
          : size(completed);
        return partial ? t("thisFile", { amount }) : amount;
      };
      // Why the installation stopped: in the page's words when the main
      // process names the reason, else the message it passed on.
      const failureText = (local) =>
        local.failure === "runtime_lookup_timed_out"
          ? t("runtimeLookupTimedOut")
          : local.failure === "runtime_lookup_unreachable"
            ? t("runtimeLookupUnreachable")
            : local.message;
      // What step 2 offers first: the local model when the localmodels tool
      // picked it for this computer and no subscription runtime is signed
      // in already; else the subscription. BYOK is never the advice.
      const defaults = () => {
        const local = state.localServer;
        const models = local.localModels;
        const signedIn = (local.runtimes ?? []).some(
          (row) => row.runtime !== "pi" && row.signedIn,
        );
        return models.state === "checked" &&
          models.recommendation === "local-models" &&
          models.eligible &&
          models.model &&
          !signedIn &&
          !modelBehind(local)
          ? "local"
          : "subscription";
      };
      // The source picked on step 1: local, subscription or byok.
      let source;
      // Whether the person picked it; until then it follows defaults().
      let picked = false;
      // Where the welcome is: checking this computer, choosing a source, or
      // the chosen source's settings.
      let stage;
      // The check only offers a way on without it once it has run this long.
      const SLOW_CHECK_MS = 20_000;
      let slowCheck = false;
      let slowTimer = 0;
      let runtimesAsked = false;
      // Also download the local model in the background.
      let background = false;
      // The ready screen's new password while it is typed:
      // { value, visible, tried, saving }.
      let passwordEdit = null;
      // The ready screen's sign-in details, folded until asked for.
      let accountOpen = false;
      // What a row just copied: { runtime, what }.
      let runtimeCopied;
      // The local model picked in the picker, by its library name; until
      // then the kit's recommendation.
      let pickedModel;
      let sheetOpen = false;
      // The welcome: the orb forms and the title rises for this long, and
      // at least as long as the check runs, then it hands off to step 1.
      const INTRO_MS = setup.introMs ?? (REDUCE ? 1200 : 2600);
      let introDone = INTRO_MS <= 0;
      let introStarted = false;
      // The welcome's orb is flying into step 1.
      let handing = false;
      // The install has finished and the bar is folding into the orb.
      let finishing = false;
      const enterStage = (next) => {
        const section = document.querySelector('[data-step="welcome"]');
        stage = next;
        section.dataset.stage = next;
        clearTimeout(slowTimer);
        slowCheck = false;
        // Only a check that runs very long offers a way on without it.
        if (next === "checking")
          slowTimer = setTimeout(() => {
            slowCheck = true;
            render();
          }, SLOW_CHECK_MS);
      };
      // The orb where the welcome is now: the picked card's on step 1, the
      // title's on step 2.
      const stageOrb = () => (stage === "choose" ? selectedOrb() : $("hd-orb"));
      // Moves between the welcome's stages and says where it went: the orb
      // flies from the card to the title or back, and the new stage's parts
      // rise in from the side they come from.
      const setStage = (next, motion) => {
        const fromOrb = stageOrb();
        const from = fromOrb?.getBoundingClientRect();
        const kind = fromOrb ? kindOf(fromOrb) : "";
        enterStage(next);
        render();
        $("welcome-title").focus({ preventScroll: true });
        $("welcome-live").textContent = $("welcome-title").textContent;
        flyOrb(from, kind, stageOrb(), 640);
        enter(stageParts(), 40, 75, motion === "back" ? -14 : 14);
      };

      // The welcome's title, word by word.
      const introWords = () => {
        const title = $("intro-title");
        title.replaceChildren(
          ...t("welcomeTitle")
            .split(/(?<=\s)/)
            .map((word) => {
              const span = document.createElement("span");
              span.textContent = word;
              return span;
            }),
        );
        return [...title.children];
      };
      // The orb forms, the words rise one after another, then the orb gives
      // one soft bounce while the check finishes.
      const startIntro = () => {
        if (introStarted) return;
        introStarted = true;
        const words = introWords();
        const ball = $("intro-ball");
        if (!REDUCE) ball.classList.add("breathe", "turn");
        if (REDUCE) {
          fadeIn(ball);
          words.forEach((word) => fadeIn(word, 200));
        } else {
          anim(
            ball,
            [
              { opacity: 0, transform: "scale(0.55)" },
              { opacity: 1, transform: "none" },
            ],
            { duration: 1100, easing: EASE },
          );
          words.forEach((word, i) =>
            anim(
              word,
              [
                { opacity: 0, transform: "translateY(14px)" },
                { opacity: 1, transform: "none" },
              ],
              { duration: 800, delay: 520 + i * 110, easing: EASE },
            ),
          );
          // One bounce, once the words are up: a squash, a soft hop that
          // overshoots a little, then settled.
          const bounceAt = Math.max(1100, Math.min(1700, INTRO_MS - 900));
          anim(
            ball,
            [
              { transform: "none" },
              { transform: "scale(1.04, 0.95)", offset: 0.14 },
              { transform: "translateY(-12px) scale(1.08)", offset: 0.42 },
              { transform: "scale(1.05, 0.93)", offset: 0.68 },
              { transform: "scale(0.97)", offset: 0.84 },
              { transform: "none" },
            ],
            {
              duration: 720,
              delay: bounceAt,
              easing: "ease-in-out",
              fill: "none",
              composite: "add",
            },
          );
        }
        if (!introDone)
          setTimeout(() => {
            introDone = true;
            render();
          }, INTRO_MS);
      };
      // The hand-off to step 1: the welcome's orb flies along a gentle curve
      // into the picked card's orb, the title fades, and the cards rise in.
      const handOff = () => {
        const from = $("intro-orb").getBoundingClientRect();
        introDone = true;
        handing = !REDUCE && typeof $("intro-orb").animate === "function";
        enterStage("choose");
        if (!handing) {
          setTimeout(() => enter(stageParts(), 0, 60));
          return;
        }
        requestAnimationFrame(() => flyIntro(from));
      };
      const flyIntro = (from) => {
        const orb = $("intro-orb");
        const target = selectedOrb();
        const glider = $("glider");
        const to = target?.getBoundingClientRect();
        if (!to?.width || !from.width) {
          handing = false;
          render();
          enter(stageParts(), 0, 60);
          return;
        }
        target.style.opacity = "0";
        glider.style.opacity = "0";
        const k = to.width / from.width;
        const dx = to.left - from.left;
        const dy = to.top - from.top;
        const cx = dx * 0.2;
        const cy = dy * 0.9;
        const frames = [];
        for (let i = 0; i <= 12; i++) {
          const p = i / 12;
          const x = 2 * p * (1 - p) * cx + p * p * dx;
          const y = 2 * p * (1 - p) * cy + p * p * dy;
          frames.push({
            transform: `translate(${x}px, ${y}px) scale(${1 + (k - 1) * p})`,
          });
        }
        const flight = orb.animate(frames, {
          duration: 780,
          easing: SPRING,
          fill: "forwards",
        });
        for (const word of $("intro-title").children)
          anim(
            word,
            [
              { opacity: 1, transform: "none" },
              { opacity: 0, transform: "translateY(-8px)" },
            ],
            { duration: 320, easing: "ease-in", fill: "forwards" },
          );
        enter(stageParts(), 260, 85);
        const land = () => {
          target.style.opacity = "";
          glider.style.opacity = "";
          handing = false;
          render();
          flight.cancel();
          for (const word of $("intro-title").children)
            word.getAnimations?.().forEach((a) => a.cancel());
          anim(target, [{ transform: "scale(1.1)" }, { transform: "none" }], {
            duration: 420,
            easing: EASE,
          });
          fadeIn(glider);
          anim(
            target.closest(".source-card")?.querySelector(".radio"),
            [{ transform: "scale(0.6)" }, { transform: "none" }],
            { duration: 360, easing: SPRING },
          );
          anim(
            $("source-continue"),
            [
              { transform: "none" },
              { transform: "scale(1.035)" },
              { transform: "none" },
            ],
            { duration: 520, delay: 900, easing: "ease-in-out", fill: "none" },
          );
        };
        flight.finished.then(land, land);
      };
      // The local model still downloading after the person left its wait.
      const modelBehind = (local) =>
        local.backgroundModel?.state === "downloading" &&
        local.phase === "idle";
      const modelPercent = (model) =>
        model?.total
          ? Math.min(99, Math.floor((model.completed / model.total) * 100))
          : 0;
      const runtimeRows = (local) =>
        Object.fromEntries(
          (local.runtimes ?? []).map((row) => [row.runtime, row]),
        );
      // A new password as the server and the account file take it
      // (validateLocalCredentials in packages/local-installation).
      const passwordProblem = (password) =>
        password.length < 8
          ? "passwordTooShort"
          : password.length > 256
            ? "passwordTooLong"
            : /\p{Cc}/u.test(password)
              ? "passwordControl"
              : "";
      // BYOK. Requests go to the base URL + path + endpoint, used verbatim;
      // path and endpoint are optional, and a grey value is the default that
      // is sent. The wire format follows the end of that address, else the
      // runtime's own, so Bifrost passes the runtime's requests through.
      // Nothing probes: Test sends one request to that one address.
      // Keep these format endings, runtime defaults and path validation in
      // sync with packages/service-kit/src/byok-endpoint.ts (source of truth).
      const BYOK_FORMATS = {
        "openai-chat": {
          suffix: "/chat/completions",
          label: "OpenAI Chat Completions",
        },
        "openai-responses": { suffix: "/responses", label: "OpenAI Responses" },
        anthropic: { suffix: "/messages", label: "Anthropic Messages" },
      };
      const RUNTIME_FORMATS = {
        claude: "anthropic",
        codex: "openai-responses",
        pi: "openai-chat",
      };
      const DEFAULT_PATH = "/v1";
      const PATH_OPTIONS = [
        { value: "/v1", label: t("pathMostProviders") },
        { value: "/api/paas/v4", label: t("pathZhipu") },
        { value: "/api/v3", label: t("pathVolcano") },
        { value: "/v1beta/openai", label: "Gemini" },
        { value: "", label: t("pathNone") },
      ];
      const ENDPOINT_OPTIONS = [
        ...Object.values(BYOK_FORMATS).map((format) => ({
          value: format.suffix,
          label: format.label,
        })),
        { value: "", label: t("endpointNone") },
      ];
      // What the installer accepts as a path or endpoint: empty, or whole
      // segments, so neither can change the base URL's host.
      const BYOK_URL_PATH = /^(\/[^/?#\s\\]+)*$/;
      const ICONS = {
        refresh:
          '<svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 6.4A5.3 5.3 0 0 0 3.4 4.6M2.8 9.6a5.3 5.3 0 0 0 9.8 1.8M3.2 2.2v2.6h2.6M12.8 13.8v-2.6h-2.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        chevron:
          '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2.5 3.8 5 6.3l2.5-2.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        selected:
          '<svg class="opt-check" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="m3.5 8.5 3 3 6-7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        ok: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m5.2 8.2 1.9 1.9 3.7-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        err: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 4.6v4.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11.2" r="0.9" fill="currentColor"/></svg>',
        close:
          '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="m2 2 6 6M8 2 2 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
      };
      const esc = (value) =>
        String(value).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );

        tSpans(name, values)
          .map((node) =>
            typeof node === "string" ? esc(node) : node.outerHTML,
          )
          .join("");
      const contextLabel = (tokens) =>
        tokens >= 1024 ** 2
          ? Math.round((tokens / 1024 ** 2) * 10) / 10 + "M"
          : Math.round(tokens / 1024) + "k";
      // A typed path gains its leading slash and loses trailing ones.
      const normalizePath = (value) => {
        const trimmed = value.trim().replace(/\/+$/, "");

      };
      // An IPC error's own message, without Electron's prefix.
      const ipcMessage = (error) =>
        String(error?.message ?? error).replace(
          /^Error invoking remote method '[^']+': (Error: )?/,

        );
      // The test's usual failures in a few words; any other keeps the

      const BYOK_FAILURES = {
        BYOK_UNREACHABLE: "byokUnreachable",
        BYOK_CHECK_TIMEOUT: "byokUnreachable",
        BYOK_AUTH_FAILED: "byokKeyRefused",
        BYOK_NOT_FOUND: "byokModelMissing",
        BYOK_UPSTREAM_REJECTED: "byokRejected",
      };
      // Asks the main process to test or list an endpoint. The answer comes
      // back in the state the command returns; nothing else waits for it.
      const byokAsk = async (command, field) => {
        try {
          state = await setup.run(command);
          return (
            state.localServer[field] ?? {
              state: "failed",
              message: t("noAnswer"),
            }
          );
        } catch (error) {
          return { state: "failed", message: ipcMessage(error) };
        }
      };

      // A combobox: type anything, or pick a suggestion from its list.
      const combos = [];
      const closeCombos = () => {
        for (const combo of combos) combo.open = false;
      };
      const combobox = (root, cfg) => {
        root.classList.add("cb");
        root.innerHTML = `
          <input class="cb-input" id="${cfg.id}" role="combobox"
            aria-autocomplete="none" aria-expanded="false"
            aria-controls="${cfg.id}-menu" autocomplete="off" spellcheck="false"
            placeholder="${esc(cfg.placeholder)}" aria-label="${esc(cfg.label)}" />
          <button type="button" class="cb-caret" tabindex="-1"
            aria-label="${esc(t("showSuggestions", { field: cfg.label }))}">${ICONS.chevron}</button>

        };
        input.addEventListener("input", () => {
          cfg.set(input.value);
          combo.open = false;

        });
        input.addEventListener("blur", () => {
          cfg.commit();
          render();
        });

          }
        });

            render();

            input.focus();
          }
        });

          closeCombos();
          render();

        });

          if (event.key !== "ArrowDown" && event.key !== "ArrowUp") return;

          const at = options.indexOf(document.activeElement);
          const step = event.key === "ArrowDown" ? 1 : -1;

        });

          const value = cfg.get();

          root.dataset.default = String(Boolean(cfg.isDefault?.()));
          root.dataset.open = String(combo.open);

            <button type="button" role="option" data-value="${esc(item.value)}"
              aria-selected="${item.value === value}">
              <span class="opt-main">${item.value ? esc(item.value) : "-"}</span>

                item.label || item.tag
                  ? `<span class="opt-label">${esc(item.label || "")}${
                      item.tag ? `<em>${esc(item.tag)}</em>` : ""
                    }</span>`
                  : ""
              }
              ${ICONS.selected}
            </button>`;
          // Notes are HTML their callers escaped.
          const html =
            (cfg.heading ? `<div class="cb-head">${cfg.heading}</div>` : "") +
            cfg
              .items()
              .map((item) =>
                item.note === undefined
                  ? option(item)
                  : `<div class="cb-note" data-tone="${item.tone || ""}">${item.note}</div>`,
              )
              .join("");
          if (html !== menuHtml) {
            menu.innerHTML = html;
            menuHtml = html;
          }
        };
        combos.push(combo);
        return combo;
      };

      // The BYOK fields, built once for the setup form and once for the
      // sign-in dialog. runtimeOf() names the runtime the endpoint serves,
      // which picks the default endpoint and format; changed() runs on every
      // edit.
      const byokForms = [];
      const byokFields = (root, prefix, runtimeOf, changed) => {
        root.innerHTML = `
          <div class="ep">
            <span class="ep-base-wrap"><input class="ep-base" id="${prefix}-url"
              type="url" autocomplete="off" spellcheck="false"
              aria-label="${esc(t("baseUrl"))}"
              placeholder="${esc(t("baseUrlPlaceholder"))}" /></span>
            <div></div>
            <div></div>
          </div>
          <input class="byok-key" id="${prefix}-key" type="password"
            autocomplete="off" spellcheck="false" aria-label="${esc(t("apiKey"))}"
            placeholder="${esc(t("apiKeyPlaceholder"))}" />
          <div class="model-row">
            <div class="standalone"></div>
            <button type="button" class="change list-btn" id="${prefix}-list"
              aria-label="${esc(t("listModels"))}" title="${esc(t("listModels"))}">${ICONS.refresh}</button>
            <button type="button" class="change test-btn" id="${prefix}-test">${esc(t("test"))}</button>
            <div class="byok-toast" id="${prefix}-toast" role="status"
              aria-live="polite" hidden></div>
          </div>
          <div class="byok-status" id="${prefix}-status" aria-live="polite"></div>`;
        const blank = () => ({
          baseUrl: "",
          path: DEFAULT_PATH,
          // null follows the runtime's default.
          endpoint: null,
          apiKey: "",
          modelId: "",
        });
        let f = blank();
        // The latest test and model listing; each sequence number drops an
        // answer to a request the fields have changed since.
        let check = null;
        let models = null;
        let checkSeq = 0;
        let modelSeq = 0;
        let toast = null;
        let toastTimer = 0;
        let toastShown = "";

        const defaultEndpoint = () =>
          BYOK_FORMATS[RUNTIME_FORMATS[runtimeOf()]].suffix;
        const endpointValue = () => f.endpoint ?? defaultEndpoint();
        const baseUrl = () => f.baseUrl.trim().replace(/\/+$/, "");
        const apiRoot = () => baseUrl() + normalizePath(f.path);
        const requestUrl = () => apiRoot() + normalizePath(endpointValue());
        const modelsUrl = () => apiRoot() + "/models";
        const format = () => {
          const url = requestUrl();
          for (const [protocol, { suffix }] of Object.entries(BYOK_FORMATS))
            if (url.endsWith(suffix)) return { protocol, fromUrl: true };
          return { protocol: RUNTIME_FORMATS[runtimeOf()], fromUrl: false };
        };
        const validParts = () =>
          [normalizePath(f.path), normalizePath(endpointValue())].every(
            (part) => part.length <= 256 && BYOK_URL_PATH.test(part),
          );
        const addressed = () => baseUrl() !== "" && validParts();
        const complete = () => addressed() && f.modelId.trim() !== "";
        const endpoint = () => {
          const apiKey = f.apiKey.trim();
          return {
            baseUrl: baseUrl(),
            path: normalizePath(f.path),
            endpoint: normalizePath(endpointValue()),
            protocol: format().protocol,
            ...(apiKey ? { apiKey } : {}),
          };
        };

        // The test result floats under Test: a success fades on its own, a
        // failure stays until dismissed or the fields change.
        const showToast = () => {
          clearTimeout(toastTimer);
          toast = { leaving: false };
          if (check?.state === "ready")
            toastTimer = setTimeout(hideToast, 3500);
        };
        const hideToast = () => {
          clearTimeout(toastTimer);
          if (!toast || toast.leaving) return;
          toast.leaving = true;
          render();
          toastTimer = setTimeout(() => {
            toast = null;
            render();
          }, 200);
        };
        const resetResults = (all) => {
          checkSeq += 1;
          check = null;
          clearTimeout(toastTimer);

          if (all) {

            models = null;
          }
        };
        const edit = (next, all) => {
          f = { ...f, ...next };
          resetResults(all);
          changed();
        };

        const base = root.querySelector(".ep-base");
        base.addEventListener("input", () => {
          edit({ baseUrl: base.value }, true);
          render();
        });
        base.addEventListener("blur", () => {
          if (baseUrl() !== f.baseUrl) f = { ...f, baseUrl: baseUrl() };
          base.scrollLeft = 0;
          render();
        });
        const [pathBox, endpointBox] = root.querySelectorAll(".ep > div");
        const path = combobox(pathBox, {
          id: prefix + "-path",
          label: t("path"),
          heading: esc(t("pathHeading")),
          placeholder: "-",
          get: () => f.path,
          set: (value) => edit({ path: value }, true),
          commit: () => {
            f = { ...f, path: normalizePath(f.path) };
          },
          isDefault: () => f.path === DEFAULT_PATH,
          items: () =>
            PATH_OPTIONS.map((option) => ({
              ...option,
              tag: option.value === DEFAULT_PATH ? t("defaultTag") : "",

        const endpointCombo = combobox(endpointBox, {
          id: prefix + "-endpoint",
          label: t("endpoint"),
          heading: esc(t("endpointHeading")),
          placeholder: "-",
          get: endpointValue,
          set: (value) =>
            edit(
              { endpoint: value === defaultEndpoint() ? null : value },

            ),
          commit: () => {
            if (f.endpoint === null) return;
            const value = normalizePath(f.endpoint);
            f = {
              ...f,
              endpoint: value === defaultEndpoint() ? null : value,
            };
          },
          isDefault: () => f.endpoint === null,
          items: () =>
            ENDPOINT_OPTIONS.map((option) => ({
              ...option,
              tag:
                option.value === defaultEndpoint()
                  ? t("runtimeDefault", { runtime: RUNTIMES[runtimeOf()] })
                  : "",
            })),
        });
        const modelCombo = combobox(root.querySelector(".model-row > div"), {
          id: prefix + "-model",
          label: t("model"),
          placeholder: t("modelPlaceholder"),
          get: () => f.modelId,
          set: (value) => edit({ modelId: value }, false),
          commit: () => {
            f = { ...f, modelId: f.modelId.trim() };
          },
          items: () => {
            if (!models) return [{ note: esc(t("modelsHint")) }];
            if (models.state === "loading")
              return [{ note: tHtml("listingFrom", { url: modelsUrl() }) }];
            if (models.state === "failed")
              return [{ note: esc(models.message), tone: "err" }];
            const count = models.models.length;
            return [
              { note: tHtml("modelsFrom", { count, url: models.url }) },
              ...models.models.map((model) => ({
                value: model.id,
                label: [
                  model.name !== model.id && model.name,
                  model.contextWindow &&
                    t("contextSize", {
                      size: contextLabel(model.contextWindow),
                    }),
                ]
                  .filter(Boolean)
                  .join(" · "),
              })),
            ];
          },
        });
        const key = root.querySelector(".byok-key");
        key.addEventListener("input", () => {
          edit({ apiKey: key.value }, true);
          render();
        });
        const list = root.querySelector(".list-btn");
        list.addEventListener("click", async () => {
          if (!addressed()) return;
          const seq = ++modelSeq;
          models = { state: "loading" };
          closeCombos();
          render();
          const answer = await byokAsk(
            { op: "local.byok.models", byok: endpoint() },
            "byokModels",
          );
          if (seq !== modelSeq) return;
          models = answer;
          // The list it filled opens; a failure shows on the status line.
          closeCombos();
          modelCombo.open = answer.state === "ready";
          render();
        });
        const test = root.querySelector(".test-btn");
        test.addEventListener("click", async () => {
          if (!complete()) return;
          resetResults(false);
          const seq = checkSeq;
          check = { state: "checking" };
          render();
          const answer = await byokAsk(
            { op: "local.byok.check", byok: form.config() },
            "byokCheck",
          );
          if (seq !== checkSeq) return;
          check = answer;
          showToast();
          render();
        });
        const toastEl = root.querySelector(".byok-toast");
        toastEl.addEventListener("click", (event) => {
          if (event.target.closest(".toast-close")) hideToast();
        });
        // Hovering keeps a success on screen; leaving lets it fade.
        toastEl.addEventListener("mouseenter", () => clearTimeout(toastTimer));
        toastEl.addEventListener("mouseleave", () => {
          if (check?.state === "ready")
            toastTimer = setTimeout(hideToast, 1500);
        });
        const status = root.querySelector(".byok-status");

        const form = {
          root,
          complete,
          modelId: () => f.modelId.trim(),
          config: () => ({
            ...endpoint(),
            modelId: f.modelId.trim(),
            runtime: runtimeOf(),
          }),
          // The runtime changed: its default endpoint and format may differ.
          runtimeChanged: () => resetResults(false),
          clearKey: () => {
            f = { ...f, apiKey: "" };
            key.value = "";
          },
          reset: () => {
            f = blank();
            resetResults(true);
          },
          // A click outside the toast and Test dismisses it.
          dismiss: (target) => {
            if (toast && !toastEl.contains(target) && !test.contains(target))
              hideToast();
          },
          sync: (busy) => {
            if (base.value !== f.baseUrl) base.value = f.baseUrl;
            if (key.value !== f.apiKey) key.value = f.apiKey;
            path.sync();
            endpointCombo.sync();
            modelCombo.sync();
            const checking = check?.state === "checking";
            const listing = models?.state === "loading";
            list.disabled = busy || listing || !addressed();
            list.dataset.busy = String(listing);
            list.setAttribute(
              "aria-label",
              t(listing ? "listingModels" : "listModels"),
            );
            test.disabled = busy || checking || !complete();
            test.textContent = t(checking ? "testing" : "test");
            const shown = Boolean(toast && check && !checking);
            toastEl.hidden = !shown;
            if (shown) {
              const ok = check.state === "ready";
              toastEl.dataset.tone = ok ? "ok" : "err";
              toastEl.dataset.leaving = String(toast.leaving);
              const html = `
                <span class="toast-icon">${ok ? ICONS.ok : ICONS.err}</span>
                <div>
                  <strong>${esc(t(ok ? "connected" : "couldNotConnect"))}</strong>
                  <div>${
                    ok
                      ? `${esc(check.modelId)} · ${esc(t("contextSize", { size: contextLabel(check.contextWindow) }))} · ${BYOK_FORMATS[check.protocol].label}<br />${urlHtml(check.url)}`
                      : esc(check.message)
                  }</div>
                </div>
                <button type="button" class="toast-close" aria-label="${esc(t("dismiss"))}">${ICONS.close}</button>`;
              if (html !== toastShown) {
                toastEl.innerHTML = html;
                toastShown = html;
              }
            }
            let line;
            if (!validParts())
              line = { tone: "err", html: esc(t("invalidParts")) };
            else if (models?.state === "failed")
              line = { tone: "err", html: esc(models.message) };
            else if (listing)
              line = { html: tHtml("listingFrom", { url: modelsUrl() }) };
            else if (!baseUrl()) line = { html: esc(t("greyDefaults")) };
            else {
              const { protocol, fromUrl } = format();
              const values = {
                format: BYOK_FORMATS[protocol].label,
                runtime: RUNTIMES[runtimeOf()],
                url: requestUrl(),
              };
              line = {
                html: tHtml(fromUrl ? "sendsTo" : "sendsToRuntime", values),
              };
            }
            if (line.tone) status.dataset.tone = line.tone;
            else delete status.dataset.tone;
            if (status.innerHTML !== line.html) status.innerHTML = line.html;
          },
        };
        byokForms.push(form);
        return form;
      };
      document.addEventListener("pointerdown", (event) => {
        for (const form of byokForms) form.dismiss(event.target);
        if (
          combos.some(
            (combo) => combo.open && !combo.root.contains(event.target),
          )
        ) {
          closeCombos();
          render();
        }
      });
      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        const open = combos.find((combo) => combo.open);
        if (!open) return;
        closeCombos();
        render();
        open.input.focus();
      });
      // The setup form's BYOK always runs on Pi; the sign-in dialog's
      // endpoint serves the runtime signing in.
      const byokRuntime = "pi";
      let signInByokOpen = false;
      const EYE =
        '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.6 8s2.4-4.6 6.4-4.6S14.4 8 14.4 8s-2.4 4.6-6.4 4.6S1.6 8 1.6 8Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><circle cx="8" cy="8" r="2" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>';
      // The setup form's BYOK: an address, a key and a model, one labelled
      // row each. The address may be a base URL or a whole request URL; a
      // bare host gets the usual /v1, and an ending that names a format
      // picks it, as the full form's defaults do. Install tests it once,
      // quietly, and a failure shows under the row it is about.
      const simpleByok = (root, prefix, runtime) => {
        const row = (field, label, input, extra = "") => `
          <div class="fld" data-field="${field}">
            <label class="lb" for="${prefix}-${field}">${esc(label)}</label>
            <div class="vw">${input}</div>${extra}
          </div>`;
        root.innerHTML =
          row(
            "url",
            t("baseUrl"),
            `<input id="${prefix}-url" type="url" autocomplete="off"
              spellcheck="false"
              placeholder="${esc(t("baseUrlPlaceholder"))}" />`,
          ) +
          row(
            "key",
            t("apiKey"),
            `<input id="${prefix}-key" type="password" autocomplete="off"
              spellcheck="false"
              placeholder="${esc(t("apiKeyPlaceholder"))}" />`,
            `<button type="button" class="eye" aria-pressed="false"
              aria-label="${esc(t("showKey"))}">${EYE}</button>`,
          ) +
          row(
            "model",
            t("byokModelId"),
            `<input id="${prefix}-model" type="text" autocomplete="off"
              spellcheck="false"
              placeholder="${esc(t("byokModelPlaceholder"))}" />`,
          ) +
          `<p class="byok-status" id="${prefix}-status" data-tone="err"
            role="alert" hidden></p>`;
        const [url, key, model] = root.querySelectorAll("input");
        const status = root.querySelector(".byok-status");
        const eye = root.querySelector(".eye");
        let f = { url: "", apiKey: "", modelId: "" };
        // Why the last Install's test failed, and which row it is about,
        // until the fields change.
        let failure = "";
        let failed = "url";
        let keyVisible = false;
        const edit = (next) => {
          f = { ...f, ...next };
          failure = "";
          render();
        };
        url.addEventListener("input", () => edit({ url: url.value }));
        key.addEventListener("input", () => edit({ apiKey: key.value }));
        model.addEventListener("input", () => edit({ modelId: model.value }));
        eye.addEventListener("click", () => {
          keyVisible = !keyVisible;
          render();
        });
        const address = () => {
          const typed = f.url.trim().replace(/\/+$/, "");
          for (const [protocol, { suffix }] of Object.entries(BYOK_FORMATS))
            if (typed.endsWith(suffix))
              return {
                baseUrl: typed.slice(0, -suffix.length),
                path: "",
                endpoint: suffix,
                protocol,
              };
          let bare = false;
          try {
            bare = new URL(typed).pathname.replace(/\/+$/, "") === "";
          } catch {}
          const protocol = RUNTIME_FORMATS[runtime];
          return {
            baseUrl: typed,
            path: bare ? DEFAULT_PATH : "",
            endpoint: BYOK_FORMATS[protocol].suffix,
            protocol,
          };
        };
        return {
          root,
          complete: () => f.url.trim() !== "" && f.modelId.trim() !== "",
          modelId: () => f.modelId.trim(),
          config: () => {
            const apiKey = f.apiKey.trim();
            return {
              ...address(),
              ...(apiKey ? { apiKey } : {}),
              modelId: f.modelId.trim(),
              runtime,
            };
          },
          fail: (message, field = "url") => {
            failure = message;
            failed = field;
            const bad = root.querySelector(`[data-field="${field}"]`);
            if (!REDUCE)
              anim(
                bad,
                [
                  { transform: "none" },
                  { transform: "translateX(-3px)" },
                  { transform: "translateX(3px)" },
                  { transform: "translateX(-2px)" },
                  { transform: "none" },
                ],
                { duration: 260, easing: "ease-out" },
              );
          },
          clearKey: () => {
            f = { ...f, apiKey: "" };
            key.value = "";
          },
          reset: () => {
            f = { url: "", apiKey: "", modelId: "" };
            failure = "";
          },
          sync: (busy) => {
            if (url.value !== f.url) url.value = f.url;
            if (key.value !== f.apiKey) key.value = f.apiKey;
            if (model.value !== f.modelId) model.value = f.modelId;
            for (const input of [url, key, model]) input.disabled = busy;
            key.type = keyVisible ? "text" : "password";
            eye.setAttribute("aria-pressed", String(keyVisible));
            eye.setAttribute(
              "aria-label",
              t(keyVisible ? "hideKey" : "showKey"),
            );
            eye.disabled = busy;
            for (const [field, input] of [
              ["url", url],
              ["key", key],
              ["model", model],
            ]) {
              const bad = !!failure && field === failed;
              const fld = input.closest(".fld");
              fld.dataset.bad = String(bad);
              if (bad) {
                input.setAttribute("aria-invalid", "true");
                input.setAttribute("aria-describedby", status.id);
                if (status.parentElement !== fld.querySelector(".vw"))
                  fld.querySelector(".vw").append(status);
              } else {
                input.removeAttribute("aria-invalid");
                input.removeAttribute("aria-describedby");
              }
            }
            status.hidden = !failure;
            if (status.dataset.text !== failure) {
              status.dataset.text = failure;
              status.innerHTML = failure
                ? ICONS.err + `<span>${esc(failure)}</span>`
                : "";
            }
          },
        };
      };
      const mainByok = simpleByok($("byok-fields"), "byok", byokRuntime);
      const signInByok = byokFields(
        $("signin-byok-fields"),
        "signin-byok",
        () => state.localServer.signIn?.runtime ?? "claude",
        () => {},
      );
      // Install is testing the BYOK endpoint before it starts.
      let byokTesting = false;

      const host = (url) => {
        try {
          return new URL(url).host;
        } catch {
          return url;
        }
      };

      // The install line: when what is happening changes, the old words
      // drift up and out as the new ones rise in; a download's count
      // changes in place.
      let lineHead = "";
      const setLine = (text) => {
        const el = $("installing-step");
        if (el.textContent === text) return;
        const head = text.split(" · ")[0];
        const old = el.textContent;
        const moving =
          !REDUCE && old && head !== lineHead && step === "installing";
        lineHead = head;
        el.textContent = text;
        if (!moving) return;
        const ghost = document.createElement("span");
        ghost.className = "line-out";
        ghost.setAttribute("aria-hidden", "true");
        ghost.textContent = old;
        el.after(ghost);
        const out = anim(
          ghost,
          [
            { opacity: 1, transform: "none" },
            { opacity: 0, transform: "translateY(-8px)" },
          ],
          { duration: 420, easing: EASE, fill: "forwards" },
        );
        const drop = () => ghost.remove();
        if (out) out.finished.then(drop, drop);
        else drop();
        anim(
          el,
          [
            { opacity: 0, transform: "translateY(8px)" },
            { opacity: 1, transform: "none" },
          ],
          { duration: 420, delay: 300, easing: EASE },
        );
      };

      // The install's end: the bar fills, folds into the orb, the orb
      // blooms with a ripple, the check draws, and the ready words rise.
      const completeInstall = () => {
        if (REDUCE || finishing || typeof $("sc-ball").animate !== "function")
          return show("ready");
        finishing = true;
        $("installing-fill").style.transform = "scaleX(1)";
        $("installing-bar").setAttribute("aria-valuenow", "100");
        setLine(t("lineAlmost"));
        setTimeout(() => {
          const parts = [
            $("installing-bar"),
            $("installing-line"),
            $("local-model-leave"),
          ];
          const out = parts.map((el) =>
            anim(
              el,
              [
                { opacity: 1, transform: "none" },
                { opacity: 0, transform: "translateY(-40px) scale(0.6)" },
              ],
              { duration: 420, easing: EASE_IO, fill: "forwards" },
            ),
          );
          setTimeout(() => {
            finishing = false;
            show("ready");
            out.forEach((a) => a?.cancel());
            readyMoment();
          }, 360);
        }, 520);
      };
      const readyMoment = () => {
        const ball = $("sc-ball");
        anim(
          ball.querySelector(".o-solid"),
          [{ opacity: 0 }, { opacity: 0.92 }],
          {
            duration: 700,
            easing: EASE,
          },
        );
        anim(
          ball,
          [
            { transform: "none" },
            { transform: "scale(1.1)", offset: 0.4 },
            { transform: "scale(0.98)", offset: 0.75 },
            { transform: "none" },
          ],
          { duration: 900, easing: "ease-in-out", composite: "add" },
        );
        anim(
          $("sc-ripple"),
          [
            { opacity: 0.7, transform: "scale(1)" },
            { opacity: 0, transform: "scale(1.7)" },
          ],
          { duration: 1100, delay: 140, easing: EASE, fill: "none" },
        );
        anim(ball.querySelector(".o-check"), [{ opacity: 0 }, { opacity: 1 }], {
          duration: 300,
          delay: 340,
          easing: "linear",
        });
        anim(
          $("sc-check"),
          [{ strokeDashoffset: 24 }, { strokeDashoffset: 0 }],
          { duration: 520, delay: 380, easing: EASE },
        );
        enter(
          [...document.querySelectorAll("#sc-ready [data-r]")].filter(
            (el) => !el.hidden,
          ),
          620,
          140,
        );
        anim(
          $("floaters"),
          [
            { transform: "translateY(6px) scale(0.985)" },
            { transform: "none" },
          ],
          { duration: 1400, easing: EASE },
        );
      };

      const show = (next) => {
        // Leaving the sign-in step stops waiting for it.
        if (pending === "signin.open") pending = null;
        if (next !== "welcome") closeSheet(false);
        step = next;
        for (const el of document.querySelectorAll("section"))
          el.classList.toggle("active", el.dataset.step === step);
        if (step === "server") {
          $("server").value ||= state.serverUrl;
          setTimeout(() => $("server").focus(), 30);
        }
        render();
      };

      // The bar eases toward the end of the current step between updates,
      // so long steps never look stuck; it never passes the step's end.
      let shown = 0;
      let eased = 0;
      const shownProgress = (local, at) => {
        const now = Date.now();
        const seconds = eased ? (now - eased) / 1000 : 0;
        eased = now;
        // A failure keeps the bar where it was, within the step that failed.
        if (local.phase === "failed")
          return (shown = Math.min(
            Math.max(local.progress, shown),
            (at + 1) / local.steps.length,
          ));
        if (local.phase !== "installing") return (shown = local.progress);
        const cap = (at + 1) / local.steps.length - 0.02;
        shown = Math.max(local.progress, shown);
        if (shown < cap) shown += (cap - shown) * (1 - Math.exp(-seconds / 90));
        return shown;
      };
      // Each install fills the bar afresh.
      let attempt;
      const startAttempt = (local) => {
        if (local.attempt === attempt) return;
        attempt = local.attempt;
        shown = 0;
        eased = 0;
      };
      // The easing bar moves once a second while installing.
      setInterval(() => {
        if (step === "installing" && state?.localServer.phase === "installing")
          render();
      }, 1000);

      // What the sign-in dialog says first for each runtime; each names
      // whose account it signs in with.
      const SIGN_IN_LEADS = {
        codex: "signInLeadCodex",
        claude: "signInLeadClaude",
        pi: "signInLeadPi",
      };
      // The page's own words for why a sign-in ended; the installer's
      // message is the fallback for anything else.
      const SIGN_IN_REASONS = {
        timed_out: "signInTimedOut",
        ended: "signInEnded",
        unavailable: "signInUnavailable",
      };
      let otherRuntimes = false;
      // The sign-in's own errors, such as a failed copy; render keeps them.
      let signInError = "";
      // What was just copied: "url" or "code".
      let signInCopied;
      // The runtime installed but not signed in: a dialog starts its own
      // login, which opens the browser, and closes once it is signed in,
      // bringing setup back. The link (and Codex's device code) always show
      // with buttons to open and copy them, so signing in works even when
      // no browser opens. No secret shows here; a pasted code goes straight
      // to the runtime.
      const renderSignIn = (local, busy) => {
        const sign = local.signIn;
        const open =
          local.phase === "installing" &&
          local.step === "signin" &&
          sign &&
          sign.state !== "signed_in";
        $("runtime-signin").hidden = !open;
        if (!open) {
          otherRuntimes = false;
          signInByokOpen = false;
          signInError = "";
          $("runtime-signin-trouble").open = false;
          return;
        }
        const name = RUNTIMES[sign.runtime];
        const failed = sign.state === "failed";
        const running =
          sign.state === "starting" || sign.state === "waiting_user";
        const pi = sign.runtime === "pi";
        const codex = sign.runtime === "codex";
        const link = running && sign.url;
        $("runtime-signin-title").textContent = t("signInTo", {
          runtime: name,
        });
        $("runtime-signin-lead").textContent = t(SIGN_IN_LEADS[sign.runtime]);
        $("runtime-signin-lead").hidden = running;
        $("runtime-signin-waiting").hidden = !running;
        $("runtime-signin-no-browser").hidden = !link || !sign.browserFailed;
        // A device code works in any browser; the browser login calls back
        // to this computer, so its link has to open here.
        $("runtime-signin-no-browser-text").textContent = t(
          sign.deviceCode ? "browserFailedDevice" : "browserFailed",
        );
        $("runtime-signin-device").hidden = !link || !sign.deviceCode;
        $("runtime-signin-device-code").textContent = sign.deviceCode || "";
        $("runtime-signin-copy-code").textContent = t(
          signInCopied === "code" ? "copied" : "copyCode",
        );
        $("runtime-signin-link").hidden = !link;
        $("runtime-signin-url").textContent = sign.url || "";
        $("runtime-signin-url").title = sign.url || "";
        $("runtime-signin-copy-url").textContent = t(
          signInCopied === "url" ? "copied" : "copyLink",
        );
        $("runtime-signin-error").textContent = failed
          ? SIGN_IN_REASONS[sign.reason]
            ? t(SIGN_IN_REASONS[sign.reason])
            : sign.message || t("signInFailed")
          : signInError;
        $("runtime-signin-idle").hidden = running;
        $("runtime-signin-start").hidden = pi;
        $("runtime-signin-start").textContent = t(
          failed ? "retry" : "authorize",
        );
        $("runtime-signin-device-start").hidden = !codex;
        $("runtime-signin-logs").hidden = !failed;
        $("runtime-signin-runtimes").hidden = !otherRuntimes && !pi;
        $("runtime-signin-other").hidden = pi;
        $("runtime-signin-byok").hidden = !signInByokOpen;
        signInByok.sync(busy);
        $("runtime-signin-byok-submit").disabled =
          busy || !signInByok.complete();
        for (const option of document.querySelectorAll("[data-switch]")) {
          option.hidden = option.dataset.switch === sign.runtime;
          option.disabled = busy;
        }
        $("runtime-signin-busy").hidden = !running;
        // Codex: a code for another device, or back to this computer's
        // browser.
        $("runtime-signin-switch-method").hidden = !codex;
        $("runtime-signin-switch-method").textContent = t(
          sign.deviceCode ? "useBrowserHere" : "useDeviceCode",
        );
        // Claude Code's page shows a code to paste back.
        $("runtime-signin-trouble").hidden = !link || !sign.acceptsCode;
      };

      // The page's own words for each localmodels reason code, with the
      // counts it carries; the tool's message is never shown. held: the
      // model fits the hardware, but other programs hold memory it needs now.
      const counts = (free, needed) =>
        free != null && needed != null
          ? t("memoryCounts", { free: size(free), needed: size(needed) })
          : "";
      const reasonText = (reason, held, freeMemory) => {
        switch (reason.code) {
          case "gpu-memory-required": {
            const values = {
              gpu: String(reason.gpuIndex),
              counts: counts(reason.freeBytes, reason.requiredBytes),
            };
            return reason.gpuIndex != null
              ? t("reasonGpuMemoryOf", values)
              : t("reasonGpuMemory", values);
          }
          case "free-memory-required":
            return t("reasonFreeMemory", {
              counts:
                counts(reason.freeBytes, reason.requiredBytes) ||
                counts(
                  freeMemory?.ramAvailableBytes,
                  freeMemory?.ramRequiredBytes,
                ),
            });
          case "gpu-sharing-required":
            return t("reasonGpuSharing");
          // localmodels 0.1.0.dev39 reports it; later versions plan by the
          // GPU memory free instead.
          case "gpu-ownership-unknown":
            return t("reasonGpuOwnership");
          case "gateway-port-in-use":
            return t("reasonGatewayPortInUse");
          case "harness-unavailable":
            return t("reasonHarnessUnavailable");
          case "facts-unavailable":
            return t("reasonFacts");
          case "cuda-driver-update-required": {
            const has = reason.detectedCudaVersion;
            const needs = reason.requiredCudaVersion;
            const driver = window.lingerSetup.minDriverForCuda?.(needs);
            if (has && needs)
              return driver
                ? t("reasonCudaUpdateDriver", {
                    has: String(has),
                    needs: String(needs),
                    driver: String(driver),
                  })
                : t("reasonCudaUpdate", {
                    has: String(has),
                    needs: String(needs),
                  });
            if (needs)
              return driver
                ? t("reasonCudaTooOldDriver", {
                    needs: String(needs),
                    driver: String(driver),
                  })
                : t("reasonCudaTooOldNeeds", { needs: String(needs) });
            return t("reasonCudaTooOld");
          }
          case "cuda-driver-version-unknown":
            return reason.requiredCudaVersion
              ? t("reasonCudaUnknownNeeds", {
                  needs: String(reason.requiredCudaVersion),
                })
              : t("reasonCudaUnknown");
          case "unsupported-platform":
            return t("reasonUnsupported");
          // Blocked now, it names another inference app holding a Mac's
          // memory.
          case "plan-unavailable":
            return t(held ? "reasonPlanHeld" : "reasonPlanUnavailable");
          default:
            return held
              ? freeMemory
                ? t("reasonHeld")
                : t("reasonHeldGeneric")
              : t("reasonUnavailable");
        }
      };
      const reasonsText = (models, held) =>
        [
          ...new Set(
            (models.reasons?.length ? models.reasons : [{ code: "" }]).map(
              (reason) => reasonText(reason, held, models.freeMemory),
            ),
          ),
        ].join(" ");
      const RECHECKABLE_REASONS = new Set([
        "cuda-driver-update-required",
        "cuda-driver-version-unknown",
        "gateway-port-in-use",
        "harness-unavailable",
      ]);
      const CUDA_DRIVER_CODES = new Set([
        "cuda-driver-update-required",
        "cuda-driver-version-unknown",
      ]);
      const cudaDriverHeld = (models) =>
        Boolean(
          models.reasons?.some((reason) => CUDA_DRIVER_CODES.has(reason.code)),
        );

      // The model step 2 shows: the one picked, else the kit's pick, from
      // the list the picker offers when the kit could list them.
      const chosenModel = (models) => {
        if (models.state !== "checked") return undefined;
        const list = models.models ?? [];
        const fallback = models.model && {
          library: models.model.library,
          name: models.model.name,
          downloadBytes: models.model.downloadBytes,
          memoryBytes: models.model.memoryBytes,
          fits: true,
        };
        return (
          list.find((option) => option.library === pickedModel) ??
          list.find((option) => option.recommended) ??
          list.find((option) => option.library === models.model?.library) ??
          fallback ??
          undefined
        );
      };
      // Why the picked model cannot be installed, in the page's words.
      const modelCheckText = (priced) =>
        priced.code === "MEMORY_INSUFFICIENT"
          ? t("modelNoMemory", { needed: size(priced.memoryBytes ?? 0) })
          : priced.code === "DISK_INSUFFICIENT"
            ? t("modelNoDisk", {
                needed: size(priced.diskBytes ?? 0),
                free: size(priced.diskFreeBytes ?? 0),
              })
            : t("modelCantPlan");
      const cardSub = (option, options) =>
        [option.publisher, paramsText(option), buildText(option, options)]
          .filter(Boolean)
          .join(" · ");
      // Sets a text only when it changed, so a cross-fade is not restarted.
      const setText = (el, text) => {
        if (el.textContent !== text) el.textContent = text;
      };

      // The model card on step 2: what the model is, how good and fast it
      // is here, the download and the memory it takes on this computer.
      const renderModelCard = (local, models, option, busy) => {
        const options = models.models ?? [];
        const total = models.totalMemoryBytes ?? models.memoryBytes;
        const priced =
          pickedModel && local.modelCheck?.library === pickedModel
            ? local.modelCheck
            : undefined;
        const held = models.state === "checked" && !!models.blockedNow;
        setText(
          $("local-model-name"),
          option ? option.name : t("localNotAvailable"),
        );
        setText($("local-model-sub"), option ? cardSub(option, options) : "");
        $("local-model-sub").hidden = !$("local-model-sub").textContent;
        $("model-change").hidden = options.length < 2;
        $("model-change").disabled = busy;
        const why = $("local-model-why-row");
        const whyLine = held
          ? ["err", reasonsText(models, true)]
          : priced?.state === "checking"
            ? ["busy", t("checkingModel")]
            : priced?.state === "checked" && !priced.fits
              ? ["err", modelCheckText(priced)]
              : option
                ? ["", whyText(option)]
                : ["err", ""];
        why.dataset.tone = whyLine[0];
        setText($("local-model-why"), whyLine[1]);
        why.hidden = !whyLine[1];
        const quality = option ? qualityText(option) : "–";
        const speed = option ? speedText(option) : "–";
        setText($("local-model-quality"), quality);
        setText($("local-model-speed"), speed);
        $("local-model-quality").parentElement.hidden = quality === "–";
        $("local-model-speed").parentElement.hidden = speed === "–";
        setText(
          $("local-model-needs"),
          option?.downloadBytes != null ? size(option.downloadBytes) : "",
        );
        $("local-model-needs").parentElement.hidden =
          option?.downloadBytes == null;
        const memory = option?.memoryBytes;
        $("local-model-memory").hidden = !memory || !total;
        if (memory && total) {
          setText(
            $("local-model-mem"),
            t("memOf", { used: gigabytes(memory), total: gigabytes(total) }),
          );
          $("local-model-bar").style.transform =
            `scaleX(${Math.min(1, Math.max(0.02, memory / total))})`;
          setText($("local-model-key"), option.name);
        }
        return {
          checking: priced?.state === "checking",
          refused: priced?.state === "checked" && !priced.fits,
        };
      };

      // The model picker: every model the kit lists here, best first, with
      // how good and fast each is; one that cannot run here is dimmed and
      // says what it needs.
      let pickerKey = "";
      const renderPicker = (models, chosen, busy) => {
        const options = models.state === "checked" ? (models.models ?? []) : [];
        const total = models.totalMemoryBytes ?? models.memoryBytes;
        $("model-sheet-title").textContent = t(
          onMac() ? "pickerTitleMac" : "pickerTitleComputer",
        );
        $("model-sheet-lead").textContent = t("pickerLead");
        const key = JSON.stringify([
          options,
          total,
          document.documentElement.lang,
        ]);
        const list = $("model-list");
        if (key !== pickerKey) {
          pickerKey = key;
          const fastest = Math.max(
            1,
            ...options.filter((o) => o.fits).map((o) => o.decodeTokS ?? 0),
          );
          list.innerHTML = options
            .map((option) => {
              const chips = [
                `<span class="mc">${esc(size(option.downloadBytes))}</span>`,
                option.recommended
                  ? `<span class="mc" data-kind="best">${esc(t("bestFit"))}</span>`
                  : "",
                option.role === "fastest" && !option.recommended
                  ? `<span class="mc">${esc(t("fastest"))}</span>`
                  : "",
              ].join("");
              const meter = (label, value, text = "") =>
                `<span class="meter">${esc(label)}<s><i style="transform: scaleX(${Math.min(1, Math.max(0.04, value)).toFixed(3)})"></i></s>${text ? `<em>${esc(text)}</em>` : ""}</span>`;
              const lower = option.fits
                ? `<span class="meters">${
                    option.quality != null
                      ? meter(t("quality"), option.quality / 80)
                      : ""
                  }${
                    option.decodeTokS != null
                      ? meter(
                          t("speed"),
                          option.decodeTokS / fastest,
                          speedText(option),
                        )
                      : ""
                  }</span>`
                : `<span class="needs">${esc(needsText(option, total))}</span>`;
              return `<button type="button" class="mrow" role="radio"
                data-library="${esc(option.library)}"
                data-rec="${option.recommended ? "true" : "false"}"
                aria-checked="false"><span class="radio" aria-hidden="true">${RADIO}</span><span><span class="nm">${esc(option.name)}</span><span class="tg">${esc(cardSub(option, options))}</span></span><span class="chips">${chips}</span>${lower}</button>`;
            })
            .join("");
        }
        for (const row of list.querySelectorAll(".mrow")) {
          const option = options.find((o) => o.library === row.dataset.library);
          const on = option?.library === chosen?.library;
          row.setAttribute("aria-checked", String(on));
          row.disabled = busy || !option?.fits;
          row.tabIndex = on ? 0 : -1;
        }
      };
      const sheetRows = () =>
        [...$("model-list").querySelectorAll(".mrow")].filter(
          (row) => !row.disabled,
        );
      const openSheet = () => {
        if (sheetOpen) return;
        sheetOpen = true;
        $("model-sheet").hidden = false;
        $("model-change").setAttribute("aria-expanded", "true");
        render();
        const rows = [...$("model-list").querySelectorAll(".mrow")];
        if (REDUCE) {
          fadeIn($("model-sheet"));
        } else {
          anim($("model-sheet-scrim"), [{ opacity: 0 }, { opacity: 1 }], {
            duration: 300,
            easing: "linear",
          });
          anim(
            $("model-sheet-panel"),
            [{ transform: "translateY(100%)" }, { transform: "none" }],
            { duration: 420, easing: EASE },
          );
          rows.forEach((row, i) =>
            anim(
              row,
              [
                { opacity: 0, transform: "translateY(12px)" },
                { opacity: 1, transform: "none" },
              ],
              { duration: 420, delay: 140 + i * 45, easing: EASE },
            ),
          );
        }
        (
          $("model-list").querySelector('.mrow[aria-checked="true"]') ??
          sheetRows()[0] ??
          $("model-sheet-close")
        ).focus({ preventScroll: true });
      };
      const closeSheet = (refocus = true) => {
        if (!sheetOpen) return;
        sheetOpen = false;
        $("model-change").setAttribute("aria-expanded", "false");
        const done = () => {
          if (sheetOpen) return;
          $("model-sheet").hidden = true;
          for (const el of [$("model-sheet-scrim"), $("model-sheet-panel")])
            el.getAnimations?.().forEach((a) => a.cancel());
        };
        const out = REDUCE
          ? null
          : anim(
              $("model-sheet-panel"),
              [{ transform: "none" }, { transform: "translateY(100%)" }],
              { duration: 320, easing: EASE_IO, fill: "forwards" },
            );
        anim($("model-sheet-scrim"), [{ opacity: 1 }, { opacity: 0 }], {
          duration: REDUCE ? 150 : 300,
          easing: "linear",
          fill: "forwards",
        });
        if (out) out.finished.then(done, done);
        else done();
        if (refocus) $("model-change").focus({ preventScroll: true });
      };
      // A pick closes the picker, the card changes to it, and the model is
      // priced again for this computer's memory and disk.
      const pickModel = (library) => {
        const models = state.localServer.localModels;
        const option = (models.models ?? []).find((o) => o.library === library);
        if (!option?.fits) return;
        const changed = chosenModel(models)?.library !== library;
        pickedModel = library;
        render();
        setTimeout(() => closeSheet(), REDUCE ? 0 : 160);
        if (!changed) return;
        anim(
          $("local-row"),
          [
            { opacity: 0.35, transform: "translateY(4px)" },
            { opacity: 1, transform: "none" },
          ],
          {
            duration: REDUCE ? 150 : 420,
            delay: REDUCE ? 0 : 200,
            easing: EASE,
          },
        );
        if (!option.recommended)
          setup
            .run({ op: "local.model.check", model: library })
            .then((next) => {
              state = next;
              render();
            })
            .catch(() => {});
      };

      // The welcome view: the welcome while this computer is checked, the
      // three sources, then the chosen source's settings with Install.
      const renderWelcome = (local, busy) => {
        const section = document.querySelector('[data-step="welcome"]');
        const available = local.available;
        section.dataset.local = String(available);
        const models = local.localModels;
        const checking = models.state === "checking";
        if (available && step === "welcome") {
          if (stage === undefined)
            enterStage(checking || !introDone ? "checking" : "choose");
          if (stage === "checking") startIntro();
          if (stage === "checking" && !checking && introDone) handOff();
          if (!runtimesAsked) {
            runtimesAsked = true;
            // The rows come through onState; the reply may be older than
            // a state pushed meanwhile, so it is not applied.
            setup.run({ op: "local.runtimes.check" }).catch(() => {});
          }
        }
        if (!picked) source = defaults();
        const known =
          models.state === "checked" || models.state === "unavailable";
        const model =
          models.state === "checked" && models.eligible && models.model;
        const held = models.state === "checked" && !!models.blockedNow;
        const heldModel = held && models.model;
        const behind = modelBehind(local);
        const localUsable = Boolean(model) && !behind;
        const rows = runtimeRows(local);
        const signedIn = ["codex", "claude"].filter(
          (runtime) => rows[runtime]?.signedIn,
        );
        const working = Object.values(rows).find(
          (row) => row.state === "installing" || row.state === "signing_in",
        );
        const settings = available && stage === "settings";
        const choosing = available && stage === "choose";
        const checkingStage = available && stage === "checking";

        // The bar under the stage: the local model's progress after the
        // person left its wait.
        $("wz-stage").hidden = checkingStage;
        $("stage-bar").hidden = !available || checkingStage || !behind;
        $("source-back").hidden = !settings;
        $("model-behind").hidden = !behind;
        if (behind) {
          const percent = modelPercent(local.backgroundModel);
          $("model-behind-fill").style.width = percent + "%";
          $("model-behind-text").textContent = t("modelBehind", { percent });
        }

        const NAMES = {
          local: t("localModel"),
          byok: "BYOK",
          subscription: t("subscription"),
        };
        setText(
          $("welcome-title"),
          settings
            ? NAMES[source]
            : available
              ? t("chooseTitle")
              : t("welcomeTitle"),
        );
        // Step 2's title carries the chosen source's orb.
        const hdOrb = "orb" + KIND[source];
        if ($("hd-orb").className !== hdOrb) $("hd-orb").className = hdOrb;

        // The welcome: the orb and the title, and a way on once the check
        // has run very long.
        $("welcome-checking").hidden = !checkingStage && !handing;
        $("checking-skip").hidden = !slowCheck || !checkingStage;
        if (!introStarted) introWords();

        $("local-setup").hidden = !choosing && !settings;
        $("source-grid").hidden = !choosing;
        $("source-panel").hidden = !settings;

        // One line under each name: what the source is, or why the local
        // model cannot be picked.
        const localCard = document.querySelector(
          '.source-card[data-value="local"]',
        );
        setText(
          $("source-local-about"),
          behind
            ? t("localMetaBehind", {
                percent: modelPercent(local.backgroundModel),
              })
            : model
              ? t("sourceLocalAbout")
              : held
                ? t("onHold")
                : known
                  ? t("localNotAvailable")
                  : t("rtChecking"),
        );
        for (const card of document.querySelectorAll(".source-card")) {
          const value = card.dataset.value;
          const off = value === "local" && !localUsable;
          card.disabled = busy || off;
          card.setAttribute("aria-checked", String(source === value));
          // One card takes Tab; the arrows move between them.
          card.tabIndex = source === value ? 0 : -1;
        }
        if (localCard.disabled && source === "local" && !busy)
          localCard.tabIndex = 0;
        // The selection glides to the picked card.
        const selected = document.querySelector(
          '.source-card[aria-checked="true"]',
        );
        $("glider").hidden = !selected;
        if (selected) {
          const y = `translateY(${selected.offsetTop}px)`;
          if ($("glider").style.transform !== y)
            $("glider").style.transform = y;
        }

        // Why the local model cannot be picked, under the cards.
        const unavailableText = known
          ? models.state === "checked"
            ? reasonsText(models, false)
            : t("cannotCheck")
          : "";
        $("plan-why").textContent = !choosing
          ? ""
          : behind || model
            ? ""
            : held
              ? t("heldWhy", { reasons: reasonsText(models, true) })
