<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; font-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title data-t="pageTitle"></title>
    <style>
      @font-face {
        font-family: "Geist Variable";
        font-style: normal;
        font-display: block;
        font-weight: 100 900;
        src: url("/geist.woff2") format("woff2");
      }
      /* The installer's look: a scene on top, the step centered below. */
      :root {
        --ink: #262626;
        --body: #1a1a16;
        --muted: #737266;
        --faint: #a3a39b;
        --line: #ecece9;
        --field: #f4f4f0;
        --ok: #2f9e44;
        --error: #b5320a;
        --filled: #9b9a90;
        --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
        color: var(--body);
        background: #fff;
        font:
          14px/1.5 "Geist Variable",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "PingFang SC",
          "Noto Sans SC",
          system-ui,
          sans-serif;
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        -webkit-user-select: none;
      }

      body:not([data-ready]) {
        background: #fbfbf9;
      }
      body:not([data-ready]) .scene,
      body:not([data-ready]) .topbar {
        display: none;
      }

      /* Scene and top bar. Both are the window drag region. */
      .scene {
        flex: none;
        height: 190px;
        background: #f4f4f0 url("/welcome-scene.png") center / cover no-repeat;
        -webkit-app-region: drag;
      }
      .topbar {
        position: absolute;
        top: 18px;
        left: 28px;
        right: 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        color: #52524b;
        font-size: 12px;
        -webkit-app-region: drag;
      }
      /* Clear the traffic lights. */
      body[data-platform="darwin"] .topbar {
        left: 84px;
      }

      .topbar .brand {
        height: 24px;
        width: auto;
      }

      /* The current step. */
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        width: min(100%, 600px);
        margin: 0 auto;
        padding: 20px 24px 16px;
        text-align: center;
      }
      section {
        display: none;
        flex: 1;
        flex-direction: column;
        min-height: 0;
        animation: enter 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      }
      section.active {
        display: flex;
      }
      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      h1 {
        margin: 0 0 6px;
        color: var(--ink);
        font-size: 20px;
        font-weight: 580;
        line-height: 32px;
        letter-spacing: 0.0025em;
        text-wrap: balance;
      }
      .lead {
        max-width: 440px;
        margin: 0 auto 22px;
        color: var(--muted);
        font-size: 13px;
        text-wrap: pretty;
      }
      .lead.compact {
        margin-bottom: 14px;
      }
      .icon {
        display: grid;
        place-items: center;
        flex: none;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: var(--field);
        color: var(--ink);
      }
      svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      form {
        width: min(100%, 400px);
        margin: 0 auto;
        text-align: left;
      }
      label.field {
        display: block;
        margin-bottom: 6px;
        color: var(--ink);
        font-size: 12px;
        font-weight: 550;
      }
      input[type="text"] {
        width: 100%;
        height: 40px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        outline: none;
        background: #fff;
        color: var(--ink);
        font: inherit;
        font-size: 14px;
        user-select: text;
        -webkit-user-select: text;
        transition: border-color 0.15s;
      }
      input[type="text"]:focus {
        border-color: var(--ink);
      }
      .hint {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 12px;
      }
      .hint:empty {
        display: none;
      }
      .error:empty {
        display: none;
      }
      .error {
        margin: 10px 0 0;
        color: var(--error);
        font-size: 12px;
      }
      .card {
        display: flex;
        align-items: center;
        gap: 12px;
        width: min(100%, 420px);
        margin: 0 auto;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        text-align: left;
      }
      .card .text {
        flex: 1;
        min-width: 0;
      }
      .card .text strong {
        display: block;
        overflow: hidden;
        color: var(--ink);
        font-size: 13px;
        font-weight: 550;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .card .text span {
        display: block;
        overflow: hidden;
        color: var(--muted);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }
      .badge[data-ok="true"] {
        color: var(--ok);
        font-weight: 500;
      }
      .badge svg {
        width: 14px;
        height: 14px;
      }
      .spinner {
        display: inline-block;
        width: 12px;
        height: 12px;
        margin-right: 6px;
        vertical-align: -1px;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .badge .spinner {
        margin-right: 0;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .rows {
        display: grid;
        align-content: start;
        min-height: 0;
        overflow-y: auto;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        text-align: left;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 0;
      }
      .row + .row {
        border-top: 1px solid var(--line);
      }
      .row .text {
        flex: 1;
        min-width: 0;
      }
      .row strong {
        display: block;
        color: var(--ink);
        font-size: 13px;
        font-weight: 550;
      }
      .row span.sub {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }
      .folders {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 6px;
      }
      .folders span {
        max-width: 200px;
        padding: 2px 6px;
        overflow: hidden;
        border-radius: 4px;
        background: var(--field);
        color: #52524b;
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      body:not([data-platform="darwin"]) .mac-only {
        display: none;
      }
      .row .badge {
        flex: none;
      }
      [hidden] {
        display: none !important;
      }
      .row span.sub[data-warn="true"] {
        color: var(--error);
      }
      .row select {
        flex: none;
        height: 30px;
        padding: 0 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--ink);
        font: inherit;
        font-size: 12px;
      }
      .switch {
        position: relative;
        flex: none;
        width: 34px;
        height: 20px;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: #dbdcd5;
        transition: background 0.2s;
      }
      .switch::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .switch[aria-checked="true"] {
        background: var(--ink);
      }
      .switch[aria-checked="true"]::after {
        transform: translateX(14px);
      }
      .switch:hover:not(:disabled) {
        background: #c4c4bc;
      }
      .switch[aria-checked="true"]:hover:not(:disabled) {
        background: #41413b;
      }
      .switch:disabled {
        opacity: 0.5;
      }

      footer.actions {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: auto;
        padding-top: 18px;
      }
      button,
      select {
        font: inherit;
        cursor: pointer;
      }
      button:disabled,
      button[aria-disabled="true"],
      select:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
      }
      .primary,
      .ghost,
      .secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid #dbdcd5;
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        font-size: 13px;
        font-weight: 470;
        white-space: nowrap;
        transition:
          background-color 140ms ease,
          transform 100ms ease;
      }
      .primary,
      .ghost {
        min-height: 36px;
        padding: 6px 15px;
      }
      .primary {
        min-width: 112px;
        border-color: var(--ink);
        background: var(--ink);
        color: #fff;
      }
      .primary:hover:not(:disabled) {
        background: #41413b;
      }
      .ghost:hover:not(:disabled),
      .secondary:hover:not(:disabled) {
        background: #f4f4f5;
      }
      .primary:active:not(:disabled),
      .ghost:active:not(:disabled),
      .secondary:active:not(:disabled) {
        transform: translateY(1px);
      }
      .primary svg {
        width: 14px;
        height: 14px;
      }
      .secondary {
        min-height: 28px;
        padding: 3px 10px;
        font-size: 12px;
      }
      .link {
        padding: 6px;
        border: 0;
        border-radius: 4px;
        background: none;
        color: #414038;
        font-size: 12px;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .link:hover:not(:disabled) {
        background: #f4f4f5;
      }

      section[data-step="welcome"] [hidden] {
        display: none !important;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      /* Focus lands on the title when a stage opens; it is not a control. */
      #welcome-title:focus {
        outline: none;
      }
      .eyebrow {
        display: inline-flex;
        align-self: center;
        align-items: center;
        gap: 6px;
        margin-bottom: 10px;
        padding: 3px 10px 3px 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.8);
        color: #5f5e55;
        font-size: 11.5px;
        font-weight: 500;
        letter-spacing: 0.01em;
      }
      .eyebrow svg {
        width: 12px;
        height: 12px;
        stroke-width: 2;
      }
      .link.quiet {
        padding: 2px 4px;
        color: #52524b;
        font-weight: 500;
        text-decoration-color: #d4d4cd;
        transition:
          color 140ms ease,
          text-decoration-color 140ms ease;
      }
      .link.quiet:hover:not(:disabled) {
        background: none;
        color: var(--ink);
        text-decoration-color: var(--ink);
      }
      .choice[hidden],
      .byok-box[hidden],
      .signin-byok[hidden] {
        display: none !important;
      }
      .choice.byok-box {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
        padding: 9px 0;
      }
      /* BYOK fields, built once by byokFields() for the setup form and the
         sign-in dialog: the base URL and two optional comboboxes (path and
         endpoint) on one row, the key, then the model with List models and
         Test beside it, and one status line. */
      .byok-fields {
        display: grid;
        gap: 6px;
        font-size: 12px;
        text-align: left;
      }
      .byok-provider-wrap {
        position: relative;
        display: flex;
        align-items: center;
        height: 32px;
        border: 1px solid #e2e2dc;
        border-radius: 8px;
        background: #fafaf8;
        transition:
          border-color 140ms ease,
          background-color 140ms ease;
      }
      .byok-provider-wrap:focus-within {
        border-color: var(--ink);
        background: #fff;
      }
      .byok-provider {
        appearance: none;
        -webkit-appearance: none;
        width: 100%;
        height: 100%;
        padding: 0 28px 0 10px;
        border: 0;
        outline: none;
        background: transparent;
        color: var(--ink);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      .byok-provider-wrap svg {
        position: absolute;
        right: 9px;
        width: 10px;
        height: 10px;
        color: var(--faint);
        pointer-events: none;
      }
      .byok-custom-base[hidden] {
        display: none;
      }
      .byok-fields .ep {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 6px;
      }
      .byok-fields .ep[data-base-outside="true"] {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      }
      .byok-fields .ep[data-base-outside="true"] > .cb .cb-input {
        width: 100%;
        max-width: none;
      }
      .byok-fields .ep-base-wrap,
      .byok-fields .ep > .cb,
      .byok-fields .cb.standalone,
      .byok-fields .byok-key {
        display: flex;
        align-items: center;
        min-width: 0;
        height: 32px;
        padding: 0 4px 0 10px;
        border: 1px solid #e2e2dc;
        border-radius: 8px;
        background: #fafaf8;
        transition:
          border-color 140ms ease,
          background-color 140ms ease;
      }
      .byok-adv {
        margin-top: 1px;
      }
      .byok-adv > summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 2px 0;
        color: var(--muted);
        font-size: 11.5px;
        font-weight: 500;
        list-style: none;
        cursor: pointer;
      }
      .byok-adv > summary::-webkit-details-marker {
        display: none;
      }
      .byok-adv > summary:hover {
        color: var(--ink);
      }
      .byok-adv-title {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        flex: none;
      }
      .byok-adv-title svg {
        width: 10px;
        height: 10px;
        color: var(--faint);
        transform: rotate(-90deg);
        transition: transform 150ms ease;
      }
      .byok-adv[open] .byok-adv-title svg {
        transform: rotate(0deg);
      }
      .byok-adv-meta {
        min-width: 0;
        overflow: hidden;
        color: var(--faint);
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 400;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .byok-adv-body {
        display: grid;
        gap: 8px;
        margin-top: 6px;
        padding: 9px 10px;
        border: 1px solid #ecece7;
        border-radius: 10px;
        background: #f8f8f5;
      }
      .byok-adv-body .ep-base-wrap,
      .byok-adv-body .ep > .cb {
        height: 29px;
        background: #fff;
      }
      .byok-adv-url {
        color: var(--muted);
        font-size: 11px;
        line-height: 1.4;
        overflow-wrap: anywhere;
      }
      .byok-status[hidden] {
        display: none;
      }
      .byok-fields .byok-key {
        width: 100%;
        padding-right: 10px;
        color: var(--ink);
        font: inherit;
        user-select: text;
        -webkit-user-select: text;
      }
      .byok-fields .ep-base-wrap:focus-within,
      .byok-fields .ep > .cb:focus-within,
      .byok-fields .cb.standalone:focus-within,
      .byok-fields .byok-key:focus {
        outline: none;
        border-color: var(--ink);
        background: #fff;
      }
      .ep-base,
      .cb-input {
        flex: 1 1 auto;
        width: 100%;
        min-width: 0;
        height: 100%;
        padding: 0;
        border: 0;
        outline: none;
        background: transparent;
        color: var(--ink);
        font: inherit;
        text-overflow: ellipsis;
        user-select: text;
        -webkit-user-select: text;
      }
      /* Path and endpoint boxes are as wide as their value; the base URL
         takes the rest of the row. */
      .ep > .cb .cb-input {
        field-sizing: content;
        width: auto;
        min-width: 1ch;
        max-width: 17ch;
      }
      .byok-fields input::placeholder {
        color: var(--faint);
      }
      .cb-input::placeholder {
        font-style: italic;
      }
      /* Grey: the default Linger fills in, which is still sent. */
      .cb[data-default="true"] .cb-input {
        color: var(--filled);
      }
      .cb[data-default="true"] .cb-input:focus {
        color: #77766c;
      }

      /* Combobox: type anything, or pick from the list. */
      .cb {
        position: relative;
      }
      .cb-caret {
        display: grid;
        flex: none;
        place-items: center;
        width: 20px;
        height: 20px;
        padding: 0;
        border: 0;
        border-radius: 5px;
        background: none;
        color: var(--faint);
      }
      .cb-caret:hover:not(:disabled),
      .cb[data-open="true"] .cb-caret {
        background: rgba(20, 20, 16, 0.06);
        color: var(--muted);
      }
      .cb-menu {
        position: absolute;
        top: calc(100% + 5px);
        left: -1px;
        z-index: 30;
        display: grid;
        gap: 1px;
        min-width: calc(100% + 2px);
        width: max-content;
        max-width: min(320px, 86vw);
        max-height: 252px;
        overflow-y: auto;
        padding: 4px;
        border: 1px solid rgba(20, 20, 16, 0.08);
        border-radius: 11px;
        background: #fff;
        box-shadow: 0 16px 36px -14px rgba(20, 20, 16, 0.35);
        font-size: 12px;
        line-height: 1.4;
        cursor: default;
        animation: menu-in 160ms var(--ease);
      }
      .cb-menu[hidden] {
        display: none;
      }
      .ep > .cb .cb-menu {
        left: auto;
        right: -1px;
      }
      @keyframes menu-in {
        from {
          opacity: 0;
          transform: translateY(-3px);
        }
      }
      .cb-menu [role="option"] {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 16px;
        align-items: center;
        gap: 1px 10px;
        padding: 6px 8px;
        border: 0;
        border-radius: 7px;
        background: none;
        text-align: left;
      }
      .cb-menu [role="option"]:hover,
      .cb-menu [role="option"]:focus-visible {
        background: #f4f4f0;
        outline: none;
      }
      .opt-main {
        color: var(--ink);
        font: 500 12px var(--mono);
        overflow-wrap: anywhere;
      }
      .opt-label {
        grid-column: 1;
        color: var(--muted);
        font-size: 11.5px;
      }
      .opt-label em {
        margin-left: 6px;
        color: #d9822b;
        font-style: normal;
        font-weight: 500;
      }
      .opt-check {
        grid-column: 2;
        grid-row: 1 / span 2;
        visibility: hidden;
        color: var(--ink);
      }
      [aria-selected="true"] > .opt-check {
        visibility: visible;
      }
      .cb-head {
        padding: 5px 8px 3px;
        color: var(--faint);
        font-size: 11px;
        font-weight: 500;
      }
      .cb-note {
        max-width: 300px;
        padding: 7px 8px;
        color: var(--muted);
        font-size: 11.5px;
        overflow-wrap: anywhere;
      }
      .cb-note[data-tone="err"] {
        color: var(--error);
      }

      /* The model box, with List models and Test beside it; the test
         result floats under Test. */
      .model-row {
        position: relative;
        display: flex;
        gap: 6px;
      }
      .model-row > .cb {
        flex: 1;
      }
      .model-row > .change {
        height: 32px;
      }
      .model-row > .list-btn {
        display: grid;
        place-items: center;
        width: 32px;
        padding: 0;
        color: var(--muted);
      }
      .model-row > .list-btn:hover:not(:disabled) {
        color: var(--ink);
      }
      .list-btn[data-busy="true"] svg {
        animation: spin 0.9s linear infinite;
      }
      .byok-toast {
        position: absolute;
        top: calc(100% + 9px);
        right: 0;
        z-index: 40;
        display: grid;
        grid-template-columns: 16px minmax(0, 1fr) 20px;
        align-items: start;
        gap: 8px;
        width: min(330px, 100%);
        padding: 10px 8px 10px 12px;
        border-radius: 10px;
        background: #1f1f1d;
        color: #c9c8bf;
        box-shadow: 0 14px 32px -10px rgba(20, 20, 16, 0.5);
        font-size: 12px;
        line-height: 1.45;
        text-align: left;
        user-select: text;
        -webkit-user-select: text;
        animation: toast-in 180ms var(--ease);
      }
      .byok-toast[hidden] {
        display: none;
      }
      .byok-toast::before {
        content: "";
        position: absolute;
        top: -4px;
        right: 22px;
        width: 9px;
        height: 9px;
        border-radius: 2px;
        background: inherit;
        transform: rotate(45deg);
      }
      .byok-toast[data-leaving="true"] {
        animation: toast-out 200ms ease forwards;
      }
      @keyframes toast-in {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
      }
      @keyframes toast-out {
        to {
          opacity: 0;
          transform: translateY(-4px);
        }
      }
      /* Over the setup form's own .choice strong. */
      .byok-fields .byok-toast strong {
        display: block;
        color: #fff;
        font-size: 12.5px;
        font-weight: 550;
      }
      .byok-toast .url {
        color: #ecebe3;
      }
      .toast-icon {
        display: grid;
        margin-top: 1px;
      }
      .byok-toast[data-tone="ok"] .toast-icon {
        color: #74d08b;
      }
      .byok-toast[data-tone="err"] .toast-icon {
        color: #ff9466;
      }
      .toast-close {
        display: grid;
        place-items: center;
        width: 20px;
        height: 20px;
        padding: 0;
        border: 0;
        border-radius: 5px;
        background: none;
        color: #8f8e85;
      }
      .toast-close:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
      }
      .byok-status {
        color: var(--faint);
        font-size: 11.5px;
        line-height: 1.4;
        overflow-wrap: anywhere;
      }
      .byok-status[data-tone="err"] {
        color: var(--error);
      }
      .byok-status .url {
        color: var(--muted);
      }
      .byok-status[data-tone] .url {
        color: inherit;
      }
      .byok-fields .url {
        font-family: var(--mono);
        font-size: 0.95em;
        overflow-wrap: anywhere;
      }
      .harness-icon {
        width: 15px;
        height: 15px;
        flex: none;
        object-fit: contain;
        transition:
          filter 160ms ease,
          opacity 160ms ease;
      }
      [data-detected="false"] .harness-icon {
        filter: grayscale(1);
        opacity: 0.38;
      }
      /* Opens the system folder picker. */
      .change {
        flex: none;
        height: 28px;
        padding: 0 12px;
        border: 1px solid #e6e6e1;
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        font-size: 12px;
        font-weight: 500;
        transition:
          border-color 140ms ease,
          background-color 140ms ease;
      }
      .change:hover:not(:disabled) {
        border-color: #c4c4bc;
        background: #fafaf8;
      }
      .change:active:not(:disabled) {
        background: #f1f1ee;
      }

      #leave-error:empty {
        display: none;
      }
      .track {
        position: relative;
        height: 4px;
        margin-top: 12px;
        overflow: hidden;
        border-radius: 999px;
        background: #f0f0ec;
      }
      .fill {
        position: relative;
        width: 0;
        height: 100%;
        overflow: hidden;
        border-radius: inherit;
        background: linear-gradient(90deg, #4a4a45, #1b1b19);
        transition: width 900ms var(--ease);
      }
      /* A soft sheen shows the work goes on between updates. */
      .fill::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.45),
          transparent
        );
        transform: translateX(-100%);
        animation: sheen 1.8s ease-in-out infinite;
      }
      @keyframes sheen {
        to {
          transform: translateX(100%);
        }
      }
      .problem {
        width: 380px;
        margin: 14px auto 0;
        padding: 10px 14px;
        border: 1px solid #f3dfd6;
        border-radius: 12px;
        background: #fdf6f3;
        color: var(--error);
        font-size: 12px;
        text-align: left;
        user-select: text;
        -webkit-user-select: text;
      }
      .problem:empty {
        display: none;
      }
      /* The AI runtime's own sign-in: a small dialog over the progress while
         the "signin" step waits. */
      .signin-modal {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        background: rgb(38 38 38 / 28%);
        animation: enter 0.18s ease-out;
      }
      .signin-modal[hidden],
      .signin-modal [hidden] {
        display: none;
      }
      .signin-modal .sheet {
        width: 340px;
        padding: 22px 22px 18px;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 18px 48px rgb(0 0 0 / 18%);
        font-size: 12px;
        text-align: left;
      }
      .signin-modal h2 {
        margin: 0 0 6px;
        color: var(--ink);
        font-size: 16px;
        font-weight: 600;
      }
      .signin-modal p {
        margin: 0 0 14px;
        color: var(--muted);
        line-height: 1.5;
      }
      .signin-modal .waiting {
        display: flex;
        align-items: center;
        margin-bottom: 4px;
        color: var(--ink);
      }
      .signin-modal .device-code strong {
        color: var(--ink);
        font:
          600 14px ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        letter-spacing: 0.08em;
        user-select: all;
        -webkit-user-select: all;
      }
      .signin-modal .problem {
        width: auto;
        margin: 0 0 14px;
      }
      .signin-modal .hint {
        color: var(--muted);
        font-size: 11.5px;
      }
      /* No browser opened: the link below is the way on. */
      .signin-modal .no-browser {
        padding: 8px 10px;
        border: 1px solid #f1e3c4;
        border-radius: 10px;
        background: #fdf9ef;
        color: #6b5413;
      }
      .signin-modal .device-code {
        margin-bottom: 12px;
      }
      .signin-modal .device-code p {
        margin: 0;
      }
      .signin-modal .copy-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 4px 0;
      }
      .signin-modal .copy-row strong {
        flex: 1;
      }
      .signin-modal .signin-link {
        margin-bottom: 12px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--field);
      }
      .signin-modal .signin-link .label {
        display: block;
        margin-bottom: 4px;
        color: var(--muted);
        font-size: 11px;
      }
      .signin-modal .signin-link code {
        display: block;
        overflow: hidden;
        margin-bottom: 8px;
        color: var(--ink);
        font: 11.5px var(--mono);
        white-space: nowrap;
        text-overflow: ellipsis;
        user-select: all;
        -webkit-user-select: all;
      }
      .signin-modal .signin-link .buttons {
        display: flex;
        gap: 8px;
      }
      .signin-modal .actions {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .signin-modal .actions .primary {
        width: 100%;
      }
      .signin-modal .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .signin-modal .runtimes {
        display: flex;
        gap: 8px;
        margin-top: 4px;
      }
      .signin-modal .runtimes button {
        flex: 1;
      }
      .signin-modal details {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
        color: var(--muted);
      }
      .signin-modal summary {
        width: max-content;
        cursor: pointer;
        list-style: none;
      }
      .signin-modal summary::-webkit-details-marker {
        display: none;
      }
      .signin-modal details p {
        margin: 8px 0;
      }
      .signin-modal details form {
        display: flex;
        gap: 8px;
      }
      .signin-modal details input {
        flex: 1;
        min-width: 0;
        padding: 5px 10px;
        border: 1px solid #dbdcd5;
        border-radius: 8px;
        font: inherit;
      }
      .signin-byok {
        display: grid;
        gap: 10px;
        margin-top: 8px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
      }
      /* The BYOK fields take the room they have on the setup form. */
      .signin-modal .sheet:has(.signin-byok:not([hidden])) {
        width: 448px;
      }
      /* Send Diagnostics: consent, progress and the report id. */
      .send-modal .files {
        max-height: 132px;
        margin: 0 0 14px;
        padding: 8px 10px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        list-style: none;
        color: var(--muted);
        font:
          11px/1.6 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        overflow-wrap: anywhere;
      }
      .send-modal .track {
        margin: 0 0 14px;
      }
      .send-modal .fill {
        transition: width 200ms linear;
      }
      .send-modal .report strong {
        display: block;
        margin-top: 6px;
        color: var(--ink);
        font:
          600 16px ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        letter-spacing: 0.06em;
        user-select: all;
        -webkit-user-select: all;
      }

      /* ---------- Wizard look (welcome, installing, ready) ----------
         One 760x660 window: a quiet wash, the logo on top, a 440px
         stage, and the mark that carries the eye from the welcome through
         step 1, the settings and the install. Ported from
         the round-4 prototype; motion is transform and opacity only. */
      body[data-look="wizard"] {
        --ink: #1a1a16;
        --body: #2c2c27;
        --line: #eeeee9;
        --field: #f6f6f2;
        --ok: #3f8a4c;
        --blue: #0a6fc2;
        --r-lg: 16px;
        --sh-card:
          0 0 0 1px rgba(26, 25, 26, 0.055), 0 1px 2px rgba(0, 0, 0, 0.04),
          0 8px 24px -12px rgba(26, 26, 22, 0.12);
        --ease-io: cubic-bezier(0.65, 0.05, 0.25, 1);
        background: #fbfbf9;
        isolation: isolate;
      }
      body[data-look="wizard"] .scene {
        display: none;
      }
      .wash {
        display: none;
      }
      body[data-look="wizard"] .wash {
        display: block;
        position: fixed;
        inset: -20%;
        z-index: -1;
        pointer-events: none;
        background:
          radial-gradient(
            40% 32% at 50% 36%,
            rgba(253, 169, 70, 0.085),
            transparent 70%
          ),
          radial-gradient(
            34% 28% at 47% 40%,
            rgba(20, 20, 20, 0.03),
            transparent 70%
          );
        transition: opacity 0.8s var(--ease);
      }
      body[data-scene] .wash {
        opacity: 0.55;
      }
      /* A drag strip along the top, under the traffic lights. */
      .drag {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 52px;
        z-index: 1;
        -webkit-app-region: drag;
      }
      body[data-look="wizard"] .topbar {
        top: 14px;
        right: 24px;
        height: 28px;
        z-index: 20;
        transition: opacity 0.6s var(--ease);
      }
      body[data-look="wizard"] .topbar .brand {
        height: 21px;
      }
      body[data-look="wizard"] #step-label {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      /* The intro and the install scene show the window without its chrome. */
      body[data-chrome="off"] .topbar {
        opacity: 0;
      }
      body[data-look="wizard"] main {
        position: fixed;
        inset: 0;
        width: auto;
        margin: 0;
        padding: 0;
        text-align: left;
      }
      body[data-look="wizard"]
        section:is(
          [data-step="welcome"],
          [data-step="installing"],
          [data-step="ready"]
        ) {
        position: absolute;
        inset: 0;
        display: none;
        animation: none;
      }
      body[data-look="wizard"]
        section:is(
          [data-step="welcome"],
          [data-step="installing"],
          [data-step="ready"]
        ).active {
        display: block;
      }
      body[data-look="wizard"] h1 {
        margin: 0;
        font-size: 24px;
        line-height: 32px;
        font-weight: 600;
        letter-spacing: -0.012em;
        color: var(--ink);
      }
      body[data-look="wizard"] :is(.src-row, .mrow):disabled {
        opacity: 1;
        cursor: default;
      }

      /* ---------- The mark: Linger's logo, built from line art ----------
         The favicon's wedge and dot. Unpicked, it is an outline; picked, it
         fills with ink and its dot. While installing, an ink trace follows
         the progress around a pale outline and the dot's ring pulses; ready
         fills it and draws a check on the dot. */
      .mark {
        --s: 44px;
        position: relative;
        display: inline-block;
        width: var(--s);
        height: var(--s);
        flex: none;
      }
      .mk-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        display: block;
        /* Not the icon stroke every other svg here inherits. */
        stroke: none;
      }
      .mk-svg * {
        transform-box: fill-box;
        transform-origin: 50% 50%;
      }
      .mk-track {
        fill: none;
        stroke: #b9b8b0;
        stroke-linejoin: round;
      }
      .mk-trace {
        fill: none;
        stroke: #141414;
        stroke-linejoin: round;
        stroke-linecap: round;
        stroke-dasharray: 100;
        stroke-dashoffset: 0;
        transition: stroke-dashoffset 0.7s var(--ease);
      }
      .mk-fill {
        fill: #141414;
        transition: opacity 0.4s var(--ease);
      }
      .mk-ring {
        fill: none;
        stroke: #fda946;
      }
      .mk-d {
        fill: #fda946;
        transition: opacity 0.4s var(--ease);
      }
      .mk-ck {
        fill: none;
        stroke: #fff;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 24;
        stroke-dashoffset: 24;
        opacity: 0;
      }
      /* Step 1: the cards not picked show the outline only. */
      .source-card:not([aria-checked="true"]) :is(.mk-fill, .mk-d, .mk-trace) {
        opacity: 0;
      }
      .source-card:not([aria-checked="true"]) .mk-ring {
        stroke: #c9c7bf;
      }
      /* The install: a pale outline, the trace and the dot's ring. */
      .mark.mark-scene .mk-track {
        stroke: #e2e1da;
      }
      .mark.mark-scene :is(.mk-fill, .mk-d) {
        opacity: 0;
      }
      .mark.mark-scene:not(.off) .mk-ring {
        animation: mk-ring 2.8s ease-in-out infinite;
      }
      .mark.breathe {
        animation: mk-breathe 4.6s ease-in-out infinite;
      }
      @keyframes mk-ring {
        50% {
          opacity: 0.35;
        }
      }
      @keyframes mk-breathe {
        50% {
          scale: 1.02;
        }
      }
      /* Failed: grey, the trace stopped where it was. */
      .mark.off :is(.mk-trace, .mk-ring) {
        stroke: #c9c8c1;
      }
      .mark.off .mk-track {
        stroke: #ebeae4;
      }
      /* Ready: filled, with the check drawn on the dot. */
      body[data-scene="ready"] #sc-mark :is(.mk-fill, .mk-d) {
        opacity: 1;
      }
      body[data-scene="ready"] #sc-mark .mk-ring {
        animation: none;
      }
      body[data-scene="ready"] #sc-mark .mk-trace {
        stroke-dashoffset: 0 !important;
      }
      body[data-scene="ready"] #sc-mark .mk-ck {
        opacity: 1;
        stroke-dashoffset: 0;
      }
      /* The ready ripple spreads from the dot: (585.2, 441.2), r 94.1 in
         the mark's 556-unit box. */
      .mk-ripple {
        position: absolute;
        left: 46.24%;
        top: 20.16%;
        width: 33.85%;
        height: 33.85%;
        border-radius: 50%;
        box-shadow: inset 0 0 0 1.5px rgba(253, 169, 70, 0.85);
        opacity: 0;
        pointer-events: none;
      }

      /* ---------- The welcome: the mark draws, the words rise ---------- */
      .intro {
        position: absolute;
        inset: 0;
        z-index: 15;
      }
      .intro[data-intro="waiting"] {
        opacity: 0;
      }
      .intro-mark {
        position: absolute;
        left: 324px;
        top: 212px;
        width: 112px;
        height: 112px;
        transform-origin: 0 0;
      }
      body[data-look="wizard"] .intro-title {
        position: absolute;
        top: 350px;
        left: 0;
        right: 0;
        margin: 0;
        text-align: center;
        font-size: 30px;
        line-height: 38px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--ink);
      }
      .intro-title span {
        display: inline-block;
        white-space: pre;
      }
      #flyer {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 40;
      }
      #flyer .mark {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
      }

      /* ---------- The stage: step 1 and the settings ---------- */
      .wz-stage {
        position: absolute;
        top: 112px;
        left: 160px;
        width: 440px;
        height: 520px;
      }
      .wz-hd {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        text-align: center;
      }
      .wz-hd .slot {
        height: 44px;
        margin: 0 auto 14px;
        display: flex;
        justify-content: center;
      }
      section[data-stage="choose"] .wz-hd .slot {
        display: none;
      }
      .wz-body {
        position: absolute;
        left: 0;
        right: 0;
        top: 112px;
        height: 272px;
      }
      section[data-stage="choose"] .wz-body {
        top: 54px;
        height: 330px;
      }
      /* Under the local model's card, a location problem takes the title
         mark's room and the model's one-line pitch, so the step still fits
         above the fixed buttons. The other sources have room as they are. */
      section[data-stage="settings"]:has(
          #local-row:not([hidden]) ~ #location-row[data-warn="true"]
        )
        .wz-hd
        .slot {
        display: none;
      }
      section[data-stage="settings"]:has(
          #local-row:not([hidden]) ~ #location-row[data-warn="true"]
        )
        .wz-body {
        top: 54px;
        height: 330px;
      }
      .wz-act {
        position: absolute;
        top: 404px;
        left: 0;
        right: 0;
        display: flex;
        gap: 10px;
      }
      .wz-aux {
        position: absolute;
        top: 460px;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        text-align: center;
        font-size: 12.5px;
        color: var(--faint);
      }
      .wz-aux p {
        margin: 0;
      }
      .wz-aux .plan-why,
      .wz-aux #local-driver-status {
        max-width: 420px;
        color: var(--muted);
        text-wrap: pretty;
      }
      .wz-aux .error:not(:empty) {
        color: var(--error);
      }
      .wz-aux .plan-actions {
        display: flex;
        gap: 10px;
        justify-content: center;
      }
      #plan-line:empty {
        display: none;
      }
      .wz-behind {
        position: absolute;
        top: 498px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
      }

      /* Buttons */
      .btn-primary,
      .btn-ghost,
      .btn-sec {
        height: 44px;
        border-radius: 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border: 0;
        font: inherit;
        font-size: 14px;
        font-weight: 550;
        cursor: pointer;
        transition:
          transform 0.15s var(--ease),
          opacity 0.25s,
          box-shadow 0.25s,
          background 0.2s;
      }
      .btn-primary {
        flex: 1;
        padding: 0 20px;
        background: var(--ink);
        color: #fff;
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.1) inset,
          0 1px 2px rgba(0, 0, 0, 0.16),
          0 6px 14px -8px rgba(26, 26, 22, 0.5);
      }
      .btn-primary kbd {
        font:
          500 11px/1 "Geist Variable",
          system-ui;
        opacity: 0.5;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 5px;
        padding: 3px 5px 2px;
      }
      .btn-primary:disabled {
        opacity: 0.32;
        box-shadow: none;
        cursor: default;
      }
      .btn-primary .spinner {
        border-color: rgba(255, 255, 255, 0.35);
        border-top-color: #fff;
      }
      .btn-ghost {
        width: 96px;
        flex: none;
        background: #fff;
        color: var(--ink);
        box-shadow: var(--sh-card);
      }
      .btn-sec {
        padding: 0 20px;
        background: #fff;
        color: var(--ink);
        box-shadow: var(--sh-card);
      }
      .btn-primary:active:not(:disabled),
      .btn-ghost:active:not(:disabled),
      .btn-sec:active:not(:disabled) {
        transform: scale(0.98);
      }
      .btn-primary:focus-visible,
      .btn-ghost:focus-visible,
      .btn-sec:focus-visible,
      .src-row:focus-visible,
      .mrow:focus-visible,
      .m-chip:focus-visible {
        outline: 2px solid rgba(10, 111, 194, 0.5);
        outline-offset: 2px;
      }

      /* Step 1: three sources, one glider marks the pick. */
      .src-list {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .src-row {
        position: relative;
        display: flex;
        align-items: center;
        gap: 16px;
        height: 102px;
        padding: 0 22px 0 24px;
        border: 0;
        border-radius: var(--r-lg);
        background: #fff;
        box-shadow: var(--sh-card);
        text-align: left;
        font: inherit;
        color: inherit;
        cursor: pointer;
        transition: box-shadow 0.3s var(--ease);
      }
      .src-row:hover:not(:disabled) {
        box-shadow:
          0 0 0 1px rgba(26, 25, 26, 0.07),
          0 1px 2px rgba(0, 0, 0, 0.05),
          0 12px 28px -12px rgba(26, 26, 22, 0.16);
      }
      .src-row:disabled {
        cursor: default;
      }
      .src-row:disabled .mark {
        filter: grayscale(0.85);
        opacity: 0.6;
      }
      .src-row .tx {
        flex: 1;
        min-width: 0;
      }
      .src-row b {
        display: block;
        font-size: 15px;
        line-height: 20px;
        font-weight: 600;
        color: var(--ink);
        letter-spacing: -0.006em;
      }
      .src-row small {
        display: block;
        font-size: 13px;
        line-height: 18px;
        color: var(--muted);
        margin-top: 2px;
      }
      .src-row:disabled b {
        color: var(--faint);
      }
      .radio {
        width: 20px;
        height: 20px;
        flex: none;
        border-radius: 50%;
        box-shadow: inset 0 0 0 1.5px #d9d9d2;
        display: grid;
        place-items: center;
        transition:
          background 0.25s var(--ease),
          box-shadow 0.25s;
      }
      body[data-look="wizard"] .radio svg {
        width: 11px;
        height: 11px;
        opacity: 0;
        transform: scale(0.4);
        transition:
          opacity 0.3s var(--ease),
          transform 0.3s var(--ease);
      }
      [aria-checked="true"] > .radio {
        background: var(--ink);
        box-shadow: none;
      }
      body[data-look="wizard"] [aria-checked="true"] > .radio svg {
        opacity: 1;
        transform: none;
      }
      .glider {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 102px;
        border-radius: var(--r-lg);
        pointer-events: none;
        z-index: 2;
        box-shadow:
          0 0 0 1.5px var(--ink),
          0 14px 30px -16px rgba(26, 26, 22, 0.3);
        transition: transform 0.42s var(--ease);
      }

      /* While this computer is still checked: a soft light passes over the
         local model's line and its card's outline. No spinner. */
      .src-row[data-pending="true"] small,
      .mcard[data-pending="true"] .m-sub {
        background: linear-gradient(
            90deg,
            var(--muted) 40%,
            #d2d2cb 50%,
            var(--muted) 60%
          )
          0 0 / 250% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: shimmer 2.4s ease-in-out infinite;
      }
      .mcard[data-pending="true"] .m-name,
      .mcard[data-pending="true"] .m-specs b,
      .mcard[data-pending="true"] .membar {
        background: linear-gradient(
            90deg,
            #f1f1ec 40%,
            #f9f9f6 50%,
            #f1f1ec 60%
          )
          0 0 / 250% 100%;
        animation: shimmer 2.4s ease-in-out infinite;
      }
      .mcard[data-pending="true"] .m-name {
        width: 200px;
        height: 18px;
        margin: 3px 0;
        border-radius: 6px;
      }
      .mcard[data-pending="true"] .m-specs b {
        width: 64px;
        height: 14px;
        margin: 3px 0 4px;
        border-radius: 5px;
      }
      .mcard[data-pending="true"] .memkey {
        visibility: hidden;
      }
      @keyframes shimmer {
        from {
          background-position: 100% 0;
        }
        to {
          background-position: 0 0;
        }
      }

      /* The local model card */
      .mcard {
        position: relative;
        height: 272px;
        padding: 22px 22px 20px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        border-radius: var(--r-lg);
        background: #fff;
        box-shadow: var(--sh-card);
      }
      .m-top {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .m-id {
        min-width: 0;
      }
      .m-top .m-chip {
        align-self: flex-start;
      }
      /* The model's mark, as on the app's Local models page: its maker's
         logo small on a neutral tile, or a full-bleed logo filling a white
         one. */
      .m-ico {
        flex: none;
        width: 40px;
        height: 40px;
        border-radius: 11px;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: var(--muted);
        background: var(--field);
        box-shadow: inset 0 0 0 1px rgba(26, 25, 26, 0.07);
      }
      .m-ico > img {
        display: block;
        width: 22px;
        height: 22px;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
      }
      .m-ico[data-full-bleed="true"] {
        background: #fff;
      }
      .m-ico[data-full-bleed="true"] > img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      body[data-look="wizard"] .m-ico svg {
        width: 20px;
        height: 20px;
      }
      .mcard[data-pending="true"] .m-ico > img {
        visibility: hidden;
      }
      .mcard[data-pending="true"] .m-ico {
        color: transparent;
        background: linear-gradient(
            90deg,
            #f1f1ec 40%,
            #f9f9f6 50%,
            #f1f1ec 60%
          )
          0 0 / 250% 100%;
        box-shadow: none;
        animation: shimmer 2.4s ease-in-out infinite;
      }
      .m-name {
        font-size: 18px;
        font-weight: 600;
        color: var(--ink);
        letter-spacing: -0.01em;
        line-height: 24px;
      }
      .m-sub {
        font-size: 12.5px;
        color: var(--muted);
        margin-top: 2px;
      }
      .m-chip {
        margin-left: auto;
        height: 30px;
        padding: 0 10px 0 12px;
        border: 0;
        border-radius: 9px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex: none;
        font: inherit;
        font-size: 12.5px;
        font-weight: 540;
        color: var(--body);
        background: var(--field);
        box-shadow: inset 0 0 0 1px var(--line);
        cursor: pointer;
      }
      .m-chip:hover:not(:disabled) {
        background: #f1f1ec;
      }
      body[data-look="wizard"] .m-chip svg {
        width: 12px;
        height: 12px;
        opacity: 0.6;
      }
      .m-why {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--body);
        min-height: 20px;
      }
      .m-why[data-tone="err"] {
        color: var(--error);
      }
      .m-specs {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }
      .m-specs > div {
        padding: 12px 0 11px;
        display: flex;
        flex-direction: column;
        gap: 1px;
        min-width: 0;
      }
      .m-specs > div + div {
        padding-left: 16px;
        border-left: 1px solid var(--line);
      }
      .m-specs b {
        font-size: 15px;
        font-weight: 600;
        color: var(--ink);
        letter-spacing: -0.01em;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .m-specs span {
        font-size: 11.5px;
        color: var(--faint);
      }
      .m-mem-l {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 7px;
      }
      .m-mem-l b {
        color: var(--ink);
        font-weight: 600;
      }
      .membar {
        display: flex;
        gap: 2px;
        height: 6px;
        border-radius: 6px;
        background: #efefea;
        overflow: hidden;
      }
      .membar i {
        display: block;
        flex: none;
        height: 100%;
        border-radius: 6px;
      }
      .membar i[hidden] {
        display: none;
      }
      .membar .sys,
      .memkey .sys {
        background: #cfcfc8;
      }
      .membar .mdl,
      .memkey .mdl {
        background: #fda946;
      }
      .memkey .free {
        background: #efefea;
        box-shadow: inset 0 0 0 1px #e2e2dc;
      }
      .memkey {
        display: flex;
        gap: 14px;
        margin-top: 7px;
        font-size: 11px;
        color: var(--faint);
      }
      .memkey i {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 2px;
        margin-right: 5px;
      }

      /* The model picker: a sheet that slides up inside the window. */
      .msheet {
        position: absolute;
        inset: 0;
        z-index: 30;
      }
      .msheet .scrim {
        position: absolute;
        inset: 0;
        background: rgba(26, 26, 22, 0.18);
      }
      .msheet .panel {
        position: absolute;
        left: 0;
        right: 0;
        top: 76px;
        bottom: 0;
        display: flex;
        flex-direction: column;
        border-radius: 20px 20px 0 0;
        background: #fbfbf9;
        box-shadow:
          0 -1px 0 rgba(26, 25, 26, 0.06),
          0 -18px 40px -20px rgba(26, 26, 22, 0.28);
      }
      .msheet .grab {
        width: 36px;
        height: 4px;
        margin: 8px auto 0;
        border-radius: 4px;
        background: #deded8;
      }
      .msheet .head {
        width: 480px;
        margin: 0 auto;
        padding: 16px 0 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      body[data-look="wizard"] .msheet h2 {
        margin: 0;
        font-size: 17px;
        line-height: 24px;
        font-weight: 600;
        color: var(--ink);
        letter-spacing: -0.01em;
      }
      .msheet .close {
        width: 30px;
        height: 30px;
        border: 0;
        border-radius: 9px;
        display: grid;
        place-items: center;
        background: var(--field);
        box-shadow: inset 0 0 0 1px var(--line);
        color: var(--muted);
        cursor: pointer;
      }
      body[data-look="wizard"] .msheet .close svg {
        width: 10px;
        height: 10px;
      }
      .mlist {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 6px 0 48px;
        -webkit-mask-image: linear-gradient(
          to bottom,
          transparent 0,
          #000 14px,
          #000 calc(100% - 56px),
          transparent 100%
        );
        mask-image: linear-gradient(
          to bottom,
          transparent 0,
          #000 14px,
          #000 calc(100% - 56px),
          transparent 100%
        );
      }
      .mlist::-webkit-scrollbar {
        width: 0;
      }
      .mlist-in {
        width: 480px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .mrow {
        position: relative;
        display: grid;
        grid-template-columns: 20px 34px 1fr auto;
        column-gap: 12px;
        align-items: start;
        width: 100%;
        padding: 16px 18px 15px 16px;
        border: 0;
        border-radius: 14px;
        background: #fff;
        box-shadow: var(--sh-card);
        text-align: left;
        font: inherit;
        color: inherit;
        cursor: pointer;
        transition:
          box-shadow 0.25s var(--ease),
          background 0.2s;
      }
      .mrow:hover:not(:disabled):not([aria-checked="true"]) {
        box-shadow:
          0 0 0 1px rgba(26, 25, 26, 0.08),
          0 1px 2px rgba(0, 0, 0, 0.05),
          0 10px 24px -12px rgba(26, 26, 22, 0.18);
      }
      .mrow[aria-checked="true"] {
        box-shadow:
          0 0 0 1.5px var(--ink),
          0 12px 26px -16px rgba(26, 26, 22, 0.3);
      }
      .mrow[data-rec="true"]:not([aria-checked="true"]) {
        box-shadow:
          0 0 0 1px rgba(92, 203, 232, 0.45),
          0 8px 24px -14px rgba(92, 160, 232, 0.35);
      }
      .mrow:disabled {
        cursor: default;
        background: #f7f7f3;
        box-shadow: inset 0 0 0 1px var(--line);
      }
      .mrow .radio {
        margin-top: 8px;
      }
      .mrow .m-ico {
        width: 34px;
        height: 34px;
        border-radius: 10px;
      }
      body[data-look="wizard"] .mrow .m-ico svg {
        width: 18px;
        height: 18px;
      }
      .mrow .m-ico > img {
        width: 19px;
        height: 19px;
      }
      .mrow .m-ico[data-full-bleed="true"] > img {
        width: 100%;
        height: 100%;
      }
      .mrow:disabled .m-ico {
        opacity: 0.45;
      }
      .mrow:disabled .m-ico > img {
        filter: grayscale(1);
      }
      .mrow:disabled .radio {
        opacity: 0.5;
      }
      .mrow .nm em {
        font-style: normal;
        font-weight: 500;
        color: var(--muted);
      }
      .mrow:disabled .nm em {
        color: inherit;
      }
      .mrow .nm {
        display: block;
        white-space: nowrap;
        font-size: 14px;
        line-height: 20px;
        font-weight: 600;
        color: var(--ink);
        letter-spacing: -0.006em;
      }
      .mrow .tg {
        display: block;
        font-size: 12px;
        line-height: 16px;
        color: var(--muted);
        margin-top: 1px;
      }
      .mrow:disabled :is(.nm, .tg) {
        color: #b3b3ab;
      }
      .mrow .chips {
        display: flex;
        gap: 6px;
        justify-content: flex-end;
      }
      .mrow .mc {
        height: 22px;
        padding: 0 8px;
        border-radius: 7px;
        display: inline-flex;
        align-items: center;
        font-size: 11.5px;
        font-weight: 540;
        color: var(--body);
        background: var(--field);
        box-shadow: inset 0 0 0 1px var(--line);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .mrow .mc[data-kind="best"] {
        color: #1d5f86;
        background: linear-gradient(
          90deg,
          rgba(67, 198, 232, 0.14),
          rgba(242, 154, 182, 0.14)
        );
        box-shadow: inset 0 0 0 1px rgba(92, 170, 232, 0.25);
      }
      .mrow:disabled .mc {
        color: #b3b3ab;
        background: transparent;
      }
      .mrow .meters {
        grid-column: 3 / 5;
        display: flex;
        gap: 20px;
        margin-top: 11px;
        font-size: 11px;
        color: var(--faint);
      }
      .mrow .meter {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .mrow .meter s {
        position: relative;
        display: block;
        width: 56px;
        height: 4px;
        border-radius: 4px;
        background: #edede7;
        overflow: hidden;
        text-decoration: none;
      }
      .mrow .meter s i {
        position: absolute;
        inset: 0;
        border-radius: 4px;
        background: var(--ink);
        transform-origin: 0 50%;
      }
      .mrow .meter em {
        font-style: normal;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .mrow .needs {
        grid-column: 3 / 5;
        margin-top: 8px;
        font-size: 12px;
        color: #a35a3a;
      }

      /* Grouped fields (BYOK, the sign-in details) */
      .grp {
        background: #fff;
        border-radius: var(--r-lg);
        box-shadow: var(--sh-card);
        overflow: hidden;
      }
      .grp + .grp,
      .byok-box + .grp {
        margin-top: 16px;
      }
      .grp.byok-fields {
        display: block;
      }
      .fld {
        position: relative;
        display: flex;
        align-items: center;
        gap: 12px;
        height: 64px;
        padding: 0 16px 0 20px;
        transition: box-shadow 0.2s;
      }
      .fld + .fld {
        border-top: 1px solid var(--line);
      }
      .fld .lb {
        width: 84px;
        flex: none;
        font-size: 13px;
        color: var(--muted);
      }
      .fld .vw {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      body[data-look="wizard"] .fld input {
        width: 100%;
        height: 24px;
        padding: 0;
        border: 0;
        outline: 0;
        background: transparent;
        font: inherit;
        font-size: 14px;
        color: var(--ink);
        box-shadow: none;
        user-select: text;
        -webkit-user-select: text;
      }
      .fld input::placeholder {
        color: #bdbdb5;
      }
      .fld input[type="password"] {
        letter-spacing: 0.08em;
      }
      .fld input[type="password"]:placeholder-shown {
        letter-spacing: 0;
      }
      .fld:focus-within::after {
        content: "";
        position: absolute;
        inset: 6px 8px;
        border-radius: 10px;
        box-shadow:
          0 0 0 3px rgba(10, 111, 194, 0.14),
          inset 0 0 0 1px rgba(10, 111, 194, 0.45);
        pointer-events: none;
      }
      .fld[data-bad="true"] {
        box-shadow: inset 2px 0 0 var(--error);
      }
      .fld .eye {
        width: 28px;
        height: 28px;
        flex: none;
        border: 0;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: none;
        color: var(--muted);
        opacity: 0.7;
        cursor: pointer;
      }
      body[data-look="wizard"] .fld .eye svg {
        width: 16px;
        height: 16px;
      }
      body[data-look="wizard"] .fld .byok-status {
        display: flex;
        align-items: center;
        gap: 5px;
        margin: 2px 0 0;
        padding: 0;
        font-size: 12px;
        line-height: 16px;
        color: var(--error);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      body[data-look="wizard"] .fld .byok-status svg {
        width: 13px;
        height: 13px;
        flex: none;
      }
      .fld .byok-status[hidden] {
        display: none !important;
      }
      .fld .val {
        flex: 1;
        min-width: 0;
        font-size: 14px;
        color: var(--ink);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        user-select: text;
        -webkit-user-select: text;
      }
      .lnk {
        border: 0;
        padding: 0;
        background: none;
        font: inherit;
        font-size: 12.5px;
        font-weight: 540;
        color: var(--muted);
        cursor: pointer;
      }
      .lnk:hover:not(:disabled) {
        color: var(--ink);
      }
      .lnk + .lnk {
        margin-left: 12px;
      }
      /* Subscription runtimes */
      .rt {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0 16px;
        min-height: 96px;
        padding: 0 20px;
      }
      .rt + .rt {
        border-top: 1px solid var(--line);
      }
      .tile {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        flex: none;
        background: linear-gradient(180deg, #fff, #f6f6f2);
        box-shadow:
          inset 0 0 0 1px rgba(26, 25, 26, 0.08),
          0 1px 2px rgba(0, 0, 0, 0.04);
        color: var(--ink);
      }
      body[data-look="wizard"] .tile svg {
        width: 24px;
        height: 24px;
        display: block;
        fill: none;
        stroke: currentColor;
      }
      /* Vendor marks keep their own colours, at the size the vendors use
         them in a square tile. */
      body[data-look="wizard"] .tile .brand {
        width: 28px;
        height: 28px;
        display: block;
        stroke: none;
      }
      .rt .text {
        flex: 1;
        min-width: 0;
      }
      .rt .text strong {
        display: block;
        font-size: 15px;
        line-height: 20px;
        font-weight: 600;
        color: var(--ink);
        letter-spacing: -0.006em;
      }
      .rt .sub {
        display: block;
        margin-top: 2px;
        font-size: 13px;
        line-height: 18px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .rt .sub[data-warn="true"] {
        color: var(--error);
      }
      /* Step 2's panel: the source's settings, then the install location
         pinned to the bottom, 12px or more below them. The model card
         takes the room the location leaves. */
      .source-panel:not([hidden]) {
        display: flex;
        flex-direction: column;
        gap: 12px;
        height: 100%;
      }
      .source-panel > .mcard {
        flex: 1 1 auto;
        height: auto;
        min-height: 0;
      }
      .loc {
        flex: none;
        margin-top: auto;
        padding: 8px 10px 8px 14px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.72);
        box-shadow: inset 0 0 0 1px var(--line);
        transition:
          background-color 0.16s ease,
          box-shadow 0.16s ease;
      }
      .loc-line {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        height: 24px;
        font-size: 12px;
        color: var(--muted);
      }
      .loc-icon {
        flex: none;
        width: 14px;
        height: 14px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linejoin: round;
        color: var(--faint);
      }
      .loc-label {
        flex: none;
      }
      .loc-path {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--body);
      }
      .loc-btn {
        flex: none;
        height: 24px;
        padding: 0 10px;
        border: 0;
        border-radius: 7px;
        background: #fff;
        box-shadow: inset 0 0 0 1px #e4e4de;
        color: var(--body);
        font-size: 12px;
        font-weight: 550;
        white-space: nowrap;
      }
      .loc-btn:hover:not(:disabled) {
        box-shadow: inset 0 0 0 1px #c4c4bc;
        color: var(--ink);
      }

        position: absolute;

      /* While it works, the mark, bar and line sit a little lower, centred
         in the window; ready lifts them back for its title and button. */
      body[data-scene="installing"]:not([data-failed])
        :is(.sc-mark, #sc-install, .floaters) {
        translate: 0 24px;

      .agent.a1,
