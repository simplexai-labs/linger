<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; font-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title data-t="pageTitle"></title>
    <style>
      @font-face {
        font-family: "Geist Variable";
        font-style: normal;
        font-display: block;
        font-weight: 100 900;
        src: url("/geist.woff2") format("woff2");
      }
      /* The installer's look: a scene on top, the step centered below. */
      :root {
        --ink: #262626;
        --body: #1a1a16;
        --muted: #737266;
        --faint: #a3a39b;
        --line: #ecece9;
        --field: #f4f4f0;
        --ok: #2f9e44;
        --error: #b5320a;
        --filled: #9b9a90;
        --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
        color: var(--body);
        background: #fff;
        font:
          14px/1.5 "Geist Variable",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "PingFang SC",
          "Noto Sans SC",
          system-ui,
          sans-serif;
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        -webkit-user-select: none;
      }

      /* Scene and top bar. Both are the window drag region. */
      .scene {
        flex: none;
        height: 190px;
        background: #f4f4f0 url("/welcome-scene.png") center / cover no-repeat;
        -webkit-app-region: drag;
      }
      .topbar {
        position: absolute;
        top: 18px;
        left: 28px;
        right: 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        color: #52524b;
        font-size: 12px;
        -webkit-app-region: drag;
      }
      /* Clear the traffic lights. */
      body[data-platform="darwin"] .topbar {
        left: 84px;
      }

      .topbar .brand {
        height: 24px;
        width: auto;
      }

      /* The current step. */
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        width: min(100%, 600px);
        margin: 0 auto;
        padding: 20px 24px 16px;
        text-align: center;
      }
      section {
        display: none;
        flex: 1;
        flex-direction: column;
        min-height: 0;
        animation: enter 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      }
      section.active {
        display: flex;
      }
      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      h1 {
        margin: 0 0 6px;
        color: var(--ink);
        font-size: 20px;
        font-weight: 580;
        line-height: 32px;
        letter-spacing: 0.0025em;
        text-wrap: balance;
      }
      .lead {
        max-width: 440px;
        margin: 0 auto 22px;
        color: var(--muted);
        font-size: 13px;
        text-wrap: pretty;
      }
      .lead.compact {
        margin-bottom: 14px;
      }
      .icon {
        display: grid;
        place-items: center;
        flex: none;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: var(--field);
        color: var(--ink);
      }
      svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      form {
        width: min(100%, 400px);
        margin: 0 auto;
        text-align: left;
      }
      label.field {
        display: block;
        margin-bottom: 6px;
        color: var(--ink);
        font-size: 12px;
        font-weight: 550;
      }
      input[type="text"] {
        width: 100%;
        height: 40px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        outline: none;
        background: #fff;
        color: var(--ink);
        font: inherit;
        font-size: 14px;
        user-select: text;
        -webkit-user-select: text;
        transition: border-color 0.15s;
      }
      input[type="text"]:focus {
        border-color: var(--ink);
      }
      .hint {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 12px;
      }
      .hint:empty {
        display: none;
      }
      .error:empty {
        display: none;
      }
      .error {
        margin: 10px 0 0;
        color: var(--error);
        font-size: 12px;
      }
      .card {
        display: flex;
        align-items: center;
        gap: 12px;
        width: min(100%, 420px);
        margin: 0 auto;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        text-align: left;
      }
      .card .text {
        flex: 1;
        min-width: 0;
      }
      .card .text strong {
        display: block;
        overflow: hidden;
        color: var(--ink);
        font-size: 13px;
        font-weight: 550;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .card .text span {
        display: block;
        overflow: hidden;
        color: var(--muted);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }
      .badge[data-ok="true"] {
        color: var(--ok);
        font-weight: 500;
      }
      .badge svg {
        width: 14px;
        height: 14px;
      }
      .spinner {
        display: inline-block;
        width: 12px;
        height: 12px;
        margin-right: 6px;
        vertical-align: -1px;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .badge .spinner {
        margin-right: 0;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .rows {
        display: grid;
        align-content: start;
        min-height: 0;
        overflow-y: auto;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        text-align: left;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 0;
      }
      .row + .row {
        border-top: 1px solid var(--line);
      }
      .row .text {
        flex: 1;
        min-width: 0;
      }
      .row strong {
        display: block;
        color: var(--ink);
        font-size: 13px;
        font-weight: 550;
      }
      .row span.sub {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }
      .folders {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 6px;
      }
      .folders span {
        max-width: 200px;
        padding: 2px 6px;
        overflow: hidden;
        border-radius: 4px;
        background: var(--field);
        color: #52524b;
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      body:not([data-platform="darwin"]) .mac-only {
        display: none;
      }
      .row .badge {
        flex: none;
      }
      [hidden] {
        display: none !important;
      }
      .row span.sub[data-warn="true"] {
        color: var(--error);
      }
      .row select {
        flex: none;
        height: 30px;
        padding: 0 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--ink);
        font: inherit;
        font-size: 12px;
      }
      .switch {
        position: relative;
        flex: none;
        width: 34px;
        height: 20px;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: #dbdcd5;
        transition: background 0.2s;
      }
      .switch::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .switch[aria-checked="true"] {
        background: var(--ink);
      }
      .switch[aria-checked="true"]::after {
        transform: translateX(14px);
      }
      .switch:hover:not(:disabled) {
        background: #c4c4bc;
      }
      .switch[aria-checked="true"]:hover:not(:disabled) {
        background: #41413b;
      }
      .switch:disabled {
        opacity: 0.5;
      }

      footer.actions {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: auto;
        padding-top: 18px;
      }
      button,
      select {
        font: inherit;
        cursor: pointer;
      }
      button:disabled,
      button[aria-disabled="true"],
      select:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
      }
      .primary,
      .ghost,
      .secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid #dbdcd5;
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        font-size: 13px;
        font-weight: 470;
        white-space: nowrap;
        transition:
          background-color 140ms ease,
          transform 100ms ease;
      }
      .primary,
      .ghost {
        min-height: 36px;
        padding: 6px 15px;
      }
      .primary {
        min-width: 112px;
        border-color: var(--ink);
        background: var(--ink);
        color: #fff;
      }
      .primary:hover:not(:disabled) {
        background: #41413b;
      }
      .ghost:hover:not(:disabled),
      .secondary:hover:not(:disabled) {
        background: #f4f4f5;
      }
      .primary:active:not(:disabled),
      .ghost:active:not(:disabled),
      .secondary:active:not(:disabled) {
        transform: translateY(1px);
      }
      .primary svg {
        width: 14px;
        height: 14px;
      }
      .secondary {
        min-height: 28px;
        padding: 3px 10px;
        font-size: 12px;
      }
      .link {
        padding: 6px;
        border: 0;
        border-radius: 4px;
        background: none;
        color: #414038;
        font-size: 12px;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .link:hover:not(:disabled) {
        background: #f4f4f5;
      }

      /* The welcome view: check this computer, choose a source, then that
         source's settings, all in one window size. */
      main {
        position: relative;
      }
      section[data-step="welcome"],
      section[data-step="installing"],
      section[data-step="ready"] {
        /* A long error scrolls instead of pushing the title into the scene. */
        justify-content: safe center;
        overflow-y: auto;
        padding-bottom: 40px;
      }
      section[data-step="welcome"][data-local="true"] {
        justify-content: flex-start;
        /* Room for the focus rings of what sits at its edges. */
        margin: -6px -6px -2px;
        padding: 6px;
      }
      section[data-step="welcome"]:not([data-local="true"]) .eyebrow {
        margin-top: auto;
      }
      h1 {
        margin-bottom: 8px;
        font-size: 26px;
        font-weight: 600;
        line-height: 34px;
        letter-spacing: -0.022em;
      }
      section[data-step="welcome"][data-local="true"] h1 {
        margin-bottom: 4px;
        font-size: 23px;
        line-height: 28px;
      }
      .lead {
        font-size: 13.5px;
        letter-spacing: -0.003em;
      }
      .lead.tight {
        margin-bottom: 0;
      }
      /* Back and More options sit beside the badge above the title. */
      .stage-bar {
        position: relative;
        display: flex;
        justify-content: center;
        margin-bottom: 4px;
      }
      .stage-bar .eyebrow {
        margin-bottom: 0;
      }
      /* Step 1 showed the badge; on step 2 Back and More options flank the
         title, and the bar keeps a row only for the local model's progress. */
      section[data-stage="settings"] #welcome-eyebrow {
        display: none;
      }
      section[data-stage="settings"] .stage-bar:has(> #model-behind[hidden]) {
        top: 14px;
        height: 0;
        margin-bottom: 0;
      }
      .stage-bar > .link {
        position: absolute;
        top: 50%;
        right: 0;
        transform: translateY(-50%);
      }
      .stage-bar > .back {
        right: auto;
        left: 0;
        display: inline-flex;
        align-items: center;
        gap: 2px;
        padding-left: 0;
        text-decoration: none;
      }
      .stage-bar > .back svg {
        width: 14px;
        height: 14px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      section[data-step="welcome"] [hidden] {
        display: none !important;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      /* Focus lands on the title when a stage opens; it is not a control. */
      #welcome-title:focus {
        outline: none;
      }
      /* Forward comes in from the right, Back from the left, and the
         choices rise in once the check ends. The button keeps its place. */
      @keyframes stage-forward {
        from {
          opacity: 0;
          transform: translateX(14px);
        }
      }
      @keyframes stage-back {
        from {
          opacity: 0;
          transform: translateX(-14px);
        }
      }
      @keyframes stage-reveal {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      @keyframes stage-fade {
        from {
          opacity: 0;
        }
      }
      section[data-motion="forward"] .stage {
        animation: stage-forward 200ms var(--ease) both;
      }
      section[data-motion="back"] .stage {
        animation: stage-back 200ms var(--ease) both;
      }
      section[data-motion="reveal"] :is(.lead, .source-card, .plan-why) {
        animation: stage-reveal 220ms var(--ease) both;
      }
      section[data-motion="reveal"] .source-card:nth-child(2) {
        animation-delay: 40ms;
      }
      section[data-motion="reveal"] :is(.source-card:nth-child(3), .plan-why) {
        animation-delay: 80ms;
      }
      section[data-motion] :is(.stage-bar > .link, .plan-line) {
        animation: stage-fade 200ms ease both;
      }
      @media (prefers-reduced-motion: reduce) {
        section[data-motion] * {
          animation: none !important;
        }
      }
      /* Checking this computer: what is happening and what for, in the
         room the cards take next. */
      .checking {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        min-height: 216px;
        padding-top: 98px;
      }
      .checking p {
        margin: 0;
      }
      .checking-now {
        color: var(--ink);
        font-size: 13.5px;
        font-weight: 550;
        letter-spacing: -0.005em;
      }
      .checking-now .spinner {
        color: #8a897f;
      }
      .checking-why {
        max-width: 400px;
        color: var(--muted);
        font-size: 12.5px;
        font-variant-numeric: tabular-nums;
        text-wrap: pretty;
      }
      .checking .link {
        margin-top: 8px;
      }
      /* The local model left downloading behind BYOK or a subscription. */
      .eyebrow.behind {
        gap: 8px;
        padding: 3px 10px;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      .behind-bar {
        position: relative;
        width: 34px;
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: #e7e7e2;
      }
      .behind-bar span {
        position: absolute;
        inset: 0 auto 0 0;
        border-radius: inherit;
        background: var(--ink);
        transition: width 900ms var(--ease);
      }
      .setup-card {
        width: 100%;
        margin: 12px auto 0;
        text-align: left;
      }
      section[data-stage="choose"] .setup-card {
        margin-top: 24px;
      }
      .source-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }
      /* Every card is the same height in every state. */
      .source-card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 5px;
        min-width: 0;
        height: 136px;
        padding: 18px 14px 12px;
        border: 1px solid #e6e6e1;
        border-radius: 12px;
        background: #fafaf8;
        text-align: left;
        transition:
          border-color 150ms ease,
          background-color 150ms ease,
          box-shadow 150ms ease;
      }
      .source-card:hover:not(:disabled) {
        border-color: #c8c8c0;
        background: #fff;
      }
      /* A source this computer cannot use stays in its place, switched off. */
      .source-card:disabled {
        opacity: 1;
      }
      .source-card:disabled .source-top strong,
      .source-card:disabled .source-about {
        color: #a3a299;
      }
      .source-card[aria-checked="true"] {
        border-color: var(--ink);
        background: #fff;
        box-shadow:
          0 0 0 0.5px var(--ink),
          0 6px 16px -12px rgba(20, 20, 16, 0.32);
      }
      .source-top strong {
        color: var(--ink);
        font-size: 14.5px;
        font-weight: 580;
        line-height: 20px;
        letter-spacing: -0.01em;
        white-space: nowrap;
      }
      /* One badge on the card's top edge: Recommended marks what the check
         advises; a card that cannot be picked says why instead. */
      .source-rec,
      .source-pill {
        position: absolute;
        top: -9px;
        left: 11px;
        padding: 0 7px;
        border: 1px solid #cfe3d3;
        border-radius: 999px;
        background: #edf6ef;
        color: #25693a;
        font-size: 10px;
        font-weight: 600;
        line-height: 16px;
        letter-spacing: 0.01em;
        white-space: nowrap;
      }
      .source-pill {
        border-color: #e3e3dc;
        background: #f4f4ef;
        color: #5f5e55;
      }
      .source-pill[data-warn="true"] {
        border-color: #f3dccb;
        background: #fdf3ec;
        color: #9a4715;
      }
      .source-about {
        width: 100%;
        min-height: 34px;
        color: var(--muted);
        font-size: 12.5px;
        line-height: 17px;
        text-wrap: pretty;
      }
      .source-meta {
        width: 100%;
        margin-top: auto;
        padding-top: 8px;
        overflow: hidden;
        border-top: 1px solid #ecece7;
        color: #52524b;
        font-size: 11px;
        font-weight: 500;
        line-height: 16px;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .source-card:disabled .source-meta {
        color: #8a897f;
      }
      .source-panel {
        padding: 4px 16px;
        border: 1px solid rgba(20, 20, 16, 0.08);
        border-radius: 14px;
        background: #fff;
        box-shadow:
          0 1px 2px rgba(20, 20, 16, 0.03),
          0 10px 26px -18px rgba(20, 20, 16, 0.2);
      }
      /* A row has a line above it only under a row that shows; the other
         sources' rows are still there, hidden. */
      .source-panel > :not([hidden]) ~ .choice {
        border-top: 1px solid #f1f1ee;
      }
      .source-hint {
        width: 100%;
        margin: 0;
        color: var(--muted);
        font-size: 11.5px;
        line-height: 1.4;
      }
      .choice.local .sub {
        white-space: normal;
      }
      .facts {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
        padding: 8px 10px;
        border-radius: 9px;
        background: #f8f8f5;
      }
      .facts small {
        color: var(--muted);
        font-size: 11px;
        line-height: 1.4;
        font-variant-numeric: tabular-nums;
      }
      /* Subscription: one row per runtime with the one thing left to do on
         the right. Every state keeps the row's height. */
      .runtimes .choice.runtime + .choice.runtime {
        border-top: 1px solid #f1f1ee;
      }
      .choice.runtime {
        flex-wrap: wrap;
        min-height: 42px;
        padding: 3px 0;
      }
      .choice.runtime strong {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .runtime-rec {
        padding: 0 6px;
        border: 1px solid #cfe3d3;
        border-radius: 999px;
        background: #edf6ef;
        color: #25693a;
        font-size: 10px;
        font-weight: 600;
        line-height: 15px;
        letter-spacing: 0.01em;
      }
      .choice.runtime .sub {
        font-variant-numeric: tabular-nums;
      }
      .choice.runtime .sub[data-warn="true"] {
        color: var(--error);
      }
      .runtime-act {
        display: flex;
        flex: none;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
        min-width: 150px;
      }
      .runtime-progress {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 150px;
      }
      .runtime-progress .track {
        flex: 1;
        margin-top: 0;
      }
      .runtime-progress .pct {
        min-width: 32px;
        color: var(--ink);
        font-size: 12px;
        font-weight: 500;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .runtime-wait {
        display: inline-flex;
        align-items: center;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }
      .runtime-wait .spinner {
        width: 11px;
        height: 11px;
        color: #8a897f;
      }
      /* While signing in: the link and code, for when no browser opens. */
      .runtime-extra {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 2px 6px;
        width: 100%;
        color: var(--muted);
        font-size: 11.5px;
      }
      .runtime-extra .link {
        padding: 0 2px;
        font-size: 11.5px;
      }
      .runtime-code strong {
        color: var(--ink);
        font:
          600 12.5px ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        letter-spacing: 0.06em;
        user-select: all;
        -webkit-user-select: all;
      }
      .runtime-paste {
        display: flex;
        gap: 6px;
        width: 100%;
      }
      .runtime-paste input {
        flex: 1;
        min-width: 0;
        height: 26px;
        padding: 0 8px;
        border: 1px solid #e6e6e1;
        border-radius: 7px;
        font: inherit;
        font-size: 12px;
        user-select: text;
        -webkit-user-select: text;
      }
      /* Also download the local model, under BYOK or a subscription. */
      .also {
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 0 10px;
        padding: 4px 0;
        border-top: 1px solid #f1f1ee;
      }
      .also input {
        width: 15px;
        height: 15px;
        margin: 0;
        accent-color: var(--ink);
        cursor: pointer;
      }
      .also input:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      .also label {
        color: var(--ink);
        font-size: 12.5px;
        font-weight: 550;
        letter-spacing: -0.005em;
        cursor: pointer;
      }
      .also .sub {
        grid-column: 2;
        color: var(--muted);
        font-size: 11.5px;
        line-height: 1.4;
        font-variant-numeric: tabular-nums;
      }
      #local-options {
        padding: 2px 16px;
      }
      /* The sign-in email and password a new installation creates. */
      .credentials label {
        display: block;
        margin: 10px 0 4px;
        color: #5f5e55;
        font-size: 12px;
        font-weight: 500;
      }
      .credentials input {
        width: 100%;
        min-width: 0;
        height: 30px;
        padding: 0 10px;
        border: 1px solid #e6e6e1;
        border-radius: 8px;
        outline: none;
        background: #fff;
        color: var(--ink);
        font: inherit;
        font-size: 12.5px;
        user-select: text;
        -webkit-user-select: text;
      }
      .credentials input:focus {
        border-color: var(--ink);
      }
      .credentials input[aria-invalid="true"] {
        border-color: var(--error);
      }
      .credentials-line {
        display: flex;
        gap: 6px;
      }
      .signin-modal .credentials .problem {
        min-height: 18px;
        margin: 10px 0 0;
        color: var(--error);
      }
      /* Done keeps clear of the last field, with or without a problem. */
      .credentials .actions {
        margin-top: 16px;
      }
      /* Switching to BYOK or a subscription while the local model
         downloads: a quiet box above the progress. */
      .leave {
        width: 380px;
        margin: 16px auto 0;
        padding: 11px 14px 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fafaf8;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
        text-align: left;
      }
      .leave[hidden] {
        display: none;
      }
      .leave p {
        margin: 0 0 9px;
        text-wrap: pretty;
      }
      .leave .error:empty {
        display: none;
      }
      .leave-row {
        display: flex;
        gap: 8px;
      }
      .leave + .panel {
        margin-top: 12px;
      }
      .eyebrow {
        display: inline-flex;
        align-self: center;
        align-items: center;
        gap: 6px;
        margin-bottom: 10px;
        padding: 3px 10px 3px 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.8);
        color: #5f5e55;
        font-size: 11.5px;
        font-weight: 500;
        letter-spacing: 0.01em;
      }
      .eyebrow svg {
        width: 12px;
        height: 12px;
        stroke-width: 2;
      }
      .start {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 16px;
      }
      .primary.large {
        position: relative;
        min-width: 232px;
        min-height: 44px;
        padding: 0 22px;
        overflow: hidden;
        border: 0;
        border-radius: 12px;
        background: linear-gradient(180deg, #2f2f2c 0%, #1b1b19 100%);
        box-shadow:
          0 0 0 1px rgba(20, 20, 16, 0.9),
          0 1px 2px rgba(20, 20, 16, 0.2),
          0 10px 24px -12px rgba(20, 20, 16, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.12);
        font-size: 14px;
        font-weight: 550;
        letter-spacing: -0.006em;
        transition:
          box-shadow 200ms ease,
          transform 200ms var(--ease);
      }
      .primary.large:hover:not(:disabled) {
        background: linear-gradient(180deg, #353532 0%, #1f1f1d 100%);
        box-shadow:
          0 0 0 1px rgba(20, 20, 16, 0.9),
          0 2px 4px rgba(20, 20, 16, 0.2),
          0 16px 30px -14px rgba(20, 20, 16, 0.6),
          inset 0 1px 0 rgba(255, 255, 255, 0.14);
        transform: translateY(-1px);
      }
      .primary.large:active:not(:disabled) {
        transform: translateY(0);
      }
      .primary.large svg {
        width: 15px;
        height: 15px;
        stroke-width: 2;
        transition: transform 240ms var(--ease);
      }
      .primary.large:hover:not(:disabled) svg {
        transform: translateX(2px);
      }
      /* Checking this computer: the button waits with what it is doing. */
      .primary.large[data-busy="true"] {
        opacity: 0.8;
        cursor: progress;
      }
      .primary.large[data-busy="true"] svg {
        display: none;
      }
      /* What the button does, in words. Always two lines high, so a long
         plan never moves the button above it. */
      .plan-line {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        width: 100%;
        height: 34px;
        margin: 10px 0 0;
        overflow: hidden;
        color: var(--faint);
        font-size: 12px;
        line-height: 17px;
        font-variant-numeric: tabular-nums;
        text-wrap: balance;
      }
      section[data-step="welcome"][data-local="true"] .start {
        margin-top: auto;
        padding-top: 12px;
      }
      .featured-pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 1px 6px;
        border: 1px solid #eed9bc;
        border-radius: 999px;
        background: #fbf4ea;
        color: #8f4f10;
        font-size: 10px;
        font-weight: 550;
        line-height: 1.4;
        white-space: nowrap;
      }
      .featured-pill::before {
        content: "";
        flex: none;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #d9822b;
      }
      .spotlight-card {
        width: min(100%, 468px);
        margin: 12px auto 0;
        padding: 8px 12px;
        border: 1px solid #e8e5dc;
        border-radius: 12px;
        background: linear-gradient(180deg, #fcfcfa 0%, #f7f5ef 100%);
        text-align: left;
      }
      .spotlight-card[data-recommended="true"] {
        border-color: #e6d2b5;
        background: linear-gradient(180deg, #fffdf9 0%, #fbf6ee 100%);
      }
      .spotlight-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .spotlight-title {
        display: inline-flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
        min-width: 0;
      }
      .spotlight-title strong {
        color: var(--ink);
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: -0.008em;
      }
      .spotlight-specs {
        margin: 3px 0 0;
        color: #52524b;
        font-size: 11.5px;
        line-height: 1.4;
      }
      .spotlight-note {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.4;
      }
      .spotlight-link {
        flex: none;
        padding: 2px 6px;
        border: 0;
        border-radius: 6px;
        background: none;
        color: #52524b;
        font-size: 11.5px;
        font-weight: 500;
        white-space: nowrap;
        text-decoration: underline;
        text-decoration-color: #d4d4cd;
        text-underline-offset: 3px;
        transition:
          background-color 140ms ease,
          color 140ms ease,
          text-decoration-color 140ms ease;
      }
      .spotlight-link:hover:not(:disabled) {
        background: rgba(20, 20, 16, 0.05);
        color: var(--ink);
        text-decoration-color: var(--ink);
      }
      .plan-why {
        max-width: 440px;
        margin-top: 4px;
        color: var(--faint);
        font-size: 11.5px;
        line-height: 1.45;
        font-variant-numeric: tabular-nums;
      }
      .plan-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin-top: 8px;
      }
      /* What downloads now, or what a long step waits on, under the
         installing bar. */
      .transfer {
        display: grid;
        gap: 2px;
        margin: 10px 0 0;
        color: var(--faint);
        font-size: 11.5px;
        line-height: 1.45;
        font-variant-numeric: tabular-nums;
      }
      .transfer span span {
        white-space: nowrap;
      }
      .transfer strong {
        color: var(--ink);
        font-weight: 500;
      }
      .link.quiet {
        padding: 2px 4px;
        color: #52524b;
        font-weight: 500;
        text-decoration-color: #d4d4cd;
        transition:
          color 140ms ease,
          text-decoration-color 140ms ease;
      }
      .link.quiet:hover:not(:disabled) {
        background: none;
        color: var(--ink);
        text-decoration-color: var(--ink);
      }
      .choice[hidden],
      .byok-box[hidden],
      .signin-byok[hidden] {
        display: none !important;
      }
      .choice.byok-box {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
      /* BYOK fields, built once by byokFields() for the setup form and the
         sign-in dialog: the base URL and two optional comboboxes (path and
         endpoint) on one row, the key, then the model with List models and
         Test beside it, and one status line. */
      .byok-fields {
        display: grid;
        gap: 6px;
        font-size: 12px;
        text-align: left;
      }
      .byok-fields .ep {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 6px;
      }
      .byok-fields .ep-base-wrap,
      .byok-fields .ep > .cb,
      .byok-fields .cb.standalone,
      .byok-fields .byok-key {
        display: flex;
        align-items: center;
        min-width: 0;
        height: 30px;
        padding: 0 4px 0 10px;
        border: 1px solid #e2e2dc;
        border-radius: 8px;
        background: #fafaf8;
        transition:
          border-color 140ms ease,
          background-color 140ms ease;
      }
      .byok-fields .byok-key {
        width: 100%;
        padding-right: 10px;
        color: var(--ink);
        font: inherit;
        user-select: text;
        -webkit-user-select: text;
      }
      .byok-fields .ep-base-wrap:focus-within,
      .byok-fields .ep > .cb:focus-within,
      .byok-fields .cb.standalone:focus-within,
      .byok-fields .byok-key:focus {
        outline: none;
        border-color: var(--ink);
        background: #fff;
      }
      .ep-base,
      .cb-input {
        flex: 1 1 auto;
        width: 100%;
        min-width: 0;
        height: 100%;
        padding: 0;
        border: 0;
        outline: none;
        background: transparent;
        color: var(--ink);
        font: inherit;
        text-overflow: ellipsis;
        user-select: text;
        -webkit-user-select: text;
      }
      /* Path and endpoint boxes are as wide as their value; the base URL
         takes the rest of the row. */
      .ep > .cb .cb-input {
        field-sizing: content;
        width: auto;
        min-width: 1ch;
        max-width: 17ch;
      }
      .byok-fields input::placeholder {
        color: var(--faint);
      }
      .cb-input::placeholder {
        font-style: italic;
      }
      /* Grey: the default Linger fills in, which is still sent. */
      .cb[data-default="true"] .cb-input {
        color: var(--filled);
      }
      .cb[data-default="true"] .cb-input:focus {
        color: #77766c;
      }

      /* Combobox: type anything, or pick from the list. */
      .cb {
        position: relative;
      }
      .cb-caret {
        display: grid;
        flex: none;
        place-items: center;
        width: 20px;
        height: 20px;
        padding: 0;
        border: 0;
        border-radius: 5px;
        background: none;
        color: var(--faint);
      }
      .cb-caret:hover:not(:disabled),
      .cb[data-open="true"] .cb-caret {
        background: rgba(20, 20, 16, 0.06);
        color: var(--muted);
      }
      .cb-menu {
        position: absolute;
        top: calc(100% + 5px);
        left: -1px;
        z-index: 30;
        display: grid;
        gap: 1px;
        min-width: calc(100% + 2px);
        width: max-content;
        max-width: min(320px, 86vw);
        max-height: 252px;
        overflow-y: auto;
        padding: 4px;
        border: 1px solid rgba(20, 20, 16, 0.08);
        border-radius: 11px;
        background: #fff;
        box-shadow: 0 16px 36px -14px rgba(20, 20, 16, 0.35);
        font-size: 12px;
        line-height: 1.4;
        cursor: default;
        animation: menu-in 160ms var(--ease);
      }
      .cb-menu[hidden] {
        display: none;
      }
      .ep > .cb .cb-menu {
        left: auto;
        right: -1px;
      }
      @keyframes menu-in {
        from {
          opacity: 0;
          transform: translateY(-3px);
        }
      }
      .cb-menu [role="option"] {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 16px;
        align-items: center;
        gap: 1px 10px;
        padding: 6px 8px;
        border: 0;
        border-radius: 7px;
        background: none;
        text-align: left;
      }
      .cb-menu [role="option"]:hover,
      .cb-menu [role="option"]:focus-visible {
        background: #f4f4f0;
        outline: none;
      }
      .opt-main {
        color: var(--ink);
        font: 500 12px var(--mono);
        overflow-wrap: anywhere;
      }
      .opt-label {
        grid-column: 1;
        color: var(--muted);
        font-size: 11.5px;
      }
      .opt-label em {
        margin-left: 6px;
        color: #d9822b;
        font-style: normal;
        font-weight: 500;
      }
      .opt-check {
        grid-column: 2;
        grid-row: 1 / span 2;
        visibility: hidden;
        color: var(--ink);
      }
      [aria-selected="true"] > .opt-check {
        visibility: visible;
      }
      .cb-head {
        padding: 5px 8px 3px;
        color: var(--faint);
        font-size: 11px;
        font-weight: 500;
      }
      .cb-note {
        max-width: 300px;
        padding: 7px 8px;
        color: var(--muted);
        font-size: 11.5px;
        overflow-wrap: anywhere;
      }
      .cb-note[data-tone="err"] {
        color: var(--error);
      }

      /* The model box, with List models and Test beside it; the test
         result floats under Test. */
      .model-row {
        position: relative;
        display: flex;
        gap: 6px;
      }
      .model-row > .cb {
        flex: 1;
      }
      .model-row > .change {
        height: 30px;
      }
      .model-row > .list-btn {
        display: grid;
        place-items: center;
        width: 30px;
        padding: 0;
        color: var(--muted);
      }
      .model-row > .list-btn:hover:not(:disabled) {
        color: var(--ink);
      }
      .list-btn[data-busy="true"] svg {
        animation: spin 0.9s linear infinite;
      }
      .byok-toast {
        position: absolute;
        top: calc(100% + 9px);
        right: 0;
        z-index: 40;
        display: grid;
        grid-template-columns: 16px minmax(0, 1fr) 20px;
        align-items: start;
        gap: 8px;
        width: min(330px, 100%);
        padding: 10px 8px 10px 12px;
        border-radius: 10px;
        background: #1f1f1d;
        color: #c9c8bf;
        box-shadow: 0 14px 32px -10px rgba(20, 20, 16, 0.5);
        font-size: 12px;
        line-height: 1.45;
        text-align: left;
        user-select: text;
        -webkit-user-select: text;
        animation: toast-in 180ms var(--ease);
      }
      .byok-toast[hidden] {
        display: none;
      }
      .byok-toast::before {
        content: "";
        position: absolute;
        top: -4px;
        right: 22px;
        width: 9px;
        height: 9px;
        border-radius: 2px;
        background: inherit;
        transform: rotate(45deg);
      }
      .byok-toast[data-leaving="true"] {
        animation: toast-out 200ms ease forwards;
      }
      @keyframes toast-in {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
      }
      @keyframes toast-out {
        to {
          opacity: 0;
          transform: translateY(-4px);
        }
      }
      /* Over the setup form's own .choice strong. */
      .byok-fields .byok-toast strong {
        display: block;
        color: #fff;
        font-size: 12.5px;
        font-weight: 550;
      }
      .byok-toast .url {
        color: #ecebe3;
      }
      .toast-icon {
        display: grid;
        margin-top: 1px;
      }
      .byok-toast[data-tone="ok"] .toast-icon {
        color: #74d08b;
      }
      .byok-toast[data-tone="err"] .toast-icon {
        color: #ff9466;
      }
      .toast-close {
        display: grid;
        place-items: center;
        width: 20px;
        height: 20px;
        padding: 0;
        border: 0;
        border-radius: 5px;
        background: none;
        color: #8f8e85;
      }
      .toast-close:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
      }
      .byok-status {
        color: var(--faint);
        font-size: 11.5px;
        line-height: 1.4;
        overflow-wrap: anywhere;
      }
      .byok-status[data-tone="err"] {
        color: var(--error);
      }
      .byok-status .url {
        color: var(--muted);
      }
      .byok-status[data-tone] .url {
        color: inherit;
      }
      .byok-fields .url {
        font-family: var(--mono);
        font-size: 0.95em;
        overflow-wrap: anywhere;
      }
      .choice.optional-keys {
        display: block;
      }
      .choice.optional-keys summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
        list-style: none;
      }
      .choice.optional-keys summary::-webkit-details-marker {
        display: none;
      }
      .choice.optional-keys[open] summary {
        margin-bottom: 8px;
        color: var(--ink);
      }
      .choices,
      .panel {
        border: 1px solid rgba(20, 20, 16, 0.07);
        border-radius: 16px;
        background: #fff;
        box-shadow:
          0 1px 2px rgba(20, 20, 16, 0.04),
          0 12px 32px -18px rgba(20, 20, 16, 0.22);
        text-align: left;
      }
      .choices {
        padding: 2px 16px;
      }
      .choice {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 5px 0;
      }
      .choice + .choice {
        border-top: 1px solid #f1f1ee;
      }
      .choice .text {
        flex: 1;
        min-width: 0;
      }
      .choice strong {
        display: block;
        color: var(--ink);
        font-size: 13px;
        font-weight: 550;
        letter-spacing: -0.005em;
      }
      .choice .sub {
        display: block;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* The local model: one card naming it and what it needs. */
      .choice.local {
        flex-wrap: wrap;
        row-gap: 6px;
      }
      .pick-head {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
        width: 100%;
      }
      .pick-name {
        color: var(--ink);
        font-size: 12px;
        font-weight: 550;
      }
      .local-spotlight {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 5px 9px;
        border: 1px solid #eceae2;
        border-radius: 8px;
        background: #faf9f5;
        color: #52524b;
        font-size: 11px;
        line-height: 1.35;
      }
      .local-spotlight[data-recommended="true"] {
        border-color: #e6d2b5;
        background: #fbf6ee;
      }
      .local-spotlight span {
        flex: 1;
        min-width: 0;
      }
      /* Opens the system folder picker. */
      .change {
        flex: none;
        height: 28px;
        padding: 0 12px;
        border: 1px solid #e6e6e1;
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        font-size: 12px;
        font-weight: 500;
        transition:
          border-color 140ms ease,
          background-color 140ms ease;
      }
      .change:hover:not(:disabled) {
        border-color: #c4c4bc;
        background: #fafaf8;
      }
      .change:active:not(:disabled) {
        background: #f1f1ee;
      }
      .choice .sub[data-warn="true"] {
        color: var(--error);
      }
      /* Provider keys: one line per provider under the row. */
      .choice.provider-keys {
        flex-wrap: wrap;
        row-gap: 6px;
      }
      .keys {
        width: 100%;
        display: grid;
        grid-template-columns: 64px 1fr auto auto;
        align-items: center;
        gap: 6px 8px;
      }
      .keys label {
        color: #5f5e55;
        font-size: 12px;
        font-weight: 500;
      }
      .keys input {
        min-width: 0;
        height: 28px;
        padding: 0 10px;
        border: 1px solid #e6e6e1;
        border-radius: 8px;
        outline: none;
        background: #fff;
        color: var(--ink);
        font: inherit;
        font-size: 12px;
        user-select: text;
        -webkit-user-select: text;
        transition: border-color 140ms ease;
      }
      .keys input:focus {
        border-color: var(--ink);
      }
      .keys-note {
        width: 100%;
        margin: 0;
        color: var(--muted);
        font-size: 11.5px;
      }
      .team {
        margin: auto 0 0;
        padding-top: 10px;
        color: var(--faint);
        font-size: 12px;
      }
      .team .link {
        padding: 2px 4px;
        color: var(--muted);
        text-decoration-color: #d4d4cd;
      }
      /* The button sits at the same place on both steps: under it step 2's
         plan takes two lines, step 1's plan one line and the team link the
         other. */
      section[data-stage="choose"] .plan-line {
        height: 17px;
        -webkit-line-clamp: 1;
      }
      section[data-step="welcome"][data-local="true"] .team {
        margin-top: 0;
        padding-top: 0;
        line-height: 17px;
      }
      section[data-step="welcome"][data-local="true"] .team .link {
        padding-block: 0;
      }
      /* A long BYOK error scrolls the settings instead of moving the button;
         the padding keeps the card's shadow in view. */
      section[data-stage="settings"] .stage {
        min-height: 0;
        margin: 0 -8px -12px;
        padding: 0 8px 12px;
        overflow-y: auto;
      }

      /* Installing: one panel with the bar and a short stepper. */
      .panel {
        width: 380px;
        margin: 26px auto 0;
        padding: 20px 22px 18px;
      }
      .now {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        color: var(--ink);
        font-size: 13px;
        font-weight: 500;
        letter-spacing: -0.005em;
      }
      .now .pct {
        color: var(--ink);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      .track {
        position: relative;
        height: 4px;
        margin-top: 12px;
        overflow: hidden;
        border-radius: 999px;
        background: #f0f0ec;
      }
      .fill {
        position: relative;
        width: 0;
        height: 100%;
        overflow: hidden;
        border-radius: inherit;
        background: linear-gradient(90deg, #4a4a45, #1b1b19);
        transition: width 900ms var(--ease);
      }
      /* A soft sheen shows the work goes on between updates. */
      .fill::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.45),
          transparent
        );
        transform: translateX(-100%);
        animation: sheen 1.8s ease-in-out infinite;
      }
      section[data-failed="true"] .fill {
        background: #c9c8c0;
      }
      section[data-failed="true"] .fill::after {
        display: none;
      }
      @keyframes sheen {
        to {
          transform: translateX(100%);
        }
      }
      .checks {
        position: relative;
        display: grid;
        gap: 12px;
        margin: 18px 0 0;
        padding: 16px 0 0;
        border-top: 1px solid #f1f1ee;
        list-style: none;
        color: var(--faint);
        font-size: 12.5px;
      }
      .checks li {
        position: relative;
        display: flex;
        align-items: center;
        gap: 12px;
        transition: color 240ms ease;
      }
      /* The line that joins the steps. */
      .checks li + li::before {
        content: "";
        position: absolute;
        left: 7.25px;
        bottom: calc(100% + 1px);
        width: 1.5px;
        height: 10px;
        border-radius: 1px;
        background: #ecece8;
        transition: background-color 240ms ease;
      }
      .checks li[data-state="done"] + li::before {
        background: var(--ink);
      }
      .checks li[data-state="now"] {
        color: var(--ink);
        font-weight: 500;
      }
      .checks li[data-state="done"] {
        color: #52524b;
      }
      .checks .time {
        margin-left: auto;
        color: var(--faint);
        font-size: 11.5px;
        font-weight: 400;
        font-variant-numeric: tabular-nums;
      }
      .dot {
        display: grid;
        flex: none;
        place-items: center;
        width: 16px;
        height: 16px;
        border: 1.5px solid #deded8;
        border-radius: 50%;
        background: #fff;
        transition:
          background-color 240ms ease,
          border-color 240ms ease;
      }
      .dot svg {
        width: 9px;
        height: 9px;
        stroke: #fff;
        stroke-width: 3;
        opacity: 0;
        transform: scale(0.6);
        transition:
          opacity 200ms ease,
          transform 260ms var(--ease);
      }
      [data-state="done"] .dot {
        border-color: var(--ink);
        background: var(--ink);
      }
      [data-state="done"] .dot svg {
        opacity: 1;
        transform: none;
      }
      [data-state="now"] .dot {
        border-color: var(--ink);
        border-right-color: transparent;
        animation: spin 0.9s linear infinite;
      }
      [data-state="failed"] .dot {
        border-color: var(--error);
      }
      .checks li[data-state="failed"] {
        color: var(--error);
      }
      /* After a failure the steps not reached make room for the error and
         what to do next. */
      section[data-failed="true"] .checks li[data-state=""] {
        display: none;
      }
      .problem {
        width: 380px;
        margin: 14px auto 0;
        padding: 10px 14px;
        border: 1px solid #f3dfd6;
        border-radius: 12px;
        background: #fdf6f3;
        color: var(--error);
        font-size: 12px;
        text-align: left;
        user-select: text;
        -webkit-user-select: text;
      }
      .problem:empty {
        display: none;
      }
      /* The whole message, line breaks kept; long ones fold behind
         "Show Details". */
      #installing-error {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      #installing-error.folded {
        max-height: 7.5em;
        overflow: hidden;
        mask-image: linear-gradient(#000 70%, transparent);
      }
      /* The AI runtime's own sign-in: a small dialog over the progress while
         the "signin" step waits. */
      .signin-modal {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        background: rgb(38 38 38 / 28%);
        animation: enter 0.18s ease-out;
      }
      .signin-modal[hidden],
      .signin-modal [hidden] {
        display: none;
      }
      .signin-modal .sheet {
        width: 340px;
        padding: 22px 22px 18px;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 18px 48px rgb(0 0 0 / 18%);
        font-size: 12px;
        text-align: left;
      }
      .signin-modal h2 {
        margin: 0 0 6px;
        color: var(--ink);
        font-size: 16px;
        font-weight: 600;
      }
      .signin-modal p {
        margin: 0 0 14px;
        color: var(--muted);
        line-height: 1.5;
      }
      .signin-modal .waiting {
        display: flex;
        align-items: center;
        margin-bottom: 4px;
        color: var(--ink);
      }
      .signin-modal .device-code strong {
        color: var(--ink);
        font:
          600 14px ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        letter-spacing: 0.08em;
        user-select: all;
        -webkit-user-select: all;
      }
      .signin-modal .problem {
        width: auto;
        margin: 0 0 14px;
      }
      .signin-modal .hint {
        color: var(--muted);
        font-size: 11.5px;
      }
      /* No browser opened: the link below is the way on. */
      .signin-modal .no-browser {
        padding: 8px 10px;
        border: 1px solid #f1e3c4;
        border-radius: 10px;
        background: #fdf9ef;
        color: #6b5413;
      }
      .signin-modal .device-code {
        margin-bottom: 12px;
      }
      .signin-modal .device-code p {
        margin: 0;
      }
      .signin-modal .copy-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 4px 0;
      }
      .signin-modal .copy-row strong {
        flex: 1;
      }
      .signin-modal .signin-link {
        margin-bottom: 12px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--field);
      }
      .signin-modal .signin-link .label {
        display: block;
        margin-bottom: 4px;
        color: var(--muted);
        font-size: 11px;
      }
      .signin-modal .signin-link code {
        display: block;
        overflow: hidden;
        margin-bottom: 8px;
        color: var(--ink);
        font: 11.5px var(--mono);
        white-space: nowrap;
        text-overflow: ellipsis;
        user-select: all;
        -webkit-user-select: all;
      }
      .signin-modal .signin-link .buttons {
        display: flex;
        gap: 8px;
      }
      .signin-modal .actions {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .signin-modal .actions .primary {
        width: 100%;
      }
      .signin-modal .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .signin-modal .runtimes {
        display: flex;
        gap: 8px;
        margin-top: 4px;
      }
      .signin-modal .runtimes button {
        flex: 1;
      }
      .signin-modal details {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
        color: var(--muted);
      }
      .signin-modal summary {
        width: max-content;
        cursor: pointer;
        list-style: none;
      }
      .signin-modal summary::-webkit-details-marker {
        display: none;
      }
      .signin-modal details p {
        margin: 8px 0;
      }
      .signin-modal details form {
        display: flex;
        gap: 8px;
      }
      .signin-modal details input {
        flex: 1;
        min-width: 0;
        padding: 5px 10px;
        border: 1px solid #dbdcd5;
        border-radius: 8px;
        font: inherit;
      }
      .signin-byok {
        display: grid;
        gap: 10px;
        margin-top: 8px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
      }
      /* The BYOK fields take the room they have on the setup form. */
      .signin-modal .sheet:has(.signin-byok:not([hidden])) {
        width: 448px;
      }
      .diagnostics {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 4px 10px;
        width: 380px;
        margin: 6px auto 0;
        font-size: 12px;
      }
      .diagnostics[hidden],
      .diagnostics [hidden] {
        display: none;
      }
      /* Send Diagnostics: consent, progress and the report id. */
      .send-modal .files {
        max-height: 132px;
        margin: 0 0 14px;
        padding: 8px 10px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        list-style: none;
        color: var(--muted);
        font:
          11px/1.6 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        overflow-wrap: anywhere;
      }
      .send-modal .track {
        margin: 0 0 14px;
      }
      .send-modal .fill {
        transition: width 200ms linear;
      }
      .send-modal .report strong {
        display: block;
        margin-top: 6px;
        color: var(--ink);
        font:
          600 16px ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        letter-spacing: 0.06em;
        user-select: all;
        -webkit-user-select: all;
      }
      .diagnostics output {
        flex-basis: 100%;
        color: #52524b;
        text-align: center;
        overflow-wrap: anywhere;
        user-select: text;
        -webkit-user-select: text;
      }

      /* Ready: the check draws itself, then a short receipt. */
      .mark {
        position: relative;
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        /* A tall receipt overflows the section; the circle must not shrink. */
        flex-shrink: 0;
        margin: 0 auto 18px;
        border-radius: 50%;
        background: linear-gradient(180deg, #2f2f2c, #1b1b19);
        box-shadow:
          0 0 0 6px #f4f4f0,
          0 14px 28px -14px rgba(20, 20, 16, 0.6);
      }
      section.active .mark {
        animation: pop 560ms var(--ease) both;
      }
      .mark svg {
        width: 22px;
        height: 22px;
        stroke: #fff;
        stroke-width: 2.4;
        stroke-dasharray: 24;
        stroke-dashoffset: 24;
      }
      section.active .mark svg {
        animation: draw 420ms 260ms var(--ease) forwards;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.7);
        }
      }
      @keyframes draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      .connected {
        display: flex;
        width: max-content;
        align-items: center;
        gap: 8px;
        margin: 18px auto 0;
        padding: 6px 12px;
        border: 1px solid #ecece7;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.8);
        color: var(--ink);
        font-size: 12px;
        font-weight: 500;
      }
      .connected .live {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--ok);
        box-shadow: 0 0 0 3px rgba(47, 158, 68, 0.15);
      }
      section.active .connected {
        animation: enter 420ms 120ms var(--ease) both;
      }
      /* The owner account of the finished install. */
      .account {
        width: 100%;
        max-width: 420px;
        margin: 18px auto 0;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.86);
        text-align: left;
      }
      .account-title {
        margin: 0 0 8px;
        color: var(--ink);
        font-size: 12.5px;
        font-weight: 600;
      }
      .account dl {
        display: grid;
        grid-template-columns: 64px 1fr auto auto;
        align-items: center;
        gap: 6px 8px;
        margin: 0;
      }
      .account dt {
        color: #5f5e55;
        font-size: 12px;
        font-weight: 500;
      }
      .account dd {
        min-width: 0;
        margin: 0;
        overflow: hidden;
        color: var(--ink);
        font-size: 12.5px;
        text-overflow: ellipsis;
        white-space: nowrap;
        user-select: text;
        -webkit-user-select: text;
      }
      .account dd.email {
        grid-column: 2 / 4;
      }
      .account dd.secret {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.02em;
      }
      .account-note {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 11.5px;
      }
      .account-note .link {
        padding: 2px 4px;
        font-size: 11.5px;
      }
      .account-error {
        margin: 0;
        color: var(--error);
        font-size: 12px;
      }
      section.active .account {
        animation: enter 420ms 160ms var(--ease) both;
      }
      /* The earlier Simplex app's data this install could not upgrade. */
      .legacy-note {
        width: 100%;
        max-width: 420px;
        margin: 12px auto 0;
        color: var(--muted);
        font-size: 12px;
        text-align: left;
        overflow-wrap: anywhere;
      }
      /* Confetti for a finished install, drawn over the whole window. */
      #confetti {
        position: fixed;
        inset: 0;
        z-index: 50;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      section[data-step="ready"] .start {
        padding-top: 22px;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body data-platform="darwin">
    <div class="scene" aria-hidden="true"></div>

            ><span data-t="back"></span>

            <div class="source-panel" id="source-panel" hidden>
              <div class="choice local" id="local-row" hidden>

                    ><span

                >
                  <div class="text">

                    ><span class="sub" data-runtime-sub></span>
                  </div>
                  <div class="runtime-act">
                    <button

                    <button

                      data-runtime-signin
                      data-t="signIn"

                    <div

      </section>
      <div
        class="signin-modal"
        id="credentials-sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="credentials-title"
        hidden
      >
        <form class="sheet credentials" id="credentials-form" novalidate>
          <h2 id="credentials-title" data-t="credentialsTitle"></h2>
          <p data-t="credentialsLead"></p>
          <label for="credentials-email" data-t="email"></label>
          <input
            id="credentials-email"
            type="email"
            autocomplete="off"
            spellcheck="false"
            autocapitalize="off"

          <div class="credentials-line">
            <input
              id="credentials-password"
              type="password"
              autocomplete="new-password"
              spellcheck="false"
              autocapitalize="off"

            <button
              type="button"
              class="change"
              id="credentials-show"
              data-t="show"
            ></button>
            <button
              type="button"
              class="change"
              id="credentials-generate"
              data-t="generate"
            ></button>
          </div>
          <label for="credentials-confirm" data-t="confirmPassword"></label>
          <input
            id="credentials-confirm"
            type="password"
            autocomplete="new-password"
            spellcheck="false"
            autocapitalize="off"

            <button class="primary" type="submit" data-t="done"></button>
            <button
              class="link quiet"
