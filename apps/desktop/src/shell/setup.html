          else canvas.remove();
        };
        requestAnimationFrame(frame);
      };

      const show = (next) => {
        // Leaving the sign-in step stops waiting for it.
        if (pending === "signin.open") pending = null;
        if (next === "ready" && step !== "ready") setTimeout(celebrate, 320);
        step = next;
        for (const el of document.querySelectorAll("section"))
          el.classList.toggle("active", el.dataset.step === step);
        if (step === "server") {
          $("server").value ||= state.serverUrl;
          setTimeout(() => $("server").focus(), 30);
        }
        render();
      };

      // Slides each segmented control's knob under its choice.
      const placeKnobs = () => {
        for (const seg of document.querySelectorAll(".seg")) {
          const on = seg.querySelector('[aria-checked="true"]');
          const knob = seg.querySelector(".knob");
          // No option is on while the local model runs tasks.
          knob.style.opacity = on ? "" : "0";
          if (!on || !on.offsetWidth) continue;
          knob.style.width = on.offsetWidth + "px";
          knob.style.transform = "translateX(" + on.offsetLeft + "px)";
        }
      };

      // The bar eases toward the end of the current step between updates,
      // so long steps never look stuck; it never passes the step's end.
      let shown = 0;
      let eased = 0;
      const shownProgress = (local, at) => {
        const now = Date.now();
        const seconds = eased ? (now - eased) / 1000 : 0;
        eased = now;
        // A failure keeps the bar where it was, within the step that failed.
        if (local.phase === "failed")
          return (shown = Math.min(
            Math.max(local.progress, shown),
            (at + 1) / local.steps.length,
          ));
        if (local.phase !== "installing") return (shown = local.progress);
        const cap = (at + 1) / local.steps.length - 0.02;
        shown = Math.max(local.progress, shown);
        if (shown < cap) shown += (cap - shown) * (1 - Math.exp(-seconds / 90));
        return shown;
      };
      // When each step began, for the timings beside the steps.
      let started = [];
      // Each Install or Try Again times its steps and fills the bar afresh.
      let attempt;
      // The attempt whose failure was last scrolled into view.
      let revealed;
      const startAttempt = (local) => {
        if (local.attempt === attempt) return;
        attempt = local.attempt;
        started = [];
        shown = 0;
        eased = 0;
      };
      const timeStep = (local, at) => {
        if (local.phase === "idle") started = [];
        for (let index = 0; index <= at; index++) started[index] ??= Date.now();
        if (local.phase === "ready") started[local.steps.length] ??= Date.now();
      };
      const clock = (ms) => {
        const seconds = Math.max(0, Math.round(ms / 1000));
        return (
          Math.floor(seconds / 60) + ":" + String(seconds % 60).padStart(2, "0")
        );
      };
      const stepTime = (index, stepState) =>
        stepState === "now"
          ? clock(Date.now() - started[index])
          : stepState === "done" && started[index] && started[index + 1]
            ? clock(started[index + 1] - started[index])
            : "";
      // Timers and the easing bar move once a second while installing.
      setInterval(() => {
        if (step === "installing" && state?.localServer.phase === "installing")
          render();
      }, 1000);

      // What the sign-in dialog says first for each runtime; each names
      // whose account it signs in with.
      const SIGN_IN_LEADS = {
        codex: "signInLeadCodex",
        claude: "signInLeadClaude",
        pi: "signInLeadPi",
      };
      // The page's own words for why a sign-in ended; the installer's
      // message is the fallback for anything else.

        timed_out: "signInTimedOut",
        ended: "signInEnded",
        unavailable: "signInUnavailable",
      };
      let otherRuntimes = false;
      // The sign-in's own errors, such as a failed copy; render keeps them.
      let signInError = "";
      // What was just copied: "url" or "code".
      let signInCopied;
      // The runtime installed but not signed in: a dialog starts its own

      // no browser opens. No secret shows here; a pasted code goes straight
      // to the runtime.
      const renderSignIn = (local, busy) => {

          local.phase === "installing" &&
          local.step === "signin" &&
          sign &&
          sign.state !== "signed_in";

          signInByokOpen = false;
          signInError = "";

        const name = RUNTIMES[sign.runtime];
        const failed = sign.state === "failed";
        const running =

        const pi = sign.runtime === "pi";
        const codex = sign.runtime === "codex";

        $("runtime-signin-title").textContent = t("signInTo", {
          runtime: name,
        });
        $("runtime-signin-lead").textContent = t(SIGN_IN_LEADS[sign.runtime]);
        $("runtime-signin-lead").hidden = running;
        $("runtime-signin-waiting").hidden = !running;
        $("runtime-signin-no-browser").hidden = !link || !sign.browserFailed;
        // A device code works in any browser; the browser login calls back

          sign.deviceCode ? "browserFailedDevice" : "browserFailed",

        $("runtime-signin-copy-code").textContent = t(

        $("runtime-signin-link").hidden = !link;

        $("runtime-signin-device-start").hidden = !codex;

        signInByok.sync(busy);
        $("runtime-signin-byok-submit").disabled =

        for (const option of document.querySelectorAll("[data-switch]")) {

        $("runtime-signin-switch-method").textContent = t(
          sign.deviceCode ? "useBrowserHere" : "useDeviceCode",
        );

        requestAnimationFrame(placeKnobs);
      };

      // The page's own words for each localmodels reason code, with the
      // counts it carries; the tool's message is never shown. held: the
      // model fits the hardware, but other programs hold memory it needs now.
      const counts = (free, needed) =>
        free != null && needed != null
          ? t("memoryCounts", { free: size(free), needed: size(needed) })
          : "";
      const reasonText = (reason, held, freeMemory) => {
        switch (reason.code) {
          case "gpu-memory-required": {
            const values = {
              gpu: String(reason.gpuIndex),
              counts: counts(reason.freeBytes, reason.requiredBytes),
            };

              ? t("reasonGpuMemoryOf", values)
              : t("reasonGpuMemory", values);
          }
          case "free-memory-required":
            return t("reasonFreeMemory", {
              counts:
                counts(reason.freeBytes, reason.requiredBytes) ||
                counts(
                  freeMemory?.ramAvailableBytes,
                  freeMemory?.ramRequiredBytes,
                ),
            });
          case "gpu-sharing-required":
            return t("reasonGpuSharing");
          // localmodels 0.1.0.dev39 reports it; later versions plan by the
          // GPU memory free instead.
          case "gpu-ownership-unknown":
            return t("reasonGpuOwnership");
          case "gateway-port-in-use":
            return t("reasonGatewayPortInUse");
          case "harness-unavailable":
            return t("reasonHarnessUnavailable");
          case "facts-unavailable":
            return t("reasonFacts");
          case "cuda-driver-update-required": {
            const has = reason.detectedCudaVersion;
            const needs = reason.requiredCudaVersion;
            if (has && needs)
              return t("reasonCudaUpdate", {
                has: String(has),
                needs: String(needs),
              });
            if (needs)
              return t("reasonCudaTooOldNeeds", { needs: String(needs) });
            return t("reasonCudaTooOld");
          }
          case "cuda-driver-version-unknown":
            return reason.requiredCudaVersion
              ? t("reasonCudaUnknownNeeds", {
                  needs: String(reason.requiredCudaVersion),

              : t("reasonCudaUnknown");
          case "unsupported-platform":
            return t("reasonUnsupported");

          // memory.

              ? freeMemory
                ? t("reasonHeld")
                : t("reasonHeldGeneric")

      };
      const reasonsText = (models, held) =>
        [
          ...new Set(
            (models.reasons?.length ? models.reasons : [{ code: "" }]).map(
              (reason) => reasonText(reason, held, models.freeMemory),
            ),

      const RECHECKABLE_REASONS = new Set([
        "cuda-driver-update-required",
        "cuda-driver-version-unknown",
        "gateway-port-in-use",

        "cuda-driver-version-unknown",

        "gpu-sharing-required",

        models.freeMemory != null ||

          models.reasons?.some((reason) => MEMORY_HELD_CODES.has(reason.code)),

        if (
          models.reasons?.some(
            (reason) => reason.code === "gateway-port-in-use",
          )

        if (
          models.reasons?.some(
            (reason) => reason.code === "harness-unavailable",

          (reason) =>
            reason.code === "gpu-memory-required" &&
            reason.freeBytes != null &&
            reason.requiredBytes != null,
        );
        if (gpu) {
          const values = {
            gpu: String(gpu.gpuIndex),
            free: size(gpu.freeBytes),
            needed: size(gpu.requiredBytes),
          };
          return gpu.gpuIndex != null
            ? t("heldGpuOf", values)
            : t("heldGpu", values);
        }
        const ram = models.reasons?.find(
          (reason) =>
            reason.code === "free-memory-required" &&
            reason.freeBytes != null &&
            reason.requiredBytes != null,
        );
        const free = ram?.freeBytes ?? models.freeMemory?.ramAvailableBytes;
        const needed =
          ram?.requiredBytes ?? models.freeMemory?.ramRequiredBytes;
        if (free != null && needed != null)
          return t("heldMemory", { free: size(free), needed: size(needed) });
        return memoryHeld(models) ? t("heldClose") : t("heldResolve");
      };

      const renderLocal = (busy) => {
        const local = state.localServer;
        const recommended = defaults();
        // Auto, picked before the check named a pick, means that pick; once
        // it is known Auto no longer shows.
        if (pickedAutoBeforeCheck && recommended.runtime !== "recommended") {

        $("welcome-lead").textContent = t(
          local.available ? "welcomeLeadLocal" : "welcomeLeadTeam",

        $("local-customize").setAttribute("aria-expanded", String(customizing));
        $("local-customize").textContent = t(
          customizing ? "useDefaults" : "customize",
        );
        // Until the check ends the button says what it waits for: the first
        // run downloads the localmodels tool, then the check runs. The label
        // changes only when it differs, so the spinner keeps turning.
        const fetching = checking ? models.download : undefined;
        const label = checking
          ? '<span class="spinner"></span>' +

                  t("memoryAmount", { size: gigabytes(models.memoryBytes) }),
                  model.downloadBytes != null &&

                  .join(" · ")
              : held
                ? cudaDriverHeld(models)
                  ? t("heldWhyCudaDriver", {

                  : memoryHeld(models)

                        reasons: reasonsText(models, true),

                      })
                    : t("heldWhyGeneric", {
                        reasons: reasonsText(models, true),

                      })
                : (models.state === "checked" && !models.eligible) ||
                    models.state === "unavailable"
                  ? unavailableText
                  : "";
        $("plan-why").hidden =
          !local.available || customizing || !$("plan-why").textContent;
        $("plan-line").hidden = !local.available;
        $("welcome-eyebrow").hidden = !local.available;
        const location = local.location;

        for (const input of document.querySelectorAll("[data-key]")) {

        $("keys-note").textContent = t("keysNote");
        const shown = model || heldModel;
        const inklingRecommended = Boolean(
          recommended.localModel && model?.featuredInkling,

        const shownIsInkling = Boolean(shown?.featuredInkling);
        $("plan-featured-badge").hidden =
          !local.available ||
          customizing ||
          checking ||
          !following ||
          !inklingRecommended;
        $("featured-spotlight").hidden = !local.available || customizing;
        $("featured-spotlight").dataset.recommended =
          String(inklingRecommended);
        $("featured-spotlight-note").textContent = t(
          inklingRecommended
            ? "featuredModelSelected"
            : "featuredModelLibraryNote",
        );
        $("featured-spotlight-link").textContent = t(
          inklingRecommended ? "learnMoreLink" : "thinkingMachinesLink",
        );
        $("local-model-featured").hidden = !shownIsInkling;
        $("local-spotlight").dataset.recommended = String(shownIsInkling);
        $("local-spotlight-text").textContent = t(
          shownIsInkling ? "featuredModelSpecs" : "featuredModelCustomizeNote",
        );
        $("local-spotlight-link").textContent = t(
          shownIsInkling ? "learnMoreLink" : "thinkingMachinesLink",
        );
        $("source-sub").textContent =
          recommended.source === "local"
            ? t("recommendedLocal")
            : known
              ? t("recommendedSubscription", {
                  runtime: RUNTIMES[recommended.runtime],
                })
              : t("chooseSource");
        $("local-row").hidden = plan.source !== "local";
        $("subscription-row").hidden = plan.source !== "subscription";
        $("byok-row").hidden = plan.source !== "byok";
        // Once checked, the card always shows: the model, or why there is
        // none, disabled.
        const settled =
          models.state === "checked" || models.state === "unavailable";
        const canRecheck =
          held ||
          (models.state === "checked" &&
            !models.eligible &&
            !!models.reasons?.some((reason) =>
              RECHECKABLE_REASONS.has(reason.code),
            ));
        $("local-model").hidden = !shown && !settled;
        $("local-recheck").hidden = !canRecheck || !local.available;
        $("local-recheck").disabled = busy;
        if (shown) {
          $("local-sub").textContent = held
            ? heldLine(models)
            : [
                t(recommended.localModel ? "localRecommended" : "localRuns"),

                .join(" · ");
          $("local-model-name").textContent = shown.name;

            shown.downloadBytes != null &&

            shown.diskBytes != null &&

            // The whole stack's memory, so more than the model's own on

            shown.memoryBytes != null &&

            .join(" · ");

        } else if (held) {

          $("local-model-needs").textContent = reasonsText(models, true);
          $("local-model").setAttribute("aria-checked", "false");
          $("local-model").disabled = true;
        } else if (settled) {
          $("local-sub").textContent = t("localRuns");
          $("local-model-name").textContent = t("localNotAvailable");
          $("local-model-needs").textContent = unavailableText;
          $("local-model").setAttribute("aria-checked", "false");
          $("local-model").disabled = true;
        } else {
          $("local-sub").textContent = t("checkingComputer");
        }
        const subKnown =
          recommended.source === "subscription" &&
          recommended.runtime !== "recommended";
        $("runtime-sub").textContent = subKnown
          ? t("recommendedRuntime", { runtime: RUNTIMES[recommended.runtime] })
          : t("subscriptionHint");
        for (const seg of document.querySelectorAll("[data-plan]"))
          for (const option of seg.querySelectorAll("button")) {
            const field = seg.dataset.plan;
            const value = option.dataset.value;
            if (field === "source") {
              option.setAttribute(
                "aria-checked",
                String(plan.source === value),
              );

              );

            } else {
              const subPick =
                plan.runtime === "pi"
                  ? subKnown

                  : plan.runtime;

            "aria-checked",
            String(byokRuntime === option.dataset.value),

        }
        mainByok.sync(busy);
        requestAnimationFrame(placeKnobs);

            ? "installStopped"

              ? "startingLinger"
              : "installingTitle",

          ? locationHint(local) || t("dataKept")
          : t("takesMinutes");
        const section = document.querySelector('[data-step="installing"]');
        const steps = ALL_STEPS.filter(([id]) => local.steps.includes(id));
        section.dataset.failed = String(failed);
        const at = Math.max(
          0,
          steps.findIndex(([id]) => id === local.step),

        startAttempt(local);

        $("installing-fill").style.width = Math.max(2, percent) + "%";

        $("installing-count").textContent = starting ? "" : percent + "%";

        steps.forEach(([, label], index) => {
          const item = checks.children[index];
          item.dataset.state =

                  ? "failed"
                  : "now"
                : "";
          item.children[1].textContent = label();
          item.lastChild.textContent = stepTime(index, item.dataset.state);

        const problem = $("installing-error");

          ? t("legacyNote", { folder: local.legacyBackup })
          : "";

      // The password stays masked until Show; the main process copies it.
      let copied = false;
      const renderAccount = (account) => {
        $("account").hidden = !account;
        if (!account) return;
        const error = account.error ?? "";
        $("account-error").textContent = error;
        $("account-error").hidden = !error;
        $("account-fields").hidden = !!error;
        $("account-note").hidden = !!error;
        if (error) return;
        $("account-email").textContent = account.email;
        $("account-password").textContent =
          account.password ?? "\u2022".repeat(12);
        $("account-show").textContent = t(account.password ? "hide" : "show");
        $("account-show").setAttribute(
          "aria-label",
          t(account.password ? "hidePassword" : "showPassword"),
        );
        $("account-copy").textContent = t(copied ? "copied" : "copy");
        $("account-copy").setAttribute("aria-label", t("copyPassword"));
      };

      const render = () => {
        if (!state) return;
        document.body.dataset.platform = state.platform;
        // Where the tray icon lives on this platform.
        for (const el of document.querySelectorAll("[data-tray]"))
          el.textContent = t(
            el.dataset.tray +
              (state.platform === "darwin" ? "MenuBar" : "Tray"),
          );
        const at = ORDER.indexOf(step);
        $("step-label").textContent =
          at >= 0 ? t("stepOf", { step: at + 1, total: ORDER.length }) : "";
        const busy = pending !== null;

        $("signin").textContent = t(state.signedIn ? "continue" : "openSignIn");

        $("send-track").hidden = phase !== "sending";

        const primary = {
          confirm: "send",
          sent: copiedReport === send.reportId ? "copied" : "copyReportId",

      // Runs one command at a time; errors land next to the step.

        if (pending !== null) return;

          pending = null;
          render();

            ? "local"
            : plan.source === "byok"

              : plan.runtime === "pi"

        signInError = "";
        setup.run({ op: "local.signin.open" }).catch((error) => {
          signInError = ipcMessage(error);
          render();
        });
      });
      const copySignIn = async (what) => {
        if (
          !(await run(
            { op: "local.signin.copy", what },
            "runtime-signin-error",
          ))
        )
          return;
        signInCopied = what;
        render();
        setTimeout(() => {
          if (signInCopied !== what) return;
          signInCopied = undefined;
          render();
        }, 1500);
      };
      $("runtime-signin-copy-url").addEventListener("click", () =>
        copySignIn("url"),
      );
      $("runtime-signin-copy-code").addEventListener("click", () =>
        copySignIn("code"),
      );
      $("runtime-signin-device-start").addEventListener("click", () =>
        run({ op: "local.signin.start", device: true }, "runtime-signin-error"),
      );
      $("runtime-signin-switch-method").addEventListener("click", () =>
        run(
          state.localServer.signIn?.deviceCode
            ? { op: "local.signin.start" }
            : { op: "local.signin.start", device: true },
          "runtime-signin-error",
        ),
      );
      $("runtime-signin-cancel").addEventListener("click", () =>
        run({ op: "local.signin.cancel" }, "runtime-signin-error"),
      );
      $("runtime-signin-other").addEventListener("click", () => {
        otherRuntimes = !otherRuntimes;
        render();
      });
      $("runtime-signin-byok-toggle").addEventListener("click", () => {
        signInByokOpen = !signInByokOpen;
        render();
      });
      $("runtime-signin-byok").addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!signInByok.complete()) return;
        const payload = signInByok.config();
        signInByok.clearKey();
        await run(
          { op: "local.signin.byok", byok: payload },
          "runtime-signin-error",
        );
      });
      $("runtime-signin-logs").addEventListener("click", () =>
        run({ op: "logs.open" }, "runtime-signin-error"),
      );
      for (const option of document.querySelectorAll("[data-switch]"))
        option.addEventListener("click", () =>
          run(
            { op: "local.signin.switch", runtime: option.dataset.switch },
            "runtime-signin-error",
          ),
        );
      $("local-retry").addEventListener("click", install);
      $("installing-more").addEventListener("click", () => {
        detailsOpen = !detailsOpen;
        render();
      });
      $("show-logs").addEventListener("click", () =>
        run({ op: "logs.open" }, "diagnostics-note"),
      );
      $("save-diagnostics").addEventListener("click", () =>
        run({ op: "diagnostics.save" }, "diagnostics-note"),
      );
      $("send-diagnostics").addEventListener("click", () => {
        copiedReport = undefined;
        run({ op: "diagnostics.send", action: "start" }, "diagnostics-note");
      });
      $("send-primary").addEventListener("click", async () => {
        const send = state.diagnosticsSend;
        if (send?.phase === "confirm")
          run({ op: "diagnostics.send", action: "confirm" }, "send-error");
        else if (send?.phase === "failed")
          run({ op: "diagnostics.send", action: "retry" }, "send-error");
        else if (send?.phase === "sent") {
          if (
            await run({ op: "diagnostics.send", action: "copy" }, "send-error")
          )
            copiedReport = send.reportId;
          render();
        }
      });
      $("send-close").addEventListener("click", () =>
        run({ op: "diagnostics.send", action: "cancel" }, "send-error"),
      );
      const clearKeys = () => {
        keys = {};
        mainByok.clearKey();
        signInByok.clearKey();
        for (const input of document.querySelectorAll("[data-key]")) {
          input.value = "";
          input.type = "password";
        }
        for (const reveal of document.querySelectorAll("[data-reveal]"))
          reveal.textContent = t("show");
      };
      for (const input of document.querySelectorAll("[data-key]"))
        input.addEventListener("input", () => {
          const key = input.value.trim();
          if (key) keys = { ...keys, [input.dataset.key]: key };
          else {
            const { [input.dataset.key]: _, ...rest } = keys;
            keys = rest;
          }
          render();
        });
      for (const reveal of document.querySelectorAll("[data-reveal]"))
        reveal.addEventListener("click", () => {
          const input = $(`key-${reveal.dataset.reveal}`);
          input.type = input.type === "password" ? "text" : "password";
          reveal.textContent = t(input.type === "password" ? "show" : "hide");
        });
      for (const remove of document.querySelectorAll("[data-remove]"))
        remove.addEventListener("click", () => {
          const provider = remove.dataset.remove;
          const { [provider]: current, ...rest } = keys;
          $(`key-${provider}`).value = "";
          // Remove clears a typed key, then the saved one; Keep undoes that.
          keys =
            current === undefined && state.localServer.keys[provider]
              ? { ...rest, [provider]: "" }
              : rest;
          render();
        });
      $("local-customize").addEventListener("click", () => {
        customizing = !customizing;
        if (!customizing) {
          picked = false;
          pickedAutoBeforeCheck = false;
          byokRuntime = "claude";
          mainByok.reset();
          clearKeys();
          const location = state.localServer.location;
          if (location.custom || location.error)
            run({ op: "local.location.reset" });
        }
        render();
      });
      for (const seg of document.querySelectorAll("[data-plan]"))
        for (const option of seg.querySelectorAll("button"))
          option.addEventListener("click", () => {
            picked = true;
            const field = seg.dataset.plan;
            const value = option.dataset.value;
            pickedAutoBeforeCheck =
              field === "runtime" &&
              value === "recommended" &&
              state.localServer.localModels.state === "checking";
            if (field === "source") {
              const rec = defaults();
              plan = {
                ...plan,
                source: value,
                runtime:
                  value === "local"
                    ? "pi"
                    : plan.runtime === "pi"
                      ? rec.source === "subscription"
                        ? rec.runtime
                        : "recommended"
                      : plan.runtime,
                localModel: value === "local",
              };
            } else {
              plan = {
                ...plan,
                source: "subscription",
                runtime: value,
                localModel: false,
              };
            }
            render();
          });
      for (const option of document.querySelectorAll(
        '[data-byok="runtime"] button',
      ))
        option.addEventListener("click", () => {
          picked = true;
          byokRuntime = option.dataset.value;
          mainByok.runtimeChanged();
          render();
        });
      $("location-change").addEventListener("click", () =>
        run({ op: "local.location.pick" }),
      );
      $("local-recheck").addEventListener("click", () =>
        run({ op: "local.recheck" }, "local-error"),
      );
      const openFeaturedAnnouncement = () =>
        run(
          {
            op: "external.open",
            url: window.lingerSetup.featuredAnnouncementUrl,
          },
          "local-error",
        );
      $("featured-spotlight-link").addEventListener(
        "click",
        openFeaturedAnnouncement,
      );
      $("local-spotlight-link").addEventListener(
        "click",
        openFeaturedAnnouncement,
      );
      $("local-model").addEventListener("click", () => {
        if ($("local-model").disabled) return;
        picked = true;
        plan = { ...plan, source: "local", runtime: "pi", localModel: true };
        render();
      });
      $("open").addEventListener("click", () => run({ op: "finish" }));
      $("account-show").addEventListener("click", () =>
        run({
          op: "local.account.show",
          on: !state.localServer.account?.password,
        }),
      );
      $("account-copy").addEventListener("click", async () => {
        if (!(await run({ op: "local.account.copy" }))) return;
        copied = true;
        render();
        setTimeout(() => {
          copied = false;
          render();
        }, 1500);
      });
      $("account-reveal").addEventListener("click", () =>
        run({ op: "local.account.reveal" }),
      );
      $("signin").addEventListener("click", () => {
        if (state.signedIn) return show("connect");
        if (pending !== null && pending !== "signin.open") return;
        // Stays pending until the main window reports a session.
        pending = "signin.open";
        render();
        setup.run({ op: "signin.open" }).catch(() => {
          pending = null;
          render();
        });
      });
      $("connect").addEventListener("click", async () => {
        if (state.enrolled) return show("permissions");
        if (await run({ op: "computer.connect" }, "connect-error"))
          show("permissions");
      });
      $("notify").addEventListener("click", async () => {
        if (await run({ op: "notifications.test" }, "permissions-error"))
          $("notify").textContent = t("testSent");
      });
      $("folder").addEventListener("click", () =>
        run({ op: "folder.add" }, "permissions-error"),
      );
      for (const id of Object.keys(PERMISSIONS))
        $("perm-" + id).addEventListener("click", () => {
          const status = state.permissions?.[id] ?? "unknown";
          run(
            id === "full-disk" || status === "denied"
              ? { op: "permission.settings", id }
              : { op: "permission.request", id },
            "permissions-error",
          );
        });
      $("sleep").addEventListener("click", () =>
        run(
          { op: "prevent-sleep.set", on: !state.preventSleep },
          "permissions-error",
        ),
      );
      $("login").addEventListener("click", () =>
        run(
          { op: "open-at-login.set", on: !state.openAtLogin },
          "permissions-error",
        ),
      );
      $("finish").addEventListener("click", () => run({ op: "finish" }));

      setup.onState((next) => {
        const signedInNow = next.signedIn && !state?.signedIn;
        const localReady =
          next.localServer.phase === "ready" &&
          state?.localServer.phase !== "ready";
        state = next;
        if (pending === "signin.open" && next.signedIn) pending = null;
        if (localReady && step === "installing") show("ready");
        else if (signedInNow && step === "signin") show("connect");
        else render();
      });
      setup.getState().then((initial) => {
        state = initial;
        const phase = initial.localServer.phase;
        show(
          ["preparing", "installing", "failed"].includes(phase)
            ? "installing"
            : initial.enrolled
              ? "permissions"
              : initial.signedIn
                ? "connect"
                : "welcome",
        );
      });
      addEventListener("resize", placeKnobs);
    </script>
  </body>
</html>
