<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; font-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title data-t="pageTitle"></title>
    <style>
      @font-face {
        font-family: "Geist Variable";
        font-style: normal;
        font-display: block;
        font-weight: 100 900;
        src: url("/geist.woff2") format("woff2");
      }
      /* The installer's look: a scene on top, the step centered below. */
      :root {
        --ink: #262626;
        --body: #1a1a16;
        --muted: #737266;
        --faint: #a3a39b;
        --line: #ecece9;
        --field: #f4f4f0;
        --ok: #2f9e44;
        --error: #b5320a;
        --filled: #9b9a90;
        --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
        color: var(--body);
        background: #fff;
        font:
          14px/1.5 "Geist Variable",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "PingFang SC",
          "Noto Sans SC",
          system-ui,
          sans-serif;
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        -webkit-user-select: none;
      }

      /* Scene and top bar. Both are the window drag region. */
      .scene {
        flex: none;
        height: 190px;
        background: #f4f4f0 url("/welcome-scene.png") center / cover no-repeat;
        -webkit-app-region: drag;
      }
      .topbar {
        position: absolute;
        top: 18px;
        left: 28px;
        right: 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        color: #52524b;
        font-size: 12px;
        -webkit-app-region: drag;
      }
      /* Clear the traffic lights. */
      body[data-platform="darwin"] .topbar {
        left: 84px;
      }

      .topbar .brand {
        height: 24px;
        width: auto;
      }

      /* The current step. */
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        width: min(100%, 600px);
        margin: 0 auto;
        padding: 20px 24px 16px;
        text-align: center;
      }
      section {
        display: none;
        flex: 1;
        flex-direction: column;
        min-height: 0;
        animation: enter 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      }
      section.active {
        display: flex;
      }
      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      h1 {
        margin: 0 0 6px;
        color: var(--ink);
        font-size: 20px;
        font-weight: 580;
        line-height: 32px;
        letter-spacing: 0.0025em;
        text-wrap: balance;
      }
      .lead {
        max-width: 440px;
        margin: 0 auto 22px;
        color: var(--muted);
        font-size: 13px;
        text-wrap: pretty;
      }
      .lead.compact {
        margin-bottom: 14px;
      }
      .icon {
        display: grid;
        place-items: center;
        flex: none;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: var(--field);
        color: var(--ink);
      }
      svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      form {
        width: min(100%, 400px);
        margin: 0 auto;
        text-align: left;
      }
      label.field {
        display: block;
        margin-bottom: 6px;
        color: var(--ink);
        font-size: 12px;
        font-weight: 550;
      }
      input[type="text"] {
        width: 100%;
        height: 40px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        outline: none;
        background: #fff;
        color: var(--ink);
        font: inherit;
        font-size: 14px;
        user-select: text;
        -webkit-user-select: text;
        transition: border-color 0.15s;
      }
      input[type="text"]:focus {
        border-color: var(--ink);
      }
      .hint {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 12px;
      }
      .hint:empty {
        display: none;
      }
      .error:empty {
        display: none;
      }
      .error {
        margin: 10px 0 0;
        color: var(--error);
        font-size: 12px;
      }
      .card {
        display: flex;
        align-items: center;
        gap: 12px;
        width: min(100%, 420px);
        margin: 0 auto;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        text-align: left;
      }
      .card .text {
        flex: 1;
        min-width: 0;
      }
      .card .text strong {
        display: block;
        overflow: hidden;
        color: var(--ink);
        font-size: 13px;
        font-weight: 550;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .card .text span {
        display: block;
        overflow: hidden;
        color: var(--muted);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }
      .badge[data-ok="true"] {
        color: var(--ok);
        font-weight: 500;
      }
      .badge svg {
        width: 14px;
        height: 14px;
      }
      .spinner {
        display: inline-block;
        width: 12px;
        height: 12px;
        margin-right: 6px;
        vertical-align: -1px;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .badge .spinner {
        margin-right: 0;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .rows {
        display: grid;
        align-content: start;
        min-height: 0;
        overflow-y: auto;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        text-align: left;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 0;
      }
      .row + .row {
        border-top: 1px solid var(--line);
      }
      .row .text {
        flex: 1;
        min-width: 0;
      }
      .row strong {
        display: block;
        color: var(--ink);
        font-size: 13px;
        font-weight: 550;
      }
      .row span.sub {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }
      .folders {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 6px;
      }
      .folders span {
        max-width: 200px;
        padding: 2px 6px;
        overflow: hidden;
        border-radius: 4px;
        background: var(--field);
        color: #52524b;
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      body:not([data-platform="darwin"]) .mac-only {
        display: none;
      }
      .row .badge {
        flex: none;
      }
      [hidden] {
        display: none !important;
      }
      .row span.sub[data-warn="true"] {
        color: var(--error);
      }
      .row select {
        flex: none;
        height: 30px;
        padding: 0 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--ink);
        font: inherit;
        font-size: 12px;
      }
      .switch {
        position: relative;
        flex: none;
        width: 34px;
        height: 20px;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: #dbdcd5;
        transition: background 0.2s;
      }
      .switch::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .switch[aria-checked="true"] {
        background: var(--ink);
      }
      .switch[aria-checked="true"]::after {
        transform: translateX(14px);
      }
      .switch:hover:not(:disabled) {
        background: #c4c4bc;
      }
      .switch[aria-checked="true"]:hover:not(:disabled) {
        background: #41413b;
      }
      .switch:disabled {
        opacity: 0.5;
      }

      footer.actions {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: auto;
        padding-top: 18px;
      }
      button,
      select {
        font: inherit;
        cursor: pointer;
      }
      button:disabled,
      button[aria-disabled="true"],
      select:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
      }
      .primary,
      .ghost,
      .secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid #dbdcd5;
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        font-size: 13px;
        font-weight: 470;
        white-space: nowrap;
        transition:
          background-color 140ms ease,
          transform 100ms ease;
      }
      .primary,
      .ghost {
        min-height: 36px;
        padding: 6px 15px;
      }
      .primary {
        min-width: 112px;
        border-color: var(--ink);
        background: var(--ink);
        color: #fff;
      }
      .primary:hover:not(:disabled) {
        background: #41413b;
      }
      .ghost:hover:not(:disabled),
      .secondary:hover:not(:disabled) {
        background: #f4f4f5;
      }
      .primary:active:not(:disabled),
      .ghost:active:not(:disabled),
      .secondary:active:not(:disabled) {
        transform: translateY(1px);
      }
      .primary svg {
        width: 14px;
        height: 14px;
      }
      .secondary {
        min-height: 28px;
        padding: 3px 10px;
        font-size: 12px;
      }
      .link {
        padding: 6px;
        border: 0;
        border-radius: 4px;
        background: none;
        color: #414038;
        font-size: 12px;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .link:hover:not(:disabled) {
        background: #f4f4f5;
      }

      /* Quick Install: one button, the options folded away behind it. */
      main {
        position: relative;
      }
      section[data-step="welcome"],
      section[data-step="installing"],
      section[data-step="ready"] {
        /* A long error scrolls instead of pushing the title into the scene. */
        justify-content: safe center;
        overflow-y: auto;
        padding-bottom: 40px;
      }
      section[data-step="welcome"] {
        padding-bottom: 0;
      }
      section[data-step="welcome"] .eyebrow {
        margin-top: auto;
      }
      h1 {
        margin-bottom: 8px;
        font-size: 26px;
        font-weight: 600;
        line-height: 34px;
        letter-spacing: -0.022em;
      }
      .lead {
        font-size: 13.5px;
        letter-spacing: -0.003em;
      }
      .lead.tight {
        margin-bottom: 0;
      }
      /* Customizing makes room for the options. */
      section[data-customizing="true"] {
        padding-bottom: 0;
      }
      section[data-customizing="true"] h1 {
        margin-bottom: 2px;
        font-size: 22px;
        line-height: 28px;
      }
      section[data-customizing="true"] .lead {
        font-size: 12.5px;
      }
      section[data-customizing="true"] .eyebrow,
      section[data-customizing="true"] .plan-line .sep,
      section[data-customizing="true"] #plan-summary,
      section[data-customizing="true"] #plan-featured-badge,
      section[data-customizing="true"] .spotlight-card {
        display: none;
      }
      section[data-customizing="true"] .start {
        padding-top: 10px;
      }
      section[data-customizing="true"] .primary.large {
        min-height: 40px;
      }
      section[data-customizing="true"] .plan-line {
        margin-top: 6px;
      }
      .eyebrow {
        display: inline-flex;
        align-self: center;
        align-items: center;
        gap: 6px;
        margin-bottom: 10px;
        padding: 3px 10px 3px 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.8);
        color: #5f5e55;
        font-size: 11.5px;
        font-weight: 500;
        letter-spacing: 0.01em;
      }
      .eyebrow svg {
        width: 12px;
        height: 12px;
        stroke-width: 2;
      }
      .start {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 16px;
      }
      .primary.large {
        position: relative;
        min-width: 232px;
        min-height: 44px;
        padding: 0 22px;
        overflow: hidden;
        border: 0;
        border-radius: 12px;
        background: linear-gradient(180deg, #2f2f2c 0%, #1b1b19 100%);
        box-shadow:
          0 0 0 1px rgba(20, 20, 16, 0.9),
          0 1px 2px rgba(20, 20, 16, 0.2),
          0 10px 24px -12px rgba(20, 20, 16, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.12);
        font-size: 14px;
        font-weight: 550;
        letter-spacing: -0.006em;
        transition:
          box-shadow 200ms ease,
          transform 200ms var(--ease);
      }
      .primary.large:hover:not(:disabled) {
        background: linear-gradient(180deg, #353532 0%, #1f1f1d 100%);
        box-shadow:
          0 0 0 1px rgba(20, 20, 16, 0.9),
          0 2px 4px rgba(20, 20, 16, 0.2),
          0 16px 30px -14px rgba(20, 20, 16, 0.6),
          inset 0 1px 0 rgba(255, 255, 255, 0.14);
        transform: translateY(-1px);
      }
      .primary.large:active:not(:disabled) {
        transform: translateY(0);
      }
      .primary.large svg {
        width: 15px;
        height: 15px;
        stroke-width: 2;
        transition: transform 240ms var(--ease);
      }
      .primary.large:hover:not(:disabled) svg {
        transform: translateX(2px);
      }
      /* Checking this computer: the button waits with what it is doing. */
      .primary.large[data-busy="true"] {
        opacity: 0.8;
        cursor: progress;
      }
      .primary.large[data-busy="true"] svg {
        display: none;
      }
      /* What Quick Install does, and the way to change it. */
      .plan-line {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 4px 6px;
        margin-top: 11px;
        color: var(--faint);
        font-size: 11.5px;
      }
      .featured-pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 1px 6px;
        border: 1px solid #eed9bc;
        border-radius: 999px;
        background: #fbf4ea;
        color: #8f4f10;
        font-size: 10px;
        font-weight: 550;
        line-height: 1.4;
        white-space: nowrap;
      }
      .featured-pill::before {
        content: "";
        flex: none;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #d9822b;
      }
      .spotlight-card {
        width: min(100%, 468px);
        margin: 12px auto 0;
        padding: 8px 12px;
        border: 1px solid #e8e5dc;
        border-radius: 12px;
        background: linear-gradient(180deg, #fcfcfa 0%, #f7f5ef 100%);
        text-align: left;
      }
      .spotlight-card[data-recommended="true"] {
        border-color: #e6d2b5;
        background: linear-gradient(180deg, #fffdf9 0%, #fbf6ee 100%);
      }
      .spotlight-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .spotlight-title {
        display: inline-flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
        min-width: 0;
      }
      .spotlight-title strong {
        color: var(--ink);
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: -0.008em;
      }
      .spotlight-specs {
        margin: 3px 0 0;
        color: #52524b;
        font-size: 11.5px;
        line-height: 1.4;
      }
      .spotlight-note {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.4;
      }
      .spotlight-link {
        flex: none;
        padding: 2px 6px;
        border: 0;
        border-radius: 6px;
        background: none;
        color: #52524b;
        font-size: 11.5px;
        font-weight: 500;
        white-space: nowrap;
        text-decoration: underline;
        text-decoration-color: #d4d4cd;
        text-underline-offset: 3px;
        transition:
          background-color 140ms ease,
          color 140ms ease,
          text-decoration-color 140ms ease;
      }
      .spotlight-link:hover:not(:disabled) {
        background: rgba(20, 20, 16, 0.05);
        color: var(--ink);
        text-decoration-color: var(--ink);
      }
      .plan-why {
        max-width: 440px;
        margin-top: 4px;
        color: var(--faint);
        font-size: 11.5px;
        line-height: 1.45;
        font-variant-numeric: tabular-nums;
      }
      /* What downloads now, or what a long step waits on, under the
         installing bar. */
      .transfer {
        display: grid;
        gap: 2px;
        margin: 10px 0 0;
        color: var(--faint);
        font-size: 11.5px;
        line-height: 1.45;
        font-variant-numeric: tabular-nums;
      }
      .transfer span span {
        white-space: nowrap;
      }
      .transfer strong {
        color: var(--ink);
        font-weight: 500;
      }
      .plan-line .sep {
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #d4d4cd;
      }
      .link.quiet {
        padding: 2px 4px;
        color: #52524b;
        font-weight: 500;
        text-decoration-color: #d4d4cd;
        transition:
          color 140ms ease,
          text-decoration-color 140ms ease;
      }
      .link.quiet:hover:not(:disabled) {
        background: none;
        color: var(--ink);
        text-decoration-color: var(--ink);
      }
      .fold {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: 0fr;
        width: min(100%, 448px);
        margin: 0 auto;
        opacity: 0;
        transition:
          grid-template-rows 420ms var(--ease),
          opacity 280ms ease,
          margin 420ms var(--ease);
      }
      .fold[data-open="true"] {
        grid-template-rows: 1fr;
        margin: 8px auto 0;
        opacity: 1;
      }
      .fold > div {
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        padding: 0 4px 4px;
      }
      .fold[data-open="true"] > div {
        overflow: visible;
      }
      .choice[hidden],
      .byok-box[hidden],
      .signin-byok[hidden] {
        display: none !important;
      }
      .byok-tip-btn {
        position: relative;
      }
      .byok-tooltip {
        position: absolute;
        bottom: calc(100% + 8px);
        right: 0;
        z-index: 30;
        width: 248px;
        padding: 8px 10px;
        border-radius: 9px;
        background: #1f1f1d;
        color: #f7f7f4;
        font-size: 11.5px;
        font-weight: 450;
        line-height: 1.4;
        text-align: left;
        white-space: normal;
        box-shadow: 0 10px 24px -8px rgba(20, 20, 16, 0.45);
        opacity: 0;
        pointer-events: none;
        transform: translateY(3px);
        transition:
          opacity 150ms ease,
          transform 150ms ease;
      }
      .byok-tip-btn:hover .byok-tooltip,
      .byok-tip-btn:focus-visible .byok-tooltip {
        opacity: 1;
        transform: translateY(0);
      }
      .choice.byok-box {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
      .byok-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .byok-row label {
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
      }
      /* BYOK fields, built once by byokFields() for the setup form and the
         sign-in dialog: the base URL and two optional comboboxes (path and
         endpoint) on one row, the key, then the model with List models and
         Test beside it, and one status line. */
      .byok-fields {
        display: grid;
        gap: 7px;
        font-size: 12px;
        text-align: left;
      }
      .byok-fields .ep {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 6px;
      }
      .byok-fields .ep-base-wrap,
      .byok-fields .ep > .cb,
      .byok-fields .cb.standalone,
      .byok-fields .byok-key {
        display: flex;
        align-items: center;
        min-width: 0;
        height: 30px;
        padding: 0 4px 0 10px;
        border: 1px solid #e2e2dc;
        border-radius: 8px;
        background: #fafaf8;
        transition:
          border-color 140ms ease,
          background-color 140ms ease;
      }
      .byok-fields .byok-key {
        width: 100%;
        padding-right: 10px;
        color: var(--ink);
        font: inherit;
        user-select: text;
        -webkit-user-select: text;
      }
      .byok-fields .ep-base-wrap:focus-within,
      .byok-fields .ep > .cb:focus-within,
      .byok-fields .cb.standalone:focus-within,
      .byok-fields .byok-key:focus {
        outline: none;
        border-color: var(--ink);
        background: #fff;
      }
      .ep-base,
      .cb-input {
        flex: 1 1 auto;
        width: 100%;
        min-width: 0;
        height: 100%;
        padding: 0;
        border: 0;
        outline: none;
        background: transparent;
        color: var(--ink);
        font: inherit;
        text-overflow: ellipsis;
        user-select: text;
        -webkit-user-select: text;
      }
      /* Path and endpoint boxes are as wide as their value; the base URL
         takes the rest of the row. */
      .ep > .cb .cb-input {
        field-sizing: content;
        width: auto;
        min-width: 1ch;
        max-width: 17ch;
      }
      .byok-fields input::placeholder {
        color: var(--faint);
      }
      .cb-input::placeholder {
        font-style: italic;
      }
      /* Grey: the default Linger fills in, which is still sent. */
      .cb[data-default="true"] .cb-input {
        color: var(--filled);
      }
      .cb[data-default="true"] .cb-input:focus {
        color: #77766c;
      }

      /* Combobox: type anything, or pick from the list. */
      .cb {
        position: relative;
      }
      .cb-caret {
        display: grid;
        flex: none;
        place-items: center;
        width: 20px;
        height: 20px;
        padding: 0;
        border: 0;
        border-radius: 5px;
        background: none;
        color: var(--faint);
      }
      .cb-caret:hover:not(:disabled),
      .cb[data-open="true"] .cb-caret {
        background: rgba(20, 20, 16, 0.06);
        color: var(--muted);
      }
      .cb-menu {
        position: absolute;
        top: calc(100% + 5px);
        left: -1px;
        z-index: 30;
        display: grid;
        gap: 1px;
        min-width: calc(100% + 2px);
        width: max-content;
        max-width: min(320px, 86vw);
        max-height: 252px;
        overflow-y: auto;
        padding: 4px;
        border: 1px solid rgba(20, 20, 16, 0.08);
        border-radius: 11px;
        background: #fff;
        box-shadow: 0 16px 36px -14px rgba(20, 20, 16, 0.35);
        font-size: 12px;
        line-height: 1.4;
        cursor: default;
        animation: menu-in 160ms var(--ease);
      }
      .cb-menu[hidden] {
        display: none;
      }
      .ep > .cb .cb-menu {
        left: auto;
        right: -1px;
      }
      @keyframes menu-in {
        from {
          opacity: 0;
          transform: translateY(-3px);
        }
      }
      .cb-menu [role="option"] {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 16px;
        align-items: center;
        gap: 1px 10px;
        padding: 6px 8px;
        border: 0;
        border-radius: 7px;
        background: none;
        text-align: left;
      }
      .cb-menu [role="option"]:hover,
      .cb-menu [role="option"]:focus-visible {
        background: #f4f4f0;
        outline: none;
      }
      .opt-main {
        color: var(--ink);
        font: 500 12px var(--mono);
        overflow-wrap: anywhere;
      }
      .opt-label {
        grid-column: 1;
        color: var(--muted);
        font-size: 11.5px;
      }
      .opt-label em {
        margin-left: 6px;
        color: #d9822b;
        font-style: normal;
        font-weight: 500;
      }
      .opt-check {
        grid-column: 2;
        grid-row: 1 / span 2;
        visibility: hidden;
        color: var(--ink);
      }
      [aria-selected="true"] > .opt-check {
        visibility: visible;
      }
      .cb-head {
        padding: 5px 8px 3px;
        color: var(--faint);
        font-size: 11px;
        font-weight: 500;
      }
      .cb-note {
        max-width: 300px;
        padding: 7px 8px;
        color: var(--muted);
        font-size: 11.5px;
        overflow-wrap: anywhere;
      }
      .cb-note[data-tone="err"] {
        color: var(--error);
      }

      /* The model box, with List models and Test beside it; the test
         result floats under Test. */
      .model-row {
        position: relative;
        display: flex;
        gap: 6px;
      }
      .model-row > .cb {
        flex: 1;
      }
      .model-row > .change {
        height: 30px;
      }
      .model-row > .list-btn {
        display: grid;
        place-items: center;
        width: 30px;
        padding: 0;
        color: var(--muted);
      }
      .model-row > .list-btn:hover:not(:disabled) {
        color: var(--ink);
      }
      .list-btn[data-busy="true"] svg {
        animation: spin 0.9s linear infinite;
      }
      .byok-toast {
        position: absolute;
        top: calc(100% + 9px);
        right: 0;
        z-index: 40;
        display: grid;
        grid-template-columns: 16px minmax(0, 1fr) 20px;
        align-items: start;
        gap: 8px;
        width: min(330px, 100%);
        padding: 10px 8px 10px 12px;
        border-radius: 10px;
        background: #1f1f1d;
        color: #c9c8bf;
        box-shadow: 0 14px 32px -10px rgba(20, 20, 16, 0.5);
        font-size: 12px;
        line-height: 1.45;
        text-align: left;
        user-select: text;
        -webkit-user-select: text;
        animation: toast-in 180ms var(--ease);
      }
      .byok-toast[hidden] {
        display: none;
      }
      .byok-toast::before {
        content: "";
        position: absolute;
        top: -4px;
        right: 22px;
        width: 9px;
        height: 9px;
        border-radius: 2px;
        background: inherit;
        transform: rotate(45deg);
      }
      .byok-toast[data-leaving="true"] {
        animation: toast-out 200ms ease forwards;
      }
      @keyframes toast-in {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
      }
      @keyframes toast-out {
        to {
          opacity: 0;
          transform: translateY(-4px);
        }
      }
      /* Over the setup form's own .choice strong. */
      .byok-fields .byok-toast strong {
        display: block;
        color: #fff;
        font-size: 12.5px;
        font-weight: 550;
      }
      .byok-toast .url {
        color: #ecebe3;
      }
      .toast-icon {
        display: grid;
        margin-top: 1px;
      }
      .byok-toast[data-tone="ok"] .toast-icon {
        color: #74d08b;
      }
      .byok-toast[data-tone="err"] .toast-icon {
        color: #ff9466;
      }
      .toast-close {
        display: grid;
        place-items: center;
        width: 20px;
        height: 20px;
        padding: 0;
        border: 0;
        border-radius: 5px;
        background: none;
        color: #8f8e85;
      }
      .toast-close:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
      }
      .byok-status {
        color: var(--faint);
        font-size: 11.5px;
        line-height: 1.4;
        overflow-wrap: anywhere;
      }
      .byok-status[data-tone="err"] {
        color: var(--error);
      }
      .byok-status .url {
        color: var(--muted);
      }
      .byok-status[data-tone] .url {
        color: inherit;
      }
      .byok-fields .url {
        font-family: var(--mono);
        font-size: 0.95em;
        overflow-wrap: anywhere;
      }
      .choice.optional-keys {
        display: block;
      }
      .choice.optional-keys summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
        list-style: none;
      }
      .choice.optional-keys summary::-webkit-details-marker {
        display: none;
      }
      .choice.optional-keys[open] summary {
        margin-bottom: 8px;
        color: var(--ink);
      }
      .choices,
      .panel {
        border: 1px solid rgba(20, 20, 16, 0.07);
        border-radius: 16px;
        background: #fff;
        box-shadow:
          0 1px 2px rgba(20, 20, 16, 0.04),
          0 12px 32px -18px rgba(20, 20, 16, 0.22);
        text-align: left;
      }
      .choices {
        padding: 2px 16px;
      }
      .choice {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 5px 0;
      }
      .choice + .choice {
        border-top: 1px solid #f1f1ee;
      }
      .choice .text {
        flex: 1;
        min-width: 0;
      }
      .choice strong {
        display: block;
        color: var(--ink);
        font-size: 13px;
        font-weight: 550;
        letter-spacing: -0.005em;
      }
      .choice .sub {
        display: block;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .seg {
        position: relative;
        display: flex;
        flex: none;
        padding: 2px;
        border-radius: 9px;
        background: #f1f1ee;
        box-shadow: inset 0 0 0 1px rgba(20, 20, 16, 0.04);
      }
      .seg button {
        position: relative;
        z-index: 1;
        min-width: 56px;
        height: 26px;
        padding: 0 10px;
        border: 0;
        border-radius: 7px;
        background: none;
        color: #6b6a60;
        font-size: 12px;
        font-weight: 500;
        transition: color 160ms ease;
      }
      .seg button:hover:not(:disabled) {
        color: var(--ink);
      }
      /* The localmodels tool's pick for this computer. */
      .seg button[data-recommended="true"]::after {
        content: "";
        position: absolute;
        top: 4px;
        right: 4px;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #d9822b;
      }
      .seg button[aria-checked="true"] {
        color: var(--ink);
        cursor: default;
      }
      .seg .knob {
        position: absolute;
        z-index: 0;
        top: 2px;
        left: 0;
        height: 26px;
        border-radius: 7px;
        background: #fff;
        box-shadow:
          0 1px 2px rgba(20, 20, 16, 0.12),
          0 0 0 0.5px rgba(20, 20, 16, 0.08);
        transition:
          transform 320ms var(--ease),
          width 320ms var(--ease);
      }
      /* The local model: one card naming it and what it needs. */
      .choice.local {
        flex-wrap: wrap;
        row-gap: 6px;
      }
      .pick {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 1px;
        min-width: 0;
        padding: 6px 10px;
        border: 1px solid #e6e6e1;
        border-radius: 9px;
        background: #fff;
        text-align: left;
        transition:
          border-color 140ms ease,
          background-color 140ms ease;
      }
      .pick:hover:not(:disabled):not([aria-disabled="true"]) {
        border-color: #c4c4bc;
      }
      .pick[aria-checked="true"] {
        border-color: var(--ink);
        background: #fafaf8;
        box-shadow: inset 0 0 0 0.5px var(--ink);
      }
      .pick-head {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
        width: 100%;
      }
      .pick-name {
        color: var(--ink);
        font-size: 12px;
        font-weight: 550;
      }
      .pick small {
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
      }
      .local-spotlight {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 5px 9px;
        border: 1px solid #eceae2;
        border-radius: 8px;
        background: #faf9f5;
        color: #52524b;
        font-size: 11px;
        line-height: 1.35;
      }
      .local-spotlight[data-recommended="true"] {
        border-color: #e6d2b5;
        background: #fbf6ee;
      }
      .local-spotlight span {
        flex: 1;
        min-width: 0;
      }
      /* Opens the system folder picker. */
      .change {
        flex: none;
        height: 28px;
        padding: 0 12px;
        border: 1px solid #e6e6e1;
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        font-size: 12px;
        font-weight: 500;
        transition:
          border-color 140ms ease,
          background-color 140ms ease;
      }
      .change:hover:not(:disabled) {
        border-color: #c4c4bc;
        background: #fafaf8;
      }
      .change:active:not(:disabled) {
        background: #f1f1ee;
      }
      .choice .sub[data-warn="true"] {
        color: var(--error);
      }
      /* Provider keys: one line per provider under the row. */
      .choice.provider-keys {
        flex-wrap: wrap;
        row-gap: 6px;
      }
      .keys {
        width: 100%;
        display: grid;
        grid-template-columns: 64px 1fr auto auto;
        align-items: center;
        gap: 6px 8px;
      }
      .keys label {
        color: #5f5e55;
        font-size: 12px;
        font-weight: 500;
      }
      .keys input {
        min-width: 0;
        height: 28px;
        padding: 0 10px;
        border: 1px solid #e6e6e1;
        border-radius: 8px;
        outline: none;
        background: #fff;
        color: var(--ink);
        font: inherit;
        font-size: 12px;
        user-select: text;
        -webkit-user-select: text;
        transition: border-color 140ms ease;
      }
      .keys input:focus {
        border-color: var(--ink);
      }
      .keys-note {
        width: 100%;
        margin: 0;
        color: var(--muted);
        font-size: 11.5px;
      }
      .team {
        margin: auto 0 0;
        padding-top: 10px;
        color: var(--faint);
        font-size: 12px;
      }
      .team .link {
        padding: 2px 4px;
        color: var(--muted);
        text-decoration-color: #d4d4cd;
      }

      /* Installing: one panel with the bar and a short stepper. */
      .panel {
        width: 380px;
        margin: 26px auto 0;
        padding: 20px 22px 18px;
      }
      .now {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        color: var(--ink);
        font-size: 13px;
        font-weight: 500;
        letter-spacing: -0.005em;
      }
      .now .pct {
        color: var(--ink);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      .track {
        position: relative;
        height: 4px;
        margin-top: 12px;
        overflow: hidden;
        border-radius: 999px;
        background: #f0f0ec;
      }
      .fill {
        position: relative;
        width: 0;
        height: 100%;
        overflow: hidden;
        border-radius: inherit;
        background: linear-gradient(90deg, #4a4a45, #1b1b19);
        transition: width 900ms var(--ease);
      }
      /* A soft sheen shows the work goes on between updates. */
      .fill::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.45),
          transparent
        );
        transform: translateX(-100%);
        animation: sheen 1.8s ease-in-out infinite;
      }
      section[data-failed="true"] .fill {
        background: #c9c8c0;
      }
      section[data-failed="true"] .fill::after {
        display: none;
      }
      @keyframes sheen {
        to {
          transform: translateX(100%);
        }
      }
      .checks {
        position: relative;
        display: grid;
        gap: 12px;
        margin: 18px 0 0;
        padding: 16px 0 0;
        border-top: 1px solid #f1f1ee;
        list-style: none;
        color: var(--faint);
        font-size: 12.5px;
      }
      .checks li {
        position: relative;
        display: flex;
        align-items: center;
        gap: 12px;
        transition: color 240ms ease;
      }
      /* The line that joins the steps. */
      .checks li + li::before {
        content: "";
        position: absolute;
        left: 7.25px;
        bottom: calc(100% + 1px);
        width: 1.5px;
        height: 10px;
        border-radius: 1px;
        background: #ecece8;
        transition: background-color 240ms ease;
      }
      .checks li[data-state="done"] + li::before {
        background: var(--ink);
      }
      .checks li[data-state="now"] {
        color: var(--ink);
        font-weight: 500;
      }
      .checks li[data-state="done"] {
        color: #52524b;
      }
      .checks .time {
        margin-left: auto;
        color: var(--faint);
        font-size: 11.5px;
        font-weight: 400;
        font-variant-numeric: tabular-nums;
      }
      .dot {
        display: grid;
        flex: none;
        place-items: center;
        width: 16px;
        height: 16px;
        border: 1.5px solid #deded8;
        border-radius: 50%;
        background: #fff;
        transition:
          background-color 240ms ease,
          border-color 240ms ease;
      }
      .dot svg {
        width: 9px;
        height: 9px;
        stroke: #fff;
        stroke-width: 3;
        opacity: 0;
        transform: scale(0.6);
        transition:
          opacity 200ms ease,
          transform 260ms var(--ease);
      }
      [data-state="done"] .dot {
        border-color: var(--ink);
        background: var(--ink);
      }
      [data-state="done"] .dot svg {
        opacity: 1;
        transform: none;
      }
      [data-state="now"] .dot {
        border-color: var(--ink);
        border-right-color: transparent;
        animation: spin 0.9s linear infinite;
      }
      [data-state="failed"] .dot {
        border-color: var(--error);
      }
      .checks li[data-state="failed"] {
        color: var(--error);
      }
      /* After a failure the steps not reached make room for the error and
         what to do next. */
      section[data-failed="true"] .checks li[data-state=""] {
        display: none;
      }
      .problem {
        width: 380px;
        margin: 14px auto 0;
        padding: 10px 14px;
        border: 1px solid #f3dfd6;
        border-radius: 12px;
        background: #fdf6f3;
        color: var(--error);
        font-size: 12px;
        text-align: left;
        user-select: text;
        -webkit-user-select: text;
      }
      .problem:empty {
        display: none;
      }
      /* The whole message, line breaks kept; long ones fold behind
         "Show Details". */
      #installing-error {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      #installing-error.folded {
        max-height: 7.5em;
        overflow: hidden;
        mask-image: linear-gradient(#000 70%, transparent);
      }
      /* The AI runtime's own sign-in: a small dialog over the progress while
         the "signin" step waits. */
      .signin-modal {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        background: rgb(38 38 38 / 28%);
        animation: enter 0.18s ease-out;
      }
      .signin-modal[hidden],
      .signin-modal [hidden] {
        display: none;
      }
      .signin-modal .sheet {
        width: 340px;
        padding: 22px 22px 18px;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 18px 48px rgb(0 0 0 / 18%);
        font-size: 12px;
        text-align: left;
      }
      .signin-modal h2 {
        margin: 0 0 6px;
        color: var(--ink);
        font-size: 16px;
        font-weight: 600;
      }
      .signin-modal p {
        margin: 0 0 14px;
        color: var(--muted);
        line-height: 1.5;
      }
      .signin-modal .waiting {
        display: flex;
        align-items: center;
        margin-bottom: 4px;
        color: var(--ink);
      }
      .signin-modal .device-code strong {
        color: var(--ink);
        font:
          600 14px ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        letter-spacing: 0.08em;
        user-select: all;
        -webkit-user-select: all;
      }
      .signin-modal .problem {
        width: auto;
        margin: 0 0 14px;
      }
      .signin-modal .hint {
        color: var(--muted);
        font-size: 11.5px;
      }
      /* No browser opened: the link below is the way on. */
      .signin-modal .no-browser {
        padding: 8px 10px;
        border: 1px solid #f1e3c4;
        border-radius: 10px;
        background: #fdf9ef;
        color: #6b5413;
      }
      .signin-modal .device-code {
        margin-bottom: 12px;
      }
      .signin-modal .device-code p {
        margin: 0;
      }
      .signin-modal .copy-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 4px 0;
      }
      .signin-modal .copy-row strong {
        flex: 1;
      }
      .signin-modal .signin-link {
        margin-bottom: 12px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--field);
      }
      .signin-modal .signin-link .label {
        display: block;
        margin-bottom: 4px;
        color: var(--muted);
        font-size: 11px;
      }
      .signin-modal .signin-link code {
        display: block;
        overflow: hidden;
        margin-bottom: 8px;
        color: var(--ink);
        font: 11.5px var(--mono);
        white-space: nowrap;
        text-overflow: ellipsis;
        user-select: all;
        -webkit-user-select: all;
      }
      .signin-modal .signin-link .buttons {
        display: flex;
        gap: 8px;
      }
      .signin-modal .actions {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .signin-modal .actions .primary {
        width: 100%;
      }
      .signin-modal .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .signin-modal .runtimes {
        display: flex;
        gap: 8px;
        margin-top: 4px;
      }
      .signin-modal .runtimes button {
        flex: 1;
      }
      .signin-modal details {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
        color: var(--muted);
      }
      .signin-modal summary {
        width: max-content;
        cursor: pointer;
        list-style: none;
      }
      .signin-modal summary::-webkit-details-marker {
        display: none;
      }
      .signin-modal details p {
        margin: 8px 0;
      }
      .signin-modal details form {
        display: flex;
        gap: 8px;
      }
      .signin-modal details input {
        flex: 1;
        min-width: 0;
        padding: 5px 10px;
        border: 1px solid #dbdcd5;
        border-radius: 8px;
        font: inherit;
      }
      .signin-byok {
        display: grid;
        gap: 10px;
        margin-top: 8px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
      }
      /* The BYOK fields take the room they have on the setup form. */
      .signin-modal .sheet:has(.signin-byok:not([hidden])) {
        width: 448px;
      }
      .diagnostics {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 4px 10px;
        width: 380px;
        margin: 6px auto 0;
        font-size: 12px;
      }
      .diagnostics[hidden],
      .diagnostics [hidden] {
        display: none;
      }
      /* Send Diagnostics: consent, progress and the report id. */
      .send-modal .files {
        max-height: 132px;
        margin: 0 0 14px;
        padding: 8px 10px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        list-style: none;
        color: var(--muted);
        font:
          11px/1.6 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        overflow-wrap: anywhere;
      }
      .send-modal .track {
        margin: 0 0 14px;
      }
      .send-modal .fill {
        transition: width 200ms linear;
      }
      .send-modal .report strong {
        display: block;
        margin-top: 6px;
        color: var(--ink);
        font:
          600 16px ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        letter-spacing: 0.06em;
        user-select: all;
        -webkit-user-select: all;
      }
      .diagnostics output {
        flex-basis: 100%;
        color: #52524b;
        text-align: center;
        overflow-wrap: anywhere;
        user-select: text;
        -webkit-user-select: text;
      }

      /* Ready: the check draws itself, then a short receipt. */
      .mark {
        position: relative;
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        /* A tall receipt overflows the section; the circle must not shrink. */
        flex-shrink: 0;
        margin: 0 auto 18px;
        border-radius: 50%;
        background: linear-gradient(180deg, #2f2f2c, #1b1b19);
        box-shadow:
          0 0 0 6px #f4f4f0,
          0 14px 28px -14px rgba(20, 20, 16, 0.6);
      }
      section.active .mark {
        animation: pop 560ms var(--ease) both;
      }
      .mark svg {
        width: 22px;
        height: 22px;
        stroke: #fff;
        stroke-width: 2.4;
        stroke-dasharray: 24;
        stroke-dashoffset: 24;
      }
      section.active .mark svg {
        animation: draw 420ms 260ms var(--ease) forwards;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.7);
        }
      }
      @keyframes draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      .connected {
        display: flex;
        width: max-content;
        align-items: center;
        gap: 8px;
        margin: 18px auto 0;
        padding: 6px 12px;
        border: 1px solid #ecece7;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.8);
        color: var(--ink);
        font-size: 12px;
        font-weight: 500;
      }
      .connected .live {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--ok);
        box-shadow: 0 0 0 3px rgba(47, 158, 68, 0.15);
      }
      section.active .connected {
        animation: enter 420ms 120ms var(--ease) both;
      }
      /* The owner account of the finished install. */
      .account {
        width: 100%;
        max-width: 420px;
        margin: 18px auto 0;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.86);
        text-align: left;
      }
      .account-title {
        margin: 0 0 8px;
        color: var(--ink);
        font-size: 12.5px;
        font-weight: 600;
      }
      .account dl {
        display: grid;
        grid-template-columns: 64px 1fr auto auto;
        align-items: center;
        gap: 6px 8px;
        margin: 0;
      }
      .account dt {
        color: #5f5e55;
        font-size: 12px;
        font-weight: 500;
      }
      .account dd {
        min-width: 0;
        margin: 0;
        overflow: hidden;
        color: var(--ink);
        font-size: 12.5px;
        text-overflow: ellipsis;
        white-space: nowrap;
        user-select: text;
        -webkit-user-select: text;
      }
      .account dd.email {
        grid-column: 2 / -1;
      }
      .account dd.secret {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.02em;
      }
      .account-note {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 11.5px;
      }
      .account-note .link {
        padding: 2px 4px;
        font-size: 11.5px;
      }
      .account-error {
        margin: 0;
        color: var(--error);
        font-size: 12px;
      }
      section.active .account {
        animation: enter 420ms 160ms var(--ease) both;
      }
      /* The earlier Simplex app's data this install could not upgrade. */
      .legacy-note {
        width: 100%;
        max-width: 420px;
        margin: 12px auto 0;
        color: var(--muted);
        font-size: 12px;
        text-align: left;
        overflow-wrap: anywhere;
      }
      /* Confetti for a finished install, drawn over the whole window. */
      #confetti {
        position: fixed;
        inset: 0;
        z-index: 50;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      section[data-step="ready"] .start {
        padding-top: 22px;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>

    <script>
      const setup = window.lingerSetup;
      const $ = (id) => document.getElementById(id);
      // The steps of connecting to a team server.
      const ORDER = ["server", "signin", "connect", "permissions"];
      const check = '<svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>';
      let state;
      let step;
      // The one action in flight; every control waits for it.
      let pending = null;
      // Whether the full failure message is unfolded.
      let detailsOpen = false;
      let shownDiagnostics;

      // What each macOS permission is for, and what goes wrong without it.
      const PERMISSIONS = {
        "full-disk": { about: "fullDiskAbout", missing: "fullDiskMissing" },
        folders: { about: "userFoldersAbout", missing: "userFoldersMissing" },
        automation: { about: "automationAbout", missing: "automationMissing" },
      };

      // What Install sets up; Quick Install keeps the defaults.
      const RUNTIMES = {
        recommended: "",
        codex: "Codex",
        claude: "Claude Code",
        pi: "Pi",
      };
      // The installing steps, as the main process reports them; it says
      // which of them this installation shows.
      const ALL_STEPS = [
        ["prepare", () => t("stepPrepare")],
        // A version is an identifier, so its digits stay as they are.
        [
          "download",
          () => t("stepDownload", { version: String(state.version) }),
        ],
        ["services", () => t("stepServices")],
        ["workspace", () => t("stepWorkspace")],
        [
          "signin",
          () => {
            const runtime = RUNTIMES[state.localServer.signIn?.runtime];
            return runtime
              ? t("stepSignIn", { runtime })
              : t("stepSignInRuntime");
          },
        ],
        ["connect", () => t("stepConnect")],
        ["agents", () => t("stepAgents")],
      ];
      const gigabytes = (bytes) => Math.round(bytes / 1024 ** 3) + " GB";
      // Download sizes: MB below a gigabyte, one decimal GB above.
      const size = (bytes) =>
        bytes < 1024 ** 3
          ? Math.max(0, Math.round(bytes / 1024 ** 2)) + " MB"
          : (bytes / 1024 ** 3).toFixed(1) + " GB";
      const duration = (seconds) => {
        const minutes = Math.round(seconds / 60);
        if (minutes < 1) return t("lessThanMinuteLeft");
        if (minutes < 60) return t("minutesLeft", { minutes });
        const hours = Math.floor(minutes / 60);
        return minutes % 60
          ? t("hoursMinutesLeft", { hours, minutes: minutes % 60 })
          : t("hoursLeft", { hours });
      };
      // A download as the localmodels tool or the installer counts it: how
      // much of how much, what remains, and the rate and time left when the
      // source reports a rate. A count of one file of several says only
      // that file's bytes, since nothing says what remains after it.
      const transferParts = (transfer) => {
        const { completed, total, bytesPerSecond: rate, partial } = transfer;
        const left = total && !partial ? total - completed : undefined;
        const amount = total
          ? t("amountOf", { done: size(completed), total: size(total) })
          : size(completed);
        return [
          partial ? t("thisFile", { amount }) : amount,
          left !== undefined && t("amountLeft", { size: size(left) }),
          rate > 0 && size(rate) + "/s",
          rate > 0 && left !== undefined && duration(left / rate),
        ].filter(Boolean);
      };
      // Long folders keep their start and their end.
      const shortPath = (value) =>
        value.length <= 46
          ? value
          : value.slice(0, 18) + "…" + value.slice(-27);
      // Where to install instead, when the installer refused the location
      // because another account could rename a folder on the way to it; the
      // message, shown below, says why. A folder directly on the drive is
      // refused for the drive's own permissions, which choosing the drive
      // again would not change, so that case gets no hint.
      const locationHint = (local) => {
        const [, drive] =
          /^([A-Za-z]:\\)[^\\]+\\[^\\]/.exec(local.location.path) ?? [];
        return drive &&
          local.refusal?.code === "WINDOWS_PRIVATE_PATH_UNSAFE" &&
          local.refusal.reason === "UNSAFE_PARENT_ACCESS"
          ? t("locationHint", { folder: drive + "Linger" })
          : "";
      };
      // Why the installation stopped: in the page's words when the main
      // process names the reason, else the message it passed on.
      const failureText = (local) =>
        local.failure === "runtime_lookup_timed_out"
          ? t("runtimeLookupTimedOut")
          : local.failure === "runtime_lookup_unreachable"
            ? t("runtimeLookupUnreachable")
            : local.message;
      // Quick Install installs what the localmodels tool recommends for this
      // computer once it has checked; until then (or when it cannot check)
      // the installer picks. The tool's local-models pick runs through Pi,
      // so it implies Pi.
      const defaults = () => {
        const models = state.localServer.localModels;
        const pick = models.state === "checked" && models.recommendation;
        if (pick === "local-models" && models.eligible && models.model)
          return { source: "local", runtime: "pi", localModel: true };
        if (pick === "codex" || pick === "claude")
          return { source: "subscription", runtime: pick, localModel: false };
        return {
          source: "subscription",
          runtime: "recommended",
          localModel: false,
        };
      };
      let plan;
      // Whether the person changed the plan; until then it follows defaults().
      let picked = false;
      let pickedAutoBeforeCheck = false;
      let customizing = false;
      // BYOK. Requests go to the base URL + path + endpoint, used verbatim;
      // path and endpoint are optional, and a grey value is the default that
      // is sent. The wire format follows the end of that address, else the
      // runtime's own, so Bifrost passes the runtime's requests through.
      // Nothing probes: Test sends one request to that one address.
      // Keep these format endings, runtime defaults and path validation in
      // sync with packages/service-kit/src/byok-endpoint.ts (source of truth).
      const BYOK_FORMATS = {
        "openai-chat": {
          suffix: "/chat/completions",
          label: "OpenAI Chat Completions",
        },
        "openai-responses": { suffix: "/responses", label: "OpenAI Responses" },
        anthropic: { suffix: "/messages", label: "Anthropic Messages" },
      };
      const RUNTIME_FORMATS = {
        claude: "anthropic",
        codex: "openai-responses",
        pi: "openai-chat",
      };
      const DEFAULT_PATH = "/v1";
      const PATH_OPTIONS = [
        { value: "/v1", label: t("pathMostProviders") },
        { value: "/api/paas/v4", label: t("pathZhipu") },
        { value: "/api/v3", label: t("pathVolcano") },
        { value: "/v1beta/openai", label: "Gemini" },
        { value: "", label: t("pathNone") },
      ];
      const ENDPOINT_OPTIONS = [
        ...Object.values(BYOK_FORMATS).map((format) => ({
          value: format.suffix,
          label: format.label,
        })),
        { value: "", label: t("endpointNone") },
      ];
      // What the installer accepts as a path or endpoint: empty, or whole
      // segments, so neither can change the base URL's host.
      const BYOK_URL_PATH = /^(\/[^/?#\s\\]+)*$/;
      const ICONS = {
        refresh:
          '<svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 6.4A5.3 5.3 0 0 0 3.4 4.6M2.8 9.6a5.3 5.3 0 0 0 9.8 1.8M3.2 2.2v2.6h2.6M12.8 13.8v-2.6h-2.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        chevron:
          '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2.5 3.8 5 6.3l2.5-2.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        selected:
          '<svg class="opt-check" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="m3.5 8.5 3 3 6-7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        ok: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m5.2 8.2 1.9 1.9 3.7-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        err: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 4.6v4.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11.2" r="0.9" fill="currentColor"/></svg>',
        close:
          '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="m2 2 6 6M8 2 2 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
      };
      const esc = (value) =>
        String(value).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const urlHtml = (url) => '<span class="url">' + esc(url) + "</span>";
      // A message with <url> spans, as HTML for the places that build it.
      const tHtml = (name, values) =>
        tSpans(name, values)
          .map((node) =>
            typeof node === "string" ? esc(node) : node.outerHTML,
          )
          .join("");
      const contextLabel = (tokens) =>
        tokens >= 1024 ** 2
          ? Math.round((tokens / 1024 ** 2) * 10) / 10 + "M"
          : Math.round(tokens / 1024) + "k";
      // A typed path gains its leading slash and loses trailing ones.
      const normalizePath = (value) => {
        const trimmed = value.trim().replace(/\/+$/, "");
        return trimmed && !trimmed.startsWith("/") ? "/" + trimmed : trimmed;
      };
      // An IPC error's own message, without Electron's prefix.
      const ipcMessage = (error) =>
        String(error?.message ?? error).replace(
          /^Error invoking remote method '[^']+': (Error: )?/,
          "",
        );
      // Asks the main process to test or list an endpoint. The answer comes
      // back in the state the command returns; nothing else waits for it.
      const byokAsk = async (command, field) => {
        try {
          state = await setup.run(command);
          return (
            state.localServer[field] ?? {
              state: "failed",
              message: t("noAnswer"),
            }
          );
        } catch (error) {
          return { state: "failed", message: ipcMessage(error) };
        }
      };

      // A combobox: type anything, or pick a suggestion from its list.
      const combos = [];
      const closeCombos = () => {
        for (const combo of combos) combo.open = false;
      };
      const combobox = (root, cfg) => {
        root.classList.add("cb");
        root.innerHTML = `
          <input class="cb-input" id="${cfg.id}" role="combobox"
            aria-autocomplete="none" aria-expanded="false"
            aria-controls="${cfg.id}-menu" autocomplete="off" spellcheck="false"
            placeholder="${esc(cfg.placeholder)}" aria-label="${esc(cfg.label)}" />
          <button type="button" class="cb-caret" tabindex="-1"
            aria-label="${esc(t("showSuggestions", { field: cfg.label }))}">${ICONS.chevron}</button>
          <div class="cb-menu" id="${cfg.id}-menu" role="listbox"
            aria-label="${esc(cfg.label)}" hidden></div>`;
        const input = root.querySelector(".cb-input");
        const caret = root.querySelector(".cb-caret");
        const menu = root.querySelector(".cb-menu");
        const combo = { root, input, open: false };
        let menuHtml = "";
        const openMenu = (focusFirst) => {
          closeCombos();
          combo.open = true;
          render();
          if (focusFirst)
            (
              menu.querySelector('[aria-selected="true"]') ||
              menu.querySelector("button")
            )?.focus();
        };
        input.addEventListener("input", () => {
          cfg.set(input.value);
          combo.open = false;
          render();
        });
        input.addEventListener("blur", () => {
          cfg.commit();
          render();
        });
        input.addEventListener("keydown", (event) => {
          if (event.key === "ArrowDown") {
            event.preventDefault();
            openMenu(true);
          } else if (event.key === "Enter") {
            // Commits the value; inside a form it does not submit it.
            event.preventDefault();
            cfg.commit();
            closeCombos();
            render();
          }
        });
        caret.addEventListener("mousedown", (event) => event.preventDefault());
        caret.addEventListener("click", () => {
          if (combo.open) {
            closeCombos();
            render();
          } else {
            openMenu(false);
            input.focus();
          }
        });
        menu.addEventListener("mousedown", (event) => event.preventDefault());
        menu.addEventListener("click", (event) => {
          const option = event.target.closest("[data-value]");
          if (!option) return;
          cfg.set(option.dataset.value);
          cfg.commit();
          closeCombos();
          render();
          input.focus();
        });
        menu.addEventListener("keydown", (event) => {
          if (event.key !== "ArrowDown" && event.key !== "ArrowUp") return;
          event.preventDefault();
          const options = [...menu.querySelectorAll("button")];
          const at = options.indexOf(document.activeElement);
          const step = event.key === "ArrowDown" ? 1 : -1;
          options[(at + step + options.length) % options.length]?.focus();
        });
        combo.sync = () => {
          const value = cfg.get();
          if (input.value !== value) input.value = value;
          root.dataset.default = String(Boolean(cfg.isDefault?.()));
          root.dataset.open = String(combo.open);
          input.setAttribute("aria-expanded", String(combo.open));
          menu.hidden = !combo.open;
          if (!combo.open) {
            menuHtml = "";
            return;
          }
          const option = (item) => `
            <button type="button" role="option" data-value="${esc(item.value)}"
              aria-selected="${item.value === value}">
              <span class="opt-main">${item.value ? esc(item.value) : "-"}</span>
              ${
                item.label || item.tag
                  ? `<span class="opt-label">${esc(item.label || "")}${
                      item.tag ? `<em>${esc(item.tag)}</em>` : ""
                    }</span>`
                  : ""
              }
              ${ICONS.selected}
            </button>`;
          // Notes are HTML their callers escaped.
          const html =
            (cfg.heading ? `<div class="cb-head">${cfg.heading}</div>` : "") +
            cfg
              .items()
              .map((item) =>
                item.note === undefined
                  ? option(item)
                  : `<div class="cb-note" data-tone="${item.tone || ""}">${item.note}</div>`,
              )
              .join("");
          if (html !== menuHtml) {
            menu.innerHTML = html;
            menuHtml = html;
          }
        };
        combos.push(combo);
        return combo;
      };

      // The BYOK fields, built once for the setup form and once for the
      // sign-in dialog. runtimeOf() names the runtime the endpoint serves,
      // which picks the default endpoint and format; changed() runs on every
      // edit.
      const byokForms = [];
      const byokFields = (root, prefix, runtimeOf, changed) => {
        root.innerHTML = `
          <div class="ep">
            <span class="ep-base-wrap"><input class="ep-base" id="${prefix}-url"
              type="url" autocomplete="off" spellcheck="false"
              aria-label="${esc(t("baseUrl"))}"
              placeholder="${esc(t("baseUrlPlaceholder"))}" /></span>
            <div></div>
            <div></div>
          </div>
          <input class="byok-key" id="${prefix}-key" type="password"
            autocomplete="off" spellcheck="false" aria-label="${esc(t("apiKey"))}"
            placeholder="${esc(t("apiKeyPlaceholder"))}" />
          <div class="model-row">
            <div class="standalone"></div>
            <button type="button" class="change list-btn" id="${prefix}-list"
              aria-label="${esc(t("listModels"))}" title="${esc(t("listModels"))}">${ICONS.refresh}</button>
            <button type="button" class="change test-btn" id="${prefix}-test">${esc(t("test"))}</button>
            <div class="byok-toast" id="${prefix}-toast" role="status"
              aria-live="polite" hidden></div>
          </div>
          <div class="byok-status" id="${prefix}-status" aria-live="polite"></div>`;
        const blank = () => ({
          baseUrl: "",
          path: DEFAULT_PATH,
          // null follows the runtime's default.
          endpoint: null,
          apiKey: "",
          modelId: "",
        });
        let f = blank();
        // The latest test and model listing; each sequence number drops an
        // answer to a request the fields have changed since.
        let check = null;
        let models = null;
        let checkSeq = 0;
        let modelSeq = 0;
        let toast = null;
        let toastTimer = 0;
        let toastShown = "";

        const defaultEndpoint = () =>
          BYOK_FORMATS[RUNTIME_FORMATS[runtimeOf()]].suffix;
        const endpointValue = () => f.endpoint ?? defaultEndpoint();
        const baseUrl = () => f.baseUrl.trim().replace(/\/+$/, "");
        const apiRoot = () => baseUrl() + normalizePath(f.path);
        const requestUrl = () => apiRoot() + normalizePath(endpointValue());
        const modelsUrl = () => apiRoot() + "/models";
        const format = () => {
          const url = requestUrl();
          for (const [protocol, { suffix }] of Object.entries(BYOK_FORMATS))
            if (url.endsWith(suffix)) return { protocol, fromUrl: true };
          return { protocol: RUNTIME_FORMATS[runtimeOf()], fromUrl: false };
        };
        const validParts = () =>
          [normalizePath(f.path), normalizePath(endpointValue())].every(
            (part) => part.length <= 256 && BYOK_URL_PATH.test(part),
          );
        const addressed = () => baseUrl() !== "" && validParts();
        const complete = () => addressed() && f.modelId.trim() !== "";
        const endpoint = () => {
          const apiKey = f.apiKey.trim();
          return {
            baseUrl: baseUrl(),
            path: normalizePath(f.path),
            endpoint: normalizePath(endpointValue()),
            protocol: format().protocol,
            ...(apiKey ? { apiKey } : {}),
          };
        };

        // The test result floats under Test: a success fades on its own, a
        // failure stays until dismissed or the fields change.
        const showToast = () => {
          clearTimeout(toastTimer);
          toast = { leaving: false };
          if (check?.state === "ready")
            toastTimer = setTimeout(hideToast, 3500);
        };
        const hideToast = () => {
          clearTimeout(toastTimer);
          if (!toast || toast.leaving) return;
          toast.leaving = true;
          render();
          toastTimer = setTimeout(() => {
            toast = null;
            render();
          }, 200);
        };
        const resetResults = (all) => {
          checkSeq += 1;
          check = null;
          clearTimeout(toastTimer);
          toast = null;
          if (all) {
            modelSeq += 1;
            models = null;
          }
        };
        const edit = (next, all) => {

        const base = root.querySelector(".ep-base");

        const [pathBox, endpointBox] = root.querySelectorAll(".ep > div");

          id: prefix + "-path",

          heading: esc(t("pathHeading")),

          get: () => f.path,

          const answer = await byokAsk(
            { op: "local.byok.check", byok: form.config() },

        toastEl.addEventListener("click", (event) => {
          if (event.target.closest(".toast-close")) hideToast();

        toastEl.addEventListener("mouseenter", () => clearTimeout(toastTimer));
        toastEl.addEventListener("mouseleave", () => {

        });
        const status = root.querySelector(".byok-status");

        const form = {
          root,
          complete,
          modelId: () => f.modelId.trim(),
          config: () => ({
            ...endpoint(),
            modelId: f.modelId.trim(),
            runtime: runtimeOf(),
          }),
          // The runtime changed: its default endpoint and format may differ.
          runtimeChanged: () => resetResults(false),
          clearKey: () => {
            f = { ...f, apiKey: "" };
            key.value = "";
          },
          reset: () => {
            f = blank();
            resetResults(true);
          },
          // A click outside the toast and Test dismisses it.
          dismiss: (target) => {
            if (toast && !toastEl.contains(target) && !test.contains(target))
              hideToast();
          },
          sync: (busy) => {
            if (base.value !== f.baseUrl) base.value = f.baseUrl;
            if (key.value !== f.apiKey) key.value = f.apiKey;
            path.sync();
            endpointCombo.sync();
            modelCombo.sync();
            const checking = check?.state === "checking";
            const listing = models?.state === "loading";

              "aria-label",

            test.textContent = t(checking ? "testing" : "test");

            toastEl.hidden = !shown;
            if (shown) {
              const ok = check.state === "ready";
              toastEl.dataset.tone = ok ? "ok" : "err";
              toastEl.dataset.leaving = String(toast.leaving);
              const html = `
                <span class="toast-icon">${ok ? ICONS.ok : ICONS.err}</span>
                <div>
                  <strong>${esc(t(ok ? "connected" : "couldNotConnect"))}</strong>
                  <div>${
                    ok
                      ? `${esc(check.modelId)} · ${esc(t("contextSize", { size: contextLabel(check.contextWindow) }))} · ${BYOK_FORMATS[check.protocol].label}<br />${urlHtml(check.url)}`
                      : esc(check.message)

                </div>
                <button type="button" class="toast-close" aria-label="${esc(t("dismiss"))}">${ICONS.close}</button>`;
              if (html !== toastShown) {
                toastEl.innerHTML = html;
                toastShown = html;
              }
            }
            let line;
            if (!validParts())
              line = { tone: "err", html: esc(t("invalidParts")) };
            else if (models?.state === "failed")
              line = { tone: "err", html: esc(models.message) };
            else if (listing)
              line = { html: tHtml("listingFrom", { url: modelsUrl() }) };
            else if (!baseUrl()) line = { html: esc(t("greyDefaults")) };
            else {
              const { protocol, fromUrl } = format();
              const values = {
                format: BYOK_FORMATS[protocol].label,
                runtime: RUNTIMES[runtimeOf()],
                url: requestUrl(),
              };
              line = {
                html: tHtml(fromUrl ? "sendsTo" : "sendsToRuntime", values),
              };
            }
            if (line.tone) status.dataset.tone = line.tone;
            else delete status.dataset.tone;

          },
        };
        byokForms.push(form);
        return form;
      };
      document.addEventListener("pointerdown", (event) => {
        for (const form of byokForms) form.dismiss(event.target);
        if (
          combos.some(
            (combo) => combo.open && !combo.root.contains(event.target),
          )
        ) {
          closeCombos();
          render();
        }
      });
      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        const open = combos.find((combo) => combo.open);
        if (!open) return;
        closeCombos();
        render();
        open.input.focus();
      });
      // The setup form's runtime; the sign-in dialog's endpoint serves the
      // runtime signing in.
      let byokRuntime = "claude";
      let signInByokOpen = false;
      const mainByok = byokFields(
        $("byok-fields"),
        "byok",
        () => byokRuntime,
        () => {
          picked = true;
        },
      );
      const signInByok = byokFields(
        $("signin-byok-fields"),
        "signin-byok",
        () => state.localServer.signIn?.runtime ?? "claude",
        () => {},
      );
      // Provider keys typed or removed here ("" removes the saved one); kept
      // only in the inputs and sent once with Install.
      let keys = {};
      const isDefaultPlan = (local) =>
        JSON.stringify(plan) === JSON.stringify(defaults()) &&
        !local.location.custom &&
        !Object.keys(keys).length;

      const host = (url) => {
        try {
          return new URL(url).host;
        } catch {
          return url;
        }
      };

      // Two bursts of confetti from the lower corners, then gone.
      const celebrate = () => {
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        const canvas = document.createElement("canvas");
        canvas.id = "confetti";
        document.body.append(canvas);
        const ratio = devicePixelRatio || 1;
        const width = innerWidth;
        const height = innerHeight;
        canvas.width = width * ratio;
        canvas.height = height * ratio;
        const ctx = canvas.getContext("2d");
        ctx.scale(ratio, ratio);
        const colors = [
          "#1b1b19",
          "#f2c94c",
          "#eb5757",
          "#2f9e44",
          "#2d9cdb",
          "#bb6bd9",
          "#f2994a",
        ];
        const pieces = [];
        for (const side of [-1, 1])
          for (let i = 0; i < 90; i++) {
            const angle =
              ((side < 0 ? 60 : 120) + (Math.random() - 0.5) * 40) *
              (Math.PI / 180);
            const speed = 9 + Math.random() * 9;
            pieces.push({
              x: side < 0 ? -10 : width + 10,
              y: height * 0.75,
              vx: Math.cos(angle) * speed,
              vy: -Math.sin(angle) * speed,
              size: 5 + Math.random() * 5,
              spin: Math.random() * Math.PI,
              turn: (Math.random() - 0.5) * 0.3,
              wobble: Math.random() * 10,
              color: colors[i % colors.length],
              round: Math.random() < 0.3,
            });
          }
        const begun = performance.now();
        const frame = (now) => {
          const age = (now - begun) / 1000;
          ctx.clearRect(0, 0, width, height);
          ctx.globalAlpha = Math.min(1, Math.max(0, 3.2 - age));
          for (const p of pieces) {
            p.vx *= 0.985;
            p.vy = p.vy * 0.985 + 0.32;
            p.x += p.vx + Math.sin(age * 4 + p.wobble) * 0.6;
            p.y += p.vy;
            p.spin += p.turn;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.spin);
            ctx.fillStyle = p.color;
            if (p.round) {
              ctx.beginPath();
              ctx.arc(0, 0, p.size / 2.4, 0, Math.PI * 2);
              ctx.fill();
            } else {
              ctx.scale(1, Math.cos(age * 6 + p.wobble));
              ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
            }
            ctx.restore();
