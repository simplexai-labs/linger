              : unavailableText;
        $("plan-why").hidden = !$("plan-why").textContent;
        renderDriver(local, models, busy, choosing && !behind);

        // Step 2: the chosen source.
        $("local-row").hidden = source !== "local";
        $("subscription-row").hidden = source !== "subscription";
        $("byok-row").hidden = source !== "byok";
        const option = model || heldModel ? chosenModel(models) : undefined;
        const card = renderModelCard(local, models, option, busy);
        if (!option && !held) {
          setText($("local-model-why"), unavailableText);
          $("local-model-why-row").hidden = !unavailableText;
        }
        renderPicker(models, option, busy);
        renderRuntimes(rows, busy);
        mainByok.sync(busy || byokTesting);
        // The local model can come along in the background, off unless
        // chosen, on a computer that runs it.
        const offerBackground =
          source !== "local" && Boolean(model) && !held && !behind;
        if (!offerBackground) background = false;
        $("background-row").hidden = !offerBackground;
        $("background-model").checked = background;
        $("background-model").disabled = busy;

        // The install location shows only when it is the problem, with
        // what is wrong and a way to change it.
        const location = local.location;
        $("location-row").hidden = !location.error;
        $("location-sub").textContent = location.error ?? "";
        $("location-sub").title = location.path;
        $("location-reset").hidden = !location.custom;
        $("location-change").disabled = busy;
        $("location-reset").disabled = busy;

        // The button and what it does. Continue opens the settings; Install
        // waits for what the source needs.
        $("source-continue").hidden = !choosing;
        $("source-continue").disabled =
          busy || (source === "local" && !localUsable);
        $("local-install").hidden = !settings;
        $("get-started").hidden = available;
        const ready =
          source === "local"
            ? localUsable && !held && !card.checking && !card.refused
            : source === "byok"
              ? mainByok.complete()
              : signedIn.length > 0;
        $("local-install").disabled =
          busy ||
          !ready ||
          byokTesting ||
          Boolean(working) ||
          Boolean(location.error);
        const label = byokTesting
          ? '<span class="spinner"></span>' + esc(t("checkingByok"))
          : esc(t(behind ? "continueSetup" : "install"));
        if ($("local-install-label").innerHTML !== label)
          $("local-install-label").innerHTML = label;
        const order = ["codex", "claude"].filter((runtime) =>
          signedIn.includes(runtime),
        );
        // One short line under the button, on step 2 only.
        $("plan-line").hidden = !available || checkingStage;
        $("plan-line").textContent =
          !settings || source !== "subscription"
            ? ""
            : working
              ? t("planWaitRuntime", { runtime: RUNTIMES[working.runtime] })
              : order.length === 2
                ? t("planBoth", { first: RUNTIMES[order[0]] })
                : order.length
                  ? ""
                  : t("planSignInFirst");
        $("team").hidden = !available || settings || checkingStage;
      };

      // NVIDIA driver help for a local model held by the driver.
      const renderDriver = (local, models, busy, visible) => {
        const held = models.state === "checked" && !!models.blockedNow;
        const canRecheck =
          held ||
          (models.state === "checked" &&
            !models.eligible &&
            !!models.reasons?.some((reason) =>
              RECHECKABLE_REASONS.has(reason.code),
            ));
        const showDriverActions =
          visible &&
          models.state === "checked" &&
          !models.eligible &&
          cudaDriverHeld(models);
        const nvidiaApp =
          state.platform === "win32"
            ? (state.driverUpdate?.nvidiaApp ?? "none")
            : "none";
        const directDriverInstall =
          state.platform === "win32" &&
          Boolean(state.driverUpdate?.directInstallSupported);
        const driverInstallState = state.driverUpdate?.installState ?? {
          phase: "idle",
        };
        const driverInstalling =
          driverInstallState.phase === "downloading" ||
          driverInstallState.phase === "verifying" ||
          driverInstallState.phase === "installing";
        let driverStatusText = "";
        if (driverInstallState.phase === "downloading") {
          driverStatusText =
            driverInstallState.totalBytes != null
              ? t("driverDownloadingSize", {
                  version: driverInstallState.version,
                  done: size(driverInstallState.completedBytes),
                  total: size(driverInstallState.totalBytes),
                })
              : t("driverDownloading", { version: driverInstallState.version });
        } else if (driverInstallState.phase === "verifying") {
          driverStatusText = t("driverVerifying", {
            version: driverInstallState.version,
          });
        } else if (driverInstallState.phase === "installing") {
          driverStatusText = t("driverInstalling", {
            version: driverInstallState.version,
          });
        } else if (driverInstallState.phase === "reboot_required") {
          driverStatusText = t("driverRebootRequired", {
            version: driverInstallState.version,
          });
        } else if (driverInstallState.phase === "completed") {
          driverStatusText = t("driverInstallComplete", {
            version: driverInstallState.version,
          });
        } else if (driverInstallState.phase === "failed") {
          driverStatusText = t(
            driverInstallState.code === "UAC_CANCELLED"
              ? "driverUacCancelled"
              : driverInstallState.code === "SIGNATURE_INVALID"
                ? "driverSignatureInvalid"
                : driverInstallState.code === "UNSUPPORTED_GPU"
                  ? "driverUnsupportedGpu"
                  : "driverInstallFailed",
          );
        }
        $("local-driver-status").hidden =
          !showDriverActions || !driverStatusText;
        $("local-driver-status").textContent = driverStatusText;
        $("local-driver-install").hidden =
          !showDriverActions || !directDriverInstall;
        $("local-driver-install").disabled = busy || driverInstalling;
        $("local-driver-action").hidden = !showDriverActions;
        $("local-driver-action").disabled = busy || driverInstalling;
        $("local-driver-action").textContent = t(
          nvidiaApp === "nvidia_app"
            ? "openNvidiaApp"
            : nvidiaApp === "geforce_experience"
              ? "openGeForceExperience"
              : "downloadNvidiaDriver",
        );
        $("local-driver-guide").hidden = !showDriverActions;
        $("local-driver-guide").disabled = busy;
        $("local-recheck").hidden = !visible || !canRecheck;
        $("local-recheck").disabled = busy || driverInstalling;
        $("local-plan-actions").hidden =
          $("local-recheck").hidden && !showDriverActions;
      };

      // Each runtime row: what it is on this computer, and the one thing
      // left to do on the right.
      const renderRuntimes = (rows, busy) => {
        for (const el of document.querySelectorAll(".choice.runtime")) {
          const runtime = el.dataset.runtime;
          const row = rows[runtime] ?? {
            runtime,
            installed: false,
            signedIn: false,
            state: "checking",
          };
          const idle = row.state === "idle";
          const installing = row.state === "installing";
          const signing = row.state === "signing_in";
          const done = row.signedIn;
          const sub = el.querySelector("[data-runtime-sub]");
          sub.dataset.warn = String(Boolean(row.failed) && idle);
          sub.textContent =
            row.state === "checking"
              ? t("rtChecking")
              : installing
                ? t("rtInstalling")
                : signing
                  ? t("rtSigningIn")
                  : row.failed === "install"
                    ? row.message || t("rtInstallFailed")
                    : row.failed === "signin"
                      ? row.message || t("signInFailed")
                      : done
                        ? t("signedIn")
                        : row.installed
                          ? t("rtInstalledNotSignedIn")
                          : t("rtNotInstalled");
          sub.title = sub.textContent;
          const install = el.querySelector("[data-runtime-install]");
          install.hidden = !idle || row.installed;
          install.textContent = t(
            row.failed === "install" ? "tryAgain" : "install",
          );
          install.disabled = busy;
          const signin = el.querySelector("[data-runtime-signin]");
          if (signin) {
            signin.hidden = !idle || !row.installed || row.signedIn;
            signin.textContent = t(
              row.failed === "signin" ? "tryAgain" : "signIn",
            );
            signin.disabled = busy;
          }
          const progress = el.querySelector(".runtime-progress");
          progress.hidden = !installing;
          if (installing) {
            const { completed = 0, total } = row.install ?? {};
            const percent = total
              ? Math.min(100, Math.round((completed / total) * 100))
              : undefined;
            progress.setAttribute(
              "aria-label",
              t("installingRuntime", { runtime: RUNTIMES[runtime] }),
            );
            if (percent === undefined)
              progress.removeAttribute("aria-valuenow");
            else progress.setAttribute("aria-valuenow", String(percent));
            progress.querySelector(".fill").style.width =
              Math.max(4, percent ?? 30) + "%";
            // An unknown total counts bytes, once there are any.
            progress.querySelector(".pct").textContent =
              percent !== undefined
                ? percent + "%"
                : completed
                  ? size(completed)
                  : "";
          }
          el.querySelector(".runtime-wait")?.toggleAttribute(
            "hidden",
            !signing,
          );
          const cancel = el.querySelector("[data-runtime-cancel]");
          cancel.hidden = !installing && !signing;
          cancel.disabled = busy;
          const badge = el.querySelector("[data-runtime-done]");
          badge.hidden = !idle || !done;
          // Signed in says so under the name; the tick only marks it.
          if (!badge.firstElementChild) badge.innerHTML = CHECK;
          // The link and code for a browser that did not open, and a
          // pasted code for Claude Code's page.
          const extra = el.querySelector("[data-runtime-extra]");
          if (!extra) continue;
          const signIn = signing ? (row.signIn ?? {}) : {};
          extra.hidden = !signing || !signIn.url;
          extra.querySelector("[data-runtime-code]").hidden =
            !signIn.deviceCode;
          extra.querySelector("[data-runtime-code-value]").textContent =
            signIn.deviceCode ?? "";
          const copiedHere = runtimeCopied?.runtime === runtime;
          for (const copy of extra.querySelectorAll("[data-runtime-copy]")) {
            const what = copy.dataset.runtimeCopy;
            if (what === "code") copy.hidden = !signIn.deviceCode;
            copy.textContent = t(
              copiedHere && runtimeCopied.what === what
                ? "copied"
                : what === "url"
                  ? "copyLink"
                  : "copyCode",
            );
          }
          const paste = extra.querySelector("[data-runtime-paste]");
          if (paste) paste.hidden = !signIn.acceptsCode;
          const device = extra.querySelector("[data-runtime-device]");
          if (device) device.hidden = Boolean(signIn.deviceCode);
        }
      };

      // What the local model's download says: its name when known.
      const modelLine = (local) => {
        const option = chosenModel(local.localModels);
        return option?.name
          ? t("stepModelNamed", { model: option.name })
          : t("stepModel");
      };
      const renderLocal = (busy) => {
        const local = state.localServer;
        renderWelcome(local, busy);

        // Installing. A restart after a reboot shows here as starting.
        const failed = local.phase === "failed";
        const starting = local.phase === "preparing";
        $("installing-title").textContent = t(
          failed
            ? "installStopped"
            : starting
              ? "startingLinger"
              : "installingTitle",
        );
        // The local model's wait offers another source meanwhile; the model
        // keeps downloading.
        $("local-model-leave").hidden = !(
          local.source === "local" &&
          local.phase === "installing" &&
          local.transfer
        );
        const section = document.querySelector('[data-step="installing"]');
        const steps = ALL_STEPS.filter(([id]) => local.steps.includes(id));
        section.dataset.failed = String(failed);
        // The scene's orb wears the source's colour, grey once it failed,
        // and breathes while it works.
        const ball =
          "orb big" +
          (failed ? " k-off" : (KIND[local.source ?? source] ?? "")) +
          (REDUCE || failed ? "" : " breathe turn");
        if ($("sc-ball").className !== ball) $("sc-ball").className = ball;
        if (finishing) {
          renderSignIn(local, busy);
          return;
        }
        const at = Math.max(
          0,
          steps.findIndex(([id]) => id === local.step),
        );
        startAttempt(local);
        const percent = Math.round(shownProgress(local, at) * 100);
        $("installing-fill").style.transform =
          `scaleX(${Math.max(2, percent) / 100})`;
        $("installing-bar").setAttribute("aria-valuenow", String(percent));
        // One bar and one line under it: what is happening now, a download
        // folded in with how far it is.
        const transfer = !failed && !starting ? local.transfer : undefined;
        const waiting =
          !failed && !starting && !transfer && local.waiting === "runtime";
        setLine(
          failed
            ? ""
            : starting
              ? t(
                  local.preparing === "updating"
                    ? "preparingUpdate"
                    : "preparingStart",
                )
              : transfer
                ? [
                    // The installer's own words name tools and timings; the
                    // line says only what downloads: the local model, which
                    // the runtime stage fetches, or Linger.
                    local.source === "local" && steps[at][0] === "services"
                      ? modelLine(local)
                      : t("stepDownload"),
                    transferAmount(transfer),
                  ].join(" · ")
                : waiting
                  ? t("waitingRuntime")
                  : steps[at][1](),
        );
        $("installing-count").textContent =
          starting || failed ? "" : percent + "%";
        // A failure says why in a line or two, with one way on: report it.
        const problem = $("installing-error");
        const message = failed ? failureText(local) : "";
        if (problem.textContent !== message) problem.textContent = message;
        problem.title = message;
        // A new save result replaces the note; a failed report writes its
        // own error there and stays until the next result.
        const saved = state.diagnostics;
        const savedKey = saved && JSON.stringify(saved);
        if (saved && savedKey !== shownDiagnostics)
          $("diagnostics-note").textContent = saved.error
            ? saved.error
            : t("savedDiagnostics", { file: saved.file });
        shownDiagnostics = savedKey;
        $("installing-actions").hidden = !failed;
        renderSignIn(local, busy);
        renderSend();
        renderAccount(local.account);
        $("legacy-note").hidden = !local.legacyBackup;
        $("legacy-note").textContent = local.legacyBackup
          ? t("legacyNote", { folder: local.legacyBackup })
          : "";
      };

      // The password stays masked until Show; the main process copies it
      // and the email.
      let copied;
      const renderAccount = (account) => {
        $("account").hidden = !account;
        if (!account) return;
        $("account-body").hidden = !accountOpen;
        $("account-toggle").setAttribute("aria-expanded", String(accountOpen));
        const error = account.error ?? "";
        $("account-error").textContent = error;
        $("account-error").hidden = !error;
        $("account-fields").hidden = !!error;
        $("account-note").hidden = !!error;
        $("account-change").hidden = true;
        if (error) return;
        $("account-email").textContent = account.email;
        $("account-password").textContent =
          account.password ?? "\u2022".repeat(12);
        $("account-show").textContent = t(account.password ? "hide" : "show");
        $("account-show").setAttribute(
          "aria-label",
          t(account.password ? "hidePassword" : "showPassword"),
        );
        $("account-copy").textContent = t(
          copied === "password" ? "copied" : "copy",
        );
        $("account-copy").setAttribute("aria-label", t("copyPassword"));
        $("account-copy-email").textContent = t(
          copied === "email" ? "copied" : "copy",
        );
        $("account-copy-email").setAttribute("aria-label", t("copyEmail"));
        // Changing the password: the form takes the note's place.
        const editing = passwordEdit !== null;
        $("account-change").hidden = !editing;
        $("account-note").hidden = editing;
        if (!editing) return;
        const problem = passwordEdit.tried
          ? passwordProblem(passwordEdit.value)
          : "";
        const message = problem ? t(problem) : (passwordEdit.error ?? "");
        $("account-new-error").textContent = message;
        $("account-new-password").setAttribute(
          "aria-invalid",
          String(Boolean(problem)),
        );
        $("account-new-password").type = passwordEdit.visible
          ? "text"
          : "password";
        $("account-new-password").disabled = passwordEdit.saving;
        $("account-new-show").textContent = t(
          passwordEdit.visible ? "hide" : "show",
        );
        $("account-new-show").setAttribute(
          "aria-label",
          t(passwordEdit.visible ? "hidePassword" : "showPassword"),
        );
        $("account-new-save").disabled = passwordEdit.saving;
        const saveLabel = passwordEdit.saving
          ? '<span class="spinner"></span>' + esc(t("saving"))
          : esc(t("save"));
        if ($("account-new-save-label").innerHTML !== saveLabel)
          $("account-new-save-label").innerHTML = saveLabel;
        $("account-new-cancel").disabled = passwordEdit.saving;
      };

      const render = () => {
        if (!state) return;
        document.body.dataset.platform = state.platform;
        // Where the tray icon lives on this platform.
        for (const el of document.querySelectorAll("[data-tray]"))
          el.textContent = t(
            el.dataset.tray +
              (state.platform === "darwin" ? "MenuBar" : "Tray"),
          );
        const busy = pending !== null;
        for (const el of document.querySelectorAll("main button"))
          el.disabled = busy && el.dataset.go === undefined;
        // Waiting for sign-in still lets the user reopen the sign-in window.
        if (pending === "signin.open") $("signin").disabled = false;

        renderLocal(busy);
        // The wizard's look, and the install scene behind installing and
        // ready.
        const local = state.localServer;
        const body = document.body.dataset;
        const wizard = ["welcome", "installing", "ready"].includes(step);
        if (wizard) body.look = "wizard";
        else delete body.look;
        if (step === "installing" || step === "ready") body.scene = step;
        else delete body.scene;
        if (step === "installing" && local.phase === "failed")
          body.failed = "true";
        else delete body.failed;
        if (step === "installing" && local.step === "agents")
          body.agents = "true";
        else delete body.agents;
        if (step === "ready" && accountOpen) body.expanded = "true";
        else delete body.expanded;
        const intro =
          step === "welcome" && local.available && stage === "checking";
        if (intro) body.chrome = "off";
        else delete body.chrome;
        const pips =
          step === "welcome" &&
          local.available &&
          (stage === "choose" || stage === "settings");
        $("pips").hidden = !pips;
        const [first, second] = $("pips").children;
        first.dataset.on = String(pips);
        second.dataset.on = String(pips && stage === "settings");
        const at = ORDER.indexOf(step);
        // Setting up this computer takes two steps: a source, then its
        // settings.
        $("step-label").textContent =
          at >= 0
            ? t("stepOf", { step: at + 1, total: ORDER.length })
            : step === "welcome" &&
                state.localServer.available &&
                (stage === "choose" || stage === "settings")
              ? t("stepOf", { step: stage === "choose" ? 1 : 2, total: 2 })
              : "";

        $("signin-host").textContent = host(state.serverUrl);
        $("signin-badge").dataset.ok = String(state.signedIn);
        $("signin-badge").innerHTML = state.signedIn
          ? check + esc(t("signedIn"))
          : pending === "signin.open"
            ? '<span class="spinner"></span>' + esc(t("waiting"))
            : esc(t("notSignedIn"));
        $("signin").textContent = t(state.signedIn ? "continue" : "openSignIn");

        $("computer-name").textContent = state.displayName;
        $("computer-host").textContent = host(state.serverUrl);
        $("connect-badge").dataset.ok = String(state.enrolled);
        $("connect-badge").innerHTML = state.enrolled
          ? check + esc(t("connected"))
          : pending === "computer.connect"
            ? '<span class="spinner"></span>' + esc(t("connecting"))
            : "";
        $("connect").textContent = t(state.enrolled ? "continue" : "connect");

        $("sleep").setAttribute("aria-checked", String(state.preventSleep));
        $("login").setAttribute("aria-checked", String(state.openAtLogin));
        for (const [id, text] of Object.entries(PERMISSIONS)) {
          const status = state.permissions?.[id] ?? "unknown";
          const granted = status === "granted";
          const sub = $("perm-" + id + "-sub");
          sub.textContent = t(status === "denied" ? text.missing : text.about);
          // Most Macs run without Full Disk Access; only refusals are warnings.
          sub.dataset.warn = String(status === "denied" && id !== "full-disk");
          const badge = $("perm-" + id + "-badge");
          badge.dataset.ok = String(granted);
          badge.innerHTML = granted ? check + esc(t("allowed")) : "";
          const button = $("perm-" + id);
          button.hidden = granted;
          button.textContent = t(
            id === "full-disk" || status === "denied"
              ? "openSettings"
              : "allow",
          );
        }
        const folders = $("folders");
        folders.replaceChildren(
          ...state.folders.map((f) => {
            const chip = document.createElement("span");
            chip.textContent = f.label;
            chip.title = f.path;
            return chip;
          }),
        );
      };

      // Send Diagnostics, while a diagnostics server is set up.
      const fileSize = (bytes) =>
        bytes < 1024 ** 2
          ? Math.max(1, Math.ceil(bytes / 1024)) + " KB"
          : (bytes / 1024 ** 2).toFixed(1) + " MB";
      let copiedReport;
      const renderSend = () => {
        const send = state.diagnosticsSend;
        const phase = send?.phase ?? "idle";
        $("send-modal").hidden = phase === "idle";
        if (phase === "idle") return;
        const title = {
          preparing: "sendPreparing",
          confirm: "sendConfirm",
          sending: "sendSending",
          sent: "sendSent",
          failed: "sendFailed",
        }[phase];
        $("send-title").textContent = t(title, { host: send.host });
        const lead = $("send-lead");
        if (phase === "preparing")
          lead.innerHTML =
            '<span class="spinner"></span>' + esc(t("sendCollecting"));
        else
          lead.textContent =
            phase === "confirm"
              ? t("sendConfirmLead", {
                  count: send.files.length,
                  size: fileSize(send.bytes),
                  host: send.host,
                })
              : phase === "sending"
                ? t("sendUploading", {
                    host: send.host,
                    percent: Math.floor(
                      (send.sent / Math.max(1, send.total)) * 100,
                    ),
                  })
                : phase === "sent"
                  ? t("sendSentLead")
                  : "";
        const files = $("send-files");
        files.hidden = phase !== "confirm";
        if (
          phase === "confirm" &&
          files.dataset.shown !== send.files.join("\n")
        ) {
          files.replaceChildren(
            ...send.files.map((file) => {
              const item = document.createElement("li");
              item.textContent = file;
              return item;
            }),
          );
          files.dataset.shown = send.files.join("\n");
        }
        $("send-track").hidden = phase !== "sending";
        if (phase === "sending")
          $("send-fill").style.width =
            Math.min(100, (send.sent / Math.max(1, send.total)) * 100) + "%";
        $("send-report").hidden = phase !== "sent";
        $("send-report-id").textContent = phase === "sent" ? send.reportId : "";
        $("send-error").textContent = phase === "failed" ? send.error : "";
        const primary = {
          confirm: "send",
          sent: copiedReport === send.reportId ? "copied" : "copyReportId",
          failed: send.retry ? "tryAgain" : "saveInstead",
        }[phase];
        $("send-primary").hidden = !primary;
        $("send-primary").textContent = primary ? t(primary) : "";
        const close = { confirm: "cancel", sent: "done", failed: "close" }[
          phase
        ];
        $("send-close").hidden = !close;
        $("send-close").textContent = close ? t(close) : "";
      };

      // Runs one command at a time; errors land next to the step.
      const run = async (command, errorId) => {
        if (pending !== null) return;
        pending = command.op;
        // The sign-in dialog renders its error itself.
        if (errorId === "runtime-signin-error") signInError = "";
        else if (errorId) $(errorId).textContent = "";
        render();
        try {
          state = await setup.run(command);
          return true;
        } catch (error) {
          if (errorId === "runtime-signin-error")
            signInError = ipcMessage(error);
          else if (errorId) $(errorId).textContent = ipcMessage(error);
          return false;
        } finally {
          pending = null;
          render();
        }
      };

      for (const el of document.querySelectorAll("[data-go]"))
        el.addEventListener("click", () => show(el.dataset.go));

      $("server-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const ok = await run(
          { op: "server.set", serverUrl: $("server").value },
          "server-error",
        );
        if (ok) show(state.enrolled ? "permissions" : "signin");
      });
      // The install runs on its own; this window follows its progress.
      const install = async () => {
        const local = state.localServer;
        // Try Again installs what failed, even after the window reopened.
        const chosen =
          local.phase === "failed" && local.source ? local.source : source;
        const byokPayload = chosen === "byok" ? mainByok.config() : undefined;
        // BYOK is tested once, quietly, before the first Install; only a
        // failure shows, under the fields. Try Again installs what passed.
        if (byokPayload && local.phase !== "failed") {
          if (byokTesting) return;
          byokTesting = true;
          mainByok.fail("");
          render();
          const answer = await byokAsk(
            { op: "local.byok.check", byok: byokPayload },
            "byokCheck",
          );
          byokTesting = false;
          if (answer.state !== "ready") {
            mainByok.fail(
              BYOK_FAILURES[answer.code]
                ? t(BYOK_FAILURES[answer.code])
                : answer.message,
              answer.code === "BYOK_AUTH_FAILED"
                ? "key"
                : answer.code === "BYOK_NOT_FOUND"
                  ? "model"
                  : "url",
            );
            render();
            return;
          }
        }
        const ok = await run(
          {
            op: "local.start",
            // "local" sets up Pi with the local model; "subscription" the
            // runtimes signed in above; BYOK always runs on Pi.
            runtime:
              chosen === "local"
                ? "local"
                : chosen === "byok"
                  ? "pi"
                  : "subscription",
            ...(byokPayload ? { byok: byokPayload } : {}),
            ...(background && chosen !== "local" ? { background: true } : {}),
            // The model picked in the picker; else the kit's pick.
            ...(pickedModel && (chosen === "local" || background)
              ? { model: pickedModel }
              : {}),
          },
          "local-error",
        );
        // Saved or not, the keys leave the page once sent.
        if (ok) clearKeys();
        if (ok && state.localServer.phase !== "idle") {
          // The title's orb flies on into the install scene.
          const from = $("hd-orb").getBoundingClientRect();
          const kind = kindOf($("hd-orb"));
          show("installing");
          flyOrb(from, kind, $("sc-ball"), 820, true);
          enter([$("installing-bar"), $("installing-line")], 260, 90);
          anim($("floaters"), [{ opacity: 0 }, { opacity: 1 }], {
            duration: 900,
            delay: 400,
            easing: "linear",
          });
        }
      };
      $("local-install").addEventListener("click", install);
      $("runtime-signin-start").addEventListener("click", () =>
        run({ op: "local.signin.start" }, "runtime-signin-error"),
      );
      $("runtime-signin-paste").addEventListener("submit", async (event) => {
        event.preventDefault();
        const input = $("runtime-signin-input");
        const code = input.value.trim();
        if (!code) return;
        input.value = "";
        await run({ op: "local.signin.start", code }, "runtime-signin-error");
      });
      $("runtime-signin-open").addEventListener("click", () => {
        // That page shows a code to paste back here.
        if (state.localServer.signIn?.acceptsCode)
          $("runtime-signin-trouble").open = true;
        // On Linux opening waits up to seconds for xdg-open, so it skips run()
        // and leaves the dialog usable; a browser that fails to open comes
        // back through onState as browserFailed.
        signInError = "";
        setup.run({ op: "local.signin.open" }).catch((error) => {
          signInError = ipcMessage(error);
          render();
        });
      });
      const copySignIn = async (what) => {
        if (
          !(await run(
            { op: "local.signin.copy", what },
            "runtime-signin-error",
          ))
        )
          return;
        signInCopied = what;
        render();
        setTimeout(() => {
          if (signInCopied !== what) return;
          signInCopied = undefined;
          render();
        }, 1500);
      };
      $("runtime-signin-copy-url").addEventListener("click", () =>
        copySignIn("url"),
      );
      $("runtime-signin-copy-code").addEventListener("click", () =>
        copySignIn("code"),
      );
      $("runtime-signin-device-start").addEventListener("click", () =>
        run({ op: "local.signin.start", device: true }, "runtime-signin-error"),
      );
      $("runtime-signin-switch-method").addEventListener("click", () =>
        run(
          state.localServer.signIn?.deviceCode
            ? { op: "local.signin.start" }
            : { op: "local.signin.start", device: true },
          "runtime-signin-error",
        ),
      );
      $("runtime-signin-cancel").addEventListener("click", () =>
        run({ op: "local.signin.cancel" }, "runtime-signin-error"),
      );
      $("runtime-signin-other").addEventListener("click", () => {
        otherRuntimes = !otherRuntimes;
        render();
      });
      $("runtime-signin-byok-toggle").addEventListener("click", () => {
        signInByokOpen = !signInByokOpen;
        render();
      });
      $("runtime-signin-byok").addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!signInByok.complete()) return;
        const payload = signInByok.config();
        signInByok.clearKey();
        await run(
          { op: "local.signin.byok", byok: payload },
          "runtime-signin-error",
        );
      });
      $("runtime-signin-logs").addEventListener("click", () =>
        run({ op: "logs.open" }, "runtime-signin-error"),
      );
      for (const option of document.querySelectorAll("[data-switch]"))
        option.addEventListener("click", () =>
          run(
            { op: "local.signin.switch", runtime: option.dataset.switch },
            "runtime-signin-error",
          ),
        );
      // Report issue sends the diagnostics where this build has somewhere
      // to send them, after asking; else it saves them to Downloads.
      $("report-issue").addEventListener("click", () => {
        copiedReport = undefined;
        run(
          state.diagnosticsSend
            ? { op: "diagnostics.send", action: "start" }
            : { op: "diagnostics.save" },
          "diagnostics-note",
        );
      });
      $("send-primary").addEventListener("click", async () => {
        const send = state.diagnosticsSend;
        if (send?.phase === "confirm")
          run({ op: "diagnostics.send", action: "confirm" }, "send-error");
        else if (send?.phase === "failed" && send.retry)
          run({ op: "diagnostics.send", action: "retry" }, "send-error");
        // Nothing left to retry: save the report to Downloads instead.
        else if (send?.phase === "failed") {
          if (
            await run(
              { op: "diagnostics.send", action: "cancel" },
              "send-error",
            )
          )
            run({ op: "diagnostics.save" }, "diagnostics-note");
        } else if (send?.phase === "sent") {
          if (
            await run({ op: "diagnostics.send", action: "copy" }, "send-error")
          )
            copiedReport = send.reportId;
          render();
        }
      });
      $("send-close").addEventListener("click", () =>
        run({ op: "diagnostics.send", action: "cancel" }, "send-error"),
      );
      const clearKeys = () => {
        mainByok.clearKey();
        signInByok.clearKey();
      };
      // The source cards: a click picks, a double click or Enter goes on,
      // and the arrows move between them.
      const cards = [...document.querySelectorAll(".source-card")];
      const pick = (value) => {
        picked = true;
        source = value;
        render();
      };
      for (const card of cards) {
        card.addEventListener("click", () => {
          if (!card.disabled) pick(card.dataset.value);
        });
        card.addEventListener("dblclick", () => {
          if (!card.disabled && !$("source-continue").disabled)
            setStage("settings", "forward");
        });
        card.addEventListener("keydown", (event) => {
          const forward =
            event.key === "ArrowRight" || event.key === "ArrowDown";
          const backward = event.key === "ArrowLeft" || event.key === "ArrowUp";
          if (event.key === "Enter") {
            event.preventDefault();
            if (!card.disabled) pick(card.dataset.value);
            if (!$("source-continue").disabled) setStage("settings", "forward");
            return;
          }
          if (!forward && !backward) return;
          event.preventDefault();
          const open = cards.filter((other) => !other.disabled);
          const at = open.indexOf(card);
          const next =
            open[(at + (forward ? 1 : -1) + open.length) % open.length];
          if (!next) return;
          pick(next.dataset.value);
          next.focus();
        });
      }
      $("source-continue").addEventListener("click", () =>
        setStage("settings", "forward"),
      );
      $("source-back").addEventListener("click", () =>
        setStage("choose", "back"),
      );
      $("checking-skip").addEventListener("click", () => {
        handOff();
        render();
      });
      // The model picker.
      $("model-change").addEventListener("click", openSheet);
      $("model-sheet-close").addEventListener("click", () => closeSheet());
      $("model-sheet-scrim").addEventListener("click", () => closeSheet());
      $("model-list").addEventListener("click", (event) => {
        const row = event.target.closest(".mrow");
        if (row && !row.disabled) pickModel(row.dataset.library);
      });
      $("model-sheet").addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          event.preventDefault();
          event.stopPropagation();
          closeSheet();
          return;
        }
        const rows = sheetRows();
        const at = rows.indexOf(document.activeElement);
        if (event.key === "ArrowDown" || event.key === "ArrowUp") {
          event.preventDefault();
          if (!rows.length) return;
          const next =
            rows[
              (at + (event.key === "ArrowDown" ? 1 : -1) + rows.length) %
                rows.length
            ];
          next.focus();
          return;
        }
        // Tab stays inside the sheet: the checked row and Close.
        if (event.key === "Tab") {
          const stops = [
            $("model-sheet-close"),
            $("model-list").querySelector('.mrow[aria-checked="true"]') ??
              rows[0],
          ].filter(Boolean);
          const i = stops.indexOf(document.activeElement);
          event.preventDefault();
          stops[
            (i + (event.shiftKey ? -1 : 1) + stops.length) % stops.length
          ].focus();
        }
      });
      // Enter takes the primary button on screen, unless a control has
      // focus that does something else with it.
      document.addEventListener("keydown", (event) => {
        if (
          event.key !== "Enter" ||
          event.defaultPrevented ||
          event.isComposing ||
          sheetOpen ||
          event.target.closest?.(
            "input, button, select, textarea, [role=radio], .signin-modal",
          ) ||
          [...document.querySelectorAll(".signin-modal")].some(
            (el) => !el.hidden,
          )
        )
          return;
        const primary = ["source-continue", "local-install", "open"]
          .map((id) => $(id))
          .find((el) => el.offsetParent !== null && !el.disabled);
        if (!primary) return;
        event.preventDefault();
        primary.click();
      });
      document.addEventListener("keydown", (event) => {
        if (
          event.key !== "Escape" ||
          sheetOpen ||
          step !== "welcome" ||
          stage !== "settings" ||
          combos.some((combo) => combo.open)
        )
          return;
        setStage("choose", "back");
      });
      $("background-model").addEventListener("change", () => {
        background = $("background-model").checked;
        render();
      });

      // The runtime rows. Each command returns at once; the row follows
      // the install or sign-in through onState.
      const runtimeRun = (command) => run(command, "local-error");
      for (const row of document.querySelectorAll(".choice.runtime")) {
        const runtime = row.dataset.runtime;
        row
          .querySelector("[data-runtime-install]")
          .addEventListener("click", () =>
            runtimeRun({ op: "local.runtime.install", runtime }),
          );
        row
          .querySelector("[data-runtime-signin]")
          ?.addEventListener("click", () =>
            runtimeRun({ op: "local.runtime.signin", runtime }),
          );
        row
          .querySelector("[data-runtime-cancel]")
          .addEventListener("click", () =>
            runtimeRun({ op: "local.runtime.cancel", runtime }),
          );
        row
          .querySelector("[data-runtime-open]")
          ?.addEventListener("click", () => {
            // On Linux opening waits for xdg-open, so it skips run(); a
            // browser that fails to open comes back as browserFailed.
            setup.run({ op: "local.runtime.open", runtime }).catch((error) => {
              $("local-error").textContent = ipcMessage(error);
            });
          });
        for (const copy of row.querySelectorAll("[data-runtime-copy]"))
          copy.addEventListener("click", async () => {
            const what = copy.dataset.runtimeCopy;
            if (
              !(await runtimeRun({ op: "local.runtime.copy", runtime, what }))
            )
              return;
            runtimeCopied = { runtime, what };
            render();
            setTimeout(() => {
              if (
                runtimeCopied?.runtime !== runtime ||
                runtimeCopied.what !== what
              )
                return;
              runtimeCopied = undefined;
              render();
            }, 1500);
          });
        row
          .querySelector("[data-runtime-device]")
          ?.addEventListener("click", () =>
            runtimeRun({ op: "local.runtime.signin", runtime, device: true }),
          );
        row
          .querySelector("[data-runtime-paste]")
          ?.addEventListener("submit", (event) => {
            event.preventDefault();
            const input = row.querySelector("[data-runtime-input]");
            const code = input.value.trim();
            if (!code) return;
            input.value = "";
            runtimeRun({ op: "local.runtime.code", runtime, code });
          });
      }

      // From the local model's wait: install another source instead while
      // the model downloads on.
      for (const leave of document.querySelectorAll("[data-leave]"))
        leave.addEventListener("click", async () => {
          if (!(await run({ op: "local.leave-local" }, "leave-error"))) return;
          // Back to step 1, to pick another source meanwhile.
          picked = false;
          introDone = true;
          enterStage("choose");
          show("welcome");
          $("welcome-title").focus({ preventScroll: true });
          $("welcome-live").textContent = $("welcome-title").textContent;
          enter(stageParts(), 0, 75, -14);
        });
      $("location-change").addEventListener("click", () =>
        run({ op: "local.location.pick" }),
      );
      $("location-reset").addEventListener("click", () =>
        run({ op: "local.location.reset" }),
      );
      $("local-recheck").addEventListener("click", () =>
        run({ op: "local.recheck" }, "local-error"),
      );
      $("local-driver-install").addEventListener("click", () => {
        const models = state?.localServer?.localModels;
        const reason =
          models?.state === "checked"
            ? models.reasons?.find(
                (entry) =>
                  entry.code === "cuda-driver-update-required" ||
                  entry.code === "cuda-driver-version-unknown",
              )
            : undefined;
        void run(
          {
            op: "driver.start-install",
            ...(reason?.requiredCudaVersion
              ? { requiredCuda: reason.requiredCudaVersion }
              : {}),
          },
          "local-error",
        );
      });
      $("local-driver-action").addEventListener("click", () => {
        const nvidiaApp =
          state?.platform === "win32"
            ? (state.driverUpdate?.nvidiaApp ?? "none")
            : "none";
        if (nvidiaApp !== "none") {
          void run({ op: "driver.open-nvidia-app" }, "local-error");
        } else {
          void run(
            {
              op: "external.open",
              url: window.lingerSetup.nvidiaDriverDownloadUrl,
            },
            "local-error",
          );
        }
      });
      $("local-driver-guide").addEventListener("click", () =>
        run(
          {
            op: "external.open",
            url: window.lingerSetup.nvidiaDriverGuideUrl,
          },
          "local-error",
        ),
      );
      $("open").addEventListener("click", () => run({ op: "finish" }));
      $("account-toggle").addEventListener("click", () => {
        accountOpen = !accountOpen;
        if (accountOpen)
          setTimeout(() =>
            enter(
              [...$("account-body").children].filter((el) => !el.hidden),
              120,
              70,
            ),
          );
        // Folding away puts the password back out of sight.
        if (!accountOpen) {
          passwordEdit = null;
          $("account-new-password").value = "";
          if (state.localServer.account?.password)
            run({ op: "local.account.show", on: false });
        }
        render();
      });
      $("account-show").addEventListener("click", () =>
        run({
          op: "local.account.show",
          on: !state.localServer.account?.password,
        }),
      );
      for (const [id, what] of [
        ["account-copy", "password"],
        ["account-copy-email", "email"],
      ])
        $(id).addEventListener("click", async () => {
          if (!(await run({ op: "local.account.copy", what }))) return;
          copied = what;
          render();
          setTimeout(() => {
            if (copied !== what) return;
            copied = undefined;
            render();
          }, 1500);
        });
      $("account-reveal").addEventListener("click", () =>
        run({ op: "local.account.reveal" }),
      );
      // A new password goes to the server, which checks the current one;
      // the account file and this computer's sign-in then follow it.
      $("account-change-open").addEventListener("click", () => {
        passwordEdit = { value: "", visible: false, tried: false };
        $("account-new-password").value = "";
        render();
        $("account-new-password").focus();
      });
      const closePasswordEdit = () => {
        passwordEdit = null;
        $("account-new-password").value = "";
        render();
        $("account-change-open").focus();
      };
      $("account-new-password").addEventListener("input", () => {
        if (!passwordEdit) return;
        passwordEdit = {
          ...passwordEdit,
          value: $("account-new-password").value,
          error: "",
        };
        render();
      });
      $("account-new-show").addEventListener("click", () => {
        passwordEdit = { ...passwordEdit, visible: !passwordEdit.visible };
        render();
      });
      $("account-new-cancel").addEventListener("click", closePasswordEdit);
      $("account-change").addEventListener("keydown", (event) => {
        if (event.key !== "Escape" || passwordEdit?.saving) return;
        event.stopPropagation();
        closePasswordEdit();
      });
      $("account-change").addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!passwordEdit || passwordEdit.saving) return;
        const password = passwordEdit.value;
        if (passwordProblem(password)) {
          passwordEdit = { ...passwordEdit, tried: true };
          render();
          return;
        }
        passwordEdit = { ...passwordEdit, saving: true, error: "" };
        render();
        try {
          state = await setup.run({ op: "local.account.password", password });
          closePasswordEdit();
        } catch (error) {
          passwordEdit = {
            ...passwordEdit,
            saving: false,
            error: ipcMessage(error),
          };
          render();
        }
      });
      $("signin").addEventListener("click", () => {
        if (state.signedIn) return show("connect");
        if (pending !== null && pending !== "signin.open") return;
        // Stays pending until the main window reports a session.
        pending = "signin.open";
        render();
        setup.run({ op: "signin.open" }).catch(() => {
          pending = null;
          render();
        });
      });
      $("connect").addEventListener("click", async () => {
        if (state.enrolled) return show("permissions");
        if (await run({ op: "computer.connect" }, "connect-error"))
          show("permissions");
      });
      $("notify").addEventListener("click", async () => {
        if (await run({ op: "notifications.test" }, "permissions-error"))
          $("notify").textContent = t("testSent");
      });
      $("folder").addEventListener("click", () =>
        run({ op: "folder.add" }, "permissions-error"),
      );
      for (const id of Object.keys(PERMISSIONS))
        $("perm-" + id).addEventListener("click", () => {
          const status = state.permissions?.[id] ?? "unknown";
          run(
            id === "full-disk" || status === "denied"
              ? { op: "permission.settings", id }
              : { op: "permission.request", id },
            "permissions-error",
          );
        });
      $("sleep").addEventListener("click", () =>
        run(
          { op: "prevent-sleep.set", on: !state.preventSleep },
          "permissions-error",
        ),
      );
      $("login").addEventListener("click", () =>
        run(
          { op: "open-at-login.set", on: !state.openAtLogin },
          "permissions-error",
        ),
      );
      $("finish").addEventListener("click", () => run({ op: "finish" }));

      setup.onState((next) => {
        const signedInNow = next.signedIn && !state?.signedIn;
        const localReady =
          next.localServer.phase === "ready" &&
          state?.localServer.phase !== "ready";
        state = next;
        if (pending === "signin.open" && next.signedIn) pending = null;
        if (localReady && step === "installing") completeInstall();
        else if (signedInNow && step === "signin") show("connect");
        else render();
      });
      setup.getState().then((initial) => {
        state = initial;
        const phase = initial.localServer.phase;
        show(
          ["preparing", "installing", "failed"].includes(phase)
            ? "installing"
            : initial.enrolled
              ? "permissions"
              : initial.signedIn
                ? "connect"
                : "welcome",
        );
      });
    </script>
  </body>
</html>
