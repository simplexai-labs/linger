<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; font-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title data-t="pageTitle"></title>
    <style>
      @font-face {
        font-family: "Geist Variable";
        font-style: normal;
        font-display: block;
        font-weight: 100 900;
        src: url("/geist.woff2") format("woff2");
      }
      /* The installer's look: a scene on top, the step centered below. */
      :root {
        --ink: #262626;
        --body: #1a1a16;
        --muted: #737266;
        --faint: #a3a39b;
        --line: #ecece9;
        --field: #f4f4f0;
        --ok: #2f9e44;
        --error: #b5320a;
        --filled: #9b9a90;
        --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
        color: var(--body);
        background: #fff;
        font:
          14px/1.5 "Geist Variable",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "PingFang SC",
          "Noto Sans SC",
          system-ui,
          sans-serif;
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        -webkit-user-select: none;
      }

      /* Scene and top bar. Both are the window drag region. */
      .scene {
        flex: none;
        height: 190px;
        background: #f4f4f0 url("/welcome-scene.png") center / cover no-repeat;
        -webkit-app-region: drag;
      }
      .topbar {
        position: absolute;
        top: 18px;
        left: 28px;
        right: 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        color: #52524b;
        font-size: 12px;
        -webkit-app-region: drag;
      }
      /* Clear the traffic lights. */
      body[data-platform="darwin"] .topbar {
        left: 84px;
      }

      .topbar .brand {
        height: 24px;
        width: auto;
      }

      /* The current step. */
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        width: min(100%, 600px);
        margin: 0 auto;
        padding: 20px 24px 16px;
        text-align: center;
      }
      section {
        display: none;
        flex: 1;
        flex-direction: column;
        min-height: 0;
        animation: enter 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      }
      section.active {
        display: flex;
      }
      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      h1 {
        margin: 0 0 6px;
        color: var(--ink);
        font-size: 20px;
        font-weight: 580;
        line-height: 32px;
        letter-spacing: 0.0025em;
        text-wrap: balance;
      }
      .lead {
        max-width: 440px;
        margin: 0 auto 22px;
        color: var(--muted);
        font-size: 13px;
        text-wrap: pretty;
      }
      .lead.compact {
        margin-bottom: 14px;
      }
      .icon {
        display: grid;
        place-items: center;
        flex: none;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: var(--field);
        color: var(--ink);
      }
      svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      form {
        width: min(100%, 400px);
        margin: 0 auto;
        text-align: left;
      }
      label.field {
        display: block;
        margin-bottom: 6px;
        color: var(--ink);
        font-size: 12px;
        font-weight: 550;
      }
      input[type="text"] {
        width: 100%;
        height: 40px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        outline: none;
        background: #fff;
        color: var(--ink);
        font: inherit;
        font-size: 14px;
        user-select: text;
        -webkit-user-select: text;
        transition: border-color 0.15s;
      }
      input[type="text"]:focus {
        border-color: var(--ink);
      }
      .hint {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 12px;
      }
      .hint:empty {
        display: none;
      }
      .error:empty {
        display: none;
      }
      .error {
        margin: 10px 0 0;
        color: var(--error);
        font-size: 12px;
      }
      .card {
        display: flex;
        align-items: center;
        gap: 12px;
        width: min(100%, 420px);
        margin: 0 auto;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        text-align: left;
      }
      .card .text {
        flex: 1;
        min-width: 0;
      }
      .card .text strong {
        display: block;
        overflow: hidden;
        color: var(--ink);
        font-size: 13px;
        font-weight: 550;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .card .text span {
        display: block;
        overflow: hidden;
        color: var(--muted);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }
      .badge[data-ok="true"] {
        color: var(--ok);
        font-weight: 500;
      }
      .badge svg {
        width: 14px;
        height: 14px;
      }
      .spinner {
        display: inline-block;
        width: 12px;
        height: 12px;
        margin-right: 6px;
        vertical-align: -1px;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .badge .spinner {
        margin-right: 0;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .rows {
        display: grid;
        align-content: start;
        min-height: 0;
        overflow-y: auto;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        text-align: left;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 0;
      }
      .row + .row {
        border-top: 1px solid var(--line);
      }
      .row .text {
        flex: 1;
        min-width: 0;
      }
      .row strong {
        display: block;
        color: var(--ink);
        font-size: 13px;
        font-weight: 550;
      }
      .row span.sub {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }
      .folders {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 6px;
      }
      .folders span {
        max-width: 200px;
        padding: 2px 6px;
        overflow: hidden;
        border-radius: 4px;
        background: var(--field);
        color: #52524b;
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      body:not([data-platform="darwin"]) .mac-only {
        display: none;
      }
      .row .badge {
        flex: none;
      }
      [hidden] {
        display: none !important;
      }
      .row span.sub[data-warn="true"] {
        color: var(--error);
      }
      .row select {
        flex: none;
        height: 30px;
        padding: 0 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--ink);
        font: inherit;
        font-size: 12px;
      }
      .switch {
        position: relative;
        flex: none;
        width: 34px;
        height: 20px;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: #dbdcd5;
        transition: background 0.2s;
      }
      .switch::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .switch[aria-checked="true"] {
        background: var(--ink);
      }
      .switch[aria-checked="true"]::after {
        transform: translateX(14px);
      }
      .switch:hover:not(:disabled) {
        background: #c4c4bc;
      }
      .switch[aria-checked="true"]:hover:not(:disabled) {
        background: #41413b;
      }
      .switch:disabled {
        opacity: 0.5;
      }

      footer.actions {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: auto;
        padding-top: 18px;
      }
      button,
      select {
        font: inherit;
        cursor: pointer;
      }
      button:disabled,
      button[aria-disabled="true"],
      select:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
      }
      .primary,
      .ghost,
      .secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid #dbdcd5;
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        font-size: 13px;
        font-weight: 470;
        white-space: nowrap;
        transition:
          background-color 140ms ease,
          transform 100ms ease;
      }
      .primary,
      .ghost {
        min-height: 36px;
        padding: 6px 15px;
      }
      .primary {
        min-width: 112px;
        border-color: var(--ink);
        background: var(--ink);
        color: #fff;
      }
      .primary:hover:not(:disabled) {
        background: #41413b;
      }
      .ghost:hover:not(:disabled),
      .secondary:hover:not(:disabled) {
        background: #f4f4f5;
      }
      .primary:active:not(:disabled),
      .ghost:active:not(:disabled),
      .secondary:active:not(:disabled) {
        transform: translateY(1px);
      }
      .primary svg {
        width: 14px;
        height: 14px;
      }
      .secondary {
        min-height: 28px;
        padding: 3px 10px;
        font-size: 12px;
      }
      .link {
        padding: 6px;
        border: 0;
        border-radius: 4px;
        background: none;
        color: #414038;
        font-size: 12px;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .link:hover:not(:disabled) {
        background: #f4f4f5;
      }

      section[data-step="welcome"] [hidden] {
        display: none !important;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      /* Focus lands on the title when a stage opens; it is not a control. */
      #welcome-title:focus {
        outline: none;
      }
      .eyebrow {
        display: inline-flex;
        align-self: center;
        align-items: center;
        gap: 6px;
        margin-bottom: 10px;
        padding: 3px 10px 3px 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.8);
        color: #5f5e55;
        font-size: 11.5px;
        font-weight: 500;
        letter-spacing: 0.01em;
      }
      .eyebrow svg {
        width: 12px;
        height: 12px;
        stroke-width: 2;
      }
      .link.quiet {
        padding: 2px 4px;
        color: #52524b;
        font-weight: 500;
        text-decoration-color: #d4d4cd;
        transition:
          color 140ms ease,
          text-decoration-color 140ms ease;
      }
      .link.quiet:hover:not(:disabled) {
        background: none;
        color: var(--ink);
        text-decoration-color: var(--ink);
      }
      .choice[hidden],
      .byok-box[hidden],
      .signin-byok[hidden] {
        display: none !important;
      }
      .choice.byok-box {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
      /* BYOK fields, built once by byokFields() for the setup form and the
         sign-in dialog: the base URL and two optional comboboxes (path and
         endpoint) on one row, the key, then the model with List models and
         Test beside it, and one status line. */
      .byok-fields {
        display: grid;
        gap: 6px;
        font-size: 12px;
        text-align: left;
      }
      .byok-fields .ep {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 6px;
      }
      .byok-fields .ep-base-wrap,
      .byok-fields .ep > .cb,
      .byok-fields .cb.standalone,
      .byok-fields .byok-key {
        display: flex;
        align-items: center;
        min-width: 0;
        height: 30px;
        padding: 0 4px 0 10px;
        border: 1px solid #e2e2dc;
        border-radius: 8px;
        background: #fafaf8;
        transition:
          border-color 140ms ease,
          background-color 140ms ease;
      }
      .byok-fields .byok-key {
        width: 100%;
        padding-right: 10px;
        color: var(--ink);
        font: inherit;
        user-select: text;
        -webkit-user-select: text;
      }
      .byok-fields .ep-base-wrap:focus-within,
      .byok-fields .ep > .cb:focus-within,
      .byok-fields .cb.standalone:focus-within,
      .byok-fields .byok-key:focus {
        outline: none;
        border-color: var(--ink);
        background: #fff;
      }
      .ep-base,
      .cb-input {
        flex: 1 1 auto;
        width: 100%;
        min-width: 0;
        height: 100%;
        padding: 0;
        border: 0;
        outline: none;
        background: transparent;
        color: var(--ink);
        font: inherit;
        text-overflow: ellipsis;
        user-select: text;
        -webkit-user-select: text;
      }
      /* Path and endpoint boxes are as wide as their value; the base URL
         takes the rest of the row. */
      .ep > .cb .cb-input {
        field-sizing: content;
        width: auto;
        min-width: 1ch;
        max-width: 17ch;
      }
      .byok-fields input::placeholder {
        color: var(--faint);
      }
      .cb-input::placeholder {
        font-style: italic;
      }
      /* Grey: the default Linger fills in, which is still sent. */
      .cb[data-default="true"] .cb-input {
        color: var(--filled);
      }
      .cb[data-default="true"] .cb-input:focus {
        color: #77766c;
      }

      /* Combobox: type anything, or pick from the list. */
      .cb {
        position: relative;
      }
      .cb-caret {
        display: grid;
        flex: none;
        place-items: center;
        width: 20px;
        height: 20px;
        padding: 0;
        border: 0;
        border-radius: 5px;
        background: none;
        color: var(--faint);
      }
      .cb-caret:hover:not(:disabled),
      .cb[data-open="true"] .cb-caret {
        background: rgba(20, 20, 16, 0.06);
        color: var(--muted);
      }
      .cb-menu {
        position: absolute;
        top: calc(100% + 5px);
        left: -1px;
        z-index: 30;
        display: grid;
        gap: 1px;
        min-width: calc(100% + 2px);
        width: max-content;
        max-width: min(320px, 86vw);
        max-height: 252px;
        overflow-y: auto;
        padding: 4px;
        border: 1px solid rgba(20, 20, 16, 0.08);
        border-radius: 11px;
        background: #fff;
        box-shadow: 0 16px 36px -14px rgba(20, 20, 16, 0.35);
        font-size: 12px;
        line-height: 1.4;
        cursor: default;
        animation: menu-in 160ms var(--ease);
      }
      .cb-menu[hidden] {
        display: none;
      }
      .ep > .cb .cb-menu {
        left: auto;
        right: -1px;
      }
      @keyframes menu-in {
        from {
          opacity: 0;
          transform: translateY(-3px);
        }
      }
      .cb-menu [role="option"] {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 16px;
        align-items: center;
        gap: 1px 10px;
        padding: 6px 8px;
        border: 0;
        border-radius: 7px;
        background: none;
        text-align: left;
      }
      .cb-menu [role="option"]:hover,
      .cb-menu [role="option"]:focus-visible {
        background: #f4f4f0;
        outline: none;
      }
      .opt-main {
        color: var(--ink);
        font: 500 12px var(--mono);
        overflow-wrap: anywhere;
      }
      .opt-label {
        grid-column: 1;
        color: var(--muted);
        font-size: 11.5px;
      }
      .opt-label em {
        margin-left: 6px;
        color: #d9822b;
        font-style: normal;
        font-weight: 500;
      }
      .opt-check {
        grid-column: 2;
        grid-row: 1 / span 2;
        visibility: hidden;
        color: var(--ink);
      }
      [aria-selected="true"] > .opt-check {
        visibility: visible;
      }
      .cb-head {
        padding: 5px 8px 3px;
        color: var(--faint);
        font-size: 11px;
        font-weight: 500;
      }
      .cb-note {
        max-width: 300px;
        padding: 7px 8px;
        color: var(--muted);
        font-size: 11.5px;
        overflow-wrap: anywhere;
      }
      .cb-note[data-tone="err"] {
        color: var(--error);
      }

      /* The model box, with List models and Test beside it; the test
         result floats under Test. */
      .model-row {
        position: relative;
        display: flex;
        gap: 6px;
      }
      .model-row > .cb {
        flex: 1;
      }
      .model-row > .change {
        height: 30px;
      }
      .model-row > .list-btn {
        display: grid;
        place-items: center;
        width: 30px;
        padding: 0;
        color: var(--muted);
      }
      .model-row > .list-btn:hover:not(:disabled) {
        color: var(--ink);
      }
      .list-btn[data-busy="true"] svg {
        animation: spin 0.9s linear infinite;
      }
      .byok-toast {
        position: absolute;
        top: calc(100% + 9px);
        right: 0;
        z-index: 40;
        display: grid;
        grid-template-columns: 16px minmax(0, 1fr) 20px;
        align-items: start;
        gap: 8px;
        width: min(330px, 100%);
        padding: 10px 8px 10px 12px;
        border-radius: 10px;
        background: #1f1f1d;
        color: #c9c8bf;
        box-shadow: 0 14px 32px -10px rgba(20, 20, 16, 0.5);
        font-size: 12px;
        line-height: 1.45;
        text-align: left;
        user-select: text;
        -webkit-user-select: text;
        animation: toast-in 180ms var(--ease);
      }
      .byok-toast[hidden] {
        display: none;
      }
      .byok-toast::before {
        content: "";
        position: absolute;
        top: -4px;
        right: 22px;
        width: 9px;
        height: 9px;
        border-radius: 2px;
        background: inherit;
        transform: rotate(45deg);
      }
      .byok-toast[data-leaving="true"] {
        animation: toast-out 200ms ease forwards;
      }
      @keyframes toast-in {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
      }
      @keyframes toast-out {
        to {
          opacity: 0;
          transform: translateY(-4px);
        }
      }
      /* Over the setup form's own .choice strong. */
      .byok-fields .byok-toast strong {
        display: block;
        color: #fff;
        font-size: 12.5px;
        font-weight: 550;
      }
      .byok-toast .url {
        color: #ecebe3;
      }
      .toast-icon {
        display: grid;
        margin-top: 1px;
      }
      .byok-toast[data-tone="ok"] .toast-icon {
        color: #74d08b;
      }
      .byok-toast[data-tone="err"] .toast-icon {
        color: #ff9466;
      }
      .toast-close {
        display: grid;
        place-items: center;
        width: 20px;
        height: 20px;
        padding: 0;
        border: 0;
        border-radius: 5px;
        background: none;
        color: #8f8e85;
      }
      .toast-close:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
      }
      .byok-status {
        color: var(--faint);
        font-size: 11.5px;
        line-height: 1.4;
        overflow-wrap: anywhere;
      }
      .byok-status[data-tone="err"] {
        color: var(--error);
      }
      .byok-status .url {
        color: var(--muted);
      }
      .byok-status[data-tone] .url {
        color: inherit;
      }
      .byok-fields .url {
        font-family: var(--mono);
        font-size: 0.95em;
        overflow-wrap: anywhere;
      }
      /* Opens the system folder picker. */
      .change {
        flex: none;
        height: 28px;
        padding: 0 12px;
        border: 1px solid #e6e6e1;
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        font-size: 12px;
        font-weight: 500;
        transition:
          border-color 140ms ease,
          background-color 140ms ease;
      }
      .change:hover:not(:disabled) {
        border-color: #c4c4bc;
        background: #fafaf8;
      }
      .change:active:not(:disabled) {
        background: #f1f1ee;
      }

      #leave-error:empty {
        display: none;
      }
      .track {
        position: relative;
        height: 4px;
        margin-top: 12px;
        overflow: hidden;
        border-radius: 999px;
        background: #f0f0ec;
      }
      .fill {
        position: relative;
        width: 0;
        height: 100%;
        overflow: hidden;
        border-radius: inherit;
        background: linear-gradient(90deg, #4a4a45, #1b1b19);
        transition: width 900ms var(--ease);
      }
      /* A soft sheen shows the work goes on between updates. */
      .fill::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.45),
          transparent
        );
        transform: translateX(-100%);
        animation: sheen 1.8s ease-in-out infinite;
      }
      @keyframes sheen {
        to {
          transform: translateX(100%);
        }
      }
      .problem {
        width: 380px;
        margin: 14px auto 0;
        padding: 10px 14px;
        border: 1px solid #f3dfd6;
        border-radius: 12px;
        background: #fdf6f3;
        color: var(--error);
        font-size: 12px;
        text-align: left;
        user-select: text;
        -webkit-user-select: text;
      }
      .problem:empty {
        display: none;
      }
      /* The AI runtime's own sign-in: a small dialog over the progress while
         the "signin" step waits. */
      .signin-modal {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        background: rgb(38 38 38 / 28%);
        animation: enter 0.18s ease-out;
      }
      .signin-modal[hidden],
      .signin-modal [hidden] {
        display: none;
      }
      .signin-modal .sheet {
        width: 340px;
        padding: 22px 22px 18px;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 18px 48px rgb(0 0 0 / 18%);
        font-size: 12px;
        text-align: left;
      }
      .signin-modal h2 {
        margin: 0 0 6px;
        color: var(--ink);
        font-size: 16px;
        font-weight: 600;
      }
      .signin-modal p {
        margin: 0 0 14px;
        color: var(--muted);
        line-height: 1.5;
      }
      .signin-modal .waiting {
        display: flex;
        align-items: center;
        margin-bottom: 4px;
        color: var(--ink);
      }
      .signin-modal .device-code strong {
        color: var(--ink);
        font:
          600 14px ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        letter-spacing: 0.08em;
        user-select: all;
        -webkit-user-select: all;
      }
      .signin-modal .problem {
        width: auto;
        margin: 0 0 14px;
      }
      .signin-modal .hint {
        color: var(--muted);
        font-size: 11.5px;
      }
      /* No browser opened: the link below is the way on. */
      .signin-modal .no-browser {
        padding: 8px 10px;
        border: 1px solid #f1e3c4;
        border-radius: 10px;
        background: #fdf9ef;
        color: #6b5413;
      }
      .signin-modal .device-code {
        margin-bottom: 12px;
      }
      .signin-modal .device-code p {
        margin: 0;
      }
      .signin-modal .copy-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 4px 0;
      }
      .signin-modal .copy-row strong {
        flex: 1;
      }
      .signin-modal .signin-link {
        margin-bottom: 12px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--field);
      }
      .signin-modal .signin-link .label {
        display: block;
        margin-bottom: 4px;
        color: var(--muted);
        font-size: 11px;
      }
      .signin-modal .signin-link code {
        display: block;
        overflow: hidden;
        margin-bottom: 8px;
        color: var(--ink);
        font: 11.5px var(--mono);
        white-space: nowrap;
        text-overflow: ellipsis;
        user-select: all;
        -webkit-user-select: all;
      }
      .signin-modal .signin-link .buttons {
        display: flex;
        gap: 8px;
      }
      .signin-modal .actions {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .signin-modal .actions .primary {
        width: 100%;
      }
      .signin-modal .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .signin-modal .runtimes {
        display: flex;
        gap: 8px;
        margin-top: 4px;
      }
      .signin-modal .runtimes button {
        flex: 1;
      }
      .signin-modal details {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
        color: var(--muted);
      }
      .signin-modal summary {
        width: max-content;
        cursor: pointer;
        list-style: none;
      }
      .signin-modal summary::-webkit-details-marker {
        display: none;
      }
      .signin-modal details p {
        margin: 8px 0;
      }
      .signin-modal details form {
        display: flex;
        gap: 8px;
      }
      .signin-modal details input {
        flex: 1;
        min-width: 0;
        padding: 5px 10px;
        border: 1px solid #dbdcd5;
        border-radius: 8px;
        font: inherit;
      }
      .signin-byok {
        display: grid;
        gap: 10px;
        margin-top: 8px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
      }
      /* The BYOK fields take the room they have on the setup form. */
      .signin-modal .sheet:has(.signin-byok:not([hidden])) {
        width: 448px;
      }
      /* Send Diagnostics: consent, progress and the report id. */
      .send-modal .files {
        max-height: 132px;
        margin: 0 0 14px;
        padding: 8px 10px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        list-style: none;
        color: var(--muted);
        font:
          11px/1.6 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        overflow-wrap: anywhere;
      }
      .send-modal .track {
        margin: 0 0 14px;
      }
      .send-modal .fill {
        transition: width 200ms linear;
      }
      .send-modal .report strong {
        display: block;
        margin-top: 6px;
        color: var(--ink);
        font:
          600 16px ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        letter-spacing: 0.06em;
        user-select: all;
        -webkit-user-select: all;
      }

      /* ---------- Wizard look (welcome, installing, ready) ----------
         One 760x660 window: a quiet wash, the logo and two step pips on
         top, a 440px stage, and the orb that carries the eye from the
         welcome through step 1, the settings and the install. Ported from
         the round-4 prototype; motion is transform and opacity only. */
      body[data-look="wizard"] {
        --ink: #1a1a16;
        --body: #2c2c27;
        --line: #eeeee9;
        --field: #f6f6f2;
        --ok: #3f8a4c;
        --blue: #0a6fc2;
        --r-lg: 16px;
        --sh-card:
          0 0 0 1px rgba(26, 25, 26, 0.055), 0 1px 2px rgba(0, 0, 0, 0.04),
          0 8px 24px -12px rgba(26, 26, 22, 0.12);
        --ease-io: cubic-bezier(0.65, 0.05, 0.25, 1);
        background: #fbfbf9;
        isolation: isolate;
      }
      body[data-look="wizard"] .scene {
        display: none;
      }
      .wash {
        display: none;
      }
      body[data-look="wizard"] .wash {
        display: block;
        position: fixed;
        inset: -20%;
        z-index: -1;
        pointer-events: none;
        background:
          radial-gradient(
            40% 32% at 50% 34%,
            rgba(94, 200, 229, 0.1),
            transparent 70%
          ),
          radial-gradient(
            36% 30% at 58% 38%,
            rgba(241, 154, 180, 0.1),
            transparent 70%
          );
        transition: opacity 0.8s var(--ease);
      }
      body[data-scene] .wash {
        opacity: 0.55;
      }
      /* A drag strip along the top, under the traffic lights. */
      .drag {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 52px;
        z-index: 1;
        -webkit-app-region: drag;
      }
      body[data-look="wizard"] .topbar {
        top: 14px;
        right: 24px;
        height: 28px;
        z-index: 20;
        transition: opacity 0.6s var(--ease);
      }
      body[data-look="wizard"] .topbar .brand {
        height: 21px;
      }
      .pips {
        display: none;
      }
      body[data-look="wizard"] .pips {
        display: flex;
        gap: 5px;
        align-items: center;
        transition: opacity 0.45s var(--ease);
      }
      .pips i {
        display: block;
        height: 4px;
        width: 6px;
        border-radius: 4px;
        background: #dcdcd5;
        transition:
          width 0.45s var(--ease),
          background 0.45s var(--ease);
      }
      .pips i[data-on="true"] {
        width: 18px;
        background: var(--ink);
      }
      body[data-look="wizard"] #step-label {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      /* The intro and the install scene show the window without its chrome. */
      body[data-chrome="off"] .topbar {
        opacity: 0;
      }
      body[data-look="wizard"] main {
        position: fixed;
        inset: 0;
        width: auto;
        margin: 0;
        padding: 0;
        text-align: left;
      }
      body[data-look="wizard"]
        section:is(
          [data-step="welcome"],
          [data-step="installing"],
          [data-step="ready"]
        ) {
        position: absolute;
        inset: 0;
        display: none;
        animation: none;
      }
      body[data-look="wizard"]
        section:is(
          [data-step="welcome"],
          [data-step="installing"],
          [data-step="ready"]
        ).active {
        display: block;
      }
      body[data-look="wizard"] h1 {
        margin: 0;
        font-size: 24px;
        line-height: 32px;
        font-weight: 600;
        letter-spacing: -0.012em;
        color: var(--ink);
      }
      body[data-look="wizard"] :is(.src-row, .mrow):disabled {
        opacity: 1;
        cursor: default;
      }

      /* ---------- The orb: a soft gradient sphere ----------
         o-base glow behind, o-fill the colour body, o-solid the ready fill,
         o-shade light and contact shadow, o-ring a hairline on large orbs,
         o-arc the highlight. */
      .orb {
        --s: 44px;
        --a: #5ccbe8;
        --b: #a3aaf4;
        --c: #f3a3c2;
        --d: #c9b8f6;
        position: relative;
        display: inline-block;
        width: var(--s);
        height: var(--s);
        flex: none;
      }
      .orb i {
        position: absolute;
        display: block;
        border-radius: 50%;
        pointer-events: none;
      }
      .orb .o-base {
        inset: -40%;
        background: radial-gradient(
          closest-side,
          color-mix(in srgb, var(--b) 24%, transparent) 30%,
          color-mix(in srgb, var(--c) 10%, transparent) 60%,
          transparent
        );
      }
      .orb .o-fill {
        inset: 0;
        background:
          radial-gradient(66% 66% at 26% 24%, var(--a), transparent 84%),
          radial-gradient(72% 72% at 82% 78%, var(--c), transparent 84%),
          radial-gradient(60% 60% at 84% 20%, var(--d), transparent 82%),
          radial-gradient(
            62% 62% at 18% 84%,
            color-mix(in srgb, var(--b) 60%, var(--c)),
            transparent 82%
          ),
          var(--b);
      }
      .orb .o-solid {
        inset: 0;
        opacity: 0;
        background: linear-gradient(
          150deg,
          color-mix(in srgb, var(--a) 88%, #1d6fd8) 8%,
          color-mix(in srgb, var(--b) 92%, #4b4fd0) 52%,
          color-mix(in srgb, var(--c) 90%, #d9467e) 96%
        );
      }
      .orb .o-shade {
        inset: 0;
        background:
          radial-gradient(
            46% 40% at 36% 28%,
            rgba(255, 255, 255, 0.62),
            rgba(255, 255, 255, 0) 72%
          ),
          radial-gradient(
            circle at 44% 40%,
            transparent 62%,
            rgba(46, 40, 110, 0.07) 100%
          );
        box-shadow:
          inset 0 calc(var(--s) * -0.06) calc(var(--s) * 0.14)
            rgba(255, 255, 255, 0.34),
          0 calc(var(--s) * 0.16) calc(var(--s) * 0.3) calc(var(--s) * -0.14)
            color-mix(in srgb, var(--b) 50%, transparent);
      }
      .orb .o-ring {
        inset: -11%;
        display: none;
        border: 1px solid color-mix(in srgb, var(--b) 20%, transparent);
      }
      .orb.big .o-ring {
        display: block;
      }
      .orb .o-arc {
        left: 23%;
        top: 13%;
        width: 26%;
        height: 15%;
        transform: rotate(-28deg);
        background: radial-gradient(
          closest-side,
          rgba(255, 255, 255, 0.9),
          rgba(255, 255, 255, 0)
        );
      }
      .orb.k-byok {
        --a: #62d0c0;
        --b: #9dc3ee;
        --c: #f6b49c;
        --d: #b7e3dc;
      }
      .orb.k-sub {
        --a: #8f97f6;
        --b: #bba6f2;
        --c: #f5b896;
        --d: #e1b3e8;
      }
      .orb.k-off {
        --a: #c9c9c3;
        --b: #d6d6d0;
        --c: #c2c2bc;
        --d: #dcdcd6;
      }
      .orb.breathe {
        animation: orb-breathe 4.2s ease-in-out infinite;
      }
      .orb.breathe .o-base {
        animation: orb-glow 4.2s ease-in-out infinite;
      }
      .orb.turn .o-fill {
        animation: orb-turn 16s linear infinite;
      }
      @keyframes orb-breathe {
        50% {
          transform: scale(1.03);
        }
      }
      @keyframes orb-glow {
        50% {
          opacity: 0.7;
        }
      }
      @keyframes orb-turn {
        to {
          transform: rotate(360deg);
        }
      }
      .orb .o-check {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        opacity: 0;
      }
      body[data-look="wizard"] .orb .o-check svg {
        width: 36%;
        height: 36%;
        filter: drop-shadow(0 1px 2px rgba(40, 40, 120, 0.25));
      }
      /* Ready: the orb is solid and carries the check. */
      body[data-scene="ready"] #sc-ball .o-solid {
        opacity: 0.92;
      }
      body[data-scene="ready"] #sc-ball .o-check {
        opacity: 1;
      }
      body[data-scene="ready"] #sc-check {
        stroke-dashoffset: 0;
      }
      .o-ripple {
        position: absolute;
        inset: -11%;
        border-radius: 50%;
        border: 1.5px solid rgba(163, 170, 244, 0.55);
        opacity: 0;
        pointer-events: none;
      }

      /* ---------- The welcome: the orb forms, the words rise ---------- */
      .intro {
        position: absolute;
        inset: 0;
        z-index: 15;
      }
      .intro-orb {
        position: absolute;
        left: 324px;
        top: 212px;
        width: 112px;
        height: 112px;
        transform-origin: 0 0;
      }
      .intro-orb > .orb {
        transform-origin: 50% 100%;
      }
      body[data-look="wizard"] .intro-title {
        position: absolute;
        top: 350px;
        left: 0;
        right: 0;
        margin: 0;
        text-align: center;
        font-size: 30px;
        line-height: 38px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--ink);
      }
      .intro-title span {
        display: inline-block;
        white-space: pre;
      }
      .intro .skip {
        position: absolute;
        top: 420px;
        left: 0;
        right: 0;
        text-align: center;
      }
      #flyer {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 40;
      }
      #flyer .orb {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
      }

      /* ---------- The stage: step 1 and the settings ---------- */
      .wz-stage {
        position: absolute;
        top: 112px;
        left: 160px;
        width: 440px;
        height: 520px;
      }
      .wz-hd {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        text-align: center;
      }
      .wz-hd .slot {
        height: 44px;
        margin: 0 auto 14px;
        display: flex;
        justify-content: center;
      }
      section[data-stage="choose"] .wz-hd .slot {
        display: none;
      }
      .wz-body {
        position: absolute;
        left: 0;
        right: 0;
        top: 112px;
        height: 272px;
      }
      section[data-stage="choose"] .wz-body {
        top: 54px;
        height: 330px;
      }
      .wz-act {
        position: absolute;
        top: 404px;
        left: 0;
        right: 0;
        display: flex;
        gap: 10px;
      }
      .wz-aux {
        position: absolute;
        top: 460px;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        text-align: center;
        font-size: 12.5px;
        color: var(--faint);
      }
      .wz-aux p {
        margin: 0;
      }
      .wz-aux .team .link {
        font-size: 12.5px;
        color: var(--muted);
        text-decoration: none;
        border-bottom: 1px solid #d9d9d2;
        border-radius: 0;
        padding: 0;
      }
      .wz-aux .plan-why,
      .wz-aux #local-driver-status {
        max-width: 420px;
        color: var(--muted);
        text-wrap: pretty;
      }
      .wz-aux .error:not(:empty) {
        color: var(--error);
      }
      .wz-aux .plan-actions {
        display: flex;
        gap: 10px;
        justify-content: center;
      }
      #plan-line:empty {
        display: none;
      }
      .wz-behind {
        position: absolute;
        top: 498px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
      }

      /* Buttons */
      .btn-primary,
      .btn-ghost,
      .btn-sec {
        height: 44px;
        border-radius: 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border: 0;
        font: inherit;
        font-size: 14px;
        font-weight: 550;
        cursor: pointer;
        transition:
          transform 0.15s var(--ease),
          opacity 0.25s,
          box-shadow 0.25s,
          background 0.2s;
      }
      .btn-primary {
        flex: 1;
        padding: 0 20px;
        background: var(--ink);
        color: #fff;
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.1) inset,
          0 1px 2px rgba(0, 0, 0, 0.16),
          0 6px 14px -8px rgba(26, 26, 22, 0.5);
      }
      .btn-primary kbd {
        font:
          500 11px/1 "Geist Variable",
          system-ui;
        opacity: 0.5;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 5px;
        padding: 3px 5px 2px;
      }
      .btn-primary:disabled {
        opacity: 0.32;
        box-shadow: none;
        cursor: default;
      }
      .btn-primary .spinner {
        border-color: rgba(255, 255, 255, 0.35);
        border-top-color: #fff;
      }
      .btn-ghost {
        width: 96px;
        flex: none;
        background: #fff;
        color: var(--ink);
        box-shadow: var(--sh-card);
      }
      .btn-sec {
        padding: 0 20px;
        background: #fff;
        color: var(--ink);
        box-shadow: var(--sh-card);
      }
      .btn-primary:active:not(:disabled),
      .btn-ghost:active:not(:disabled),
      .btn-sec:active:not(:disabled) {
        transform: scale(0.98);
      }
      .btn-primary:focus-visible,
      .btn-ghost:focus-visible,
      .btn-sec:focus-visible,
      .src-row:focus-visible,
      .mrow:focus-visible,
      .m-chip:focus-visible {
        outline: 2px solid rgba(10, 111, 194, 0.5);
        outline-offset: 2px;
      }

      /* Step 1: three sources, one glider marks the pick. */
      .src-list {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .src-row {
        position: relative;
        display: flex;
        align-items: center;
        gap: 16px;
        height: 102px;
        padding: 0 22px 0 24px;
        border: 0;
        border-radius: var(--r-lg);
        background: #fff;
        box-shadow: var(--sh-card);
        text-align: left;
        font: inherit;
        color: inherit;
        cursor: pointer;
        transition: box-shadow 0.3s var(--ease);
      }
      .src-row:hover:not(:disabled) {
        box-shadow:
          0 0 0 1px rgba(26, 25, 26, 0.07),
          0 1px 2px rgba(0, 0, 0, 0.05),
          0 12px 28px -12px rgba(26, 26, 22, 0.16);
      }
      .src-row:disabled {
        cursor: default;
      }
      .src-row:disabled .orb {
        filter: grayscale(0.85);
        opacity: 0.6;
      }
      .src-row .tx {
        flex: 1;
        min-width: 0;
      }
      .src-row b {
        display: block;
        font-size: 15px;
        line-height: 20px;
        font-weight: 600;
        color: var(--ink);
        letter-spacing: -0.006em;
      }
      .src-row small {
        display: block;
        font-size: 13px;
        line-height: 18px;
        color: var(--muted);
        margin-top: 2px;
      }
      .src-row:disabled b {
        color: var(--faint);
      }
      .radio {
        width: 20px;
        height: 20px;
        flex: none;
        border-radius: 50%;
        box-shadow: inset 0 0 0 1.5px #d9d9d2;
        display: grid;
        place-items: center;
        transition:
          background 0.25s var(--ease),
          box-shadow 0.25s;
      }
      body[data-look="wizard"] .radio svg {
        width: 11px;
        height: 11px;
        opacity: 0;
        transform: scale(0.4);
        transition:
          opacity 0.3s var(--ease),
          transform 0.3s var(--ease);
      }
      [aria-checked="true"] > .radio {
        background: var(--ink);
        box-shadow: none;
      }
      body[data-look="wizard"] [aria-checked="true"] > .radio svg {
        opacity: 1;
        transform: none;
      }
      .glider {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 102px;
        border-radius: var(--r-lg);
        pointer-events: none;
        z-index: 2;
        box-shadow:
          0 0 0 1.5px var(--ink),
          0 14px 30px -16px rgba(26, 26, 22, 0.3);
        transition: transform 0.42s var(--ease);
      }

      /* The local model card */
      .mcard {
        position: relative;
        height: 272px;
        padding: 22px 22px 20px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        border-radius: var(--r-lg);
        background: #fff;
        box-shadow: var(--sh-card);
      }
      .m-top {
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }
      .m-name {
        font-size: 18px;
        font-weight: 600;
        color: var(--ink);
        letter-spacing: -0.01em;
        line-height: 24px;
      }
      .m-sub {
        font-size: 12.5px;
        color: var(--muted);
        margin-top: 2px;
      }
      .m-chip {
        margin-left: auto;
        height: 30px;
        padding: 0 10px 0 12px;
        border: 0;
        border-radius: 9px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex: none;
        font: inherit;
        font-size: 12.5px;
        font-weight: 540;
        color: var(--body);
        background: var(--field);
        box-shadow: inset 0 0 0 1px var(--line);
        cursor: pointer;
      }
      .m-chip:hover:not(:disabled) {
        background: #f1f1ec;
      }
      body[data-look="wizard"] .m-chip svg {
        width: 12px;
        height: 12px;
        opacity: 0.6;
      }
      .m-why {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--body);
        min-height: 20px;
      }
      body[data-look="wizard"] .m-why svg {
        width: 14px;
        height: 14px;
        flex: none;
      }
      .m-why[data-tone="err"] {
        color: var(--error);
      }
      .m-why .spinner {
        width: 13px;
        height: 13px;
      }
      .m-specs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }
      .m-specs > div {
        padding: 12px 0 11px;
        display: flex;
        flex-direction: column;
        gap: 1px;
        min-width: 0;
      }
      .m-specs > div + div {
        padding-left: 16px;
        border-left: 1px solid var(--line);
      }
      .m-specs b {
        font-size: 15px;
        font-weight: 600;
        color: var(--ink);
        letter-spacing: -0.01em;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .m-specs span {
        font-size: 11.5px;
        color: var(--faint);
      }
      .m-mem-l {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 7px;
      }
      .m-mem-l b {
        color: var(--ink);
        font-weight: 600;
      }
      .membar {
        height: 6px;
        border-radius: 6px;
        background: #efefea;
        overflow: hidden;
      }
      .membar i {
        display: block;
        height: 100%;
        border-radius: 6px;
        background: linear-gradient(90deg, #43c6e8, #a9b3f2 55%, #f29ab6);
        transform-origin: 0 50%;
        transition: transform 0.5s var(--ease);
      }
      .memkey {
        display: flex;
        gap: 14px;
        margin-top: 7px;
        font-size: 11px;
        color: var(--faint);
      }
      .memkey i {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 2px;
        margin-right: 5px;
      }

      /* The model picker: a sheet that slides up inside the window. */
      .msheet {
        position: absolute;
        inset: 0;
        z-index: 30;
      }
      .msheet .scrim {
        position: absolute;
        inset: 0;
        background: rgba(26, 26, 22, 0.18);
      }
      .msheet .panel {
        position: absolute;
        left: 0;
        right: 0;
        top: 76px;
        bottom: 0;
        display: flex;
        flex-direction: column;
        border-radius: 20px 20px 0 0;
        background: #fbfbf9;
        box-shadow:
          0 -1px 0 rgba(26, 25, 26, 0.06),
          0 -18px 40px -20px rgba(26, 26, 22, 0.28);
      }
      .msheet .grab {
        width: 36px;
        height: 4px;
        margin: 8px auto 0;
        border-radius: 4px;
        background: #deded8;
      }
      .msheet .head {
        width: 480px;
        margin: 0 auto;
        padding: 16px 0 12px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
      }
      body[data-look="wizard"] .msheet h2 {
        margin: 0;
        font-size: 17px;
        line-height: 24px;
        font-weight: 600;
        color: var(--ink);
        letter-spacing: -0.01em;
      }
      .msheet .head p {
        margin: 2px 0 0;
        font-size: 12.5px;
        color: var(--muted);
      }
      .msheet .close {
        width: 30px;
        height: 30px;
        border: 0;
        border-radius: 9px;
        display: grid;
        place-items: center;
        background: var(--field);
        box-shadow: inset 0 0 0 1px var(--line);
        color: var(--muted);
        cursor: pointer;
      }
      body[data-look="wizard"] .msheet .close svg {
        width: 10px;
        height: 10px;
      }
      .mlist {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 6px 0 24px;
        -webkit-mask-image: linear-gradient(
          to bottom,
          transparent 0,
          #000 14px,
          #000 calc(100% - 28px),
          transparent 100%
        );
        mask-image: linear-gradient(
          to bottom,
          transparent 0,
          #000 14px,
          #000 calc(100% - 28px),
          transparent 100%
        );
      }
      .mlist::-webkit-scrollbar {
        width: 0;
      }
      .mlist-in {
        width: 480px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .mrow {
        position: relative;
        display: grid;
        grid-template-columns: 20px 1fr auto;
        column-gap: 14px;
        align-items: start;
        width: 100%;
        padding: 16px 18px 15px 16px;
        border: 0;
        border-radius: 14px;
        background: #fff;
        box-shadow: var(--sh-card);
        text-align: left;
        font: inherit;
        color: inherit;
        cursor: pointer;
        transition:
          box-shadow 0.25s var(--ease),
          background 0.2s;
      }
      .mrow:hover:not(:disabled):not([aria-checked="true"]) {
        box-shadow:
          0 0 0 1px rgba(26, 25, 26, 0.08),
          0 1px 2px rgba(0, 0, 0, 0.05),
          0 10px 24px -12px rgba(26, 26, 22, 0.18);
      }
      .mrow[aria-checked="true"] {
        box-shadow:
          0 0 0 1.5px var(--ink),
          0 12px 26px -16px rgba(26, 26, 22, 0.3);
      }
      .mrow[data-rec="true"]:not([aria-checked="true"]) {
        box-shadow:
          0 0 0 1px rgba(92, 203, 232, 0.45),
          0 8px 24px -14px rgba(92, 160, 232, 0.35);
      }
      .mrow:disabled {
        cursor: default;
        background: #f7f7f3;
        box-shadow: inset 0 0 0 1px var(--line);
      }
      .mrow .radio {
        margin-top: 2px;
      }
      .mrow:disabled .radio {
        opacity: 0.5;
      }
      .mrow .nm {
        display: block;
        font-size: 14px;
        line-height: 20px;
        font-weight: 600;
        color: var(--ink);
        letter-spacing: -0.006em;
      }
      .mrow .tg {
        display: block;
        font-size: 12px;
        line-height: 16px;
        color: var(--muted);
        margin-top: 1px;
      }
      .mrow:disabled :is(.nm, .tg) {
        color: #b3b3ab;
      }
      .mrow .chips {
        display: flex;
        gap: 6px;
        justify-content: flex-end;
      }
      .mrow .mc {
        height: 22px;
        padding: 0 8px;
        border-radius: 7px;
        display: inline-flex;
        align-items: center;
        font-size: 11.5px;
        font-weight: 540;
        color: var(--body);
        background: var(--field);
        box-shadow: inset 0 0 0 1px var(--line);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .mrow .mc[data-kind="best"] {
        color: #1d5f86;
        background: linear-gradient(
          90deg,
          rgba(67, 198, 232, 0.14),
          rgba(242, 154, 182, 0.14)
        );
        box-shadow: inset 0 0 0 1px rgba(92, 170, 232, 0.25);
      }
      .mrow:disabled .mc {
        color: #b3b3ab;
        background: transparent;
      }
      .mrow .meters {
        grid-column: 2 / 4;
        display: flex;
        gap: 22px;
        margin-top: 11px;
        font-size: 11px;
        color: var(--faint);
      }
      .mrow .meter {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .mrow .meter s {
        position: relative;
        display: block;
        width: 72px;
        height: 4px;
        border-radius: 4px;
        background: #edede7;
        overflow: hidden;
        text-decoration: none;
      }
      .mrow .meter s i {
        position: absolute;
        inset: 0;
        border-radius: 4px;
        background: var(--ink);
        transform-origin: 0 50%;
      }
      .mrow .meter em {
        font-style: normal;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .mrow .needs {
        grid-column: 2 / 4;
        margin-top: 8px;
        font-size: 12px;
        color: #a35a3a;
      }

      /* Grouped fields (BYOK, the sign-in details) */
      .grp {
        background: #fff;
        border-radius: var(--r-lg);
        box-shadow: var(--sh-card);
        overflow: hidden;
      }
      .grp + .grp,
      .byok-box + .grp {
        margin-top: 16px;
      }
      .grp.byok-fields {
        display: block;
      }
      .fld {
        position: relative;
        display: flex;
        align-items: center;
        gap: 12px;
        height: 64px;
        padding: 0 16px 0 20px;
        transition: box-shadow 0.2s;
      }
      .fld + .fld {
        border-top: 1px solid var(--line);
      }
      .fld .lb {
        width: 84px;
        flex: none;
        font-size: 13px;
        color: var(--muted);
      }
      .fld .vw {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      body[data-look="wizard"] .fld input {
        width: 100%;
        height: 24px;
        padding: 0;
        border: 0;
        outline: 0;
        background: transparent;
        font: inherit;
        font-size: 14px;
        color: var(--ink);
        box-shadow: none;
        user-select: text;
        -webkit-user-select: text;
      }
      .fld input::placeholder {
        color: #bdbdb5;
      }
      .fld input[type="password"] {
        letter-spacing: 0.08em;
      }
      .fld input[type="password"]:placeholder-shown {
        letter-spacing: 0;
      }
      .fld:focus-within::after {
        content: "";
        position: absolute;
        inset: 6px 8px;
        border-radius: 10px;
        box-shadow:
          0 0 0 3px rgba(10, 111, 194, 0.14),
          inset 0 0 0 1px rgba(10, 111, 194, 0.45);
        pointer-events: none;
      }
      .fld[data-bad="true"] {
        box-shadow: inset 2px 0 0 var(--error);
      }
      .fld .eye {
        width: 28px;
        height: 28px;
        flex: none;
        border: 0;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: none;
        color: var(--muted);
        opacity: 0.7;
        cursor: pointer;
      }
      body[data-look="wizard"] .fld .eye svg {
        width: 16px;
        height: 16px;
      }
      body[data-look="wizard"] .fld .byok-status {
        display: flex;
        align-items: center;
        gap: 5px;
        margin: 2px 0 0;
        padding: 0;
        font-size: 12px;
        line-height: 16px;
        color: var(--error);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      body[data-look="wizard"] .fld .byok-status svg {
        width: 13px;
        height: 13px;
        flex: none;
      }
      .fld .byok-status[hidden] {
        display: none !important;
      }
      .fld .val {
        flex: 1;
        min-width: 0;
        font-size: 14px;
        color: var(--ink);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        user-select: text;
        -webkit-user-select: text;
      }
      .lnk {
        border: 0;
        padding: 0;
        background: none;
        font: inherit;
        font-size: 12.5px;
        font-weight: 540;
        color: var(--muted);
        cursor: pointer;
      }
      .lnk:hover:not(:disabled) {
        color: var(--ink);
      }
      .lnk + .lnk {
        margin-left: 12px;
      }
      /* A switch row with a small orb: also download the local model. */
      .tgl {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 64px;
        padding: 0 18px 0 20px;
        font-size: 13.5px;
        color: var(--body);
        cursor: pointer;
      }
      .tgl .tl {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .tgl .orb {
        --s: 26px;
      }
      body[data-look="wizard"] input.sw {
        appearance: none;
        -webkit-appearance: none;
        position: relative;
        width: 32px;
        height: 19px;
        margin: 0;
        border-radius: 19px;
        background: #e4e4de;
        flex: none;
        cursor: pointer;
        transition: background 0.25s;
      }
      input.sw::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.18);
        transition: transform 0.25s var(--ease);
      }
      body[data-look="wizard"] input.sw:checked {
        background: var(--ink);
      }
      input.sw:checked::after {
        transform: translateX(13px);
      }
      input.sw:focus-visible {
        outline: 2px solid rgba(10, 111, 194, 0.5);
        outline-offset: 2px;
      }

      /* Subscription runtimes */
      .rt {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0 16px;
        min-height: 96px;
        padding: 0 20px;
      }
      .rt + .rt {
        border-top: 1px solid var(--line);
      }
      .tile {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        flex: none;
        background: linear-gradient(180deg, #fff, #f6f6f2);
        box-shadow:
          inset 0 0 0 1px rgba(26, 25, 26, 0.08),
          0 1px 2px rgba(0, 0, 0, 0.04);
        color: var(--ink);
      }
      body[data-look="wizard"] .tile svg {
        width: 24px;
        height: 24px;
        display: block;
        fill: none;
        stroke: currentColor;
      }
      .rt .text {
        flex: 1;
        min-width: 0;
      }
      .rt .text strong {
        display: block;
        font-size: 15px;
        line-height: 20px;
        font-weight: 600;
        color: var(--ink);
        letter-spacing: -0.006em;
      }
      .rt .sub {
        display: block;
        margin-top: 2px;
        font-size: 13px;
        line-height: 18px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .rt .sub[data-warn="true"] {
        color: var(--error);
      }
      .runtime-act {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: none;
      }
      body[data-look="wizard"] .runtime-act .change {
        height: 30px;
        padding: 0 14px;
        border: 0;
        border-radius: 9px;
        font-size: 12.5px;
        font-weight: 550;
        background: #fff;
        color: var(--ink);
        box-shadow:
          0 0 0 1px rgba(26, 25, 26, 0.1),
          0 1px 2px rgba(0, 0, 0, 0.05);
      }
      body[data-look="wizard"] .runtime-act [data-runtime-signin] {
        background: var(--ink);
        color: #fff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      }
      .runtime-progress {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12.5px;
        color: var(--faint);
        font-variant-numeric: tabular-nums;
      }
      .runtime-progress .track {
        width: 96px;
        height: 3px;
        border-radius: 3px;
        background: rgba(26, 26, 22, 0.08);
      }
      .runtime-progress .fill {
        background: var(--ink);
      }
      .runtime-progress .fill::after {
        display: none;
      }
      .runtime-wait {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12.5px;
        color: var(--muted);
      }
      .rt .badge {
        display: inline-flex;
        background: none;
        padding: 0;
      }
      body[data-look="wizard"] .rt .badge svg {
        width: 24px;
        height: 24px;
      }
      .runtime-extra {
        flex-basis: 100%;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 14px;
        padding: 0 0 14px 60px;
        margin-top: -12px;
        font-size: 12.5px;
        color: var(--muted);
      }
      .runtime-paste {
        display: flex;
        gap: 8px;
        flex-basis: 100%;
      }
      body[data-look="wizard"] .runtime-paste input {
        flex: 1;
        height: 30px;
        padding: 0 10px;
        border: 0;
        border-radius: 8px;
        background: var(--field);
        box-shadow: inset 0 0 0 1px var(--line);
        font: inherit;
        font-size: 12.5px;
      }

      /* ---------- Install, failure and ready: one calm scene ---------- */
      .sc {
        display: none;
      }
      body[data-scene] .sc {
        display: block;
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .sc-orb {
        position: absolute;
        left: 320px;
        top: 214px;
        transition: transform 0.5s var(--ease);
      }
      .sc-orb > .orb {
        --s: 120px;
      }
      body[data-expanded] .sc-orb,
      body[data-expanded] .sc-ready {
        transform: translateY(-104px);
      }
      .floaters {
        position: absolute;
        inset: 0;
        opacity: 0.4;
        transition:
          opacity 1.2s var(--ease),
          filter 0.6s;
      }
      body[data-scene="ready"] .floaters,
      body[data-agents] .floaters {
        opacity: 0.85;
      }
      body[data-failed] .floaters {
        opacity: 0.22;
        filter: grayscale(1);
      }
      .agent {
        position: absolute;
        width: 156px;
        padding: 20px 14px 18px;
        border-radius: 20px;
        background: #fff;
        box-shadow:
          0 0 0 1px rgba(26, 25, 26, 0.05),
          0 18px 40px -20px rgba(26, 26, 22, 0.2);
        text-align: center;
      }
      .agent .orb {
        --s: 44px;
        display: block;
        margin: 2px auto 14px;
      }
      .agent b {
        display: block;
        white-space: nowrap;
        font-size: 12px;
        font-weight: 600;
        color: var(--ink);
        letter-spacing: -0.004em;
      }
      .agent small {
        display: block;
        font-size: 11px;
        line-height: 15px;
        color: var(--faint);
        margin-top: 3px;
      }
      .agent.a1 {
        left: 44px;
        top: 246px;
        rotate: -6deg;
        animation: agent-drift 9s ease-in-out infinite;
      }
      .agent.a2 {
        left: 560px;
        top: 246px;
        rotate: 6deg;
        animation: agent-drift 9s ease-in-out -4.5s infinite;
      }
      @keyframes agent-drift {
        50% {
          transform: translateY(-8px);
        }
      }
      .sc-part {
        position: absolute;
        left: 0;
        right: 0;
        top: 370px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .sc-bar {
        width: 260px;
        height: 3px;
        border-radius: 3px;
        background: rgba(26, 26, 22, 0.08);
        overflow: hidden;
      }
      .sc-bar i {
        display: block;
        height: 100%;
        width: 100%;
        border-radius: 3px;
        background: var(--ink);
        transform: scaleX(0);
        transform-origin: 0 50%;
        transition: transform 0.6s var(--ease);
      }
      .sc-line {
        position: relative;
        height: 22px;
        width: 340px;
        margin: 16px 0 0;
        font-size: 14px;
        color: var(--body);
        font-variant-numeric: tabular-nums;
      }
      .sc-line > span:not(.sr-only) {
        position: absolute;
        left: 0;
        right: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sc-meanwhile {
        margin: 18px 0 0;
        font-size: 12.5px;
        color: var(--faint);
      }
      .sc-meanwhile button {
        border: 0;
        padding: 0;
        background: none;
        font: inherit;
        color: var(--muted);
        border-bottom: 1px solid #d9d9d2;
        cursor: pointer;
      }
      body[data-look="wizard"] .sc-part h1,
      body[data-look="wizard"] .sc-part h2 {
        font-size: 22px;
        line-height: 30px;
      }
      section[data-step="installing"]:not([data-failed="true"])
        #installing-title {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      section[data-failed="true"] :is(.sc-bar, .sc-line, .sc-meanwhile) {
        display: none;
      }
      section[data-step="installing"] .problem {
        max-width: 420px;
        margin: 6px 0 22px;
        padding: 0;
        border: 0;
        background: none;
        font-size: 13.5px;
        color: var(--muted);
        text-align: center;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        user-select: text;
        -webkit-user-select: text;
      }
      section[data-step="installing"] .problem:empty {
        display: none;
      }
      .sc-report {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .sc-report output {
        max-width: 420px;
        font-size: 12px;
        color: var(--faint);
      }
      .sc-ready .btn-primary {
        flex: none;
        width: 280px;
        margin-top: 24px;
      }
      .disclose {
        margin-top: 14px;
        border: 0;
        padding: 0;
        background: none;
        font: inherit;
        font-size: 12.5px;
        color: var(--muted);
        display: inline-flex;
        align-items: center;
        gap: 5px;
        cursor: pointer;
      }
      body[data-look="wizard"] .disclose svg {
        width: 11px;
        height: 11px;
        transition: transform 0.3s var(--ease);
      }
      .disclose[aria-expanded="true"] svg {
        transform: rotate(180deg);
      }
      .acct {
        width: 360px;
        margin-top: 12px;
      }
      .acct .fld {
        height: 48px;
      }
      .acct .fld .lb {
        width: 72px;
      }
      .acct-foot {
        display: flex;
        justify-content: center;
        gap: 14px;
        margin: 10px 0 0;
        font-size: 12.5px;
      }
      .acct-foot .link {
        font-size: 12.5px;
        color: var(--muted);
        text-decoration: none;
        border-bottom: 1px solid #d9d9d2;
        border-radius: 0;
        padding: 0;
      }
      .acct .account-change {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
        flex-wrap: wrap;
        justify-content: center;
      }
      body[data-look="wizard"] .acct .account-change input {
        flex: 1;
        height: 36px;
        padding: 0 12px;
        border: 0;
        border-radius: 10px;
        background: #fff;
        box-shadow: var(--sh-card);
        font: inherit;
        font-size: 13px;
        user-select: text;
        -webkit-user-select: text;
      }
      .acct .account-problem,
      .acct .account-error {
        flex-basis: 100%;
        margin: 4px 0 0;
        font-size: 12px;
        color: var(--error);
      }
      .acct .account-problem:empty {
        display: none;
      }
      .sc-ready .legacy-note {
        max-width: 420px;
        margin: 12px 0 0;
        font-size: 12px;
        color: var(--faint);
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
