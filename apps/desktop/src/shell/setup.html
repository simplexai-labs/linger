    <script>
      const setup = window.lingerSetup;
      const $ = (id) => document.getElementById(id);
      // The steps of connecting to a team server.
      const ORDER = ["server", "signin", "connect", "permissions"];
      const check = '<svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>';
      // A signed-in tick in a soft green disc.
      const CHECK =
        '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="rgba(63,138,76,.11)" stroke="none"/><path d="M7.8 12.3 10.6 15 16.3 9.2" fill="none" stroke="#3f8a4c" stroke-width="1.7"/></svg>';
      const RADIO =
        '<svg viewBox="0 0 12 12"><path d="M2.5 6.2 5 8.6 9.6 3.6" fill="none" stroke="#fff" stroke-width="1.8"/></svg>';
      // Each model's mark, as on the app's Local models page
      // (apps/web/src/features/local-models/local-model-brand-icon.tsx,
      // resolveModelBrand): the maker's logo for its family, else the
      // publisher's for its Hugging Face organization or id prefix, else a
      // plain layered mark. The logos are that page's own files, served here
      // at model-logo/<file> (src/main/model-logos.ts). A full-bleed logo
      // fills its tile; the rest sit small on a neutral one.
      const logo = (id, file, fullBleed = false) => ({ id, file, fullBleed });
      const FAMILY_LOGOS = {
        claude: logo("claude", "claude.svg"),
        deepseek: logo("deepseek", "deepseek.svg"),
        gemma: logo("gemma", "gemma.svg"),
        glm: logo("glm", "glm.svg"),
        grok: logo("grok", "grok.svg"),
        kimi: logo("kimi", "kimi.svg", true),
        llama: logo("meta", "meta.svg"),
        mistral: logo("mistral", "mistral.svg"),
        openai: logo("openai", "openai.svg"),
        phi: logo("phi", "phi.svg"),
        qwen: logo("qwen", "qwen.svg"),
      };
      const THINKING_MACHINES_LOGO = logo(
        "thinkingmachines",
        "thinkingmachines.png",
        true,
      );
      const PUBLISHER_LOGOS = {
        inclusionai: logo("inclusionai", "inclusionai.png", true),
        "ornith-ai": logo("ornith", "ornith.png", true),
        thinkingmachines: THINKING_MACHINES_LOGO,
        xhtoken: logo("xhtoken", "xhtoken.png"),
      };
      const ID_PREFIX_LOGOS = [
        ["ornith-", PUBLISHER_LOGOS["ornith-ai"]],
        ["spark-", PUBLISHER_LOGOS.xhtoken],
        ["ling-", PUBLISHER_LOGOS.inclusionai],
      ];
      const DEFAULT_MODEL_MARK =
        '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 3.25 16.5 7 10 10.75 3.5 7 10 3.25Z" fill="currentColor" fill-opacity=".09" stroke="currentColor" stroke-width="1.45" stroke-linejoin="round"/><path d="M3.5 10.5 10 14.25l6.5-3.75M3.5 13.75 10 17.5l6.5-3.75" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".75"/></svg>';
      const resolveModelLogo = (option) => {
        if (!option) return undefined;
        // `featured` is set only for Inkling 2 Mini (setup-models.ts).
        if (option.featured) return THINKING_MACHINES_LOGO;
        if (option.family && option.family !== "other") {
          return Object.hasOwn(FAMILY_LOGOS, option.family)
            ? FAMILY_LOGOS[option.family]
            : undefined;
        }
        if (
          option.sourceOrg &&
          Object.hasOwn(PUBLISHER_LOGOS, option.sourceOrg)
        ) {
          return PUBLISHER_LOGOS[option.sourceOrg];
        }
        const id = String(option.library ?? "")
          .split(":")[0]
          .toLowerCase();
        return ID_PREFIX_LOGOS.find(([prefix]) => id.startsWith(prefix))?.[1];
      };
      // The tile's brand (`data-brand`, "default" without a logo) and mark.
      const modelBrand = (option) => {
        const brand = resolveModelLogo(option);
        return {
          brand: brand?.id ?? "default",
          fullBleed: Boolean(brand?.fullBleed),
          html: brand
            ? `<img src="model-logo/${brand.file}" alt="" draggable="false" />`
            : DEFAULT_MODEL_MARK,
        };
      };
      // Linger's mark, from the favicon's two paths: an outline under the
      // ink fill, a trace that can draw the outline, and the dot in its
      // ring. The outline keeps about 1.5px (2px when large) at any size.
      // The install's mark also carries the ready check and ripple; the
      // personal agent's card shows the dot inside its ring.
      const WEDGE = $("logo-wedge").getAttribute("d");
      const markHTML = (role, size) => {
        if (role === "agent") {
          const w = +((1.5 * 252) / size).toFixed(2);
          return `<svg class="mk-svg" viewBox="459 315 252 252"><circle class="mk-ring" cx="585.2" cy="441.2" r="${124 - w / 2}" stroke-width="${w}"/><use class="mk-d" href="#logo-dot"/></svg>`;
        }
        const w = +(((size >= 100 ? 2 : 1.5) * 556) / size).toFixed(2);
        const scene = role === "scene";
        const check = scene
          ? '<path class="mk-ck" id="sc-check" pathLength="24" d="M546 444 L574 471 L625 414" stroke-width="17"/>'
          : "";
        return (
          `<svg class="mk-svg" viewBox="234 235 556 556"><path class="mk-track" d="${WEDGE}" stroke-width="${w}"/><use class="mk-fill" href="#logo-wedge"/><path class="mk-trace" pathLength="100" d="${WEDGE}" stroke-width="${w}"${scene ? ' style="stroke-dashoffset: 100"' : ""}/><g class="mk-dot"><circle class="mk-ring" cx="585.2" cy="441.2" r="${(94.1 - w / 2).toFixed(2)}" stroke-width="${w}"/><use class="mk-d" href="#logo-dot"/>${check}</g></svg>` +
          (scene ? '<span class="mk-ripple" id="sc-ripple"></span>' : "")
        );
      };
      for (const mark of document.querySelectorAll(".mark"))
        mark.innerHTML = markHTML(
          mark.dataset.role,
          parseFloat(mark.style.getPropertyValue("--s")) ||
            (mark.dataset.role === "scene" ? 120 : 44),
        );
      for (const radio of document.querySelectorAll(".radio"))
        radio.innerHTML = RADIO;

      // Motion moves only transform and opacity. With reduced motion it
      // fades briefly instead: nothing flies, bounces, breathes or drifts.
      const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const EASE = "cubic-bezier(0.22, 1, 0.36, 1)";
      const EASE_IO = "cubic-bezier(0.65, 0.05, 0.25, 1)";
      // A soft spring: a few percent past the end, then settled.
      const SPRING =
        "linear(0, 0.06 3%, 0.24 7%, 0.52 13%, 0.78 20%, 0.93 27%, 1.01 34%, 1.035 41%, 1.03 48%, 1.012 58%, 1 70%, 0.998 82%, 1)";
      // A Web Animation where the page has them (jsdom has none).
      const anim = (el, frames, options) =>
        el && typeof el.animate === "function"
          ? el.animate(frames, { fill: "backwards", ...options })
          : null;
      const fadeIn = (el, delay = 0) =>
        anim(el, [{ opacity: 0 }, { opacity: 1 }], {
          duration: 150,
          delay,
          easing: "linear",
        });
      // Arriving elements rise in, from the side they come from, one after
      // another.
      const enter = (els, base = 0, gap = 75, dx = 0) =>
        els.forEach((el, i) =>
          REDUCE
            ? fadeIn(el)
            : anim(
                el,
                [
                  { opacity: 0, transform: `translate(${dx}px, 10px)` },
                  { opacity: 1, transform: "none" },
                ],
                { duration: 520, delay: base + i * gap, easing: EASE },
              ),
        );
      // A picked card's outline fills with ink and its dot pops in.
      const fillPop = (card) => {
        if (REDUCE || !card) return;
        anim(
          card.querySelector(".mk-fill"),
          [
            { opacity: 0, transform: "scale(0.94)" },
            { opacity: 1, transform: "none" },
          ],
          { duration: 420, easing: EASE },
        );
        anim(
          card.querySelector(".mk-d"),
          [
            { opacity: 0, transform: "scale(0.4)" },
            { opacity: 1, transform: "scale(1.12)", offset: 0.7 },
            { opacity: 1, transform: "none" },
          ],
          { duration: 520, delay: 160, easing: EASE },
        );
      };
      // Flies a copy of a mark from one place to another along a gentle
      // arc, scaling as it goes; the destination shows once it lands. The
      // copy is drawn at the larger size, so it never scales up blurred.
      // Into the install scene it empties to the scene's pale outline.
      const flyMark = (from, toEl, duration) => {
        if (REDUCE || !from?.width || typeof toEl?.animate !== "function")
          return;
        const to = toEl.getBoundingClientRect();
        if (!to.width) return;
        const base = Math.max(from.width, to.width);
        const mark = document.createElement("span");
        mark.className = "mark";
        mark.style.setProperty("--s", base + "px");
        mark.innerHTML = markHTML("mark", base);
        $("flyer").append(mark);
        if (toEl.classList.contains("mark-scene")) {
          mark.querySelector(".mk-track").style.stroke = "#e2e1da";
          for (const part of mark.querySelectorAll(
            ".mk-fill, .mk-d, .mk-trace",
          ))
            anim(part, [{ opacity: 1 }, { opacity: 0 }], {
              duration: duration * 0.7,
              delay: duration * 0.25,
              easing: EASE,
              fill: "both",
            });
        }
        toEl.style.opacity = "0";
        const k0 = from.width / base;
        const k1 = to.width / base;
        const dx = to.left - from.left;
        const dy = to.top - from.top;
        // The control point lifts the path into a soft curve.
        const cx = dx * 0.2;
        const cy = dy * 0.9 - 24;
        const frames = [];
        for (let i = 0; i <= 12; i++) {
          const p = i / 12;
          const x = from.left + 2 * p * (1 - p) * cx + p * p * dx;
          const y = from.top + 2 * p * (1 - p) * cy + p * p * dy;
          const s = k0 + (k1 - k0) * p;
          frames.push({ transform: `translate(${x}px, ${y}px) scale(${s})` });
        }
        const flight = mark.animate(frames, {
          duration,
          easing: SPRING,
          fill: "forwards",
        });
        const land = () => {
          toEl.style.opacity = "";
          mark.remove();
          anim(toEl, [{ transform: "scale(1.08)" }, { transform: "none" }], {
            duration: 420,
            easing: EASE,
          });
        };
        flight.finished.then(land, land);
      };
      // What moves in on the welcome's current stage.
      const stageParts = () =>
        [...document.querySelectorAll("#wz-stage [data-in]")].filter(
          (el) => !el.closest("[hidden]"),
        );
      const selectedMark = () =>
        document.querySelector('.source-card[aria-checked="true"] .mark');

      // The local models the picker offers, in the page's words. The
      // quality peers are the ones docs/local-inference.md names.
      const GB = 1024 ** 3;
      const MEMORY_SIZES = [16, 24, 32, 36, 48, 64, 96, 128, 192, 256, 512];
      const QUALITY_PEERS = [
        [/^inkling-2-mini/, "≈ Sonnet 4.6"],
        [/^spark-x2\.6-4b-q4km/, "≈ Gemini 2.5 Pro"],
        [/^qwen3\.8-flash-next-iq2xs/, "≈ Opus 4.6"],
      ];
      const qualityText = (option) => {
        const peer = QUALITY_PEERS.find(([pattern]) =>
          pattern.test(option.library ?? ""),
        );
        if (peer) return peer[1];
        const score = option.quality;
        if (score == null) return "–";
        return t(
          score >= 60
            ? "qualityCutting"
            : score >= 50
              ? "qualityFrontier"
              : score >= 35
                ? "qualityCapable"
                : "qualityEveryday",
        );
      };
      const speedText = (option) =>
        option.decodeTokS != null
          ? "~" + Math.round(option.decodeTokS) + " tok/s"
          : "–";
      // Two builds of one model: the larger download is the standard one.
      const buildText = (option, options) => {
        const same = options.filter((other) => other.name === option.name);
        if (same.length < 2) return "";
        const largest = Math.max(...same.map((other) => other.downloadBytes));
        return t(option.downloadBytes === largest ? "standard" : "compact");
      };
      // What a model too large for this computer needs: memory as a
      // computer is sold with it, of which a model may use three quarters.
      const needsText = (option, total) => {
        if (!option.tooLarge) return t("needsFreeMemory");
        const wanted = (option.needsMemoryBytes ?? option.memoryBytes) / 0.75;
        const size =
          MEMORY_SIZES.find(
            (gb) => gb * GB >= wanted && (!total || gb * GB > total),
          ) ?? Math.ceil(wanted / GB);
        return t("needsComputer", {
          size: String(size),
        });
      };
      let state;
      let step;
      // The one action in flight; every control waits for it.
      let pending = null;
      let shownDiagnostics;

      // What each macOS permission is for, and what goes wrong without it.
      const PERMISSIONS = {
        "full-disk": { about: "fullDiskAbout", missing: "fullDiskMissing" },
        folders: { about: "userFoldersAbout", missing: "userFoldersMissing" },
        automation: { about: "automationAbout", missing: "automationMissing" },
      };

      // The runtimes setup names.
      const RUNTIMES = {
        recommended: "",
        codex: "Codex",
        claude: "Claude Code",
        pi: "Pi",
      };
      // The installing steps, as the main process reports them; it says
      // which of them this installation shows.
      const ALL_STEPS = [
        ["prepare", () => t("stepPrepare")],
        ["download", () => t("stepDownload")],
        ["services", () => t("stepServices")],
        ["workspace", () => t("stepWorkspace")],
        [
          "signin",
          () => {
            const runtime = RUNTIMES[state.localServer.signIn?.runtime];
            return runtime
              ? t("stepSignIn", { runtime })
              : t("stepSignInRuntime");
          },
        ],
        ["connect", () => t("stepConnect")],
        ["agents", () => t("stepAgents")],
      ];
      const gigabytes = (bytes) => Math.round(bytes / 1024 ** 3) + " GB";
      // Download sizes: MB below a gigabyte, one decimal GB above.
      const size = (bytes) =>
        bytes < 1024 ** 3
          ? Math.max(0, Math.round(bytes / 1024 ** 2)) + " MB"
          : (bytes / 1024 ** 3).toFixed(1) + " GB";
      // A long folder keeps its start (the drive or home) and its end (the
      // folder itself), with … between, in about `max` characters.
      const shortPath = (value, max = 34) => {
        if (value.length <= max) return value;
        const head = Math.ceil((max - 1) * 0.4);
        return value.slice(0, head) + "…" + value.slice(-(max - 1 - head));
      };
      // Why the installation stopped: in the page's words when the main
      // process names the reason, else the message it passed on.
      const failureText = (local) =>
        local.failure === "runtime_lookup_timed_out"
          ? t("runtimeLookupTimedOut")
          : local.failure === "runtime_lookup_unreachable"
            ? t("runtimeLookupUnreachable")
            : local.failure === "installer_unreachable"
              ? t("installerUnreachable")
              : local.message;
      // What step 1 offers first: the local model when the localmodels tool
      // picked it for this computer and no subscription runtime is signed
      // in already; else the subscription, also while the check runs. BYOK
      // is never the advice.
      const defaults = () => {
        const local = state.localServer;
        const models = local.localModels;
        const signedIn = (local.runtimes ?? []).some(
          (row) => row.runtime !== "pi" && row.signedIn,
        );
        return models.state === "checked" &&
          models.recommendation === "local-models" &&
          models.eligible &&
          models.model &&
          !signedIn &&
          !modelBehind(local)
          ? "local"
          : "subscription";
      };
      // The source picked on step 1: local, subscription or byok.
      let source;
      // Whether the person picked it; until then it follows defaults().
      let picked = false;
      // The advice settles once, when the check's answer arrives, so the
      // selection never moves again by itself after that.
      let settled = false;
      // Where the welcome is: the intro, choosing a source, or the chosen
      // source's settings. The intro never waits for the check.
      let stage;
      let runtimesAsked = false;
      // The ready screen's new password while it is typed:
      // { value, visible, tried, saving }.
      let passwordEdit = null;
      // The ready screen's sign-in details, folded until asked for.
      let accountOpen = false;
      // What a row just copied: { runtime, what }.
      let runtimeCopied;
      // The local model picked in the picker, by its library name; until
      // then the kit's recommendation.
      let pickedModel;
      let sheetOpen = false;
      // The welcome: the mark draws and the title rises for this long, then
      // it hands off to step 1, whether or not the check has finished.
      const INTRO_MS = setup.introMs ?? (REDUCE ? 1200 : 2600);
      let introDone = INTRO_MS <= 0;
      let introStarted = false;
      // The welcome's mark is flying into step 1.
      let handing = false;
      // The install has finished and the bar is folding into the mark.
      let finishing = false;
      const enterStage = (next) => {
        const section = document.querySelector('[data-step="welcome"]');
        stage = next;
        section.dataset.stage = next;
      };
      // The mark where the welcome is now: the picked card's on step 1, the
      // title's on step 2.
      const stageMark = () =>
        stage === "choose" ? selectedMark() : $("hd-mark");
      // Moves between the welcome's stages and says where it went: the mark
      // flies from the card to the title or back, and the new stage's parts
      // rise in from the side they come from.
      const setStage = (next, motion) => {
        // Going on with a source is picking it: the advice no longer moves.
        if (next === "settings") picked = true;
        const from = stageMark()?.getBoundingClientRect();
        enterStage(next);
        render();
        $("welcome-title").focus({ preventScroll: true });
        $("welcome-live").textContent = $("welcome-title").textContent;
        flyMark(from, stageMark(), 640);
        enter(stageParts(), 40, 75, motion === "back" ? -14 : 14);
      };

      // The welcome's title, word by word.
      const introWords = () => {
        const title = $("intro-title");
        title.replaceChildren(
          ...t("welcomeTitle")
            .split(/(?<=\s)/)
            .map((word) => {
              const span = document.createElement("span");
              span.textContent = word;
              return span;
            }),
        );
        return [...title.children];
      };
      // The dot's drop: it falls in, lands with a squash, hops once and
      // settles.
      const DROP = [
        {
          transform: "translate(0px, -560px)",
          opacity: 0,
          easing: "cubic-bezier(0.5, 0, 0.9, 0.5)",
        },
        {
          transform: "translate(0px, -200px)",
          opacity: 1,
          offset: 0.32,
          easing: "cubic-bezier(0.5, 0, 0.9, 0.5)",
        },
        {
          transform: "translate(0px, 0px) scale(1.1, 0.88)",

          easing: "cubic-bezier(0.2, 0.6, 0.4, 1)",
        },
        {
          transform: "translate(0px, -64px) scale(0.97, 1.04)",
          offset: 0.76,
          easing: "cubic-bezier(0.6, 0, 0.8, 0.4)",

        { transform: "translate(0px, 0px) scale(1.04, 0.96)", offset: 0.9 },
        { transform: "none" },
      ];
      // The mark draws its outline and fills with ink, the dot drops in
      // with one soft bounce, and the words rise one after another.
      const startIntro = () => {
        if (introStarted) return;
        introStarted = true;
        const words = introWords();
        const logo = $("intro-logo");
        if (REDUCE) {
          fadeIn(logo);

            duration: 1080,

          anim(
            part(".mk-fill"),
            [

              [

                { opacity: 1, transform: "none" },
              ],
              { duration: 800, delay: 520 + i * 110, easing: EASE },
            ),
          );
        }
        $("welcome-checking").dataset.intro = "playing";
        if (!introDone)
          setTimeout(() => {
            introDone = true;
            render();

      };
      // The hand-off to step 1: the welcome's mark flies along a gentle
      // curve into the picked card's mark, the title fades, and the cards
      // rise in.
      const handOff = () => {
        const from = $("intro-mark").getBoundingClientRect();
        introDone = true;
        handing = !REDUCE && typeof $("intro-mark").animate === "function";
        enterStage("choose");
        if (!handing) {
          setTimeout(() => enter(stageParts(), 0, 60));
          return;

        requestAnimationFrame(() => flyIntro(from));
      };
      const flyIntro = (from) => {
        const mark = $("intro-mark");
        const target = selectedMark();
        const glider = $("glider");
        const to = target?.getBoundingClientRect();
        if (!to?.width || !from.width) {
          handing = false;
          render();
          enter(stageParts(), 0, 60);
          return;
        }
        target.style.opacity = "0";
        glider.style.opacity = "0";
        const k = to.width / from.width;
        const dx = to.left - from.left;
        const dy = to.top - from.top;
        const cx = dx * 0.2;
        const cy = dy * 0.9;
        const frames = [];
        for (let i = 0; i <= 12; i++) {
          const p = i / 12;
          const x = 2 * p * (1 - p) * cx + p * p * dx;
          const y = 2 * p * (1 - p) * cy + p * p * dy;
          frames.push({
            transform: `translate(${x}px, ${y}px) scale(${1 + (k - 1) * p})`,

          duration: 780,
          easing: SPRING,
          fill: "forwards",

        const [pathBox, endpointBox] = root.querySelectorAll(".ep > div");

        const endpointCombo = combobox(endpointBox, {
          id: prefix + "-endpoint",

          placeholder: "-",
          get: endpointValue,
          set: (value) =>
            edit(
              {

          items: () =>
            ENDPOINT_OPTIONS.map((option) => ({

        });
        const toastEl = root.querySelector(".byok-toast");
        toastEl.addEventListener("click", (event) => {
          if (event.target.closest(".toast-close")) hideToast();
        });
        // Hovering keeps a success on screen; leaving lets it fade.
        toastEl.addEventListener("mouseenter", () => clearTimeout(toastTimer));
        toastEl.addEventListener("mouseleave", () => {
          if (check?.state === "ready")
            toastTimer = setTimeout(hideToast, 1500);
        });
        const status = root.querySelector(".byok-status");

        const form = {
          root,
          complete,
          modelId: () => f.modelId.trim(),
          providerLabel: () => {
            const preset = byokProviderById(f.provider);
            return preset.id === "custom" ? "" : byokProviderName(preset);
          },
          config: () => ({
            ...endpoint(),
            modelId: f.modelId.trim(),
            runtime: safeRuntime(),
          }),
          // Keeps an untouched sign-in fallback aligned with the active runtime.
          syncDefaultPreset: () => {
            if (touched) return;
            const target = initialProviderId();
            if (f.provider === target) return;
            f = stateFromPreset(target, f.apiKey);
            placeBaseInput(f.provider === "custom");
          },
          // The runtime changed: its default endpoint and format may differ.
          runtimeChanged: () => resetResults(false),
          clearKey: () => {
            f = { ...f, apiKey: "" };
            key.value = "";
          },
          reset: () => {
            touched = false;
            f = stateFromPreset(initialProviderId());
            placeBaseInput(f.provider === "custom");
            advDetails.open = false;

          // A click outside the toast and Test dismisses it.
          dismiss: (target) => {

          sync: (busy) => {
            const preset = byokProviderById(f.provider);
            if (providerSelect.value !== f.provider)

            if (base.value !== f.baseUrl) base.value = f.baseUrl;
            if (key.value !== f.apiKey) key.value = f.apiKey;
            modelCombo.input.placeholder =

            modelCombo.sync();

                    ok

              if (html !== toastShown) {

            }
            const resolvedParts =
              normalizePath(f.path) + normalizePath(endpointValue());
            if (advMeta.textContent !== resolvedParts)
              advMeta.textContent = resolvedParts;
            let urlPreviewHtml = "";
            if (!validParts()) {
              urlPreviewHtml = esc(t("invalidParts"));
            } else if (!baseUrl()) {
              urlPreviewHtml = esc(t("greyDefaults"));
            } else {
              const { protocol, fromUrl } = format();
              const values = {
                format: BYOK_FORMATS[protocol].label,
                runtime: RUNTIMES[safeRuntime()],
                url: requestUrl(),
              };
              urlPreviewHtml = tHtml(
                fromUrl ? "sendsTo" : "sendsToRuntime",
                values,
              );
            }
            if (advUrl.innerHTML !== urlPreviewHtml)
              advUrl.innerHTML = urlPreviewHtml;

            let line = null;
            if (!validParts())
              line = { tone: "err", html: esc(t("invalidParts")) };
            else if (models?.state === "failed")
              line = { tone: "err", html: esc(models.message) };
            else if (listing)
              line = { html: tHtml("listingFrom", { url: modelsUrl() }) };
            else if (baseOutside && baseUrl()) line = { html: urlPreviewHtml };

            status.hidden = !line;
            if (line) {
              if (line.tone) status.dataset.tone = line.tone;
              else delete status.dataset.tone;
              if (status.innerHTML !== line.html) status.innerHTML = line.html;
            } else {
              delete status.dataset.tone;

            }
          },
        };
        byokForms.push(form);
        return form;
      };
      document.addEventListener("pointerdown", (event) => {
        for (const form of byokForms) form.dismiss(event.target);
        if (
          combos.some(
            (combo) => combo.open && !combo.root.contains(event.target),
          )
        ) {
          closeCombos();
          render();
        }
      });
      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        const open = combos.find((combo) => combo.open);
        if (!open) return;
        closeCombos();
        render();
        open.input.focus();
      });
      // The setup form's BYOK always runs on Pi; the sign-in dialog's
      // endpoint serves the runtime signing in.
      const byokRuntime = "pi";
      let signInByokOpen = false;
      const EYE =
        '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.6 8s2.4-4.6 6.4-4.6S14.4 8 14.4 8s-2.4 4.6-6.4 4.6S1.6 8 1.6 8Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><circle cx="8" cy="8" r="2" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>';
      // The setup form's BYOK: an address, a key and a model, one labelled
      // row each. The address may be a base URL or a whole request URL; a
      // bare host gets the usual /v1, and an ending that names a format
      // picks it, as the full form's defaults do. Install tests it once,
      // quietly, and a failure shows under the row it is about.
      const simpleByok = (root, prefix, runtime) => {
        const row = (field, label, input, extra = "") => `
          <div class="fld" data-field="${field}">
            <label class="lb" for="${prefix}-${field}">${esc(label)}</label>
            <div class="vw">${input}</div>${extra}
          </div>`;
        root.innerHTML =
          row(
            "url",
            t("baseUrl"),
            `<input id="${prefix}-url" type="url" autocomplete="off"
              spellcheck="false"
              placeholder="${esc(t("baseUrlPlaceholder"))}" />`,
          ) +
          row(
            "key",
            t("apiKey"),
            `<input id="${prefix}-key" type="password" autocomplete="off"
              spellcheck="false"
              placeholder="${esc(t("apiKeyPlaceholder"))}" />`,
            `<button type="button" class="eye" aria-pressed="false"
              aria-label="${esc(t("showKey"))}">${EYE}</button>`,
          ) +
          row(
            "model",
            t("byokModelId"),
            `<input id="${prefix}-model" type="text" autocomplete="off"
              spellcheck="false"
              placeholder="${esc(t("byokModelPlaceholder"))}" />`,
          ) +
          `<p class="byok-status" id="${prefix}-status" data-tone="err"
            role="alert" hidden></p>`;
        const [url, key, model] = root.querySelectorAll("input");
        const status = root.querySelector(".byok-status");
        const eye = root.querySelector(".eye");
        let f = { url: "", apiKey: "", modelId: "" };
        // Why the last Install's test failed, and which row it is about,
        // until the fields change.
        let failure = "";
        let failed = "url";
        let keyVisible = false;
        const edit = (next) => {
          f = { ...f, ...next };
          failure = "";
          render();
        };
        url.addEventListener("input", () => edit({ url: url.value }));
        key.addEventListener("input", () => edit({ apiKey: key.value }));
        model.addEventListener("input", () => edit({ modelId: model.value }));
        eye.addEventListener("click", () => {

        });
        const address = () => {
          const typed = f.url.trim().replace(/\/+$/, "");
          for (const [protocol, { suffix }] of Object.entries(BYOK_FORMATS))
            if (typed.endsWith(suffix))
              return {
                baseUrl: typed.slice(0, -suffix.length),
                path: "",
                endpoint: suffix,
                protocol,
              };

          try {
            bare = new URL(typed).pathname.replace(/\/+$/, "") === "";
          } catch {}
          const protocol = RUNTIME_FORMATS[runtime];
          return {
            baseUrl: typed,
            path: bare ? DEFAULT_PATH : "",
            endpoint: BYOK_FORMATS[protocol].suffix,
            protocol,
          };
        };
        return {
          root,
          complete: () => f.url.trim() !== "" && f.modelId.trim() !== "",
          modelId: () => f.modelId.trim(),
          config: () => {
            const apiKey = f.apiKey.trim();
            return {
              ...address(),
              ...(apiKey ? { apiKey } : {}),
              modelId: f.modelId.trim(),
              runtime,
            };
          },
          fail: (message, field = "url") => {
            failure = message;
            failed = field;
            const bad = root.querySelector(`[data-field="${field}"]`);
            if (!REDUCE)
              anim(
                bad,
                [
                  { transform: "none" },
                  { transform: "translateX(-3px)" },
                  { transform: "translateX(3px)" },
                  { transform: "translateX(-2px)" },
                  { transform: "none" },
                ],
                { duration: 260, easing: "ease-out" },
              );
          },
          clearKey: () => {
            f = { ...f, apiKey: "" };
            key.value = "";
          },
          reset: () => {
            f = { url: "", apiKey: "", modelId: "" };
            failure = "";
          },
          sync: (busy) => {
            if (url.value !== f.url) url.value = f.url;
            if (key.value !== f.apiKey) key.value = f.apiKey;
            if (model.value !== f.modelId) model.value = f.modelId;
            for (const input of [url, key, model]) input.disabled = busy;
            key.type = keyVisible ? "text" : "password";
            eye.setAttribute("aria-pressed", String(keyVisible));
            eye.setAttribute(
              "aria-label",
              t(keyVisible ? "hideKey" : "showKey"),
            );

              ["url", url],
              ["key", key],
              ["model", model],
            ]) {

              }
            }

            if (status.dataset.text !== failure) {
              status.dataset.text = failure;

                ? ICONS.err + `<span>${esc(failure)}</span>`
                : "";
            }
          },
        };
      };
      const mainByok = simpleByok($("byok-fields"), "byok", byokRuntime);
      const signInByok = byokFields(
        $("signin-byok-fields"),
        "signin-byok",
        () => state.localServer.signIn?.runtime ?? "claude",
        () => {},
        {
          allowRuntime: false,
          initialProvider: () =>
            defaultProviderForRuntime(
              state?.localServer?.signIn?.runtime ?? "claude",
            ),
        },
      );
      // Install is testing the BYOK endpoint before it starts.
      let byokTesting = false;

      const host = (url) => {
        try {
          return new URL(url).host;
        } catch {
          return url;
        }
      };

      // The install line: when what is happening changes, the old words
      // drift up and out as the new ones rise in; a download's count
      // changes in place.
      let lineHead = "";
      const setLine = (text) => {
        const el = $("installing-step");
        if (el.textContent === text) return;
        const head = text.split(" · ")[0];
        const old = el.textContent;
        const moving =
          !REDUCE && old && head !== lineHead && step === "installing";
        lineHead = head;
        el.textContent = text;
        if (!moving) return;
        const ghost = document.createElement("span");
        ghost.className = "line-out";
        ghost.setAttribute("aria-hidden", "true");

          ghost,

            { opacity: 1, transform: "none" },
            { opacity: 0, transform: "translateY(-8px)" },

          { duration: 420, easing: EASE, fill: "forwards" },
        );
        const drop = () => ghost.remove();
        if (out) out.finished.then(drop, drop);
        else drop();
        anim(
          el,
          [
            { opacity: 0, transform: "translateY(8px)" },
            { opacity: 1, transform: "none" },
          ],
          { duration: 420, delay: 180, easing: EASE },
        );
      };

      // The install's trace around the mark follows the bar.
      const traceTo = (percent) => {
        const trace = $("sc-mark").querySelector(".mk-trace");
        if (trace) trace.style.strokeDashoffset = String(100 - percent);
      };
      // The install's end: the bar and the trace complete, fold into the
      // mark, the mark fills, its dot pops with a ripple, the check draws,
      // and the ready words rise.
      const completeInstall = () => {
        if (REDUCE || finishing || typeof $("sc-mark").animate !== "function")
          return show("ready");
        finishing = true;
        $("installing-fill").style.transform = "scaleX(1)";
        traceTo(100);
        $("installing-bar").setAttribute("aria-valuenow", "100");
        setLine(t("lineAlmost"));
        setTimeout(() => {
          const parts = [
            $("installing-bar"),
            $("installing-line"),
            $("local-model-leave"),
          ];
          const out = parts.map((el) =>
            anim(
              el,
              [
                { opacity: 1, transform: "none" },
                { opacity: 0, transform: "translateY(-40px) scale(0.6)" },
              ],
              { duration: 420, easing: EASE_IO, fill: "forwards" },
            ),
          );
          setTimeout(() => {
            finishing = false;
            show("ready");
            out.forEach((a) => a?.cancel());

          }, 360);
        }, 520);
      };
      const readyMoment = () => {
        const part = (selector) => $("sc-mark").querySelector(selector);
        anim(
          part(".mk-fill"),
          [
            { opacity: 0, transform: "scale(0.97)" },
            { opacity: 1, transform: "none" },
          ],
          { duration: 640, easing: EASE },
        );
        anim(
          part(".mk-d"),
          [
            { opacity: 0, transform: "scale(0.5)" },
            { opacity: 1, transform: "none" },
          ],
          { duration: 520, delay: 160, easing: EASE },
        );
        anim(
          part(".mk-dot"),
          [
            { transform: "none" },
            { transform: "scale(1.16)", offset: 0.4 },
            { transform: "scale(0.98)", offset: 0.75 },
            { transform: "none" },
          ],
          { duration: 900, delay: 200, easing: "ease-in-out" },
        );
        anim(
          $("sc-ripple"),
          [
            { opacity: 0.8, transform: "scale(1)" },
            { opacity: 0, transform: "scale(2.6)" },
          ],
          { duration: 1100, delay: 140, easing: EASE, fill: "none" },
        );
        anim(part(".mk-ck"), [{ opacity: 0 }, { opacity: 1 }], {
          duration: 300,
          delay: 460,
          easing: "linear",
        });
        anim(
          $("sc-check"),
          [{ strokeDashoffset: 24 }, { strokeDashoffset: 0 }],
          { duration: 520, delay: 480, easing: EASE },
        );
        enter(
          [...document.querySelectorAll("#sc-ready [data-r]")].filter(
            (el) => !el.hidden,
          ),
          620,
          140,
        );
        anim(
          $("floaters"),
          [
            { transform: "translateY(6px) scale(0.985)" },
            { transform: "none" },
          ],
          { duration: 1400, easing: EASE },
        );
      };

      const show = (next) => {
        // Leaving the sign-in step stops waiting for it.
        if (pending === "signin.open") pending = null;
        if (next !== "welcome") closeSheet(false);
        step = next;
        for (const el of document.querySelectorAll("section"))
          el.classList.toggle("active", el.dataset.step === step);
        if (step === "server") {
          $("server").value ||= state.serverUrl;
          setTimeout(() => $("server").focus(), 30);
        }
        render();
      };

      // The bar eases toward the end of the current step between updates,
      // so long steps never look stuck; it never passes the step's end.
      let shown = 0;
      let eased = 0;
      const shownProgress = (local, at) => {
        const now = Date.now();
        const seconds = eased ? (now - eased) / 1000 : 0;
        eased = now;
        // A failure keeps the bar where it was, within the step that failed.
        if (local.phase === "failed")
          return (shown = Math.min(
            Math.max(local.progress, shown),
            (at + 1) / local.steps.length,
          ));
        if (local.phase !== "installing") return (shown = local.progress);
        const cap = (at + 1) / local.steps.length - 0.02;
        shown = Math.max(local.progress, shown);
        // A download with a known size moves the bar through its step as
        // the bytes arrive; one file of several says nothing about the rest.
        const transfer = local.transfer;
        if (transfer?.total && !transfer.partial)
          shown = Math.max(
            shown,
            (at + (transfer.completed / transfer.total) * 0.98) /
              local.steps.length,
          );
        if (shown < cap) shown += (cap - shown) * (1 - Math.exp(-seconds / 90));
        return shown;
      };
      // Each install fills the bar afresh.
      let attempt;
      const startAttempt = (local) => {
        if (local.attempt === attempt) return;

        shown = 0;
        eased = 0;
      };

        if (step === "installing" && state?.localServer.phase === "installing")
          render();

      // What the sign-in dialog says first for each runtime; each names
      // whose account it signs in with.
      const SIGN_IN_LEADS = {
        codex: "signInLeadCodex",
        claude: "signInLeadClaude",
        pi: "signInLeadPi",
      };

      // message is the fallback for anything else.
      const SIGN_IN_REASONS = {
        timed_out: "signInTimedOut",
        ended: "signInEnded",
        unavailable: "signInUnavailable",
      };
      let otherRuntimes = false;
      // The sign-in's own errors, such as a failed copy; render keeps them.
      let signInError = "";
      // What was just copied: "url" or "code".
      let signInCopied;
      // The runtime installed but not signed in: a dialog starts its own
      // login, which opens the browser, and closes once it is signed in,
      // bringing setup back. The link (and Codex's device code) always show
      // with buttons to open and copy them, so signing in works even when
      // no browser opens. No secret shows here; a pasted code goes straight
      // to the runtime.
      const renderSignIn = (local, busy) => {
        const sign = local.signIn;
        const open =
          local.phase === "installing" &&
          local.step === "signin" &&
          sign &&
          sign.state !== "signed_in";
        $("runtime-signin").hidden = !open;
        if (!open) {
          otherRuntimes = false;
          signInByokOpen = false;
          signInError = "";
          $("runtime-signin-trouble").open = false;
          return;
        }
        const name = RUNTIMES[sign.runtime];
        const failed = sign.state === "failed";
        const running =
          sign.state === "starting" || sign.state === "waiting_user";
        const pi = sign.runtime === "pi";
        const codex = sign.runtime === "codex";
        const link = running && sign.url;
        $("runtime-signin-title").textContent = t("signInTo", {
          runtime: name,
        });
        $("runtime-signin-lead").textContent = t(SIGN_IN_LEADS[sign.runtime]);
        $("runtime-signin-lead").hidden = running;
        $("runtime-signin-waiting").hidden = !running;
        $("runtime-signin-no-browser").hidden = !link || !sign.browserFailed;
        // A device code works in any browser; the browser login calls back
        // to this computer, so its link has to open here.
        $("runtime-signin-no-browser-text").textContent = t(
          sign.deviceCode ? "browserFailedDevice" : "browserFailed",
        );
        $("runtime-signin-device").hidden = !link || !sign.deviceCode;
        $("runtime-signin-device-code").textContent = sign.deviceCode || "";
        $("runtime-signin-copy-code").textContent = t(
          signInCopied === "code" ? "copied" : "copyCode",
        );
        $("runtime-signin-link").hidden = !link;
        $("runtime-signin-url").textContent = sign.url || "";
        $("runtime-signin-url").title = sign.url || "";
        $("runtime-signin-copy-url").textContent = t(
          signInCopied === "url" ? "copied" : "copyLink",
        );
        $("runtime-signin-error").textContent = failed
          ? SIGN_IN_REASONS[sign.reason]
            ? t(SIGN_IN_REASONS[sign.reason])
            : sign.message || t("signInFailed")
          : signInError;
        $("runtime-signin-idle").hidden = running;
        $("runtime-signin-start").hidden = pi;
        $("runtime-signin-start").textContent = t(
          failed ? "retry" : "authorize",
        );
        $("runtime-signin-device-start").hidden = !codex;
        $("runtime-signin-logs").hidden = !failed;
        $("runtime-signin-runtimes").hidden = !otherRuntimes && !pi;
        $("runtime-signin-other").hidden = pi;
        $("runtime-signin-byok").hidden = !signInByokOpen;
        signInByok.syncDefaultPreset();
        signInByok.sync(busy);
        $("runtime-signin-byok-submit").disabled =
          busy || !signInByok.complete();
        for (const option of document.querySelectorAll("[data-switch]")) {
          option.hidden = option.dataset.switch === sign.runtime;
          option.disabled = busy;
        }
        $("runtime-signin-busy").hidden = !running;
        // Codex: a code for another device, or back to this computer's
        // browser.
        $("runtime-signin-switch-method").hidden = !codex;
        $("runtime-signin-switch-method").textContent = t(
          sign.deviceCode ? "useBrowserHere" : "useDeviceCode",
        );
        // Claude Code's page shows a code to paste back.
        $("runtime-signin-trouble").hidden = !link || !sign.acceptsCode;
      };

      // The page's own words for each localmodels reason code, with the
      // counts it carries; the tool's message is never shown. held: the
      // model fits the hardware, but other programs hold memory it needs now.
      const counts = (free, needed) =>
        free != null && needed != null
          ? t("memoryCounts", { free: size(free), needed: size(needed) })
          : "";
      const reasonText = (reason, held, freeMemory) => {
        switch (reason.code) {
          case "gpu-memory-required": {
            const values = {
              gpu: String(reason.gpuIndex),
              counts: counts(reason.freeBytes, reason.requiredBytes),
            };
            return reason.gpuIndex != null
              ? t("reasonGpuMemoryOf", values)
              : t("reasonGpuMemory", values);
          }
          case "free-memory-required":
            return t("reasonFreeMemory", {
              counts:
                counts(reason.freeBytes, reason.requiredBytes) ||
                counts(
                  freeMemory?.ramAvailableBytes,
                  freeMemory?.ramRequiredBytes,
                ),
            });
          case "gpu-sharing-required":
            return t("reasonGpuSharing");
          // localmodels 0.1.0.dev39 reports it; later versions plan by the
          // GPU memory free instead.
          case "gpu-ownership-unknown":
            return t("reasonGpuOwnership");
          case "gateway-port-in-use":
            return t("reasonGatewayPortInUse");
          case "harness-unavailable":
            return t("reasonHarnessUnavailable");
          case "facts-unavailable":
            return t("reasonFacts");
          case "cuda-driver-update-required": {
            const has = reason.detectedCudaVersion;
            const needs = reason.requiredCudaVersion;
            const driver = window.lingerSetup.minDriverForCuda?.(needs);
            if (has && needs)
              return driver
                ? t("reasonCudaUpdateDriver", {
                    has: String(has),
                    needs: String(needs),
                    driver: String(driver),
                  })
                : t("reasonCudaUpdate", {
                    has: String(has),
                    needs: String(needs),
                  });
            if (needs)
              return driver
                ? t("reasonCudaTooOldDriver", {
                    needs: String(needs),
                    driver: String(driver),
                  })
                : t("reasonCudaTooOldNeeds", { needs: String(needs) });
            return t("reasonCudaTooOld");
          }
          case "cuda-driver-version-unknown":
            return reason.requiredCudaVersion
              ? t("reasonCudaUnknownNeeds", {
                  needs: String(reason.requiredCudaVersion),
                })
              : t("reasonCudaUnknown");
          case "unsupported-platform":
            return t("reasonUnsupported");
          // Blocked now, it names another inference app holding a Mac's
          // memory.
          case "plan-unavailable":
            return t(held ? "reasonPlanHeld" : "reasonPlanUnavailable");
          default:
            return held
              ? freeMemory
                ? t("reasonHeld")
                : t("reasonHeldGeneric")
              : t("reasonUnavailable");
        }
      };
      const reasonsText = (models, held) =>
        [
          ...new Set(
            (models.reasons?.length ? models.reasons : [{ code: "" }]).map(
              (reason) => reasonText(reason, held, models.freeMemory),
            ),
          ),
        ].join(" ");
      const RECHECKABLE_REASONS = new Set([
        "cuda-driver-update-required",
        "cuda-driver-version-unknown",
        "gateway-port-in-use",
        "harness-unavailable",
      ]);
      const CUDA_DRIVER_CODES = new Set([
        "cuda-driver-update-required",
        "cuda-driver-version-unknown",
      ]);
      const cudaDriverHeld = (models) =>
        Boolean(
          models.reasons?.some((reason) => CUDA_DRIVER_CODES.has(reason.code)),
        );

      // The model step 2 shows: the one picked, else the kit's pick, from
      // the list the picker offers when the kit could list them.
      const chosenModel = (models) => {
        if (models.state !== "checked") return undefined;
        const list = models.models ?? [];
        const fallback = models.model && {
          library: models.model.library,
          name: models.model.name,
          downloadBytes: models.model.downloadBytes,
          diskBytes: models.model.diskBytes,
          memoryBytes: models.model.memoryBytes,
          fits: true,
        };
        return (
          list.find((option) => option.library === pickedModel) ??
          list.find((option) => option.recommended) ??
          list.find((option) => option.library === models.model?.library) ??
          fallback ??
          undefined
        );
      };
      // Why the picked model cannot be installed, in the page's words.
      const modelCheckText = (priced) =>
        priced.code === "MEMORY_INSUFFICIENT"
          ? t("modelNoMemory", { needed: size(priced.memoryBytes ?? 0) })
          : priced.code === "DISK_INSUFFICIENT"
            ? t("modelNoDisk", {
                needed: size(priced.diskBytes ?? 0),
                free: size(priced.diskFreeBytes ?? 0),
              })
            : t("modelCantPlan");
      // The subline: who makes it; the build is in the name.
      const cardSub = (option) => option.publisher ?? "";
      // Two builds of one model differ at a glance: the build follows the
      // name.
      const nameText = (option, options) =>
        [option.name, buildText(option, options)].filter(Boolean).join(" · ");
      // Sets a text only when it changed, so a cross-fade is not restarted.
      const setText = (el, text) => {
        if (el.textContent !== text) el.textContent = text;
      };

      // The model card on step 2: what the model is, how good and fast it
      // is here and the memory it takes on this computer.
      // While this computer is still checked it is the card's outline,
      // quietly shimmering, and fills in once the check answers.
      const renderModelCard = (local, models, option, busy, pending) => {
        const options = models.models ?? [];
        const total = models.totalMemoryBytes ?? models.memoryBytes;
        const priced =
          pickedModel && local.modelCheck?.library === pickedModel
            ? local.modelCheck
            : undefined;
        const held = models.state === "checked" && !!models.blockedNow;
        const mcard = $("local-row");
        const wasPending = mcard.dataset.pending === "true";
        mcard.dataset.pending = String(pending);
        mcard.setAttribute("aria-busy", String(pending));
        setText(
          $("local-model-name"),
          pending
            ? ""
            : option
              ? nameText(option, options)
              : t("localNotAvailable"),
        );
        setText(
          $("local-model-sub"),
          pending ? t("checkingComputer") : option ? cardSub(option) : "",
        );
        $("local-model-sub").hidden = !$("local-model-sub").textContent;
        const icon = $("local-model-icon");
        const brand = modelBrand(pending ? undefined : option);
        if (icon.dataset.brand !== brand.brand || !icon.firstChild) {
          icon.dataset.brand = brand.brand;
          icon.dataset.fullBleed = String(brand.fullBleed);
          icon.innerHTML = brand.html;
        }
        icon.hidden = !pending && !option;
        $("model-change").hidden = !pending && options.length < 2;
        $("model-change").disabled = busy || pending;
        // The answer fades in over the outline.
        if (wasPending && !pending && !mcard.hidden)
          for (const part of mcard.children)
            anim(part, [{ opacity: 0.35 }, { opacity: 1 }], {
              duration: 420,
              easing: EASE,
            });
        if (pending) {
          $("local-model-why-row").hidden = true;
          for (const id of ["local-model-quality", "local-model-speed"]) {
            setText($(id), "");
            $(id).parentElement.hidden = false;
          }
          $("local-model-memory").hidden = false;
          setText($("local-model-mem"), "");
          $("local-model-sys").hidden = true;
          $("local-model-bar").style.width = "0%";
          return { checking: true, refused: false };
        }
        const why = $("local-model-why-row");
        const whyLine = held
          ? ["err", reasonsText(models, true)]
          : priced?.state === "checking"
            ? ["busy", t("checkingModel")]
            : priced?.state === "checked" && !priced.fits
              ? ["err", modelCheckText(priced)]
              : ["err", ""];
        why.dataset.tone = whyLine[0];
        setText($("local-model-why"), whyLine[1]);
        why.hidden = !whyLine[1];
        const quality = option ? qualityText(option) : "–";
        const speed = option ? speedText(option) : "–";
        setText($("local-model-quality"), quality);
        setText($("local-model-speed"), speed);
        $("local-model-quality").parentElement.hidden = quality === "–";
        $("local-model-speed").parentElement.hidden = speed === "–";
        const memory = option?.memoryBytes;
        $("local-model-memory").hidden = !memory || !total;
        if (memory && total) {
          setText(
            $("local-model-mem"),
            t("memOf", { used: gigabytes(memory), total: gigabytes(total) }),
          );
          // What the system and other apps hold now, when the kit says
          // how much is free; the model after it; the rest is free.
          const free = models.availableMemoryBytes;
          const model = Math.min(1, Math.max(0.02, memory / total));
          const held =
            free != null && free < total
              ? Math.min(1 - model, (total - free) / total)
              : 0;
          const percent = (part) => (part * 100).toFixed(1) + "%";
          $("local-model-sys").hidden = held <= 0;
          $("local-model-sys").style.width = percent(held);
          $("local-model-bar").style.width = percent(model);
          $("local-model-sys-key").hidden = held <= 0;
          setText($("local-model-sys-name"), t("memSystemComputer"));
          setText($("local-model-key"), nameText(option, options));
        }
        return {
          checking: priced?.state === "checking",
          refused: priced?.state === "checked" && !priced.fits,
        };
      };

      // The model picker: every model the kit lists here, best first, with
      // how good and fast each is; one that cannot run here is dimmed and
      // says what it needs.
      let pickerKey = "";
      const renderPicker = (models, chosen, busy) => {
        const options = models.state === "checked" ? (models.models ?? []) : [];
        const total = models.totalMemoryBytes ?? models.memoryBytes;
        $("model-sheet-title").textContent = t("pickerTitleComputer");
        const key = JSON.stringify([
          options,
          total,
          document.documentElement.lang,
        ]);
        const list = $("model-list");
        if (key !== pickerKey) {
          pickerKey = key;
          const fastest = Math.max(
            1,
            ...options.filter((o) => o.fits).map((o) => o.decodeTokS ?? 0),
          );
          // What fits comes first, in the kit's order; what this computer
          // cannot run follows, dimmed.
          const ordered = [
            ...options.filter((o) => o.fits),
            ...options.filter((o) => !o.fits),
          ];
          list.innerHTML = ordered
            .map((option) => {
              const build = buildText(option, options);
              const brand = modelBrand(option);
              const chips = [
                `<span class="mc">${esc(size(option.downloadBytes))}</span>`,
                option.recommended
                  ? `<span class="mc" data-kind="best">${esc(t("bestFit"))}</span>`
                  : "",
                option.role === "fastest" && !option.recommended
                  ? `<span class="mc">${esc(t("fastest"))}</span>`
                  : "",
              ].join("");
              const meter = (label, value, text = "") =>
                `<span class="meter">${esc(label)}<s><i style="transform: scaleX(${Math.min(1, Math.max(0.04, value)).toFixed(3)})"></i></s>${text ? `<em>${esc(text)}</em>` : ""}</span>`;
              const lower = option.fits
                ? `<span class="meters">${
                    option.quality != null
                      ? meter(
                          t("quality"),
                          option.quality / 80,
                          qualityText(option),
                        )
                      : ""
                  }${
                    option.decodeTokS != null
                      ? meter(
                          t("speed"),
                          option.decodeTokS / fastest,
                          speedText(option),
                        )
                      : ""
                  }</span>`
                : `<span class="needs">${esc(needsText(option, total))}</span>`;
              return `<button type="button" class="mrow" role="radio"
                data-library="${esc(option.library)}"
                data-rec="${option.recommended ? "true" : "false"}"
                aria-checked="false"><span class="radio" aria-hidden="true">${RADIO}</span><span class="m-ico" data-brand="${brand.brand}" data-full-bleed="${brand.fullBleed}" aria-hidden="true">${brand.html}</span><span><span class="nm">${esc(option.name)}${build ? ` <em>· ${esc(build)}</em>` : ""}</span><span class="tg">${esc(cardSub(option))}</span></span><span class="chips">${chips}</span>${lower}</button>`;
            })
            .join("");
        }
        for (const row of list.querySelectorAll(".mrow")) {
          const option = options.find((o) => o.library === row.dataset.library);
          const on = option?.library === chosen?.library;
          row.setAttribute("aria-checked", String(on));
          row.disabled = busy || !option?.fits;
          row.tabIndex = on ? 0 : -1;
        }
      };
      const sheetRows = () =>
        [...$("model-list").querySelectorAll(".mrow")].filter(
          (row) => !row.disabled,
        );
      const openSheet = () => {
        if (sheetOpen) return;
        sheetOpen = true;
        $("model-sheet").hidden = false;
        $("model-change").setAttribute("aria-expanded", "true");
        render();
        const rows = [...$("model-list").querySelectorAll(".mrow")];
        if (REDUCE) {
          fadeIn($("model-sheet"));
        } else {
          anim($("model-sheet-scrim"), [{ opacity: 0 }, { opacity: 1 }], {
            duration: 300,
            easing: "linear",
          });
          anim(
            $("model-sheet-panel"),
            [{ transform: "translateY(100%)" }, { transform: "none" }],
            { duration: 420, easing: EASE },
          );
          rows.forEach((row, i) =>
            anim(
              row,
              [
                { opacity: 0, transform: "translateY(12px)" },
                { opacity: 1, transform: "none" },
              ],
              { duration: 420, delay: 140 + i * 45, easing: EASE },
            ),
          );
        }
        (
          $("model-list").querySelector('.mrow[aria-checked="true"]') ??
          sheetRows()[0] ??
          $("model-sheet-close")
        ).focus({ preventScroll: true });
      };
      const closeSheet = (refocus = true) => {
        if (!sheetOpen) return;
        sheetOpen = false;
        $("model-change").setAttribute("aria-expanded", "false");
        const done = () => {
          if (sheetOpen) return;
          $("model-sheet").hidden = true;
          for (const el of [$("model-sheet-scrim"), $("model-sheet-panel")])
            el.getAnimations?.().forEach((a) => a.cancel());
        };
        const out = REDUCE
          ? null
          : anim(
              $("model-sheet-panel"),
              [{ transform: "none" }, { transform: "translateY(100%)" }],
              { duration: 320, easing: EASE_IO, fill: "forwards" },
            );
        anim($("model-sheet-scrim"), [{ opacity: 1 }, { opacity: 0 }], {
          duration: REDUCE ? 150 : 300,
          easing: "linear",
          fill: "forwards",
        });
        if (out) out.finished.then(done, done);
        else done();
        if (refocus) $("model-change").focus({ preventScroll: true });
      };
      // A pick closes the picker, the card changes to it, and the model is
      // priced again for this computer's memory and disk.
      const pickModel = (library) => {
        const models = state.localServer.localModels;
        const option = (models.models ?? []).find((o) => o.library === library);
        if (!option?.fits) return;
        const changed = chosenModel(models)?.library !== library;
        pickedModel = library;
        render();
        setTimeout(() => closeSheet(), REDUCE ? 0 : 160);
        if (!changed) return;
        anim(
          $("local-row"),
          [
            { opacity: 0.35, transform: "translateY(4px)" },
            { opacity: 1, transform: "none" },
          ],
          {
            duration: REDUCE ? 150 : 420,
            delay: REDUCE ? 0 : 200,
            easing: EASE,
          },
        );
        if (!option.recommended)
          setup
            .run({ op: "local.model.check", model: library })
            .then((next) => {
              state = next;
              render();
            })
            .catch(() => {});
      };

      // The welcome view: the intro, the three sources, then the chosen
      // source's settings with Install. Nothing here waits for the check of
      // this computer: until it answers, only the local model shows that it
      // is still being checked.
      const renderWelcome = (local, busy) => {
        const section = document.querySelector('[data-step="welcome"]');
        const available = local.available;
        section.dataset.local = String(available);
        const models = local.localModels;
        if (available && step === "welcome") {
          if (stage === undefined) enterStage(introDone ? "choose" : "intro");
          if (
            stage === "intro" &&
            state.windowShown !== false &&
            document.visibilityState !== "hidden"
          )
            startIntro();
          if (stage === "intro" && introDone) handOff();
          if (!runtimesAsked) {
            runtimesAsked = true;
            // The rows come through onState; the reply may be older than
            // a state pushed meanwhile, so it is not applied.
            setup.run({ op: "local.runtimes.check" }).catch(() => {});
          }
        }
        const known =
          models.state === "checked" || models.state === "unavailable";
        // Until the person picks, the advice follows the check, and settles
        // once its answer is in; the glider carries the change.
        if (!picked && !settled) source = defaults();
        if (known) settled = true;
        // Still checking: the local model can be picked and shows so.
        const pending = !known;
        const model =
          models.state === "checked" && models.eligible && models.model;
        const held = models.state === "checked" && !!models.blockedNow;
        const heldModel = held && models.model;
        const behind = modelBehind(local);
        const localUsable = Boolean(model) && !behind;
        // The local model can be picked while the check runs, but Continue
        // only goes on to it once the check found it usable or is still
        // checking; a local model that turned out not to fit stays put.
        const localOpen = localUsable || (pending && !behind);
        const rows = runtimeRows(local);
        const signedIn = ["codex", "claude"].filter(
          (runtime) => rows[runtime]?.signedIn,
        );
        const working = Object.values(rows).find(
          (row) => row.state === "installing" || row.state === "signing_in",
        );
        const settings = available && stage === "settings";
        const choosing = available && stage === "choose";
        const checkingStage = available && stage === "intro";

        // The bar under the stage: the local model's progress after the
        // person left its wait.
        $("wz-stage").hidden = checkingStage;
        $("stage-bar").hidden = !available || checkingStage || !behind;
        $("source-back").hidden = !settings;
        $("model-behind").hidden = !behind;
        if (behind) {
          const percent = modelPercent(local.backgroundModel);
          $("model-behind-fill").style.width = percent + "%";
          $("model-behind-text").textContent = t("modelBehind", { percent });
        }

        const NAMES = {
          local: t("localModel"),
          byok: "BYOK",
          subscription: t("subscription"),
        };
        setText(
          $("welcome-title"),
          settings
            ? NAMES[source]
            : available
              ? t("chooseTitle")
              : t("welcomeTitle"),
        );
        // The welcome: the mark and the title.
        const checking = $("welcome-checking");
        checking.hidden = !checkingStage && !handing;
        if (checkingStage)
          checking.dataset.intro = introStarted ? "playing" : "waiting";
        else delete checking.dataset.intro;
        if (!introStarted) introWords();

        $("local-setup").hidden = !choosing && !settings;
        $("source-grid").hidden = !choosing;
        $("source-panel").hidden = !settings;

        // One line under each name: what the source is, or why the local
        // model cannot be picked.
        const localCard = document.querySelector(
          '.source-card[data-value="local"]',
        );
        setText(
          $("source-local-about"),
          behind
            ? t("localMetaBehind", {
                percent: modelPercent(local.backgroundModel),
              })
            : model
              ? t("sourceLocalAbout")
              : held
                ? t("onHold")
                : known
                  ? t("localNotAvailable")
                  : t("checkingComputer"),
        );
        // A quiet shimmer on that line while the check runs.
        localCard.dataset.pending = String(pending && !behind);
        for (const card of document.querySelectorAll(".source-card")) {
          const value = card.dataset.value;
          const off = value === "local" && !localOpen;
          card.disabled = busy || off;
          card.setAttribute("aria-checked", String(source === value));
          // One card takes Tab; the arrows move between them.
          card.tabIndex = source === value ? 0 : -1;
        }
        if (localCard.disabled && source === "local" && !busy)
          localCard.tabIndex = 0;
        // The selection glides to the picked card.
        const selected = document.querySelector(
          '.source-card[aria-checked="true"]',
        );
        $("glider").hidden = !selected;
        if (selected) {
          const y = `translateY(${selected.offsetTop}px)`;
          if ($("glider").style.transform !== y)
            $("glider").style.transform = y;
        }

        // Why the local model cannot be picked, under the cards.
        const unavailableText = known
          ? models.state === "checked"
            ? reasonsText(models, false)
            : t("cannotCheck")
          : "";
        $("plan-why").textContent = !choosing
          ? ""
          : behind || model
            ? ""
            : held
              ? t("heldWhy", { reasons: reasonsText(models, true) })
              : unavailableText;
        $("plan-why").hidden = !$("plan-why").textContent;
        renderDriver(local, models, busy, choosing && !behind);

        // Step 2: the chosen source.
        $("local-row").hidden = source !== "local";
        $("subscription-row").hidden = source !== "subscription";
        $("byok-row").hidden = source !== "byok";
        const option = model || heldModel ? chosenModel(models) : undefined;
        const card = renderModelCard(
          local,
          models,
          option,
          busy,
          pending && !behind,
        );
        if (!option && !held && !pending) {
          setText($("local-model-why"), unavailableText);
          $("local-model-why-row").hidden = !unavailableText;
        }
        renderPicker(models, option, busy);
        renderRuntimes(rows, busy);
        mainByok.sync(busy || byokTesting);

        // Where Linger installs, for every source, with a way to change it.
        // A folder Linger cannot use, or a disk without room for the
        // services and the local model, is said inside the row.
        const location = local.location;
        const modelCheck = local.modelCheck;
        const modelDisk =
          source !== "local" || !option
            ? 0
            : (modelCheck?.library === option.library &&
                modelCheck?.diskBytes) ||
              option.diskBytes ||
              option.downloadBytes ||
              0;
        const neededBytes = (location.minFreeBytes ?? 0) + modelDisk;
        const spaceLow =
          !location.error &&
          location.freeBytes != null &&
          neededBytes > 0 &&
          location.freeBytes < neededBytes;
        const locationWarning =
          location.error ??
          (spaceLow
            ? t("locationSpaceLow", {
                needed: String(Math.ceil(neededBytes / GB)),
                free: String(Math.floor(location.freeBytes / GB)),
              })
            : "");
        const shownPath =
          (location.error && location.rejectedPath) || location.path;
        $("location-row").dataset.warn = String(Boolean(locationWarning));
        // Shortened in the middle so the drive and the folder's own name
        // both stay; the whole path is in the tooltip.
        const pathEl = $("location-path");
        let budget = location.custom || location.error ? 22 : 32;
        pathEl.textContent = shortPath(shownPath, budget);
        while (pathEl.scrollWidth > pathEl.clientWidth && budget > 12)
          pathEl.textContent = shortPath(shownPath, (budget -= 2));
        pathEl.title = shownPath;
        $("location-sub").textContent = locationWarning;
        $("location-sub").hidden = !locationWarning;
        $("location-reset").hidden = !location.custom && !location.error;
        $("location-change").disabled = busy;
        $("location-reset").disabled = busy;

        // The button and what it does. Continue opens the settings; Install
        // waits for what the source needs.
        $("source-continue").hidden = !choosing;
        $("source-continue").disabled =
          busy || (source === "local" && !localOpen);
        $("local-install").hidden = !settings;
        $("get-started").hidden = available;
        const ready =
          source === "local"
            ? localUsable && !held && !card.checking && !card.refused
            : source === "byok"
              ? mainByok.complete()
              : signedIn.length > 0;
        $("local-install").disabled =
          busy ||
          !ready ||
          byokTesting ||
          Boolean(working) ||
          Boolean(locationWarning);
        const label = byokTesting
          ? '<span class="spinner"></span>' + esc(t("checkingByok"))
          : esc(t(behind ? "continueSetup" : "install"));
        if ($("local-install-label").innerHTML !== label)
          $("local-install-label").innerHTML = label;
        const order = ["codex", "claude"].filter((runtime) =>
          signedIn.includes(runtime),
        );
        // One short line under the button, on step 2 only.
        $("plan-line").hidden = !available || checkingStage;
        $("plan-line").textContent =
          !settings || source !== "subscription"
            ? ""
            : working
              ? t("planWaitRuntime", { runtime: RUNTIMES[working.runtime] })
              : order.length === 2
                ? t("planBoth", { first: RUNTIMES[order[0]] })
                : order.length
                  ? ""
                  : t("planSignInFirst");
      };

      // NVIDIA driver help for a local model held by the driver.
      const renderDriver = (local, models, busy, visible) => {
        const held = models.state === "checked" && !!models.blockedNow;
        const canRecheck =
          held ||
          (models.state === "checked" &&
            !models.eligible &&
            !!models.reasons?.some((reason) =>
              RECHECKABLE_REASONS.has(reason.code),
            ));
        const showDriverActions =
          visible &&
          models.state === "checked" &&
          !models.eligible &&
          cudaDriverHeld(models);
        const nvidiaApp =
          state.platform === "win32"
            ? (state.driverUpdate?.nvidiaApp ?? "none")
            : "none";
        const directDriverInstall =
          state.platform === "win32" &&
          Boolean(state.driverUpdate?.directInstallSupported);
        const driverInstallState = state.driverUpdate?.installState ?? {
          phase: "idle",
        };
        const driverInstalling =
          driverInstallState.phase === "downloading" ||
          driverInstallState.phase === "verifying" ||
          driverInstallState.phase === "installing";
        let driverStatusText = "";
        if (driverInstallState.phase === "downloading") {
          driverStatusText =
            driverInstallState.totalBytes != null
              ? t("driverDownloadingSize", {
                  version: driverInstallState.version,
                  done: size(driverInstallState.completedBytes),
                  total: size(driverInstallState.totalBytes),
                })
              : t("driverDownloading", { version: driverInstallState.version });
        } else if (driverInstallState.phase === "verifying") {
          driverStatusText = t("driverVerifying", {
            version: driverInstallState.version,
          });
        } else if (driverInstallState.phase === "installing") {
          driverStatusText = t("driverInstalling", {
            version: driverInstallState.version,
          });
        } else if (driverInstallState.phase === "reboot_required") {
          driverStatusText = t("driverRebootRequired", {
            version: driverInstallState.version,
          });
        } else if (driverInstallState.phase === "completed") {
          driverStatusText = t("driverInstallComplete", {
            version: driverInstallState.version,
          });
        } else if (driverInstallState.phase === "failed") {
          driverStatusText = t(
            driverInstallState.code === "UAC_CANCELLED"
              ? "driverUacCancelled"
              : driverInstallState.code === "SIGNATURE_INVALID"
                ? "driverSignatureInvalid"
                : driverInstallState.code === "UNSUPPORTED_GPU"
                  ? "driverUnsupportedGpu"
                  : "driverInstallFailed",
          );
        }
        $("local-driver-status").hidden =
          !showDriverActions || !driverStatusText;
        $("local-driver-status").textContent = driverStatusText;
        $("local-driver-install").hidden =
          !showDriverActions || !directDriverInstall;
        $("local-driver-install").disabled = busy || driverInstalling;
        $("local-driver-action").hidden = !showDriverActions;
        $("local-driver-action").disabled = busy || driverInstalling;
        $("local-driver-action").textContent = t(
          nvidiaApp === "nvidia_app"
            ? "openNvidiaApp"
            : nvidiaApp === "geforce_experience"
              ? "openGeForceExperience"
              : "downloadNvidiaDriver",
        );
        $("local-driver-guide").hidden = !showDriverActions;
        $("local-driver-guide").disabled = busy;
        $("local-recheck").hidden = !visible || !canRecheck;
        $("local-recheck").disabled = busy || driverInstalling;
        $("local-plan-actions").hidden =
          $("local-recheck").hidden && !showDriverActions;
      };

      // Each runtime row: what it is on this computer, and the one thing
      // left to do on the right.
      const renderRuntimes = (rows, busy) => {
        for (const el of document.querySelectorAll(".choice.runtime")) {
          const runtime = el.dataset.runtime;
          const row = rows[runtime] ?? {
            runtime,
            installed: false,
            signedIn: false,
            state: "checking",
          };
          const idle = row.state === "idle";
          const installing = row.state === "installing";
          const signing = row.state === "signing_in";
          const done = row.signedIn;
          const sub = el.querySelector("[data-runtime-sub]");
          sub.dataset.warn = String(Boolean(row.failed) && idle);
          sub.textContent =
            row.state === "checking"
              ? t("rtChecking")
              : installing
                ? t("rtInstalling")
                : signing
                  ? t("rtSigningIn")
                  : row.failed === "install"
                    ? row.message || t("rtInstallFailed")
                    : row.failed === "signin"
                      ? SIGN_IN_REASONS[row.reason]
                        ? t(SIGN_IN_REASONS[row.reason])
                        : row.message || t("signInFailed")
                      : done
                        ? t("signedIn")
                        : row.installed
                          ? t("rtInstalledNotSignedIn")
                          : t("rtNotInstalled");
          sub.title = sub.textContent;
          const install = el.querySelector("[data-runtime-install]");
          install.hidden = !idle || row.installed;
          install.textContent = t(
            row.failed === "install" ? "tryAgain" : "install",
          );
          install.disabled = busy;
          const signin = el.querySelector("[data-runtime-signin]");
          if (signin) {
            signin.hidden = !idle || !row.installed || row.signedIn;
            signin.textContent = t(
              row.failed === "signin" ? "tryAgain" : "signIn",
            );
            signin.disabled = busy;
          }
          const progress = el.querySelector(".runtime-progress");
          progress.hidden = !installing;
          if (installing) {
            const { completed = 0, total } = row.install ?? {};
