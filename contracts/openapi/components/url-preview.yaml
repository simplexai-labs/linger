components:
  schemas:
    UrlPreviewFraming:
      type: object
      additionalProperties: false
      required: [framing]
      properties:
        framing:
          type: string
          enum: [allowed, refused, unknown]
          description: >-
            refused: the final response forbids framing by another site
            (X-Frame-Options DENY or SAMEORIGIN, or a CSP frame-ancestors
            that allows no page of the Linger page's scheme), so the panel
            offers a new tab instead of a frame. allowed: it does not.
            unknown: TeamHub did not read the page, because it was
            unreachable, slow or redirected too often, TeamHub was busy with
            other probes, or it is on a non-public address or a port other
            than 80 and 443, which TeamHub never requests; the panel frames
            it and lets the browser decide.
