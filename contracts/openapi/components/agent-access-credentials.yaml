components:
  schemas:
    ManagedAgentAccessCredentialRequest:
      type: object
      additionalProperties: false
      required: [label, computer_id, workspace_grant_id]
      properties:
        label: { type: string, minLength: 1, maxLength: 128 }
        computer_id:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            The Local Computer the Runner Gateway installs this credential on.
            Together with workspace_grant_id it must match the Agent's current
            placement; a Computer the Agent moved away from is refused. The
            credential does not expire: it ends when the Agent's placement
            changes, when the Agent is deleted, or when the next credential
            for the Agent is issued.
        workspace_grant_id:
          type: string
          minLength: 1
          maxLength: 64
        held_token_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: >-
            The SHA-256 of the token the Computer reports it holds. When it is
            the Agent's live credential for the current placement, nothing is
            issued and the response is 204; otherwise a new credential replaces
            it.
    AgentAccessCredential:
      type: object
      additionalProperties: false
      required: [credential_id, access_token, agent_id, tenant_id]
      properties:
        credential_id: { type: string }
        access_token:
          type: string
          pattern: "^th_agent_[A-Za-z0-9_-]{43}$"
          description: Returned once. Store privately; never include in logs or model prompts.
        agent_id: { type: string }
        tenant_id: { type: string }
