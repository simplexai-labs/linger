components:
  schemas:
    InternalErrorCode:
      type: string
      enum:
        - invalid_request
        - unauthenticated
        - forbidden
        - not_found
        - stale_membership
        - document_state_corrupt
        - idempotency_conflict
        - state_conflict
        - asset_unavailable
        - payload_too_large
        - rate_limited
        - validation_failed
        - unsupported_document
        - unsupported_format
        - state_bundle_inconsistent
        - runtime_unavailable
        - dependency_unavailable
        - deadline_exceeded
        - internal_error
    DocumentInternalError:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          $ref: "#/components/schemas/InternalErrorCode"
        message:
          type: string
          minLength: 1
          maxLength: 1024
        retryable:
          type: boolean
        request_id:
          type: string
          maxLength: 128
        retry_after_ms:
          type: integer
          minimum: 0
          maximum: 60000
  responses:
    DocumentInternalError:
      description: Typed internal service failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DocumentInternalError"
