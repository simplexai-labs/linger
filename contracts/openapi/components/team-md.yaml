components:
  schemas:
    TeamMdPattern:
      type: string
      description: >-
        Collaboration pattern declared in the team.md frontmatter. TeamHub matches this value
        exactly; it does not normalize spelling, spacing, or case.
      enum:
        - classify-and-act
        - fan-out-and-synthesize
        - adversarial-verification
        - tournament
        - loop-until-done
    TeamMdParticipant:
      type: object
      description: One Orchestrator or Team Member declared in a team.md.
      additionalProperties: false
      required:
        - name
        - actor_id
        - report_to
        - receive_from
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Document-local display name. Relationships reference this value, not the Actor ID.
        actor_id:
          $ref: "./common.yaml#/components/schemas/Id"
          description: Agent Actor ID. It must be an active member of the owning Room.
        role:
          type: string
          maxLength: 1000
          description: Optional description of what this participant is responsible for.
        report_to:
          type: array
          maxItems: 20
          description: Declared names this participant reports to. Empty when the document says none.
          items:
            type: string
            minLength: 1
            maxLength: 120
        receive_from:
          type: array
          maxItems: 20
          description: Declared names this participant receives handoffs from. Empty when the document says none.
          items:
            type: string
            minLength: 1
            maxLength: 120
    TeamMdDocument:
      type: object
      description: >-
        One Room's parsed collaboration protocol document. TeamHub owns parsing so every consumer
        reads the same structure; raw_markdown is the verbatim submitted content.
      additionalProperties: false
      required:
        - collaborate_pattern
        - task_goal
        - orchestrator
        - members
        - raw_markdown
        - revision
        - updated_at
      properties:
        collaborate_pattern:
          $ref: "#/components/schemas/TeamMdPattern"
        task_goal:
          type: string
          minLength: 1
          maxLength: 4000
          description: The shared goal this team is collaborating to reach.
        orchestrator:
          $ref: "#/components/schemas/TeamMdParticipant"
        members:
          type: array
          minItems: 1
          maxItems: 50
          description: Team Members in document declaration order.
          items:
            $ref: "#/components/schemas/TeamMdParticipant"
        raw_markdown:
          type: string
          minLength: 1
          maxLength: 65536
          description: The submitted team.md content, stored verbatim and projected to Agents unchanged.
        revision:
          type: integer
          format: int64
          minimum: 1
          description: Monotonic revision of this Room's team.md. Each accepted submission replaces the previous one.
        updated_at:
          type: string
          format: date-time
          description: When TeamHub accepted the current revision.
