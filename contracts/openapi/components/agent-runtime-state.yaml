          format: date-time
        display_name:
          type: string
        platform:
          type: string
          enum: [darwin, linux, win32]
        capacity:
          type: integer
          minimum: 0
        runtimes:
          type: array
          items:
            type: string
            enum: [codex, claude, pi]
        runtime_diagnostics:
          type: array
          items:
            type: object
            additionalProperties: true
        workspace_grants:
          type: array
          items:
            type: object
            additionalProperties: true
        daemon_version:
          type: string
          minLength: 1
          maxLength: 64
        recommended_version:
          type: string
          minLength: 1
          maxLength: 64
          description: Computer release this deployment ships; omission keeps the last one.
