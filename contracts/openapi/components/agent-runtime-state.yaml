        type:
          type: string
          const: activity.started
        activity_id:
          $ref: "#/components/schemas/AgentRuntimeActivityId"
        kind:
          $ref: "#/components/schemas/AgentRuntimeActivityKind"
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: array
          maxItems: 6
          items:
            $ref: "#/components/schemas/AgentRuntimeActivityContentBlock"
    AgentRuntimeActivityUpdatedEvent:
      type: object
      additionalProperties: false
      required: [type, activity_id, detail]
      properties:
        type:
          type: string
          const: activity.updated
        activity_id:
          $ref: "#/components/schemas/AgentRuntimeActivityId"
        detail:
          type: string
          minLength: 1
          maxLength: 200
    AgentRuntimeActivityFinishedEvent:
      type: object
      additionalProperties: false
      required: [type, activity_id, outcome]
      properties:
        type:
          type: string
          const: activity.finished
        activity_id:
          $ref: "#/components/schemas/AgentRuntimeActivityId"
        outcome:
          $ref: "#/components/schemas/AgentRuntimeActivityOutcome"
        content:
          type: array
          maxItems: 6
          items:
            $ref: "#/components/schemas/AgentRuntimeActivityContentBlock"
    AgentRuntimePresentationOutputCreatedEvent:
      type: object
      additionalProperties: false
      required: [type, output_id, output_kind, surface]
      properties:
        type:
          type: string
          const: presentation.output_created
        output_id:
          type: string
          minLength: 1
          maxLength: 256
        output_kind:
          type: string
          enum: [message, card]
        surface:
          type: string
