components:
  schemas:
    AgentRuntimeCommandId:
      type: string
      minLength: 8
      maxLength: 256
      pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"
    AgentRuntimeInt64:
      type: string
      pattern: "^(0|[1-9][0-9]*)$"
      maxLength: 19
    AgentRuntimePositiveInt64:
      type: string
      pattern: "^[1-9][0-9]*$"
      maxLength: 19
    AgentServiceEpoch:
      type: string
      minLength: 1
      maxLength: 256
      description: >-
        The epoch a starting Agent Service process opened. Every Runtime write
        names it; a write naming an earlier epoch is rejected with CONTEXT_FENCED.
    StartAgentServiceEpochRequest:
      type: object
      additionalProperties: false
      required: [epoch]
      properties:
        epoch:
          $ref: "#/components/schemas/AgentServiceEpoch"
    AgentServiceEpochStart:
      type: object
      additionalProperties: false
      required: [interrupted_run_ids, waiting_context_keys]
      properties:
        interrupted_run_ids:
          type: array
          items:
            type: string
        waiting_context_keys:
          type: array
          maxItems: 1000
          description: Contexts with a queued Run or Message steer, for the new process to take up at once.
          items:
            $ref: "#/components/schemas/AgentRuntimeContextKey"
    AnotherMePlacement:
      type: object
      additionalProperties: false
      required:
        [
          tenant_id,
          owner_actor_id,
          agent_id,
          agent_actor_id,
          computer_id,
          local_runtime_type,
          status,
        ]
      description: Where one Human's Another Me runs; background model calls for that Human run on this Computer.
      properties:
        tenant_id:
          $ref: "./common.yaml#/components/schemas/Id"
        owner_actor_id:
          $ref: "./common.yaml#/components/schemas/Id"
        agent_id:
          $ref: "./common.yaml#/components/schemas/Id"
          description: The Agent Service Agent id the Computer knows the Another Me by.
        agent_actor_id:
          $ref: "./common.yaml#/components/schemas/Id"
        computer_id:
          $ref: "./common.yaml#/components/schemas/Id"
        local_runtime_type:
          $ref: "./domain.yaml#/components/schemas/LocalRuntimeType"
        status:
          type: string
          enum: [active, updating]
    AnotherMePlacementList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/AnotherMePlacement"
    AgentRuntimeConfigSnapshot:
      type: object
      additionalProperties: false
      required:
        - agent_id
        - actor_id
        - tenant_id
        - configuration_revision
        - runtime_configuration_revision
        - content_hash
        - agent
        - runtime
        - resources
        - permission_review
      properties:
        agent_id:
          $ref: "./common.yaml#/components/schemas/Id"
        actor_id:
          $ref: "./common.yaml#/components/schemas/Id"
        tenant_id:
          $ref: "./common.yaml#/components/schemas/Id"
        configuration_revision:
          $ref: "#/components/schemas/AgentRuntimePositiveInt64"
        runtime_configuration_revision:
          allOf:
            - $ref: "#/components/schemas/AgentRuntimePositiveInt64"
          description: >-
            The configuration revision of the last Runtime or placement change.
            Later revisions changed only the profile, which a running Runtime
            adopts in place from its next claim.
        permission_review:
          type: boolean
          description: >-
            TeamHub has a Runtime permission judge, so Runs declare permission
            review and the Agent is taught the tool approval protocol. A
            deployment fact, excluded from content_hash.
        content_hash:
          type: string
          pattern: "^[a-f0-9]{64}$"
        agent:
          type: object
          additionalProperties: false
          required: [name, instructions]
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 120
            instructions:
              type: string
              minLength: 1
              maxLength: 50000
        runtime:
          $ref: "#/components/schemas/AgentRuntimeSettingsSnapshot"
        resources:
          $ref: "#/components/schemas/AgentRuntimeResourceSnapshot"
    AgentRuntimeDeletionSnapshot:
      type: object
      additionalProperties: false
      required:
        - agent_id
        - actor_id
        - tenant_id
        - configuration_revision
        - runtime
        - contexts
      properties:
        agent_id:
          $ref: "./common.yaml#/components/schemas/Id"
        actor_id:
          $ref: "./common.yaml#/components/schemas/Id"
        tenant_id:
          $ref: "./common.yaml#/components/schemas/Id"
        configuration_revision:
          $ref: "#/components/schemas/AgentRuntimePositiveInt64"
        runtime:
          $ref: "#/components/schemas/AgentRuntimeSettingsSnapshot"
        contexts:
          type: array
          items:
            $ref: "#/components/schemas/AgentExecutionContext"
    AgentRuntimeSettingsSnapshot:
      type: object
      additionalProperties: false
      required: [type, model, placement]
      properties:
        type:
          type: string
          const: local
        model:
          type: string
          minLength: 1
          maxLength: 120
        reasoning_effort:
          $ref: "./domain.yaml#/components/schemas/AgentReasoningEffort"
        placement:
          type: object
          additionalProperties: false
          required:
            - tenant_id
            - owner_actor_id
            - computer_id
            - runtime_type
            - workspace_grant_id
            - assignment_revision
          properties:
            tenant_id:
              $ref: "./common.yaml#/components/schemas/Id"
            owner_actor_id:
              $ref: "./common.yaml#/components/schemas/Id"
            computer_id:
              $ref: "./common.yaml#/components/schemas/Id"
            runtime_type:
              $ref: "./domain.yaml#/components/schemas/LocalRuntimeType"
            workspace_grant_id:
              $ref: "./common.yaml#/components/schemas/Id"
            assignment_revision:
              $ref: "#/components/schemas/AgentRuntimePositiveInt64"
    AgentRuntimeResourceSnapshot:
      type: object
      additionalProperties: false
      required: [skills, mcp_servers]
      properties:
        skills:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required:
              - skill_id
              - manifest_version
              - name
              - package_name
              - package_sha256
              - config
            properties:
              skill_id:
                $ref: "./common.yaml#/components/schemas/SkillIdentifier"
              manifest_version:
                type: string
              name:
                type: string
              package_name:
                type: string
              package_sha256:
                type: string
                pattern: "^[a-f0-9]{64}$"
              config:
                type: object
                additionalProperties: true
        mcp_servers:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required:
              [mcp_id, manifest_version, name, transport, url, allowed_tools]
            properties:
              mcp_id:
                $ref: "./common.yaml#/components/schemas/Id"
              manifest_version:
                type: string
              name:
                type: string
              transport:
                type: string
                const: streamable_http
              url:
                type: string
                format: uri
              allowed_tools:
                type: array
                items:
                  type: string
    AgentRuntimeContextKey:
      type: string
      minLength: 1
      maxLength: 1000
    AgentRuntimeContextRef:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, agent_id, room_id]
          properties:
            kind:
              type: string
              const: meta
            agent_id:
              $ref: "./common.yaml#/components/schemas/Id"
            room_id:
              $ref: "./common.yaml#/components/schemas/Id"
        - type: object
          additionalProperties: false
          required: [kind, agent_id, task_id]
          properties:
            kind:
              type: string
              const: alter_ego
            agent_id:
              $ref: "./common.yaml#/components/schemas/Id"
            task_id:
              $ref: "./common.yaml#/components/schemas/Id"
        - type: object
          additionalProperties: false
          required: [kind, agent_id, document_id]
          properties:
            kind:
              type: string
              const: document
            agent_id:
              $ref: "./common.yaml#/components/schemas/Id"
            document_id:
              $ref: "./common.yaml#/components/schemas/Id"
    AgentExecutionContext:
      type: object
      additionalProperties: false
      required:
        - ref
        - context_key
        - tenant_id
        - agent_actor_id
        - target_residency
        - state_revision
        - next_input_sequence
      properties:
        ref:
          $ref: "#/components/schemas/AgentRuntimeContextRef"
        context_key:
          $ref: "#/components/schemas/AgentRuntimeContextKey"
        tenant_id:
          $ref: "./common.yaml#/components/schemas/Id"
        agent_actor_id:
          $ref: "./common.yaml#/components/schemas/Id"
        room_kind:
          type: string
          enum: [direct, collaboration]
          description: >-
            Trusted TeamHub Room shape. Present only for a Room-bound Meta
            Context and derived from TeamHub Room authority.
        target_residency:
          type: string
          enum: [active, suspended]
        state_revision:
          $ref: "#/components/schemas/AgentRuntimePositiveInt64"
        next_input_sequence:
          $ref: "#/components/schemas/AgentRuntimeInt64"
        terminal_reason:
          type: string
          enum: [room_deleted, context_deleted]
        terminated_at:
          type: string
          format: date-time
        membership_epoch_id:
          type: string
          minLength: 1
          description: >-
            The Room membership a Room-bound Meta Context is bound to. A new
            membership rebinds the Context; the Agent Service restarts what it
            prepared under the previous one.
        shared_task_scope:
          $ref: "#/components/schemas/AgentRuntimeSharedTaskScope"
    AgentRuntimeSharedTaskScope:
      type: object
      additionalProperties: false
      description: >-
        Trusted identity of the shared Task directory this Context reads or
        writes. Present for a Room-bound Meta Context (role meta, no task_id)
        and for an alter_ego Context whose current Task generation is
        coordinated by a Room-bound Meta Context of the same Agent (role
        alter_ego, task_id required). The origin Room is that frozen
        coordinator's Room, never the Task Room.
      required: [version, tenant_id, agent_id, origin_room_id, role]
      properties:
        version:
          type: integer
          enum: [1]
        tenant_id:
          $ref: "./common.yaml#/components/schemas/Id"
        agent_id:
          $ref: "./common.yaml#/components/schemas/Id"
        origin_room_id:
          $ref: "./common.yaml#/components/schemas/Id"
        role:
          type: string
          enum: [meta, alter_ego]
        task_id:
          $ref: "./common.yaml#/components/schemas/Id"
    AgentExecutionContextList:
      type: object
      additionalProperties: false
      required: [contexts]
      properties:
        contexts:
          type: array
          items:
            $ref: "#/components/schemas/AgentExecutionContext"
    ReconcileAgentExecutionContextsRequest:
      type: object
      additionalProperties: false
      required: [limit]
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 1000
        cursor:
          type: string
          minLength: 1
          maxLength: 2000
    ReconcileAgentExecutionContextsResult:
      type: object
      additionalProperties: false
      required:
        - examined_count
        - existing_count
        - created_count
        - created_context_keys
      properties:
        examined_count:
          type: integer
          minimum: 0
        existing_count:
          type: integer
          minimum: 0
        created_count:
          type: integer
          minimum: 0
        created_context_keys:
          type: array
          items:
            $ref: "#/components/schemas/AgentRuntimeContextKey"
        next_cursor:
          type: string
          minLength: 1
          maxLength: 2000
    EnsureAgentExecutionContextRequest:
      type: object
      additionalProperties: false
      required: [ref, target_residency]
      properties:
        ref:
          $ref: "#/components/schemas/AgentRuntimeContextRef"
        target_residency:
          type: string
          enum: [active, suspended]
    EnsureAgentExecutionContextResult:
      type: object
      additionalProperties: false
      required: [created, context]
      properties:
        created:
          type: boolean
        context:
          $ref: "#/components/schemas/AgentExecutionContext"
    SetAgentExecutionContextResidencyRequest:
      type: object
      additionalProperties: false
      required: [context_key, expected_revision, target_residency]
      properties:
        context_key:
          $ref: "#/components/schemas/AgentRuntimeContextKey"
        expected_revision:
          $ref: "#/components/schemas/AgentRuntimePositiveInt64"
        target_residency:
          type: string
          enum: [active, suspended]
    DeleteAgentExecutionContextRequest:
      type: object
      additionalProperties: false
      required: [context_key, expected_revision]
      properties:
        context_key:
          $ref: "#/components/schemas/AgentRuntimeContextKey"
        expected_revision:
          $ref: "#/components/schemas/AgentRuntimePositiveInt64"
    AgentRuntimeDeletedResult:
      type: object
      additionalProperties: false
      required: [deleted]
      properties:
        deleted:
          type: boolean
    AgentRuntimeInput:
      type: object
      additionalProperties: false
      required: [input_id, payload, source_kind]
      properties:
        input_id:
          type: string
          minLength: 1
          maxLength: 1000
        payload:
          type: object
          additionalProperties: true
        source_kind:
          type: string
          enum: [inbox, trusted_turn, internal]
        source_message_id:
          type: string
          minLength: 1
          maxLength: 1000
        source_inbox_id:
          type: string
          minLength: 1
          maxLength: 1000
    StoredAgentRuntimeInput:
      type: object
      additionalProperties: false
      required: [input_id, payload, source_kind, sequence, status]
      properties:
        input_id:
          type: string
          minLength: 1
          maxLength: 1000
        payload:
          type: object
          additionalProperties: true
        source_kind:
          type: string
          enum: [inbox, trusted_turn, internal]
        source_message_id:
          type: string
          minLength: 1
          maxLength: 1000
        source_inbox_id:
          type: string
          minLength: 1
          maxLength: 1000
        sequence:
          $ref: "#/components/schemas/AgentRuntimePositiveInt64"
        status:
          type: string
          enum: [steering, handled]
        selection_result:
          type: object
          additionalProperties: true
        steer_group_id:
          type: string
        local_run_id:
          type: string
        steer_outcome:
          type: string
          enum: [applied, uncertain]
        created_at:
          type: string
          format: date-time
    AgentRuntimeAcceptedContextState:
      type: object
      additionalProperties: false
      required: [state_revision, target_residency, next_input_sequence]
      description: >-
        The Context state the accepting transaction committed. The Agent Service applies it to
        its Context record instead of reading the Context again.
      properties:
        state_revision:
          $ref: "#/components/schemas/AgentRuntimePositiveInt64"
        target_residency:
          type: string
          enum: [active, suspended]
        next_input_sequence:
          $ref: "#/components/schemas/AgentRuntimeInt64"
    AcceptAgentTrustedNotificationRequest:
      type: object
      additionalProperties: false
      required: [context_key, epoch, execution_run_ref, input]
      properties:
        context_key:
          $ref: "#/components/schemas/AgentRuntimeContextKey"
        epoch:
          $ref: "#/components/schemas/AgentServiceEpoch"
        execution_run_ref:
          type: string
          minLength: 1
          maxLength: 128
        input:
          $ref: "#/components/schemas/AgentRuntimeInput"
    AcceptAgentTrustedNotificationResult:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [committed, already_accepted]
        steer_group_id:
          type: string
          minLength: 1
    ClearAgentRuntimeSessionRequest:
      type: object
      additionalProperties: false
      required: [context_key, epoch, configuration_revision]
      properties:
        context_key:
          $ref: "#/components/schemas/AgentRuntimeContextKey"
        epoch:
          $ref: "#/components/schemas/AgentServiceEpoch"
        configuration_revision:
          $ref: "#/components/schemas/AgentRuntimePositiveInt64"
        expected_current_configuration_revision:
          allOf:
            - $ref: "#/components/schemas/AgentRuntimePositiveInt64"
          description: Loaded registration revision for automatic stale-session clearing. Requires the same active registration and rejects a Session compatible through proven profile initialization. Omit only for an explicit Session reset.
    ClearAgentRuntimeSessionResult:
      type: object
      additionalProperties: false
      required: [cleared]
      properties:
        cleared:
          type: boolean
    SubmitAgentTrustedTurnRequest:
      type: object
      additionalProperties: false
      required: [context_key, epoch, inputs]
      properties:
        context_key:
          $ref: "#/components/schemas/AgentRuntimeContextKey"
        epoch:
          $ref: "#/components/schemas/AgentServiceEpoch"
        inputs:
          type: array
          minItems: 1
          maxItems: 1024
          items:
            $ref: "#/components/schemas/AgentRuntimeInput"
    SubmitAgentTrustedTurnResult:
      type: object
      additionalProperties: false
      required: [run_id]
      properties:
        run_id:
          type: string
        created:
          type: boolean
          description: True only when this request created the Local Run; false when its inputs already had one.
        context:
          description: Present only when this request created the Local Run.
          $ref: "#/components/schemas/AgentRuntimeAcceptedContextState"
    AgentLocalRun:
      type: object
      additionalProperties: false
      required:
        [
          run_id,
          context_key,
          status,
          attempt_count,
          initial_input_ids,
          steer_input_ids,
        ]
      properties:
        cancellation_requested:
          type: boolean
        run_id:
          type: string
        context_key:
          $ref: "#/components/schemas/AgentRuntimeContextKey"
        status:
          type: string
          enum: [queued, running, succeeded, failed, canceled]
        attempt_count:
          type: integer
          minimum: 0
        initial_input_ids:
          type: array
          items:
            type: string
        steer_input_ids:
          type: array
          items:
            type: string
        terminal:
          type: object
          additionalProperties: true
    ClaimAgentLocalRunRequest:
      type: object
      additionalProperties: false
      required: [context_key, epoch, claim_id]
      properties:
        context_key:
          $ref: "#/components/schemas/AgentRuntimeContextKey"
        epoch:
          $ref: "#/components/schemas/AgentServiceEpoch"
        claim_id:
          type: string
          minLength: 1
          maxLength: 256
          description: Names this claim; a claim repeated after a lost response receives the same Run.
    ClaimedAgentLocalRun:
      type: object
      additionalProperties: false
      required: [run_id, attempt_count, inputs, continues_context]
      properties:
        cancellation_requested:
          type: boolean
          description: Current cancellation flag returned atomically with the Run claim. The production authority always returns this field.
        run_id:
          type: string
        attempt_count:
          type: integer
          minimum: 1
        inputs:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/StoredAgentRuntimeInput"
        profile_update:
          $ref: "#/components/schemas/AgentProfileUpdate"
        continues_context:
          type: boolean
          description: The Context received input before this Run's first input.
    AgentProfileUpdate:
      type: object
      additionalProperties: false
      description: >-
        The Agent's current profile, present when this Context's Runtime Session
        was started under an older profile. Agent Service puts it
        before the Run's inputs as one hidden update; TeamHub returns each
        profile revision to a Session once.
      required: [configuration_revision, name, instructions]
      properties:
        configuration_revision:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 120
        instructions:
          type: string
          minLength: 1
          maxLength: 50000
    ClaimAgentLocalRunResult:
      type: object
      additionalProperties: false
      required: [claimed]
      properties:
        claimed:
          type: boolean
        run:
          $ref: "#/components/schemas/ClaimedAgentLocalRun"
    RequeueAgentLocalRunRequest:
      type: object
      additionalProperties: false
      required: [context_key, epoch, run_id]
      properties:
        context_key:
          $ref: "#/components/schemas/AgentRuntimeContextKey"
        epoch:
          $ref: "#/components/schemas/AgentServiceEpoch"
        run_id:
          type: string
    AgentRuntimeSessionCheckpoint:
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - provider_kind
        - schema_version
        - session
        - configuration_revision
      properties:
        expected_revision:
          $ref: "#/components/schemas/AgentRuntimeInt64"
        provider_kind:
          type: string
          minLength: 1
          maxLength: 64
        schema_version:
          $ref: "#/components/schemas/AgentRuntimePositiveInt64"
        session:
          type: object
          additionalProperties: true
          description: >-
            Schema 1 stores the provider session directly. Schema 2 strictly stores
            {nativeSession, executionResources}; nativeSession is the provider object or
            null before its first thread exists. executionResources contains version=1,
            optional userProfile, effectiveSha256 and up to 100 exact Skill descriptors
            (skillId, manifestId, manifestVersion, name, packageName, packageSha256, config,
            source). No credentials or snapshot tokens. A null nativeSession requires no
            thread_id; otherwise its threadId matches thread_id. These are loaded version
            references for execution recovery, never an authorization snapshot.
        thread_id:
          type: string
          minLength: 1
          maxLength: 1000
        configuration_revision:
          $ref: "#/components/schemas/AgentRuntimePositiveInt64"
    AgentRuntimeSession:
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - provider_kind
        - schema_version
        - session
        - configuration_revision
        - revision
        - updated_at
      properties:
        expected_revision:
          $ref: "#/components/schemas/AgentRuntimeInt64"
        provider_kind:
          type: string
          minLength: 1
          maxLength: 64
        schema_version:
          $ref: "#/components/schemas/AgentRuntimePositiveInt64"
        session:
          type: object
          additionalProperties: true
          description: >-
            Schema 1 stores the provider session directly. Schema 2 strictly stores
            {nativeSession, executionResources}; nativeSession is the provider object or
            null before its first thread exists. executionResources contains version=1,
            optional userProfile, effectiveSha256 and up to 100 exact Skill descriptors
            (skillId, manifestId, manifestVersion, name, packageName, packageSha256, config,
            source). No credentials or snapshot tokens. A null nativeSession requires no
            thread_id; otherwise its threadId matches thread_id. These are loaded version
            references for execution recovery, never an authorization snapshot.
        thread_id:
          type: string
          minLength: 1
          maxLength: 1000
        configuration_revision:
          $ref: "#/components/schemas/AgentRuntimePositiveInt64"
        compatible_configuration_revision:
          allOf:
            - $ref: "#/components/schemas/AgentRuntimePositiveInt64"
          description: Read-only server proof that the current registration is exactly one revision newer due to this Agent's successful profile initialization. Returned by a fresh Session read, never trusted from provider JSON or checkpoint requests. Does not grant execution authority or alter the stored checkpoint.
        revision:
          $ref: "#/components/schemas/AgentRuntimePositiveInt64"
        updated_at:
          type: string
          format: date-time
    FinishAgentLocalRunRequest:
      type: object
      additionalProperties: false
      required: [context_key, epoch, run_id, terminal]
      properties:
        context_key:
          $ref: "#/components/schemas/AgentRuntimeContextKey"
        epoch:
          $ref: "#/components/schemas/AgentServiceEpoch"
        run_id:
          type: string
        terminal:
          type: object
          additionalProperties: true
          required: [type]
          properties:
            type:
              type: string
              enum: [succeeded, failed, canceled]
            failure:
              $ref: "#/components/schemas/AgentRuntimeExecutionFailure"
        session:
          $ref: "#/components/schemas/AgentRuntimeSessionCheckpoint"
    FinishAgentLocalRunResult:
      type: object
      additionalProperties: false
      required: [run]
      properties:
        run:
          $ref: "#/components/schemas/AgentLocalRun"
        session:
          $ref: "#/components/schemas/AgentRuntimeSession"
    CancelAgentLocalRunRequest:
      type: object
      additionalProperties: false
      required: [context_key, epoch, run_id]
      properties:
        context_key:
          $ref: "#/components/schemas/AgentRuntimeContextKey"
        epoch:
          $ref: "#/components/schemas/AgentServiceEpoch"
        run_id:
          type: string
    CancelAgentLocalRunResult:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [cancel_requested, canceled, already_terminal, not_found]
    EnqueueAgentSteerRequest:
      type: object
      additionalProperties: false
      required: [context_key, epoch, group_id]
      properties:
        context_key:
          $ref: "#/components/schemas/AgentRuntimeContextKey"
        epoch:
          $ref: "#/components/schemas/AgentServiceEpoch"
        group_id:
          type: string
    EnqueueAgentSteerResult:
      type: object
      additionalProperties: false
      required: [run_id]
      properties:
        run_id:
          type: string
    AssignAgentSteerRunRequest:
      type: object
      additionalProperties: false
      required: [context_key, epoch, group_id, run_id]
      properties:
        context_key:
          $ref: "#/components/schemas/AgentRuntimeContextKey"
        epoch:
          $ref: "#/components/schemas/AgentServiceEpoch"
        group_id:
          type: string
        run_id:
          type: string
    CompleteAgentSteerRequest:
      type: object
      additionalProperties: false
