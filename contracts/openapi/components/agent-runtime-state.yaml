      type: object
      additionalProperties: false
      required: [revision, summary, memory, sessions, cursors]
      properties:
        revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        summary:
          type: string
          maxLength: 8000
        memory:
          type: string
          maxLength: 200000
        cursors:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            required: [thread_id, through]
            properties:
              thread_id:
                type: string
              through:
                type: integer
                minimum: 0
        sessions:
          type: object
          maxProperties: 30
          additionalProperties:
            type: object
            additionalProperties: false
            required:
              [
                context_key,
                thread_id,
                through,
                summary,
                raw_memory,
                updated_revision,
              ]
            properties:
