      properties:
        kind: { type: string, enum: [assistant, tool_call, tool_result] }
        tool: { type: string, maxLength: 256 }
        text: { type: string, maxLength: 20000 }
        truncated: { type: boolean }
    RuntimePermissionEvidence:
      type: object
      additionalProperties: false
      properties:
        script:
          type: object
          additionalProperties: false
          required: [path, body]
          properties:
            path: { type: string, maxLength: 4096 }
            sha256: { type: string, maxLength: 128 }
            body: { type: string, maxLength: 65536 }
        patch: { type: string, maxLength: 262144 }
        browser:
          type: object
          additionalProperties: false
          required: [url]
          properties:
            url: { type: string, maxLength: 4096 }
            title: { type: string, maxLength: 1024 }
            target_role: { type: string, maxLength: 256 }
            target_name: { type: string, maxLength: 1024 }
            form_fields: { type: string, maxLength: 20000 }
        desktop:
          type: object
          additionalProperties: false
          description: >-
            The window a desktop action targets and the elements its element
            tokens name in the Agent's latest read of that window.
          properties:
            app: { type: string, maxLength: 256 }
            window_title: { type: string, maxLength: 1024 }
            targets:
              type: array
              maxItems: 16
              items:
                type: object
                additionalProperties: false
                required: [token, role]
                properties:
                  token: { type: string, maxLength: 128 }
                  role: { type: string, maxLength: 256 }
                  name: { type: string, maxLength: 1024 }
        missing:
          type: array
          maxItems: 16
          description: Facts the host could not collect and that the decision depends on.
          items: { type: string, maxLength: 1024 }
        screenshot:
          type: object
          additionalProperties: false
          required: [media_type, data, width, height]
          description: >-
            The window, screen or page the host captured just before a browser
            or desktop action. Shown only to the approver; the judge model does
            not see it.
          properties:
            media_type: { type: string, enum: [image/jpeg, image/png] }
            data:
              type: string
              maxLength: 2800000
              description: Base64 image bytes, at most 2 MiB decoded.
            width: { type: integer, minimum: 1, maximum: 10000 }
            height: { type: integer, minimum: 1, maximum: 10000 }
    RuntimePermissionReviewResult:
      type: object
      additionalProperties: false
      required: [decision, message, policy_version]
      properties:
        decision:
          type: string
          enum: [allow, needs_approval, deny, unavailable]
          description: unavailable means the judge failed; the Runtime must not run the call.
        message:
          type: string
          description: Text shown to the Runtime model when the call does not run. Empty for allow.
        interaction_id:
          type: string
          description: The approval card, for needs_approval.
        policy_version: { type: string }
