        - $ref: "#/components/schemas/AgentRuntimePlanUpdatedEvent"
        - $ref: "#/components/schemas/AgentRuntimeActivityStartedEvent"
        - $ref: "#/components/schemas/AgentRuntimeActivityUpdatedEvent"
        - $ref: "#/components/schemas/AgentRuntimeActivityFinishedEvent"
        - $ref: "#/components/schemas/AgentRuntimePresentationOutputCreatedEvent"
