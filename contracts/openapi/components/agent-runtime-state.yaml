          type: string
          minLength: 1
          maxLength: 256
        operation_id:
          type: string
          minLength: 1
          maxLength: 256
        runtime_type:
          $ref: "./domain.yaml#/components/schemas/LocalRuntimeType"
        usage:
          type: array
