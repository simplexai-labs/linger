    AgentRuntimeWorkingStatusChangedEvent:
      type: object
      additionalProperties: false
      required: [type, status]
      properties:
        type:
          type: string
          const: status.changed
        status:
          type: string
          enum: [queued, working, thinking]
        title:
          type: string
          minLength: 1
          maxLength: 50000
          description: >-
            Optional public queue label for queued, or the full provider-visible reasoning
            summary title for thinking. Omit for working; raw reasoning is never allowed.
    AgentRuntimeExecutionFailure:
      type: object
      additionalProperties: false
      required: [code]
      description: >-
        Public classified failure; contains no native error text, paths, credentials, or task input.
        Each code is set where the failure is observed, from structured signals only.
        model_unavailable means the model service refused the selected model for the
        Runtime's account, so the Agent needs another model or another sign-in.
        model_not_offered means the Agent's Computer does not offer the selected model for
        its Runtime, or the model does not support the selected reasoning effort, so the
        Runtime could not start; the Agent needs a model and reasoning effort that Computer offers.
        context_too_long means the conversation no longer fits the model's context window.
        model_service_error means the model service reported a server-side error.
        timeout means the Runtime hit its local execution deadline.
        execution_outcome_unknown means a command was dispatched but no validated exit
        was observed before unexpected transport or Runtime failure. Intentional cancellation,
        authorization loss or unavailability, and normal retirement do not create this
        classification. Authorization loss or unavailability includes explicit revocation,
        authorization checks that fail or time out, and authorization expiry. This code
        does not currently cover unknown effects caused by control-plane disconnection.
        It remains a failed Run and must not be automatically replayed; verify its effects
        before starting another Run. reply_undelivered means a Room Run finished, but every
        message the Agent tried to post failed, so the Room received no reply from it.
        interrupted means the Run stopped before it finished for a reason other than a user
        cancellation, such as a restart or a Runner stopped on its Computer; part of its work
        may have taken effect and it is not replayed.
        computer_unavailable means the Agent's Computer could not run it: the Computer is
        unreachable, the Agent's Runner is stopped there, or the Runtime is not enabled.
        cleanup_unconfirmed means the Runtime process could not be confirmed stopped.
        response_too_large means the reply exceeded the Room's size limit.
        unclassified means no structured signal identified the cause.
        runtime_type is present when the failure belongs to a selected Runtime; it is
        absent for failures the Agent Service or TeamHub observes without one.
      properties:
        code:
          type: string
          enum:
            [
              session_not_found,
              protocol_incompatible,
              authentication_required,
              network_error,
              rate_limited,
              model_unavailable,
              model_not_offered,
              context_too_long,
              model_service_error,
              timeout,
              execution_failed,
              execution_outcome_unknown,
              reply_undelivered,
              interrupted,
              computer_unavailable,
              cleanup_unconfirmed,
              response_too_large,
              unclassified,
            ]
        runtime_type:
          $ref: "./domain.yaml#/components/schemas/LocalRuntimeType"
        runtime_version:
          type: string
          maxLength: 80
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9.-]+)?$'
    AgentRuntimeStoppedStatusChangedEvent:
      type: object
      additionalProperties: false
      required: [type, status, outcome]
      properties:
        type:
          type: string
          const: status.changed
        status:
          type: string
          const: stopped
        outcome:
          type: string
          enum: [completed, failed, canceled]
        failure:
          $ref: "#/components/schemas/AgentRuntimeExecutionFailure"
        unconfirmed_input_ids:
          type: array
          description: Follow-up inputs whose application to this Run could not be confirmed. Does not change the Run outcome.
          items:
            type: string
    AgentRuntimePlanStep:
      type: object
      additionalProperties: false
      required: [content, status]
      properties:
        content:
          type: string
          maxLength: 50000
        status:
          type: string
          enum: [pending, in_progress, completed, canceled]
    AgentRuntimePlanUpdatedEvent:
      type: object
      additionalProperties: false
      required: [type, steps]
      properties:
        type:
          type: string
          const: plan.updated
        explanation:
          type: string
          maxLength: 50000
        steps:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/AgentRuntimePlanStep"
    AgentRuntimeActivityId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"
      description: >-
        Opaque identity of one logical activity within a local Run. Provider-native item
        identifiers must not cross the Runtime adapter boundary.
    AgentRuntimeActivityKind:
      type: string
      description: >-
        Runtime-neutral kind of an activity. Each Runtime adapter classifies its own tools; a single shell
        command gets the kind its program shows. Clients present an activity by kind, not by tool name.
      enum:
        - command
        - tool
        - file_change
        - search
        - read
        - browse
        - message
        - message_read
        - image
        - delegation
        - response
        - interaction
        - recovery
        - review
      # Explicit names keep oapi-codegen from renaming other enums' constants
      # that share values such as read or message.
      x-enum-varnames:
        [
          AgentRuntimeActivityKindCommand,
          AgentRuntimeActivityKindTool,
          AgentRuntimeActivityKindFileChange,
          AgentRuntimeActivityKindSearch,
          AgentRuntimeActivityKindRead,
          AgentRuntimeActivityKindBrowse,
          AgentRuntimeActivityKindMessage,
          AgentRuntimeActivityKindMessageRead,
          AgentRuntimeActivityKindImage,
          AgentRuntimeActivityKindDelegation,
          AgentRuntimeActivityKindResponse,
          AgentRuntimeActivityKindInteraction,
          AgentRuntimeActivityKindRecovery,
          AgentRuntimeActivityKindReview,
        ]
    AgentRuntimeActivityOutcome:
      type: string
      enum: [succeeded, failed, canceled, declined]
    AgentRuntimeActivityContentBlock:
      type: object
      additionalProperties: false
      required: [format, content]
      properties:
        format:
          type: string
          enum: [text, code, json]
        label:
          type: string
          minLength: 1
          maxLength: 80
        content:
          type: string
          minLength: 1
          maxLength: 4000
      description: >-
        One explicitly projected, bounded public detail block. Provider-native payloads must be
        redacted and normalized before entering this field.
    AgentRuntimeActivityStartedEvent:
      type: object
      additionalProperties: false
      required: [type, activity_id, kind, title]
