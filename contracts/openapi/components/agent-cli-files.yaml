components:
  schemas:
    AgentCLIFileLinkCommand:
      type: object
      additionalProperties: false
      required: [operation]
      properties:
        operation: { type: string, enum: [read, set, revoke] }
        role: { type: string, enum: [viewer, editor] }
        expected_version: { type: integer, format: int64, minimum: 0 }
        reset: { type: boolean }
    AgentCLIFile:
      type: object
      additionalProperties: false
      description: >-
        A Document the Agent reads. An Agent reads, writes and manages every
        Document its Human does; shared_with_me marks a Document someone shared
        with this Agent so it knows to look at it.
      required:
        [
          document_id,
          name,
          version_id,
          version_number,
          role,
          editable,
          read_only,
          shared_with_me,
        ]
      properties:
        document_id: { type: string }
        name: { type: string }
        version_id: { type: string }
        version_number: { type: integer }
        role: { type: string, enum: [viewer, editor, manager, owner] }
        editable: { type: boolean }
        read_only: { type: boolean }
        shared_with_me: { type: boolean }
    AgentCLIFileShare:
      type: object
      additionalProperties: false
      required: [target_kind, target_id, role]
      properties:
        target_kind: { type: string, enum: [room, actor, task] }
        target_id: { type: string }
        role: { type: string, enum: [viewer, editor, manager] }
  parameters:
    CLIFileAgentId:
      name: agentId
      in: path
      required: true
      schema: { type: string }
    CLIFileTenantId:
      name: tenant_id
      in: query
      required: true
      schema: { type: string }
    CLIFileDocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string }
  responses:
    FileError:
      description: Rejected or retryable file operation. Native latest changed throughout bounded rendering retries returns 202 with latest_not_ready, private/no-store and no document bytes. Retry after one second. Other conflicts include current and base version IDs. Service failures and exhausted serialization retries remain unavailable.
      headers:
        Retry-After:
          description: Retry delay in seconds, provided for 202 latest_not_ready.
          schema: { type: integer, format: int32, minimum: 1 }
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
                  current_version_id: { type: string }
                  base_version_id: { type: string }
                  details:
                    type: object
                    required: [retry_after_seconds]
                    properties:
                      retry_after_seconds:
                        type: integer
                        format: int32
                        minimum: 1
                        description: Advisory delay for latest_not_ready.
