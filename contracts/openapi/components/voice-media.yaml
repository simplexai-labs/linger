components:
  responses:
    VoiceProviderKeyRefused:
      description: >-
        TeamHub or the voice provider refused the key; error.code is one of
        VoiceProviderKeyErrorCode.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VoiceProviderKeyErrorResponse"
  schemas:
    VoiceMediaPolicy:
      type: object
      additionalProperties: false
      required: [voice_media_supported]
      properties:
        voice_media_supported:
          type: boolean
          description: Soniox ASR is configured, so Recording, Pocket notes dictation and Voice Mode dictation are available.
        active_room_id:
          $ref: "./common.yaml#/components/schemas/Id"
        live_supported:
          type: boolean
          description: Whether the xAI live voice provider is configured; Live does not need Soniox.
        live_enabled:
          type: boolean
          description: Whether this tenant may enter live voice mode.
        voice_available:
          type: boolean
          description: The deployment can run voice (TEAMHUB_VOICE_MEDIA=on); clients show voice entries only when true.
        local_dictation_supported:
          type: boolean
          description: >-
            A speech model downloaded to this deployment is ready and a person chose what rewrites the dictated
            text, so Pocket notes dictation and Voice Mode dictation work without a Soniox key. Recording still
            needs Soniox.
        soniox_key:
          $ref: "#/components/schemas/VoiceProviderKeyStatus"
        xai_key:
          $ref: "#/components/schemas/VoiceProviderKeyStatus"
    VoiceProvider:
      type: string
      enum: [soniox, xai]
    VoiceDictationSettings:
      type: object
      additionalProperties: false
      required: [local_model, default_polish_model, can_save_api_key]
      properties:
        local_model:
          type: string
          enum: [ready, downloading, unavailable]
          description: >-
            State of the speech model that dictates without a Soniox key: ready to use, still downloading, or
            not available on this deployment.
        polish_source:
          type: string
          enum: [cli, api]
          description: >-
            What rewrites dictated text: the connected CLI, or an OpenAI-compatible API of the deployment's own.
            Absent until a person chooses, and dictation without a Soniox key stays off until then.
        polish_model:
          type: string
          description: The Claude model the connected CLI rewrites dictated text with.
        default_polish_model:
          type: string
          description: The model a client preselects for the CLI.
        polish_api:
          $ref: "#/components/schemas/VoiceDictationPolishApi"
        can_save_api_key:
          type: boolean
          description: False when this deployment has no secret encryption key, so an API key cannot be stored.
    VoiceDictationPolishApi:
      type: object
      additionalProperties: false
      required: [base_url, model, key_saved]
      description: The deployment's own API for rewriting dictated text. The key is never returned.
      properties:
        base_url:
          type: string
        model:
          type: string
        key_saved:
          type: boolean
    SaveVoiceDictationSettingsRequest:
      type: object
      additionalProperties: false
      required: [polish_source]
      properties:
        polish_source:
          type: string
          enum: [cli, api]
        polish_model:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:/\\[\\]-]*$"
          description: Required for cli.
        polish_api:
          $ref: "#/components/schemas/SaveVoiceDictationPolishApiRequest"
    SaveVoiceDictationPolishApiRequest:
      type: object
      additionalProperties: false
      required: [base_url, model]
      description: Required for api.
      properties:
        base_url:
          type: string
          minLength: 1
          maxLength: 300
          description: An https base URL whose /chat/completions answers, such as https://api.deepseek.com/v1.
        model:
          type: string
          minLength: 1
          maxLength: 100
        api_key:
          type: string
          minLength: 1
          maxLength: 512
          description: Omitted, the key already saved is kept.
    ListVoiceDictationModelsRequest:
      type: object
      additionalProperties: false
      required: [base_url]
      properties:
        base_url:
          type: string
          minLength: 1
          maxLength: 300
          description: An https base URL whose /models lists the API's models, such as https://api.deepseek.com/v1.
        api_key:
          type: string
          minLength: 1
          maxLength: 512
          description: Omitted, the key already saved for this address is used.
    VoiceDictationModels:
      type: object
      additionalProperties: false
      required: [models]
      properties:
        models:
          type: array
          maxItems: 300
          items:
            type: string
    SaveVoiceProviderKeyRequest:
      type: object
      additionalProperties: false
      required: [api_key]
      properties:
        api_key:
          type: string
          minLength: 1
          maxLength: 512
    VoiceProviderKeyStatus:
      type: object
      additionalProperties: false
      required: [source, can_save]
      properties:
        source:
          type: string
          enum: [none, environment, stored]
          description: Where the effective key comes from; the environment wins over a stored key.
        can_save:
          type: boolean
          description: False when the provider's environment variable is set, no secret encryption key is configured, or voice media is off.
    VoiceProviderKeyErrorCode:
      description: >-
        error.code of a refused voice provider key save. 400: INVALID_REQUEST
        (malformed request or key); VOICE_KEY_REJECTED (the provider refused
        the key); VOICE_KEY_NO_BALANCE (the provider account's balance or
        monthly budget is used up); VOICE_KEY_NO_REALTIME_PERMISSION (the
        Soniox key may not use realtime transcription). 409:
        VOICE_KEY_FROM_ENVIRONMENT. 503: VOICE_KEY_STORAGE_UNAVAILABLE,
        VOICE_MEDIA_OFF, or VOICE_PROVIDER_UNAVAILABLE (the provider could
        not be reached or did not answer in time).
      type: string
      enum:
        - INVALID_REQUEST
        - VOICE_KEY_REJECTED
        - VOICE_KEY_NO_BALANCE
        - VOICE_KEY_NO_REALTIME_PERMISSION
        - VOICE_KEY_FROM_ENVIRONMENT
        - VOICE_KEY_STORAGE_UNAVAILABLE
        - VOICE_MEDIA_OFF
        - VOICE_PROVIDER_UNAVAILABLE
      x-enum-varnames:
        - VoiceProviderKeyErrorCodeInvalidRequest
        - VoiceProviderKeyErrorCodeVoiceKeyRejected
        - VoiceProviderKeyErrorCodeVoiceKeyNoBalance
        - VoiceProviderKeyErrorCodeVoiceKeyNoRealtimePermission
        - VoiceProviderKeyErrorCodeVoiceKeyFromEnvironment
        - VoiceProviderKeyErrorCodeVoiceKeyStorageUnavailable
        - VoiceProviderKeyErrorCodeVoiceMediaOff
        - VoiceProviderKeyErrorCodeVoiceProviderUnavailable
    VoiceProviderKeyError:
      description: The common error body with error.code narrowed to VoiceProviderKeyErrorCode.
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          $ref: "#/components/schemas/VoiceProviderKeyErrorCode"
        message:
          type: string
          minLength: 1
          description: Human-readable summary safe to display; clients branch on code, not message.
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        details:
          type: array
          items:
            $ref: "./common.yaml#/components/schemas/ErrorDetail"
        retryable:
          type: boolean
          default: false
    VoiceProviderKeyErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/VoiceProviderKeyError"
    VoiceSessionStatus:
      type: string
      enum: [provisioning, connected, reconnecting, closing, closed]
    VoiceSessionPurpose:
      type: string
      enum:
        - hardware_control
        - chat_dictation
        - chat_live
    VoiceSessionCreateRequest:
      type: object
      additionalProperties: false
      required: [purpose]
      properties:
        purpose:
          $ref: "#/components/schemas/VoiceSessionPurpose"
    VoiceSession:
      type: object
      additionalProperties: false
      required:
        - id
        - tenant_id
        - room_id
        - created_by_actor_id
        - status
        - purpose
        - credential_generation
        - created_at
        - updated_at
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Id"
        tenant_id:
          $ref: "./common.yaml#/components/schemas/Id"
        room_id:
          $ref: "./common.yaml#/components/schemas/Id"
        created_by_actor_id:
          $ref: "./common.yaml#/components/schemas/Id"
        status:
          $ref: "#/components/schemas/VoiceSessionStatus"
        purpose:
          $ref: "#/components/schemas/VoiceSessionPurpose"
        credential_generation:
          type: integer
          format: int64
          minimum: 0
        input_ready_generation:
          type: integer
          format: int64
          minimum: 0
          description: Publisher generation whose Runtime has opened its ASR consumer. Zero means not ready.
        input_started_offset_ms:
          type: integer
          format: int64
          minimum: 0
          description:
            Latest persisted track_started offset on the session audio clock. Absent until Runtime reports an input
            boundary.
        input_ended_offset_ms:
          type: integer
          format: int64
          minimum: 0
          description:
            Latest persisted track_ended offset, reported only after preceding transcript callbacks are accepted. A
            value older than input_started_offset_ms does not confirm the current input has drained. Absent until an
            input drains.
        last_failure_code:
          type: string
          minLength: 1
          maxLength: 128
        created_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        updated_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        closed_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        partial_transcript:
          type: string
          minLength: 1
          description:
            Latest uncommitted ASR hypothesis. It is cleared when a final event arrives and is never used for the
            formal transcript.
        partial_start_offset_ms:
          type: integer
          format: int64
          minimum: 0
        partial_end_offset_ms:
          type: integer
          format: int64
          minimum: 1
    VoiceDictationCommitRequest:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id:
          $ref: "./common.yaml#/components/schemas/Id"
      description:
        Transient request to finalize the current dictation turn. Retry with the same request ID; ordinary chat
        message idempotence uses the resulting dictation_turn event ID.
    VoiceDictationCommitReceipt:
      type: object
      additionalProperties: false
      required: [request_id, status]
      properties:
        request_id:
          $ref: "./common.yaml#/components/schemas/Id"
        status:
          type: string
          enum: [accepted]
    VoiceConnectionCredential:
      type: object
      additionalProperties: false
      required: [endpoint, credential, expires_at, generation]
      properties:
        endpoint:
          type: string
          format: uri
          pattern: "^wss?://"
        credential:
          type: string
          minLength: 1
          description: Short-lived opaque LiveKit participant grant.
        expires_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        generation:
          type: integer
          format: int64
          minimum: 1
    VoiceCaptureStartRequest:
      type: object
      additionalProperties: false
      required: [room_id, start_offset_ms]
      properties:
        room_id:
          $ref: "./common.yaml#/components/schemas/Id"
        start_offset_ms:
          type: integer
          format: int64
          minimum: 0
    VoiceCaptureStatus:
      type: string
      enum: [starting, recording, finalizing, recovering, finalized, failed]
    VoiceCaptureQuestionRequest:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 1000
    VoiceCaptureQuestionSource:
      type: object
      additionalProperties: false
      required: [start_offset_ms, end_offset_ms, text]
      properties:
        start_offset_ms:
          type: integer
          format: int64
          minimum: 0
        end_offset_ms:
          type: integer
          format: int64
          minimum: 0
        text:
          type: string
    VoiceCaptureQuestion:
      type: object
      additionalProperties: false
      required:
        [
          id,
          kind,
          question,
          answer,
          answered,
          cutoff_offset_ms,
          sources,
          created_at,
        ]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [answer, task]
          description:
            answer when the recording's Agent answered the question; task when it recognized a request for the caller's
            Another Me to act, which is handed to Another Me as a background Task request.
        question:
          type: string
        answer:
          type: string
          description: The answer; empty for a task request.
        task_title:
          type: string
          description: Short title the recording's Agent gave a task request.
        sent_message_id:
          type: string
          description: The hidden Message that handed this task request to the caller's Another Me; absent until it is sent.
        answered:
          type: boolean
          description: False when the recording so far does not settle the question.
        cutoff_offset_ms:
          type: integer
          format: int64
          minimum: 0
          description: End of the last confirmed transcript the answer could read.
        sources:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/VoiceCaptureQuestionSource"
        created_at:
          type: string
          format: date-time
    VoiceCaptureQuestionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/VoiceCaptureQuestion"
    VoiceCaptureQuickNotes:
      type: object
      additionalProperties: false
      required: [state]
      description: >-
        Quick notes written from the transcript seconds after the completion Message, which
        promised them. title and sections are present once state is ready; failed means the
        Message keeps only the recording and transcript.
      properties:
        state:
          type: string
          enum: [pending, ready, failed]
        title:
          type: string
          minLength: 1
          maxLength: 240
        sections:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: object
            additionalProperties: false
            required: [heading, bullets]
            properties:
              heading:
                type: string
                minLength: 1
                maxLength: 240
              bullets:
                type: array
                minItems: 1
                maxItems: 5
                items:
                  type: string
                  minLength: 1
                  maxLength: 500
    VoiceCapture:
      type: object
      additionalProperties: false
      required:
        - id
        - voice_session_id
        - room_id
        - status
        - requested_start_offset_ms
        - gap_count
        - gap_duration_ms
        - created_at
        - updated_at
      properties:
        quick_notes:
          $ref: "#/components/schemas/VoiceCaptureQuickNotes"
        source_audio_document_version_id:
          $ref: "./common.yaml#/components/schemas/Id"
        transcript_recovery_status:
          type: string
          enum: [pending, running, succeeded, failed]
        transcript_recovery_progress_ms:
          type: integer
          format: int64
          minimum: 0
        transcript_recovery_total_ms:
          type: integer
          format: int64
          minimum: 1
        transcript_recovery_attempt:
          type: integer
          format: int64
          minimum: 1
          description: >-
            The recovery attempt that is running or due next; once recovery failed, the attempts
            already made. Present with transcript_recovery_status.
        transcript_recovery_max_attempts:
          type: integer
          format: int64
          minimum: 1
          description: Attempts a recovery makes before it fails and waits for the account's retry.
        audio_document_version_id:
          $ref: "./common.yaml#/components/schemas/Id"
        transcript_document_version_id:
          $ref: "./common.yaml#/components/schemas/Id"
        id:
          $ref: "./common.yaml#/components/schemas/Id"
        voice_session_id:
          $ref: "./common.yaml#/components/schemas/Id"
        room_id:
          $ref: "./common.yaml#/components/schemas/Id"
        status:
          $ref: "#/components/schemas/VoiceCaptureStatus"
        requested_start_offset_ms:
          type: integer
          format: int64
          minimum: 0
          description:
            Original Capture start request on the VoiceSession audio timeline. Stable across media startup alignment;
            scopes transient ASR previews, not archived audio trimming.
        archived_through_ms:
          type: integer
          format: int64
          minimum: 0
        gap_count:
          type: integer
          format: int64
          minimum: 0
          description: Number of authoritative unrecoverable media gaps observed during this Capture.
        gap_duration_ms:
          type: integer
          format: int64
          minimum: 0
          description: Total duration of authoritative unrecoverable media gaps during this Capture.
        last_failure_code:
          type: string
          minLength: 1
          maxLength: 128
        created_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        updated_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
    VoiceTranscriptEventKind:
      type: string
      enum: [speech, dictation_turn]
    VoiceTranscriptEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - event_id
        - voice_session_id
        - media_epoch
        - lane
        - start_offset_ms
        - end_offset_ms
        - text
        - kind
        - accepted_at
        - updated_at
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Id"
        event_id:
          $ref: "./common.yaml#/components/schemas/Id"
        voice_session_id:
          $ref: "./common.yaml#/components/schemas/Id"
        capture_session_id:
          $ref: "./common.yaml#/components/schemas/Id"
        media_epoch:
          type: integer
          format: int32
          minimum: 0
        lane:
          type: string
          enum: [live, recovery]
        start_offset_ms:
          type: integer
          format: int64
          minimum: 0
        end_offset_ms:
          type: integer
          format: int64
          minimum: 1
        text:
          type: string
          minLength: 1
        speaker_id:
          type: string
          minLength: 1
          maxLength: 16
          pattern: "^spk_[1-9][0-9]*$"
          description: Session-scoped anonymous speaker cluster. Omitted when the provider did not label this window.
        kind:
          $ref: "#/components/schemas/VoiceTranscriptEventKind"
        accepted_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        updated_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
    VoiceTranscriptEventPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/VoiceTranscriptEvent"
        partial_transcript:
          type: string
          minLength: 1
        partial_start_offset_ms:
          type: integer
          format: int64
          minimum: 0
        partial_end_offset_ms:
          type: integer
          format: int64
          minimum: 1
        event_cursor:
          type: string
          minLength: 1
          description:
            Voice event cursor read in the same snapshot as this HTTP page; every transcript event committed later is
            delivered after it by the event feed. Absent from SSE partial frames.

    VoiceEventPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      description:
        Transcript events committed after the cursor, in commit order, followed on the last page by the current
        VoiceSession and its unfinished and newest Captures. Session and Capture items are current snapshots, not
        changes, and may repeat; clients upsert every item by resource ID. Cursors are opaque and scoped to one
        VoiceSession. Partial snapshots have no cursor.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/VoiceEvent"
        next_cursor:
          type: string
        has_more:
          type: boolean
    VoiceEvent:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [transcript, capture, session]
        transcript:
          $ref: "#/components/schemas/VoiceTranscriptEvent"
        capture:
          $ref: "#/components/schemas/VoiceCapture"
        session:
          $ref: "#/components/schemas/VoiceSession"
    VoiceLiveTurnMarker:
      type: object
      additionalProperties: false
      required:
        - voice_session_id
        - turn_id
      properties:
        voice_session_id:
          $ref: ./common.yaml#/components/schemas/Id
        turn_id:
          $ref: ./common.yaml#/components/schemas/Id
      description:
        Marks a Human Message as a turn the caller's own active chat_live VoiceSession answers. TeamHub records it
        once for that turn. A turn the live model handed to a live task (start_task or reply_to_task) is routed to Room
        Agents as usual; any other turn does not wake them. The marker never grants authority.
    VoiceLiveRuntimeEvent:
      type: object
      additionalProperties: false
      required:
        - type
      description:
        Reliable LiveKit data packet on topic linger.voice.live sent by Voice Runtime to the VoiceSession
        publisher. user_partial and user_turn carry the Human's transcript; reply_delta and reply_done carry the live
        reply text for subtitles; reply_done also means the turn's whole reply, including its tool rounds, has finished,
        so the browser saves the turn after it; reply_interrupted stops playback of that turn; tool_request asks the
        browser to read or operate the page it shows, or to end Voice Mode; speech_started opens the bubble of a
        background update the runtime started saying, identified by speech_id, whose reply_delta/reply_done carry its
        actual spoken words without touching the turn's own reply. playout_done says the turn's reply audio has finished
        playing on the reply track. session_failure asks the browser to fall back to dictation.
      properties:
        type:
          type: string
          enum:
            - user_partial
            - user_turn
            - reply_delta
            - reply_done
            - reply_interrupted
            - tool_request
            - speech_started
            - playout_done
            - session_failure
        turn_id:
          $ref: ./common.yaml#/components/schemas/Id
        speech_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Identifies one background update the runtime said, for its own subtitle bubble.
        call_id:
          type: string
          minLength: 1
          maxLength: 255
        tool:
          type: string
          enum:
            - read_page
            - page_action
            - end_voice_mode
        text:
          type: string
          maxLength: 20000
        interrupted:
          type: boolean
        code:
          type: string
          maxLength: 128
    VoiceLiveClientEvent:
      type: object
      additionalProperties: false
      required:
        - type
      description:
        Reliable LiveKit data packet on topic linger.voice.live sent by the VoiceSession publisher to Voice
        Runtime. tool_result answers one tool_request; context silently tells the live model where the Human is, such as
        the page they opened; audio_stats reports how the browser received the reply audio and sent the microphone
        since its previous report, only for Voice Runtime to log. These packets only steer the conversation and never
        authorize writes.
      properties:
        type:
          type: string
          enum:
            - tool_result
            - context
            - audio_stats
        call_id:
          type: string
          minLength: 1
          maxLength: 255
        text:
          type: string
          maxLength: 20000
        audio:
          $ref: "#/components/schemas/VoiceLiveAudioStats"
    VoiceLiveAudioStats:
      type: object
      additionalProperties: false
      required:
        - interval_ms
      description:
        WebRTC audio statistics the browser observed since its previous audio_stats report, as deltas rather than
        cumulative totals. Reply fields come from the reply track's inbound-rtp stats and packets_sent from the
        microphone's outbound-rtp stats; a field is absent when the browser does not report it, a replaced reply or
        microphone track counts from zero, and a counter that went down (packets_lost after late packets) reports 0. No
        audio or text.
      properties:
        interval_ms:
          type: integer
          minimum: 0
          maximum: 3600000
        samples_received:
          type: integer
          minimum: 0
          maximum: 1000000000
        concealed_samples:
          type: integer
          minimum: 0
          maximum: 1000000000
        silent_concealed_samples:
          type: integer
          minimum: 0
          maximum: 1000000000
        concealment_events:
          type: integer
          minimum: 0
          maximum: 1000000000
        inserted_samples_for_deceleration:
          type: integer
          minimum: 0
          maximum: 1000000000
        removed_samples_for_acceleration:
          type: integer
          minimum: 0
          maximum: 1000000000
        jitter_buffer_delay_ms:
          type: number
          minimum: 0
          maximum: 60000
          description: Average jitter buffer delay of the samples emitted in the interval.
        packets_lost:
          type: integer
          minimum: 0
          maximum: 1000000000
        packets_sent:
          type: integer
          minimum: 0
          maximum: 1000000000
