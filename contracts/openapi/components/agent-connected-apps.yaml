components:
  schemas:
    AgentListConnectedAppsRequest:
      type: object
      additionalProperties: false
      properties: {}
    ConnectorAutoReminders:
      type: object
      additionalProperties: false
      description: Whether AnotherMe watches one Sponsor-owned connection for things that need the Human's attention.
      required: [connection_id, app_key, identity_label, status, enabled]
      properties:
        connection_id: { type: string }
        app_key: { type: string }
        identity_label: { type: string }
        status: { type: string }
        enabled: { type: boolean }
    AgentConnectedApp:
      type: object
      additionalProperties: false
      required: [connection_id, app_key, display_name, identity_label]
      properties:
        connection_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$"
        app_key:
          type: string
          minLength: 1
          maxLength: 120
          pattern: "^[a-z0-9][a-z0-9_-]{0,119}$"
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        identity_label:
          type: string
          maxLength: 240
    AgentListConnectedAppsResponse:
      type: object
      additionalProperties: false
      required: [connections]
      properties:
        connections:
          type: array
          items:
            $ref: "#/components/schemas/AgentConnectedApp"
    AgentSearchAppToolsRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 200
        connection_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$"
        app_key:
          type: string
          minLength: 1
          maxLength: 120
          pattern: "^[a-z0-9][a-z0-9_-]{0,119}$"
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
          default: 20
    AgentConnectedAppTool:
      type: object
      additionalProperties: false
      required:
        [
          tool_slug,
          tool_version,
          name,
          description,
          app_key,
          input_schema,
          output_schema,
          available_connections,
        ]
      properties:
        tool_slug:
          type: string
          minLength: 2
          maxLength: 200
          pattern: "^[A-Z0-9][A-Z0-9_]{1,199}$"
        tool_version:
          type: string
          pattern: "^[0-9]{8}_[0-9]{2}$"
        name:
          type: string
          minLength: 1
          maxLength: 240
        description:
          type: string
          maxLength: 4000
        app_key:
          type: string
          minLength: 1
          maxLength: 120
          pattern: "^[a-z0-9][a-z0-9_-]{0,119}$"
        input_schema:
          type: object
          additionalProperties: true
        output_schema:
          type: object
          additionalProperties: true
        available_connections:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AgentConnectedApp"
    AgentSearchAppToolsResponse:
      type: object
      additionalProperties: false
      required: [tools]
      properties:
        tools:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/AgentConnectedAppTool"
    AgentExecuteAppToolRequest:
      type: object
      additionalProperties: false
      required: [connection_id, tool_slug, tool_version, arguments]
      properties:
        connection_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$"
        tool_slug:
          type: string
          minLength: 2
          maxLength: 200
          pattern: "^[A-Z0-9][A-Z0-9_]{1,199}$"
        tool_version:
          type: string
          pattern: "^[0-9]{8}_[0-9]{2}$"
        arguments:
          type: object
          additionalProperties: true
    AgentExecuteAppToolResponse:
      description: >-
        The Tool result, or, for a write that needs the sponsor's confirmation,
        the receipt of the confirmation card TeamHub posted instead of running
        it. TeamHub classifies every call: reads and writes nobody
        else sees run at once; other writes, including any Tool TeamHub does
        not know, wait for the card.
      oneOf:
        - $ref: "#/components/schemas/AgentAppToolResult"
        - $ref: "#/components/schemas/AgentAppToolConfirmationPending"
    AgentAppToolResult:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          description: Sanitized JSON result returned by the connected application Tool.
    AgentAppToolConfirmationPending:
      type: object
      additionalProperties: false
      description: >-
        Nothing external ran. After the sponsor approves the card, TeamHub runs
        the stored call once and tells the Agent the result; a denial (with its
        reason) or expiry is reported the same way. An identical pending call
        reuses its card.
      required: [status, room_id, message_id, interaction_id]
      properties:
        status: { type: string, enum: [confirmation_pending] }
        room_id: { type: string }
        message_id: { type: string }
        interaction_id:
          type: string
          description: The confirmation card's decision.
