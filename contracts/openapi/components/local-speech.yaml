components:
  responses:
    LocalSpeechRefused:
      description: >-
        The Computer or TeamHub refused the local-speech request; error.code is
        one of LocalSpeechErrorCode.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LocalSpeechErrorResponse"
  schemas:
    LocalSpeechModelId:
      description: >-
        Stable localmodels speech catalog id, such as sensevoice-small or
        whisper-large-v3-turbo.
      type: string
      pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,159}$"
    LocalSpeechLanguage:
      description: >-
        Speech recognition language: auto (default) or an ISO-639-1 / BCP-47
        language tag such as zh, en, ja, ko, or yue.
      type: string
      pattern: "^(auto|[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*)$"
      maxLength: 32
    LocalSpeechEngine:
      type: string
      enum: [sherpa-onnx, whisper.cpp]
      x-enum-varnames:
        - LocalSpeechEngineSherpaOnnx
        - LocalSpeechEngineWhisperCpp
    LocalSpeechQualityRating:
      type: string
      enum: [fast-cjk, high-multilingual]
      x-enum-varnames:
        - LocalSpeechQualityFastCjk
        - LocalSpeechQualityHighMultilingual
    LocalSpeechModelState:
      type: string
      enum: [absent, downloading, idle, loading, loaded, failed]
      x-enum-varnames:
        - LocalSpeechModelStateAbsent
        - LocalSpeechModelStateDownloading
        - LocalSpeechModelStateIdle
        - LocalSpeechModelStateLoading
        - LocalSpeechModelStateLoaded
        - LocalSpeechModelStateFailed
    LocalSpeechRuntimeState:
      type: string
      enum: [stopped, standby, loading, loaded, error]
      x-enum-varnames:
        - LocalSpeechRuntimeStateStopped
        - LocalSpeechRuntimeStateStandby
        - LocalSpeechRuntimeStateLoading
        - LocalSpeechRuntimeStateLoaded
        - LocalSpeechRuntimeStateError
    LocalSpeechRequestedDevice:
      type: string
      enum: [gpu, cpu]
      x-enum-varnames:
        - LocalSpeechRequestedDeviceGpu
        - LocalSpeechRequestedDeviceCpu
    LocalSpeechEffectiveDevice:
      type: string
      enum: [cuda, metal, vulkan, directml, cpu]
      x-enum-varnames:
        - LocalSpeechEffectiveDeviceCuda
        - LocalSpeechEffectiveDeviceMetal
        - LocalSpeechEffectiveDeviceVulkan
        - LocalSpeechEffectiveDeviceDirectml
        - LocalSpeechEffectiveDeviceCpu
    LocalSpeechFallbackReason:
      type: string
      enum:
        - insufficient_vram
        - insufficient_unified_memory
        - memory_pressure_warn
        - memory_pressure_critical
        - driver_update_required
        - vulkan_unavailable
        - gpu_engine_unavailable
        - gpu_unsupported_platform
        - cpu_optimal_for_int8
        - gpu_init_failed
        - runtime_oom_fallback
        - yielded_to_llm
        - no_supported_gpu
      x-enum-varnames:
        - LocalSpeechFallbackInsufficientVram
        - LocalSpeechFallbackInsufficientUnifiedMemory
        - LocalSpeechFallbackMemoryPressureWarn
        - LocalSpeechFallbackMemoryPressureCritical
        - LocalSpeechFallbackDriverUpdateRequired
        - LocalSpeechFallbackVulkanUnavailable
        - LocalSpeechFallbackGpuEngineUnavailable
        - LocalSpeechFallbackGpuUnsupportedPlatform
        - LocalSpeechFallbackCpuOptimalForInt8
        - LocalSpeechFallbackGpuInitFailed
        - LocalSpeechFallbackRuntimeOomFallback
        - LocalSpeechFallbackYieldedToLlm
        - LocalSpeechFallbackNoSupportedGpu
    LocalSpeechDownloadProgress:
      type: object
      additionalProperties: false
      required: [step, done_bytes, total_bytes, bytes_per_second]
      properties:
        step:
          type: string
          enum: [download, verify]
          x-enum-varnames:
            - LocalSpeechDownloadStepDownload
            - LocalSpeechDownloadStepVerify
        done_bytes:
          type: integer
          format: int64
          minimum: 0
        total_bytes:
          type: integer
          format: int64
          minimum: 0
        bytes_per_second:
          type: integer
          format: int64
          minimum: 0
        source:
          type: string
          maxLength: 200
        connections:
          type: integer
          minimum: 0
          maximum: 64
    LocalSpeechModelError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 128
        message:
          type: string
          maxLength: 4000
    LocalSpeechConfig:
      type: object
      additionalProperties: false
      required: [use_gpu, keep_loaded_seconds, language]
      properties:
        model_id:
          $ref: "#/components/schemas/LocalSpeechModelId"
          nullable: true
        use_gpu:
          type: boolean
        keep_loaded_seconds:
          type: integer
          minimum: -1
          maximum: 86400
          description: "-1 never unloads while the sidecar runs; 0 unloads immediately after transcription; positive values set idle TTL seconds (default 900)."
        language:
          $ref: "#/components/schemas/LocalSpeechLanguage"
    LocalSpeechModel:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - engine
        - languages
        - language_count
        - quality_rating
        - license
        - license_url
        - disk_size_bytes
        - vram_estimate_bytes
        - ram_estimate_bytes
        - gpu_supported
        - state
        - active
      properties:
        id:
          $ref: "#/components/schemas/LocalSpeechModelId"
        name:
          type: string
          minLength: 1
          maxLength: 200
        engine:
          $ref: "#/components/schemas/LocalSpeechEngine"
        languages:
          type: array
          maxItems: 256
          items:
            type: string
            minLength: 1
            maxLength: 32
        language_count:
          type: integer
          minimum: 0
          maximum: 1000
        quality_rating:
          $ref: "#/components/schemas/LocalSpeechQualityRating"
        license:
          type: string
          minLength: 1
          maxLength: 128
        license_url:
          type: string
          minLength: 1
          maxLength: 2048
        commercial_notice:
          type: string
          maxLength: 1000
          nullable: true
        disk_size_bytes:
          type: integer
          format: int64
          minimum: 0
        vram_estimate_bytes:
          type: integer
          format: int64
          minimum: 0
        ram_estimate_bytes:
          type: integer
          format: int64
          minimum: 0
        gpu_supported:
          type: boolean
        state:
          $ref: "#/components/schemas/LocalSpeechModelState"
        active:
          type: boolean
        download:
          $ref: "#/components/schemas/LocalSpeechDownloadProgress"
          nullable: true
        error:
          $ref: "#/components/schemas/LocalSpeechModelError"
          nullable: true
    LocalSpeechRuntime:
      type: object
      additionalProperties: false
      required:
        - running
        - state
        - requested_device
        - vram_used_bytes
        - ram_used_bytes
        - keep_loaded_seconds
        - active_sessions
      properties:
        running:
          type: boolean
        state:
          $ref: "#/components/schemas/LocalSpeechRuntimeState"
        active_model:
          $ref: "#/components/schemas/LocalSpeechModelId"
          nullable: true
        engine:
          $ref: "#/components/schemas/LocalSpeechEngine"
          nullable: true
        requested_device:
          $ref: "#/components/schemas/LocalSpeechRequestedDevice"
        effective_device:
          $ref: "#/components/schemas/LocalSpeechEffectiveDevice"
          nullable: true
        fallback_reason:
          $ref: "#/components/schemas/LocalSpeechFallbackReason"
          nullable: true
        fallback_detail:
          type: string
          maxLength: 1000
          nullable: true
        vram_used_bytes:
          type: integer
          format: int64
          minimum: 0
        ram_used_bytes:
          type: integer
          format: int64
          minimum: 0
        keep_loaded_seconds:
          type: integer
          minimum: -1
          maximum: 86400
        idle_remaining_seconds:
          type: integer
          minimum: 0
          maximum: 86400
          nullable: true
        active_sessions:
          type: integer
          minimum: 0
    LocalSpeechUnavailableCode:
      type: string
      enum: [TOOL_NOT_INSTALLED, SPEECH_UNSUPPORTED, TOOL_FAILED]
      x-enum-varnames:
        - LocalSpeechUnavailableToolNotInstalled
        - LocalSpeechUnavailableSpeechUnsupported
        - LocalSpeechUnavailableToolFailed
    LocalSpeechUnavailableReason:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          $ref: "#/components/schemas/LocalSpeechUnavailableCode"
        detail:
          type: string
          maxLength: 4000
    LocalSpeechSnapshot:
      type: object
      additionalProperties: false
      required: [available, observed_at, models]
      properties:
        available:
          type: boolean
        reason:
          $ref: "#/components/schemas/LocalSpeechUnavailableReason"
        observed_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        tool_version:
          type: string
          minLength: 1
          maxLength: 64
        config:
          $ref: "#/components/schemas/LocalSpeechConfig"
        runtime:
          $ref: "#/components/schemas/LocalSpeechRuntime"
        models:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/LocalSpeechModel"
    RecordLocalSpeechRequest:
      type: object
      additionalProperties: false
      required: [computer_id, snapshot]
      properties:
        computer_id:
          $ref: "./common.yaml#/components/schemas/Id"
        snapshot:
          $ref: "#/components/schemas/LocalSpeechSnapshot"
    LocalSpeechActionKind:
      type: string
      enum: [download, cancel, remove, load, unload, configure, refresh]
      x-enum-varnames:
        - LocalSpeechActionKindDownload
        - LocalSpeechActionKindCancel
        - LocalSpeechActionKindRemove
        - LocalSpeechActionKindLoad
        - LocalSpeechActionKindUnload
        - LocalSpeechActionKindConfigure
        - LocalSpeechActionKindRefresh
    LocalSpeechActionCommand:
      description: >-
        TeamHub asks Agent Service to send one execute local_speech_action frame
        to an owned Computer.
      type: object
      additionalProperties: false
      required: [request_id, action, expires_at]
      properties:
        request_id:
          $ref: "./common.yaml#/components/schemas/Id"
        action:
          $ref: "#/components/schemas/LocalSpeechActionKind"
        model_id:
          $ref: "#/components/schemas/LocalSpeechModelId"
        use_gpu:
          type: boolean
        keep_loaded_seconds:
          type: integer
          minimum: -1
          maximum: 86400
        language:
          $ref: "#/components/schemas/LocalSpeechLanguage"
        include_gpu_engine:
          type: boolean
        expires_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
    LocalSpeechActionRefusalCode:
      type: string
      enum:
        - MODEL_UNKNOWN
        - INVALID_STATE
        - JOB_RUNNING
        - DISK_INSUFFICIENT
        - MEMORY_INSUFFICIENT
        - PLATFORM_UNSUPPORTED
        - DOWNLOAD_FAILED
        - CHECKSUM_MISMATCH
        - NETWORK_UNAVAILABLE
        - ENGINE_START_FAILED
        - MODEL_FILES_MISSING
        - CANCELLED
        - SPEECH_UNSUPPORTED
        - TOOL_NOT_INSTALLED
        - TOOL_FAILED
        - UNKNOWN_ERROR
      x-enum-varnames:
        - LocalSpeechRefusalModelUnknown
        - LocalSpeechRefusalInvalidState
        - LocalSpeechRefusalJobRunning
        - LocalSpeechRefusalDiskInsufficient
        - LocalSpeechRefusalMemoryInsufficient
        - LocalSpeechRefusalPlatformUnsupported
        - LocalSpeechRefusalDownloadFailed
        - LocalSpeechRefusalChecksumMismatch
        - LocalSpeechRefusalNetworkUnavailable
        - LocalSpeechRefusalEngineStartFailed
        - LocalSpeechRefusalModelFilesMissing
        - LocalSpeechRefusalCancelled
        - LocalSpeechRefusalSpeechUnsupported
        - LocalSpeechRefusalToolNotInstalled
        - LocalSpeechRefusalToolFailed
        - LocalSpeechRefusalUnknownError
    LocalSpeechActionRefusal:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          $ref: "#/components/schemas/LocalSpeechActionRefusalCode"
        detail:
          type: string
          maxLength: 4000
    LocalSpeechActionAck:
      type: object
      additionalProperties: false
      required: [request_id, outcome]
      properties:
        request_id:
          $ref: "./common.yaml#/components/schemas/Id"
        outcome:
          type: string
          enum: [accepted, refused]
          x-enum-varnames:
            - LocalSpeechActionAcceptedOutcome
            - LocalSpeechActionRefusedOutcome
        refusal:
          $ref: "#/components/schemas/LocalSpeechActionRefusal"
    LocalSpeechActionRequest:
      description: >-
        A Computer owner's action on local speech models or speech runtime config.
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [download, cancel, remove, load, unload, configure]
          x-enum-varnames:
            - LocalSpeechActionRequestDownload
            - LocalSpeechActionRequestCancel
            - LocalSpeechActionRequestRemove
            - LocalSpeechActionRequestLoad
            - LocalSpeechActionRequestUnload
            - LocalSpeechActionRequestConfigure
        model_id:
          $ref: "#/components/schemas/LocalSpeechModelId"
        use_gpu:
          type: boolean
        keep_loaded_seconds:
          type: integer
          minimum: -1
          maximum: 86400
        language:
          $ref: "#/components/schemas/LocalSpeechLanguage"
        include_gpu_engine:
          type: boolean
    LocalSpeechActionAccepted:
      type: object
      additionalProperties: false
      required: [computer_id, action]
      properties:
        computer_id:
          $ref: "./common.yaml#/components/schemas/Id"
        action:
          type: string
          enum: [download, cancel, remove, load, unload, configure]
          x-enum-varnames:
            - LocalSpeechActionAcceptedDownload
            - LocalSpeechActionAcceptedCancel
            - LocalSpeechActionAcceptedRemove
            - LocalSpeechActionAcceptedLoad
            - LocalSpeechActionAcceptedUnload
            - LocalSpeechActionAcceptedConfigure
        model_id:
          $ref: "#/components/schemas/LocalSpeechModelId"
    LocalSpeechRefreshAccepted:
      type: object
      additionalProperties: false
      required: [computer_id, action]
      properties:
        computer_id:
          $ref: "./common.yaml#/components/schemas/Id"
        action:
          type: string
          enum: [refresh]
          x-enum-varnames: [LocalSpeechRefreshAcceptedRefresh]
    LocalSpeechViewUnavailableReason:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          enum:
            [TOOL_NOT_INSTALLED, SPEECH_UNSUPPORTED, TOOL_FAILED, NOT_REPORTED]
          x-enum-varnames:
            - LocalSpeechViewToolNotInstalled
            - LocalSpeechViewSpeechUnsupported
            - LocalSpeechViewToolFailed
            - LocalSpeechViewNotReported
        detail:
          type: string
          maxLength: 4000
    LocalSpeechView:
      description: >-
        One Computer's local speech status as last reported. Tenant members who
        can see the Computer may read; only its owner may act.
      type: object
      additionalProperties: false
      required: [computer, viewer_is_owner, available, models]
      properties:
        computer:
          $ref: "./local-models.yaml#/components/schemas/LocalModelsComputer"
        viewer_is_owner:
          type: boolean
        available:
          type: boolean
        reason:
          $ref: "#/components/schemas/LocalSpeechViewUnavailableReason"
        observed_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        tool_version:
          type: string
          minLength: 1
          maxLength: 64
        config:
          $ref: "#/components/schemas/LocalSpeechConfig"
        runtime:
          $ref: "#/components/schemas/LocalSpeechRuntime"
        models:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/LocalSpeechModel"
    LocalSpeechErrorCode:
      type: string
      enum:
        - LOCAL_COMPUTER_OFFLINE
        - LOCAL_SPEECH_ACTION_FORBIDDEN
        - LOCAL_SPEECH_UNAVAILABLE
        - LOCAL_SPEECH_MODEL_UNKNOWN
        - LOCAL_SPEECH_INVALID_STATE
        - LOCAL_SPEECH_JOB_RUNNING
        - LOCAL_SPEECH_DISK_INSUFFICIENT
        - LOCAL_SPEECH_MEMORY_INSUFFICIENT
        - LOCAL_SPEECH_PLATFORM_UNSUPPORTED
        - LOCAL_SPEECH_ACTION_FAILED
        - LOCAL_SPEECH_ACTION_UNCONFIRMED
        - LOCAL_SPEECH_SERVICE_UNAVAILABLE
    LocalSpeechError:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          $ref: "#/components/schemas/LocalSpeechErrorCode"
        message:
          type: string
          minLength: 1
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        details:
          type: array
          items:
            $ref: "./common.yaml#/components/schemas/ErrorDetail"
        retryable:
          type: boolean
          default: false
    LocalSpeechErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/LocalSpeechError"
    LocalAsrTranscribeSegment:
      type: object
      additionalProperties: false
      required: [start, end, text]
      properties:
        start:
          type: number
          minimum: 0
        end:
          type: number
          minimum: 0
        text:
          type: string
    LocalAsrTranscribeRequest:
      type: object
      additionalProperties: false
      required:
        - tenant_id
        - owner_actor_id
        - computer_id
        - audio_wav_base64
      properties:
        tenant_id:
          $ref: "./common.yaml#/components/schemas/Id"
        owner_actor_id:
          $ref: "./common.yaml#/components/schemas/Id"
        computer_id:
          $ref: "./common.yaml#/components/schemas/Id"
        model_id:
          $ref: "#/components/schemas/LocalSpeechModelId"
        language:
          $ref: "#/components/schemas/LocalSpeechLanguage"
        use_gpu:
          type: boolean
        keep_loaded_seconds:
          type: integer
          minimum: -1
          maximum: 86400
        audio_wav_base64:
          type: string
          minLength: 1
          maxLength: 4194304
    LocalAsrTranscribeResponse:
      type: object
      additionalProperties: false
      required: [text, model, requested_device]
      properties:
        text:
          type: string
        language:
          type: string
          maxLength: 32
          nullable: true
        duration:
          type: number
          minimum: 0
          nullable: true
        model:
          type: string
          minLength: 1
          maxLength: 160
        requested_device:
          $ref: "#/components/schemas/LocalSpeechRequestedDevice"
        effective_device:
          $ref: "#/components/schemas/LocalSpeechEffectiveDevice"
          nullable: true
        fallback_reason:
          $ref: "#/components/schemas/LocalSpeechFallbackReason"
          nullable: true
        segments:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/LocalAsrTranscribeSegment"
