components:
  schemas:
    PersonalWikiDocumentPage:
      type: object
      additionalProperties: false
      required:
        - page_key
        - document_id
        - document_version_id
        - media_type
        - size_bytes
        - sha256
      properties:
        page_key:
          type: string
          minLength: 3
          maxLength: 512
          pattern: "^[a-z0-9][a-z0-9._/-]*\\.md$"
        document_id:
          $ref: "./common.yaml#/components/schemas/Id"
        document_version_id:
          $ref: "./common.yaml#/components/schemas/Id"
        media_type:
          type: string
          const: text/markdown
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
    PersonalWikiDocumentRevision:
      type: object
      additionalProperties: false
      required: [wiki_revision_id, published_at, pages]
      properties:
        is_current:
          type: boolean
          description: This published revision matches all currently usable source versions, checked in one read snapshot. An idle state alone does not prove freshness.
        wiki_state:
          type: string
          enum: [idle, refreshing, failed]
          description: The Wiki's refresh state, the same projection as the Personal Wiki state; failed publication must not be reported as completed.

        wiki_revision_id:
          $ref: "./common.yaml#/components/schemas/Id"
        published_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        pages:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PersonalWikiDocumentPage"
    MemoryWikiRefreshRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, date]
      properties:
        tenant_id:
          $ref: "./common.yaml#/components/schemas/Id"
        date:
          type: string
          format: date
          description: >-
            The business date the request is for: the closed date of a nightly refresh, or the date of the
            meeting. It scopes the refresh intent, not the sources.
        capture_id:
          type: string
          minLength: 1
          maxLength: 128
          description: >-
            The recording whose transcript became ready. The refresh then admits only that meeting's recording
            Sessions, every other source staying at its published version, and its settlement queues no
            follow-up. While another refresh runs, the response is in_progress and the meeting is not admitted:
            request it again after that refresh finishes. Without it, the refresh admits every changed source
            (the nightly refresh).
    MemoryWikiRefreshResponse:
      type: object
      additionalProperties: false
      required: [refresh_status, wiki_id]
      properties:
        refresh_id:
          $ref: "./common.yaml#/components/schemas/Id"
        refresh_status:
          type: string
          enum: [accepted, already_latest, in_progress, no_sources]
        wiki_id:
          $ref: "./common.yaml#/components/schemas/Id"
