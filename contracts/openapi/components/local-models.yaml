components:
  responses:
    LocalModelsRefused:
      description: >-
        The Computer or TeamHub refused the local-models request; error.code is
        one of LocalModelsErrorCode.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LocalModelsErrorResponse"
  schemas:
    LocalModelId:
      description: >-
        Stable localmodels library id: catalog id and variant, such as
        qwen3-4b:Q4_K_M.
      type: string
      pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,159}$"
    LocalModelPoolId:
      description: >-
        A place a model can live: gpu:<index>, system (RAM beside GPUs), or
        unified (RAM of a host without discrete GPUs).
      type: string
      pattern: "^(gpu:(0|[1-9][0-9]{0,2})|system|unified)$"
    LocalModelErrorCode:
      description: >-
        Closed localmodels library error set. It is extended only together with
        the localmodels library contract; UNKNOWN_ERROR preserves forward
        compatibility with newer localmodels releases.
      type: string
      enum:
        - MODEL_UNKNOWN
        - INVALID_STATE
        - JOB_RUNNING
        - MEMORY_INSUFFICIENT
        - DISK_INSUFFICIENT
        - PLATFORM_UNSUPPORTED
        - GPU_UNSUPPORTED
        - DRIVER_UPDATE_REQUIRED
        - RUNTIME_DEPENDENCY_MISSING
        - LOAD_NO_ROOM
        - DOWNLOAD_FAILED
        - CHECKSUM_MISMATCH
        - NETWORK_UNAVAILABLE
        - ENGINE_START_FAILED
        - HEALTH_CHECK_FAILED
        - OUT_OF_MEMORY
        - MODEL_FILES_MISSING
        - GATEWAY_REGISTRATION_FAILED
        - CANCELLED
        - HUB_AUTH_REQUIRED
        - HUB_FORBIDDEN
        - HUB_REPO_NOT_FOUND
        - HUB_FORMAT_UNSUPPORTED
        - HUB_UNREACHABLE
        - UNSUPPORTED_ARCHITECTURE
        - CORRUPT_WEIGHTS
        - UNKNOWN_ERROR
    LocalModelsUnavailableCode:
      description: >-
        Why a Computer reports no model library. TOOL_NOT_INSTALLED: its
        Computer config names no localmodels tool. TOOL_FAILED: the tool did
        not answer library status.
      type: string
      enum: [TOOL_NOT_INSTALLED, TOOL_FAILED]
    LocalModelActionRefusalCode:
      description: >-
        Why the Computer refused an action before starting it: a localmodels
        library error or a reason the library is unavailable.
      type: string
      enum:
        - MODEL_UNKNOWN
        - INVALID_STATE
        - JOB_RUNNING
        - MEMORY_INSUFFICIENT
        - DISK_INSUFFICIENT
        - PLATFORM_UNSUPPORTED
        - GPU_UNSUPPORTED
        - DRIVER_UPDATE_REQUIRED
        - RUNTIME_DEPENDENCY_MISSING
        - LOAD_NO_ROOM
        - DOWNLOAD_FAILED
        - CHECKSUM_MISMATCH
        - NETWORK_UNAVAILABLE
        - ENGINE_START_FAILED
        - HEALTH_CHECK_FAILED
        - OUT_OF_MEMORY
        - MODEL_FILES_MISSING
        - GATEWAY_REGISTRATION_FAILED
        - CANCELLED
        - HUB_AUTH_REQUIRED
        - HUB_FORBIDDEN
        - HUB_REPO_NOT_FOUND
        - HUB_FORMAT_UNSUPPORTED
        - HUB_UNREACHABLE
        - UNSUPPORTED_ARCHITECTURE
        - CORRUPT_WEIGHTS
        - UNKNOWN_ERROR
        - TOOL_NOT_INSTALLED
        - TOOL_FAILED
    LocalModelGpu:
      type: object
      additionalProperties: false
      required: [index, name, total_bytes, free_bytes]
      properties:
        index:
          type: integer
          minimum: 0
        uuid:
          type: string
          minLength: 1
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 200
        total_bytes:
          type: integer
          format: int64
          minimum: 0
        free_bytes:
          type: integer
          format: int64
          minimum: 0
    LocalModelHost:
      description: Hardware and software of the Computer as localmodels reports it.
      type: object
      additionalProperties: false
      required:
        [
          platform,
          arch,
          os_label,
          engine_label,
          ram_total_bytes,
          disk_free_bytes,
          gpus,
        ]
      properties:
        platform:
          type: string
          enum: [linux, darwin, windows]
          x-enum-varnames:
            [
              LocalModelHostPlatformLinux,
              LocalModelHostPlatformDarwin,
              LocalModelHostPlatformWindows,
            ]
        arch:
          type: string
          enum: [x86_64, arm64]
          x-enum-varnames: [LocalModelHostArchX8664, LocalModelHostArchArm64]
        os_label:
          description: Display only, such as Ubuntu 24.04.
          type: string
          maxLength: 200
        engine_label:
          description: Display only, such as llama.cpp b11370 with CUDA.
          type: string
          maxLength: 200
        ram_total_bytes:
          type: integer
          format: int64
          minimum: 0
        disk_free_bytes:
          type: integer
          format: int64
          minimum: 0
        models_dir:
          description: >-
            Absolute directory on the Computer where local model weight files
            are stored (<base_dir>/models). Sent only when service_features
            declares local_models_storage; omitted for non-owners in the public
            view.
          type: string
          minLength: 1
          maxLength: 4096
        models_dir_exists:
          description: >-
            Whether models_dir currently exists on disk on the Computer. Sent
            only when service_features declares local_models_storage; omitted
            for non-owners in the public view.
          type: boolean
        gpus:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/LocalModelGpu"
        supported_formats:
          description: Weight formats the host can run natively (gguf, mlx).
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            $ref: "#/components/schemas/LocalModelFormat"
    LocalModelFormat:
      description: Local weight format supported by localmodels engines.
      type: string
      enum: [gguf, mlx]
      x-enum-varnames: [LocalModelFormatGguf, LocalModelFormatMlx]
    LocalModelCustomRepoFormat:
      description: Weight format detected in a remote Hugging Face or ModelScope repository.
      type: string
      enum: [gguf, mlx, safetensors, unknown]
      x-enum-varnames:
        [
          LocalModelCustomRepoFormatGguf,
          LocalModelCustomRepoFormatMlx,
          LocalModelCustomRepoFormatSafetensors,
          LocalModelCustomRepoFormatUnknown,
        ]
    LocalModelOrigin:
      description: Whether a model entry comes from the curated catalog or a custom hub repository.
      type: string
      enum: [curated, custom]
      x-enum-varnames: [LocalModelOriginCurated, LocalModelOriginCustom]
    LocalModelCustomHub:
      description: Remote model hub hosting a custom repository.
      type: string
      enum: [huggingface, modelscope]
      x-enum-varnames:
        [LocalModelCustomHubHuggingface, LocalModelCustomHubModelscope]
    LocalModelCustomInfo:
      description: Provenance and Standby-First metadata for a custom hub model.
      type: object
      additionalProperties: false
      required:
        [hub, repo_id, format, variant_id, shard_count, standby_on_restart]
      properties:
        hub:
          $ref: "#/components/schemas/LocalModelCustomHub"
        repo_id:
          type: string
          minLength: 1
          maxLength: 256
        revision:
          type: string
          minLength: 1
          maxLength: 128
        url:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: "^https://[A-Za-z0-9._~:/?#\\[\\]@!$&'()*+,;=%-]+$"
        format:
          $ref: "#/components/schemas/LocalModelFormat"
        variant_id:
          type: string
          minLength: 1
          maxLength: 128
        shard_count:
          type: integer
          minimum: 1
          maximum: 256
        mmproj_file:
          type: string
          minLength: 1
          maxLength: 512
        mmproj_bytes:
          type: integer
          format: int64
          minimum: 0
        accepted_risk:
          type: boolean
        standby_on_restart:
          type: boolean
    LocalModelVerificationStatus:
      description: Smoke-test verification state for a custom model.
      type: string
      enum: [untested, running, verified, failed]
      x-enum-varnames:
        [
          LocalModelVerificationStatusUntested,
          LocalModelVerificationStatusRunning,
          LocalModelVerificationStatusVerified,
          LocalModelVerificationStatusFailed,
        ]
    LocalModelVerificationFailureKind:
      description: Classified failure category of a custom model smoke test.
      type: string
      enum: [oom, unsupported_arch, corrupt, unknown]
      x-enum-varnames:
        [
          LocalModelVerificationFailureKindOom,
          LocalModelVerificationFailureKindUnsupportedArch,
          LocalModelVerificationFailureKindCorrupt,
          LocalModelVerificationFailureKindUnknown,
        ]
    LocalModelVerificationFailure:
      description: Structured details of a failed custom model smoke test.
      type: object
      additionalProperties: false
      required:
        [kind, code, context_tokens, can_retry_lower_ctx, can_redownload]
      properties:
        kind:
          $ref: "#/components/schemas/LocalModelVerificationFailureKind"
        code:
          $ref: "#/components/schemas/LocalModelErrorCode"
        context_tokens:
          type: integer
          format: int64
          minimum: 1
        can_retry_lower_ctx:
          type: boolean
        can_redownload:
          type: boolean
        diagnostic_log:
          description: Redacted diagnostic excerpt from the smoke test; owner-only in public views.
          type: string
          maxLength: 4000
    LocalModelVerification:
      description: Smoke-test verification record for a custom model.
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/LocalModelVerificationStatus"
        context_tokens:
          type: integer
          format: int64
          minimum: 1
        tested_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        failure:
          $ref: "#/components/schemas/LocalModelVerificationFailure"
    LocalModelPoolHolder:
      description: >-
        Something holding pool memory. A component is a foundation service such
        as an embedding, reranker, or speech model; it is never a model row.
      type: object
      additionalProperties: false
      required: [kind, id, name, bytes]
      properties:
        kind:
          type: string
          enum: [model, component]
          x-enum-varnames:
            [LocalModelPoolHolderKindModel, LocalModelPoolHolderKindComponent]
        id:
          type: string
          minLength: 1
          maxLength: 160
        name:
          type: string
          minLength: 1
          maxLength: 200
        bytes:
          type: integer
          format: int64
          minimum: 0
    LocalModelPoolExternalHolder:
      description: >-
        A desktop application outside localmodels holding pool memory, such as
        a browser, video player, or game, that the user could close.
      type: object
      additionalProperties: false
      required: [name, bytes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        bytes:
          type: integer
          format: int64
          minimum: 0
    LocalModelPool:
      description: >-
        One place models load into. The system and unified budgets are 80% of
        RAM, as localmodels computes them.
      type: object
      additionalProperties: false
      required: [id, kind, total_bytes, used_bytes, holders]
      properties:
        id:
          $ref: "#/components/schemas/LocalModelPoolId"
        kind:
          type: string
          enum: [gpu, system, unified]
          x-enum-varnames:
            [
              LocalModelPoolKindGpu,
              LocalModelPoolKindSystem,
              LocalModelPoolKindUnified,
            ]
        gpu_index:
          description: Present only for kind gpu; matches LocalModelGpu.index.
          type: integer
          minimum: 0
        total_bytes:
          type: integer
          format: int64
          minimum: 0
        used_bytes:
          type: integer
          format: int64
          minimum: 0
        holders:
          type: array
          maxItems: 256
          items:
            $ref: "#/components/schemas/LocalModelPoolHolder"
        external_holders:
          description: >-
            Closeable desktop applications holding this pool's memory, as
            localmodels reports them. An empty list means localmodels looked
            and found no closeable app; absent means not reported, and the
            rest of used_bytes is then not known to be other apps.
          type: array
          maxItems: 256
          items:
            $ref: "#/components/schemas/LocalModelPoolExternalHolder"
    LocalModelAvailability:
      type: object
      additionalProperties: false
      required: [downloadable]
      properties:
        downloadable:
          type: boolean
        reason:
          $ref: "#/components/schemas/LocalModelAvailabilityReason"
          description: Present only when downloadable is false.
    LocalModelAvailabilityReason:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          enum:
            - MEMORY_INSUFFICIENT
            - DISK_INSUFFICIENT
            - PLATFORM_UNSUPPORTED
            - GPU_UNSUPPORTED
            - DRIVER_UPDATE_REQUIRED
            - RUNTIME_DEPENDENCY_MISSING
            - UNAVAILABLE
          x-enum-varnames:
            - LocalModelAvailabilityMemoryInsufficient
            - LocalModelAvailabilityDiskInsufficient
            - LocalModelAvailabilityPlatformUnsupported
            - LocalModelAvailabilityGpuUnsupported
            - LocalModelAvailabilityDriverUpdateRequired
            - LocalModelAvailabilityRuntimeDependencyMissing
            - LocalModelAvailabilityUnavailable
        need_bytes:
          type: integer
          format: int64
          minimum: 0
        have_bytes:
          type: integer
          format: int64
          minimum: 0
        memory_kind:
          description: "With MEMORY_INSUFFICIENT: which memory space was short."
          type: string
          enum: [vram, ram, unified]
          x-enum-varnames:
            [
              LocalModelMemoryKindVram,
              LocalModelMemoryKindRam,
              LocalModelMemoryKindUnified,
            ]
        gpu_vendor:
          description: "With GPU_UNSUPPORTED: detected GPU vendor class on this Computer."
          type: string
          enum: [amd, intel, none, unknown]
          x-enum-varnames:
            [
              LocalModelGpuVendorAmd,
              LocalModelGpuVendorIntel,
              LocalModelGpuVendorNone,
              LocalModelGpuVendorUnknown,
            ]
        required_cuda:
          description: "With DRIVER_UPDATE_REQUIRED: minimum CUDA version required by the pinned engine."
          type: string
          minLength: 1
          maxLength: 32
        detected_cuda:
          description: "With DRIVER_UPDATE_REQUIRED: CUDA version reported by the installed driver."
          type: string
          minLength: 1
          maxLength: 32
        driver_version:
          description: "With DRIVER_UPDATE_REQUIRED: installed NVIDIA driver version."
          type: string
          minLength: 1
          maxLength: 64
        missing_libraries:
          description: "With RUNTIME_DEPENDENCY_MISSING: missing shared libraries such as libgomp.so.1."
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
        required_glibc:
          description: "With RUNTIME_DEPENDENCY_MISSING: minimum glibc version required by the engine."
          type: string
          minLength: 1
          maxLength: 32
        detected_glibc:
          description: "With RUNTIME_DEPENDENCY_MISSING: glibc version detected on this Computer."
          type: string
          minLength: 1
          maxLength: 32
    LocalModelsDebugInfo:
      description: >-
        Present only when localmodels debug mode (tiny or simulate) is active on
        the Computer. config_path is shown only to the Computer owner.
      type: object
      additionalProperties: false
      required: [mode, source]
      properties:
        mode:
          type: string
          enum: [tiny, simulate]
          x-enum-varnames:
            [LocalModelsDebugModeTiny, LocalModelsDebugModeSimulate]
        source:
          type: string
          enum: [env, state_config, user_config]
          x-enum-varnames:
            [
              LocalModelsDebugSourceEnv,
              LocalModelsDebugSourceStateConfig,
              LocalModelsDebugSourceUserConfig,
            ]
        config_path:
          description: Local debug.json path when source is state_config or user_config; owner-only in the public view.
          type: string
          minLength: 1
          maxLength: 4096
    LocalModelDownloadProgress:
      type: object
      additionalProperties: false
      required: [step, done_bytes, total_bytes]
      properties:
        step:
          type: string
          enum: [download, verify]
          x-enum-varnames:
            [LocalModelDownloadStepDownload, LocalModelDownloadStepVerify]
        done_bytes:
          type: integer
          format: int64
          minimum: 0
        total_bytes:
          type: integer
          format: int64
          minimum: 0
        bytes_per_second:
          type: integer
          format: int64
          minimum: 0
        shard_index:
          description: 1-based index of the shard currently downloading.
          type: integer
          minimum: 1
        shard_count:
          description: Total number of shards in this download.
          type: integer
          minimum: 1
    LocalModelEndpoint:
      type: object
      additionalProperties: false
      required: [base_url]
      properties:
        base_url:
          type: string
          minLength: 1
          maxLength: 2048
    LocalModelError:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          $ref: "#/components/schemas/LocalModelErrorCode"
        detail:
          description: Diagnostic text for display; never matched on.
          type: string
          maxLength: 4000
        cause:
          description: >-
            Why a GATEWAY_REGISTRATION_FAILED happened, when the Computer
            supervised the failed job. GATEWAY_HOME_NOT_PRIVATE: the local
            gateway's private folder at path has another owner; closing Linger
            and renaming that folder lets the model load.
          type: string
          enum: [GATEWAY_HOME_NOT_PRIVATE]
          x-enum-varnames: [LocalModelErrorCauseGatewayHomeNotPrivate]
        path:
          description: >-
            The folder the cause names, on the Computer. The public view
            carries it only for the Computer's owner.
          type: string
          minLength: 1
          maxLength: 4096
        pool:
          $ref: "#/components/schemas/LocalModelPoolId"
          description: With LOAD_NO_ROOM.
        need_bytes:
          type: integer
          format: int64
          minimum: 0
        free_bytes:
          type: integer
          format: int64
          minimum: 0
        shortfall_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Minimum additional free memory needed to load even at the lowest posture rung.
        can_force:
          type: boolean
          description: True when the owner may override admission with Load Anyway (--force).
    LocalModelNote:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          enum: [NO_ROOM_TO_LOAD]
          x-enum-varnames: [LocalModelNoteNoRoomToLoad]
    LocalModelState:
      description: >-
        absent: not on disk. idle: on disk, holding no memory. loading reserves
        its memory before it finishes; loaded is registered with the local
        gateway and Pi.
      type: string
      enum: [absent, downloading, idle, loading, loaded, failed]
      x-enum-varnames:
        [
          LocalModelStateAbsent,
          LocalModelStateDownloading,
          LocalModelStateIdle,
          LocalModelStateLoading,
          LocalModelStateLoaded,
          LocalModelStateFailed,
        ]
    LocalModelFit:
      description: >-
        Where the model can live, judged on total capacity so it stays stable
        across loads. system means localmodels can run it from RAM, slower.
      type: string
      enum: [gpu, unified, system, none]
      x-enum-varnames:
        [
          LocalModelFitGpu,
          LocalModelFitUnified,
          LocalModelFitSystem,
          LocalModelFitNone,
        ]
    LocalModelFamily:
      description: Model family for brand presentation; never inferred from name.
      type: string
      enum:
        [
          qwen,
          gemma,
          llama,
          openai,
          deepseek,
          mistral,
          phi,
          glm,
          kimi,
          claude,
          grok,
          other,
        ]
      x-enum-varnames:
        [
          LocalModelFamilyQwen,
          LocalModelFamilyGemma,
          LocalModelFamilyLlama,
          LocalModelFamilyOpenai,
          LocalModelFamilyDeepseek,
          LocalModelFamilyMistral,
          LocalModelFamilyPhi,
          LocalModelFamilyGlm,
          LocalModelFamilyKimi,
          LocalModelFamilyClaude,
          LocalModelFamilyGrok,
          LocalModelFamilyOther,
        ]
    LocalModelArchitecture:
      description: >-
        Weight activation topology: dense activates all parameters per token;
        moe activates a subset.
      type: string
      enum: [dense, moe]
      x-enum-varnames: [LocalModelArchitectureDense, LocalModelArchitectureMoe]
    LocalModelCapability:
      description: Model capability verified by localmodels on this platform.
      type: string
      enum: [vision, tool_use, reasoning, coding, multilingual]
      x-enum-varnames:
        [
          LocalModelCapabilityVision,
          LocalModelCapabilityToolUse,
          LocalModelCapabilityReasoning,
          LocalModelCapabilityCoding,
          LocalModelCapabilityMultilingual,
        ]
    LocalModelEngine:
      description: >-
        Inference engine family that runs this model entry. Never inferred from
        name or description.
      type: string
      enum: [llama.cpp, polystrata, strata, mlx]
      x-enum-varnames:
        [
          LocalModelEngineLlamaCpp,
          LocalModelEnginePolystrata,
          LocalModelEngineStrata,
          LocalModelEngineMlx,
        ]
    LocalModelStorageFile:
      description: >-
        One local weight or companion file belonging to a model on disk.
        Omitted for non-owners in the public view.
      type: object
      additionalProperties: false
      required: [path, role, size_bytes, present, shared]
      properties:
        path:
          description: Absolute native OS path to the file on the Computer.
          type: string
          minLength: 1
          maxLength: 4096
        role:
          type: string
          enum: [weights, mmproj, other]
          x-enum-varnames:
            [
              LocalModelStorageFileRoleWeights,
              LocalModelStorageFileRoleMmproj,
              LocalModelStorageFileRoleOther,
            ]
        size_bytes:
          description: Actual bytes currently on disk (or partial download bytes); 0 when missing.
          type: integer
          format: int64
          minimum: 0
        present:
          description: Whether the final file currently exists on disk.
          type: boolean
        shared:
          description: Whether another downloaded model or deployment shares this file.
          type: boolean
    LocalModelStorage:
      description: >-
        On-disk storage location and files for a model on the Computer. Present
        only for non-absent models when reported by localmodels and
        service_features declares local_models_storage; omitted for non-owners
        in the public view.
      type: object
      additionalProperties: false
      required:
        [dir, primary_path, dedicated_dir, disk_bytes, files_present, files]
      properties:
        dir:
          description: Absolute native OS directory containing primary_path.
          type: string
          minLength: 1
          maxLength: 4096
        primary_path:
          description: Absolute native OS path to the primary weight file for this model.
          type: string
          minLength: 1
          maxLength: 4096
        dedicated_dir:
          description: True when dir holds only this model's files rather than a shared flat folder.
          type: boolean
        disk_bytes:
          description: Total actual bytes currently on disk across files.
          type: integer
          format: int64
          minimum: 0
        files_present:
          description: True when every required file in files currently exists on disk.
          type: boolean
        files:
          type: array
          minItems: 1
          maxItems: 256
          items:
            $ref: "#/components/schemas/LocalModelStorageFile"
    LocalModelKvQuant:
      description: Symmetric KV-cache quantization of a model posture; omitted when asymmetric or unknown.
      type: string
      enum: [f16, q8_0, q4_0]
      x-enum-varnames:
        [LocalModelKvQuantF16, LocalModelKvQuantQ80, LocalModelKvQuantQ40]
    LocalModelPosture:
      description: Context length, concurrent slots, and optional KV-cache quantization for a loaded or requested model posture.
      type: object
      additionalProperties: false
      required: [context_tokens, slots]
      properties:
        context_tokens:
          type: integer
          format: int64
          minimum: 1
        slots:
          type: integer
          minimum: 1
          maximum: 64
        kv_cache_quant:
          $ref: "#/components/schemas/LocalModelKvQuant"
    LocalModelDegradationReason:
      description: Why a loaded model stepped down from its requested posture or overrode normal memory headroom.
      type: string
      enum:
        [
          reduced_slots,
          reduced_context,
          above_soft_budget,
          oom_retry,
          forced_overcommit,
        ]
      x-enum-varnames:
        [
          LocalModelDegradationReasonReducedSlots,
          LocalModelDegradationReasonReducedContext,
          LocalModelDegradationReasonAboveSoftBudget,
          LocalModelDegradationReasonOomRetry,
          LocalModelDegradationReasonForcedOvercommit,
        ]
    LocalModelPressureWarning:
      description: Present when loaded under tight memory without failing.
      type: object
      additionalProperties: false
      required: [level]
      properties:
        level:
          type: string
          enum: [soft, high]
          x-enum-varnames:
            [
              LocalModelPressureWarningLevelSoft,
              LocalModelPressureWarningLevelHigh,
            ]
        pool:
          $ref: "#/components/schemas/LocalModelPoolId"
        free_bytes:
          type: integer
          format: int64
          minimum: 0
        budget_bytes:
          type: integer
          format: int64
          minimum: 0
    LocalModel:
      description: >-
        One validated chat model of the catalog on this platform and its state
        on this Computer. Sizes are bytes; readers format them.
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          description,
          quant,
          context_tokens,
          vision,
          download_bytes,
          memory_bytes,
          fit,
          recommended,
          availability,
          state,
        ]
      properties:
        id:
          $ref: "#/components/schemas/LocalModelId"
        name:
          type: string
