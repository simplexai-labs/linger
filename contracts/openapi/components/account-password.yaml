components:
  schemas:
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
        new_password:
          type: string
          description: >-
            8-1024 UTF-8 bytes. TeamHub counts bytes; minLength and maxLength count characters,
            so they bound the byte rule only loosely.
          minLength: 2
          maxLength: 1024
          writeOnly: true
