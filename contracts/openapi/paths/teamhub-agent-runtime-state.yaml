startEpoch:
  post:
    tags: [Agent Runtime State]
    operationId: startAgentServiceEpoch
    summary: Open the epoch of a newly started Agent Service process.
    description: >-
      One Agent Service process runs against a database. Every Run still
      running under an earlier epoch ends as interrupted (failed with
      process_interrupted); queued Runs stay queued. A Message steer that
      waited for an interrupted Run becomes a queued Run, and any other
      unsettled steer is settled as uncertain. Every later Runtime write
      names this epoch; a write naming an earlier one is rejected with
      CONTEXT_FENCED.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/agent-runtime-state.yaml#/components/schemas/StartAgentServiceEpochRequest"
    responses:
      "200":
        description: The interrupted Runs and the Contexts with queued work.
        content:
          application/json:
            schema:
              $ref: "../components/agent-runtime-state.yaml#/components/schemas/AgentServiceEpochStart"
      "400":
        $ref: "../components/common.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../components/common.yaml#/components/responses/Unauthenticated"
      "500":
        $ref: "../components/common.yaml#/components/responses/InternalError"

acceptTrustedNotification:
  post:
    tags: [Agent Runtime State]
    operationId: acceptAgentRuntimeTrustedNotification
    summary: Persist one trusted internal notification for the active Local Run
    description: >-
      Inserts the internal input in steering state under the fenced Context. An
      exact already-persisted input is reported as already_accepted so callers do
      not steer the provider twice.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/agent-runtime-state.yaml#/components/schemas/AcceptAgentTrustedNotificationRequest"
    responses:
      "200":
