getLocalComputer:
  get:
    tags: [Agent Runtime State]
    operationId: getAgentRuntimeLocalComputer
    summary: Read one Local Computer, to check a Runner credential before a connection is accepted.
    parameters:
      - name: computer_id
        in: query
        required: true
        schema:
          $ref: "../components/common.yaml#/components/schemas/Id"
    responses:
      "200":
        description: The Local Computer.
        content:
          application/json:
            schema:
              $ref: "../components/agent-runtime-state.yaml#/components/schemas/AgentRuntimeLocalComputer"
      "401":
        $ref: "../components/common.yaml#/components/responses/Unauthenticated"
      "404":
        $ref: "../components/common.yaml#/components/responses/NotFound"
      "500":
        $ref: "../components/common.yaml#/components/responses/InternalError"

connectLocalComputer:
  post:
    tags: [Agent Runtime State]
    operationId: connectAgentRuntimeLocalComputer
    summary: Record a Computer's hello and read the Agent Runners it should hold.
    description: >-
      Checks the Runner credential generation and owner, binds the Computer
      Daemon Identity on first use, records the observation, and returns every
      active Agent placed on this Computer. The Agent Service computes the
      Computer's Agent Runners from these placements; a Runner the Computer
      reports for an Agent not listed here is removed.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/agent-runtime-state.yaml#/components/schemas/ConnectAgentRuntimeLocalComputerRequest"
    responses:
      "200":
        description: The Computer and the Agents placed on it.
        content:
          application/json:
            schema:
              $ref: "../components/agent-runtime-state.yaml#/components/schemas/ConnectAgentRuntimeLocalComputerResult"
      "400":
        $ref: "../components/common.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../components/common.yaml#/components/responses/Unauthenticated"
      "404":
        $ref: "../components/common.yaml#/components/responses/NotFound"
      "409":
        $ref: "../components/common.yaml#/components/responses/Conflict"
      "500":
        $ref: "../components/common.yaml#/components/responses/InternalError"

recordRunOperation:
  post:
    tags: [Agent Runtime State]
    operationId: recordAgentLocalRunOperation
    summary: Record a Runner Operation of a Run, and its usage once it ends.
    description: >-
      The Run keeps one entry per Runner Operation. A start records the
      Operation with no usage; a terminal records its usage once and adds it
      to the usage totals. A write of an earlier Agent Service epoch is
      rejected with CONTEXT_FENCED.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/agent-runtime-state.yaml#/components/schemas/RecordAgentLocalRunOperationRequest"
    responses:
      "200":
        description: Recorded.
        content:
          application/json:
            schema:
              $ref: "../components/agent-runtime-state.yaml#/components/schemas/AgentRuntimeSuccessResult"
      "400":
        $ref: "../components/common.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../components/common.yaml#/components/responses/Unauthenticated"
      "404":
        $ref: "../components/common.yaml#/components/responses/NotFound"
      "409":
        $ref: "../components/common.yaml#/components/responses/Conflict"
      "500":
        $ref: "../components/common.yaml#/components/responses/InternalError"

touchLocalComputer:
  post:
    tags: [Agent Runtime State]
    operationId: touchAgentRuntimeLocalComputer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/agent-runtime-state.yaml#/components/schemas/TouchAgentRuntimeLocalComputerRequest"
    responses:
      "200":
        description: Updated Local Computer projection.
        content:
          application/json:
            schema:
              $ref: "../components/agent-runtime-state.yaml#/components/schemas/AgentRuntimeLocalComputer"
      "400":
        $ref: "../components/common.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../components/common.yaml#/components/responses/Unauthenticated"
      "404":
        $ref: "../components/common.yaml#/components/responses/NotFound"
      "500":
        $ref: "../components/common.yaml#/components/responses/InternalError"

removeLocalComputer:
  post:
    tags: [Agent Runtime State]
    operationId: removeAgentRuntimeLocalComputer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/agent-runtime-state.yaml#/components/schemas/RemoveAgentRuntimeLocalComputerRequest"
    responses:
      "200":
        description: Local Computer removal result.
        content:
          application/json:
            schema:
              $ref: "../components/agent-runtime-state.yaml#/components/schemas/AgentRuntimeLocalComputerRemovalResult"
      "400":
        $ref: "../components/common.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../components/common.yaml#/components/responses/Unauthenticated"
      "409":
        $ref: "../components/common.yaml#/components/responses/Conflict"
      "500":
        $ref: "../components/common.yaml#/components/responses/InternalError"

components:
  responses:
    InboxNotAuthorized:
      description: >-
        INBOX_NOT_AUTHORIZED rejects only this Inbox's current reception grant;
        the Context and its other Inboxes remain authoritative. CONTEXT_FENCED
        is reserved for a lost Context identity or a superseded Agent Service
        epoch and is returned as 409.
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/components/schemas/ErrorResponse"
  parameters:
    ContextKey:
      name: context_key
      in: query
      required: true
      schema:
        $ref: "../components/agent-runtime-state.yaml#/components/schemas/AgentRuntimeContextKey"
    InboxId:
      name: inbox_id
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 1000
    LocalRunId:
      name: local_run_id
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    InputId:
      name: input_id
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 1000

listRecentlyUsedContexts:
  post:
    tags: [Agent Runtime State]
    operationId: listRecentlyUsedAgentRuntimeContexts
    summary: List active Local Computer Contexts with a recent Local Run, for restart restore.
    description: Read only. Never activates Contexts; callers decide what to do with the observations. The window and row limit are server-side.
    responses:
      "200":
        description: Contexts ordered by most recent Local Run first. Empty when none match.
        content:
          application/json:
            schema:
              $ref: "../components/agent-runtime-state.yaml#/components/schemas/ListRecentlyUsedAgentRuntimeContextsResult"
      "401":
        $ref: "../components/common.yaml#/components/responses/Unauthenticated"
      "500":
        $ref: "../components/common.yaml#/components/responses/InternalError"

agentMemory:
  parameters:
    - name: agentId
      in: path
      required: true
      schema:
        $ref: "../components/common.yaml#/components/schemas/Id"
  get:
    tags: [Agent Runtime State]
    operationId: getAgentMemory
    summary: Read the Agent-scoped derived memory and maintenance cursor.
    responses:
      "200":
        description: Current memory; an uninitialized Agent has revision zero.
        content:
          application/json:
            schema:
              $ref: "../components/agent-runtime-state.yaml#/components/schemas/AgentMemoryDocument"
      "401":
        $ref: "../components/common.yaml#/components/responses/Unauthenticated"
      "404":
        $ref: "../components/common.yaml#/components/responses/NotFound"
  post:
    tags: [Agent Runtime State]
    operationId: commitAgentMemory
    summary: Compare-and-swap derived memory using the supplied current revision.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/agent-runtime-state.yaml#/components/schemas/AgentMemoryDocument"
    responses:
      "200":
        description: Committed memory with incremented revision.
        content:
          application/json:
            schema:
              $ref: "../components/agent-runtime-state.yaml#/components/schemas/AgentMemoryDocument"
      "400":
        $ref: "../components/common.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../components/common.yaml#/components/responses/Unauthenticated"
      "404":
        $ref: "../components/common.yaml#/components/responses/NotFound"
      "409":
        $ref: "../components/common.yaml#/components/responses/Conflict"

humanInteractions:
  post:
    tags: [Agent Runtime State]
    operationId: createRuntimeHumanInteraction
    summary: Create a Room question card for one active Runtime request.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/agent-runtime-state.yaml#/components/schemas/CreateRuntimeHumanInteractionRequest
    responses:
      "201":
        description: The card and its Room Event are committed.
        content:
          application/json:
            schema:
              $ref: ../components/agent-runtime-state.yaml#/components/schemas/RuntimeHumanInteractionCreated
      "400":
        $ref: ../components/common.yaml#/components/responses/BadRequest
      "401":
        $ref: ../components/common.yaml#/components/responses/Unauthenticated
      "403":
        $ref: ../components/common.yaml#/components/responses/Forbidden
      "409":
        $ref: ../components/common.yaml#/components/responses/Conflict
      "503":
        $ref: ../components/common.yaml#/components/responses/ServiceUnavailable

permissionReviews:
  post:
    tags: [Agent Runtime State]
    operationId: createRuntimePermissionReview
    summary: Judge one pending Runtime tool call that the Runtime would otherwise ask a human about.
    description: |
      Consumes a matching one-time approval, returns a still-pending approval card,
      or asks the permission judge. A needs_approval verdict creates an asynchronous
      approval card whose decision wakes the waiting Agent; the Runtime is never
      blocked on the human.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/agent-runtime-state.yaml#/components/schemas/CreateRuntimePermissionReviewRequest
    responses:
      "200":
        description: The verdict for this exact action.
        content:
          application/json:
            schema:
              $ref: ../components/agent-runtime-state.yaml#/components/schemas/RuntimePermissionReviewResult
      "400":
        $ref: ../components/common.yaml#/components/responses/BadRequest
      "401":
        $ref: ../components/common.yaml#/components/responses/Unauthenticated
      "403":
        $ref: ../components/common.yaml#/components/responses/Forbidden
      "409":
        $ref: ../components/common.yaml#/components/responses/Conflict
      "503":
        $ref: ../components/common.yaml#/components/responses/ServiceUnavailable
