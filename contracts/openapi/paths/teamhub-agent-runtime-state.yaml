configSnapshot:
  get:
    tags: [Agent Runtime State]
    operationId: getAgentRuntimeConfigSnapshot
    summary: Read one TeamHub-composed Agent Runtime configuration snapshot.
    parameters:
      - name: agent_id
        in: query
        required: true
        schema:
          $ref: "../components/common.yaml#/components/schemas/Id"
      - name: revision
        in: query
        schema:
          $ref: "../components/agent-runtime-state.yaml#/components/schemas/AgentRuntimePositiveInt64"
    responses:
      "200":
        description: Canonical current Runtime configuration.
        content:
          application/json:
            schema:
              $ref: "../components/agent-runtime-state.yaml#/components/schemas/AgentRuntimeConfigSnapshot"
      "400":
        $ref: "../components/common.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../components/common.yaml#/components/responses/Unauthenticated"
      "404":
        $ref: "../components/common.yaml#/components/responses/NotFound"
      "409":
        $ref: "../components/common.yaml#/components/responses/Conflict"
      "500":
        $ref: "../components/common.yaml#/components/responses/InternalError"
      "503":
        $ref: "../components/common.yaml#/components/responses/ServiceUnavailable"

anotherMePlacements:
  get:
    tags: [Agent Runtime State]
    operationId: listAnotherMePlacements
    summary: List the Computer and Runtime of each active Another Me.
    description: >-
      Lets the Agent Service run a Human's background model calls on the
      Computer of that Human's Another Me. Without filters it lists every
      active Another Me placed on a Computer.
    parameters:
      - name: tenant_id
        in: query
        schema:
          $ref: "../components/common.yaml#/components/schemas/Id"
      - name: owner_actor_id
        in: query
        schema:
          $ref: "../components/common.yaml#/components/schemas/Id"
    responses:
      "200":
        description: Active Another Me placements, at most 1000.
        content:
          application/json:
            schema:
              $ref: "../components/agent-runtime-state.yaml#/components/schemas/AnotherMePlacementList"
      "400":
        $ref: "../components/common.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../components/common.yaml#/components/responses/Unauthenticated"
      "500":
        $ref: "../components/common.yaml#/components/responses/InternalError"
      "503":
        $ref: "../components/common.yaml#/components/responses/ServiceUnavailable"

deletionSnapshot:
  get:
    tags: [Agent Runtime State]
    operationId: getAgentRuntimeDeletionSnapshot
    summary: Read cleanup identity only for an Agent whose registration is revoked.
    description: >-
      A read-only snapshot of existing identity and Contexts. This does not reconcile
      Contexts, load Sessions or authorize execution. Cleanup must check
      this current deletion authority before retiring each existing physical resource.
    parameters:
      - name: agent_id
        in: query
        required: true
        schema:
          $ref: "../components/common.yaml#/components/schemas/Id"
    responses:
      "200":
        description: Current deletion identity and existing Contexts.
        content:
          application/json:
            schema:
              $ref: "../components/agent-runtime-state.yaml#/components/schemas/AgentRuntimeDeletionSnapshot"
      "400":
        $ref: "../components/common.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../components/common.yaml#/components/responses/Unauthenticated"
      "404":
        $ref: "../components/common.yaml#/components/responses/NotFound"
      "409":
        $ref: "../components/common.yaml#/components/responses/Conflict"
      "500":
        $ref: "../components/common.yaml#/components/responses/InternalError"

listOrEnsureContexts:
