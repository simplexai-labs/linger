list:
  post:
    operationId: listAgentTrackingItems
    summary: listAgentTrackingItems
    security: [{ agentBearer: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            {
              $ref: "../components/tracking-items.yaml#/components/schemas/TrackingItemList",
            }
    responses:
      "200":
        description: Owner-scoped tracking item command result.
        content:
          application/json:
            schema:
              {
                $ref: "../components/tracking-items.yaml#/components/schemas/TrackingItemPage",
              }
      default:
        $ref: "../components/agent-api-errors.yaml#/components/responses/InternalError"
