managedCredentials:
  parameters:
    - { name: agentId, in: path, required: true, schema: { type: string } }
  post:
    operationId: issueManagedAgentAccessCredential
    description: Trusted Agent Service configuration only. The service bearer must not be exposed to the Agent. Ensures the Agent's one long-term Computer credential, bound to its current placement. A call whose held_token_sha256 names that live credential issues nothing; any other call creates a new credential and revokes the previous one. The Runner Gateway calls it once per Computer connection and Agent, and whenever the Computer holds nothing for the current placement.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            {
              $ref: "../components/agent-access-credentials.yaml#/components/schemas/ManagedAgentAccessCredentialRequest",
            }
    responses:
      "201":
        description: Credential created; secret is returned once.
        content:
          application/json:
            schema:
              {
                $ref: "../components/agent-access-credentials.yaml#/components/schemas/AgentAccessCredential",
              }
      "204":
        {
          description: The held token is the Agent's live credential for the current placement.,
        }
      "401": { description: Service authentication required }
      "403": { description: Agent or grant denied }
