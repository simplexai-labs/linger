              schema:
                $ref: '../components/domain.yaml#/components/schemas/RoomMemberPage'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
  /v0/rooms/{roomId}/members/{actorId}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/ActorId'
    put:
      tags: [Room Members]
      operationId: putRoomMember
      summary: Add an eligible Room member or change an existing role.
      description: >-
        Any current Room member may add a Tenant Human as member. An active Agent may be added
        only by its Sponsor. Existing role changes and owner admission remain owner-only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/domain.yaml#/components/schemas/RoomMemberPutRequest'
      responses:
        '200':
          description: Current membership. Exact replays do not append another Room Event.
          content:
            application/json:
              schema:
                $ref: '../components/domain.yaml#/components/schemas/RoomMember'
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../components/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '409':
          $ref: '../components/common.yaml#/components/responses/Conflict'
    delete:
      tags: [Room Members]
      operationId: deleteRoomMember
      summary: Remove a Room member as a Room owner.
      description: >-
        Removes the membership in one transaction. The member's open Document connections are
        closed after the commit.
      responses:
        '204':
          description: Membership removed.
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../components/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '409':
          $ref: '../components/common.yaml#/components/responses/Conflict'
  /v0/rooms/{roomId}/message-attachment-uploads:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      tags: [Messages, Artifacts]
      operationId: uploadMessageAttachment
      summary: Store one Human Message attachment without publishing it to the Room.
      parameters:
        - $ref: '../components/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '../components/messages.yaml#/components/schemas/MessageAttachmentUploadRequest'
      responses:
        '201':
          description: Signed upload credential the same Human can attach to one Message until expiry.
          headers:
            Idempotent-Replay:
              $ref: '../components/common.yaml#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema:
                $ref: '../components/messages.yaml#/components/schemas/MessageAttachmentUpload'
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '409':
          $ref: '../components/common.yaml#/components/responses/Conflict'
        '413':
          $ref: '../components/common.yaml#/components/responses/PayloadTooLarge'
  /v0/rooms/{roomId}/message-attachment-uploads/{attachmentUploadId}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/AttachmentUploadId'
    delete:
      tags: [Messages, Artifacts]
      operationId: cancelMessageAttachmentUpload
      summary: Cancel one unattached Human Message attachment upload.
      description: >-
        Deletes the upload's stored file. An upload that no Message attached is otherwise deleted
        when its credential expires.
      responses:
        '204':
          description: Upload cancelled; invalid, expired, cancelled, or attached uploads conflict.
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '409':
          $ref: '../components/common.yaml#/components/responses/Conflict'
  /v0/rooms/{roomId}/messages:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [Messages]
      operationId: listMessages
      summary: Read the latest committed Message page or an older page before a cursor.
      parameters:
        - $ref: '../components/common.yaml#/components/parameters/Cursor'
        - $ref: '../components/common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: A newest-first window rendered in stable creation order, with the Room Event watermark read before the snapshot.
          content:
            application/json:
              schema:
                $ref: '../components/messages.yaml#/components/schemas/MessagePage'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
    post:
      tags: [Messages]
      operationId: createMessage
      summary: Commit a Human Message and its Room Event in one transaction.
      parameters:
        - $ref: '../components/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/messages.yaml#/components/schemas/MessageCreateRequest'
      responses:
        '201':
          description: Message committed exactly once for this idempotency key.
          headers:
            Idempotent-Replay:
              $ref: '../components/common.yaml#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema:
                $ref: '../components/messages.yaml#/components/schemas/Message'
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '409':
          $ref: '../components/common.yaml#/components/responses/Conflict'
  /v0/rooms/{roomId}/read-state:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    put:
      tags: [Rooms]
      operationId: updateRoomReadState
      summary: Advance the current Human's applied Room sequence.
      description: >-
        The cursor is monotonic and cannot exceed the Room's committed sequence. Repeating or
        submitting an older cursor returns the current state. Other tabs and devices of the same
        Human see the new cursor on their next Room list read; no realtime event announces it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/domain.yaml#/components/schemas/RoomReadStateUpdateRequest'
      responses:
        '200':
          description: Current monotonic read state.
          content:
            application/json:
              schema:
                $ref: '../components/domain.yaml#/components/schemas/RoomReadState'
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
  /v0/rooms/{roomId}/presence:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      tags: [Rooms]
      operationId: notifyRoomPresence
      summary: Report that the current Human is in this Room.
      description: >-
        Best-effort hint that pre-activates, on their online Local Computers, the Meta Contexts
        that this Room's next message would wake, so the Provider process is ready before the
        message is sent. Nothing is persisted, repeated calls inside the per-process throttle
        window are ignored, and a dropped hint only means the next message starts the Runtime
        as usual.
      responses:
        '204':
          description: Hint accepted, throttled, or nothing to pre-activate.
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
  /v0/rooms/{roomId}/pin:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    put:
      tags: [Rooms]
      operationId: updateRoomPin
      summary: Pin or unpin a Room for the current Human.
      description: >-
        Pinning is private to the calling Human. Pinning an already pinned Room keeps its original
        pin time, so the most recently pinned Room stays first; unpinning clears it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/domain.yaml#/components/schemas/RoomPinUpdateRequest'
      responses:
        '200':
          description: Current pin state.
          content:
            application/json:
              schema:
                $ref: '../components/domain.yaml#/components/schemas/RoomPinState'
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
  /v0/rooms/{roomId}/messages/{messageId}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/MessageId'
    get:
      tags: [Messages]
      operationId: getMessage
      summary: Get a committed Message.
      responses:
        '200':
          description: Message.
          content:
            application/json:
              schema:
                $ref: '../components/messages.yaml#/components/schemas/Message'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
  /v0/rooms/{roomId}/messages/{messageId}/activities:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/MessageId'
    get:
      tags: [Messages]
      operationId: getMessageActivities
      summary: Get the exact sanitized Runtime activity log for an Agent Message.
      description: >-
        Authorizes the committed Message through ordinary Room membership, resolves its source
        Runtime run, and returns only records linked to that run by Activity identity.
        Task runs return unavailable; their public activities use Runtime presentation events.
      responses:
        '200':
          description: Exact Message activity log or an explicit unavailable state.
          content:
            application/json:
              schema:
                $ref: '../components/messages.yaml#/components/schemas/MessageActivityLog'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '503':
          $ref: '../components/common.yaml#/components/responses/ServiceUnavailable'
  /v0/rooms/{roomId}/messages/{messageId}/forward:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/MessageId'
    post:
      tags: [Messages, Documents]
      operationId: forwardRoomMessage
      summary: Atomically resolve one target, bind every referenced Document, and create a normal Message.
      parameters:
        - $ref: '../components/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/messages.yaml#/components/schemas/MessageForwardRequest'
      responses:
        '201':
          description: Forward Message and deterministic Room Bindings committed together.
          headers:
            Idempotent-Replay:
              $ref: '../components/common.yaml#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema:
                $ref: '../components/messages.yaml#/components/schemas/MessageForwardResult'
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '409':
          $ref: '../components/common.yaml#/components/responses/Conflict'
  /v0/rooms/{roomId}/messages/{messageId}/thread:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/MessageId'
    post:
      tags: [Messages]
      operationId: createOrGetMessageThread
      summary: Create or return the shared Thread room rooted at this parent Message.
      description: A repeated submission returns the existing Thread room with 200.
      responses:
        '200':
          description: Existing Thread room.
          content:
            application/json:
              schema:
                $ref: '../components/messages.yaml#/components/schemas/ThreadRoom'
        '201':
          description: Thread room created with a seed copy of the parent Message.
          content:
            application/json:
              schema:
                $ref: '../components/messages.yaml#/components/schemas/ThreadRoom'
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '409':
          $ref: '../components/common.yaml#/components/responses/Conflict'
  /v0/rooms/{roomId}/messages/{messageId}/reactions/{reactionId}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/MessageId'
      - $ref: '#/components/parameters/MessageReactionId'
    put:
      tags: [Messages]
      operationId: putMessageReaction
      summary: Idempotently add the current Human's public Reaction to a conversation Message.
      responses:
        '204':
          description: Reaction exists for this Human and Reaction ID.
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '409':
          $ref: '../components/common.yaml#/components/responses/Conflict'
    delete:
      tags: [Messages]
      operationId: deleteMessageReaction
      summary: Idempotently remove only the current Human's Reaction from a Message.
      responses:
        '204':
          description: Reaction no longer exists for this Human and Reaction ID.
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
  /v0/decisions/{decisionId}:
    parameters:
      - $ref: '#/components/parameters/DecisionId'
    post:
      tags: [Messages]
      operationId: decideDecision
      summary: Answer a pending decision card.
      description: >-
        Only the card's decision owner may decide, except that any member may decide a
        room_creation an Agent visible to the whole workspace asked for. A caller who is not a
        member of the card's Room gets 404; a member who may not decide gets 403. A decision that
        is no longer pending, has expired, or whose card version differs gets 409, and so does an
        answer to a Runtime question whose Run has ended. TeamHub runs what an approval allows
        once, after this request returns, and tells the requesting Agent the result; a
        room_creation creates its Room in this request. A connection_auth approval names the
        Connection the Human chose and ends authorizing until its OAuth completes. An
        AnotherMe sources card's answer becomes the Human's own Message in the same request; its
        uploads fail as message creation does. A repeated submission carries a stale card version
        and gets 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/message-cards.yaml#/components/schemas/DecisionRequest'
      responses:
        '200':
          description: Current Message with the authoritative decision card projection.
          content:
            application/json:
              schema:
                $ref: '../components/messages.yaml#/components/schemas/Message'
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../components/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '409':
          $ref: '../components/common.yaml#/components/responses/Conflict'
  /v0/decisions/{decisionId}/screenshot:
    parameters:
      - $ref: '#/components/parameters/DecisionId'
    get:
      tags: [Messages]
      operationId: getDecisionScreenshot
      summary: Read the screenshot a runtime_permission decision shows its decision owner.
      description: >-
        Only the card's decision owner can read it; every other caller, and a card
        without a screenshot, gets 404.
      responses:
        '200':
          description: The captured image.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
  /v0/rooms/{roomId}/events:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [Room Events]
      operationId: listRoomEvents
      summary: Catch up from the persistent Room synchronization log.
      description: >-
        Returns room_seq > after in ascending order. Advance after to the last applied room_seq, not
        latest_room_seq, and continue while has_more. Duplicate delivery is legal; clients sort and
        deduplicate within this Room by room_seq (event_id is a secondary consistency check).
      parameters:
        - $ref: '../components/common.yaml#/components/parameters/AfterRoomSeq'
        - $ref: '../components/common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One catch-up page.
          content:
            application/json:
              schema:
                $ref: '../components/room-events.yaml#/components/schemas/RoomEventPage'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
  /v0/rooms/{roomId}/run-statuses:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [Messages]
      operationId: listRoomRunStatuses
      summary: Read the Agent Run statuses currently shown in a Room.
      description: >-
        Authoritative replacement collection for reconnect recovery. Returns queued and running
        Runs shown in the Room, and failed or canceled Runs for 24 hours until the same Agent has
        a newer Run there. Succeeded Runs leave this collection; their Runtime presentation stays
        readable through the presentation endpoints. agent_run.status_changed Room Events carry
        later changes.
      responses:
        '200':
          description: Current Run statuses.
          content:
            application/json:
              schema:
                $ref: '../components/room-agent.yaml#/components/schemas/RoomRunStatusList'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '500':
          $ref: '../components/common.yaml#/components/responses/InternalError'
  /v0/rooms/{roomId}/runtime-presentation-runs:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [Messages]
      operationId: listRoomRuntimePresentationRuns
      summary: Recover unfinished and Message-associated Agent Runs shown in a Room.
      description: >-
        Returns at most 100 Run statuses, prioritizing unfinished Runs within that bound.
        Unfinished Runs are eligible regardless of Message association; finished Runs are
        included only when one of their source Messages or a Message they published is among the
        requested Message IDs. Without Message IDs, only unfinished Runs are returned.
        With run_id, returns only that Run in any state, independently of Message association.
        A Run the Room does not show returns an empty list.
      parameters:
        - name: run_id
          in: query
          required: false
          description: Exact Local Run identity for live or terminal activity recovery.
          schema:
            $ref: '../components/common.yaml#/components/schemas/Id'
        - name: message_id
          in: query
          required: false
          style: form
          explode: true
          description: Loaded Room Message IDs that bound finished Run recovery.
          schema:
            type: array
            maxItems: 100
            uniqueItems: true
            items:
              $ref: '../components/common.yaml#/components/schemas/Id'
      responses:
        '200':
          description: Unfinished and Message-associated Run statuses in the Room.
          content:
            application/json:
              schema:
                $ref: '../components/room-agent.yaml#/components/schemas/RoomRunStatusList'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '500':
          $ref: '../components/common.yaml#/components/responses/InternalError'
  /v0/rooms/{roomId}/runs/{runId}/activities:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - name: runId
        in: path
        required: true
        schema:
          $ref: '../components/common.yaml#/components/schemas/Id'
    get:
      tags: [Messages]
      operationId: getRunActivities
      summary: Read sanitized native execution history of an Agent Run shown in a Room.
      description: >-
        Requires ordinary Room membership. Resolves native turns only through trusted
        invocation identities in persisted Runtime events. History may be unavailable
        until the Run has recorded such an identity.
        Task runs always return unavailable; use their public Runtime presentation events.
      responses:
        '200':
          description: Native execution records with explicit availability and truncation.
          content:
            application/json:
              schema:
                $ref: '../components/messages.yaml#/components/schemas/MessageActivityLog'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '503':
          $ref: '../components/common.yaml#/components/responses/ServiceUnavailable'
  /v0/rooms/{roomId}/runs/{runId}/runtime-presentation-events:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - name: runId
        in: path
        required: true
        schema:
          $ref: '../components/common.yaml#/components/schemas/Id'
    get:
      tags: [Messages]
      operationId: listRoomRuntimePresentationEvents
      summary: Read ordered Runtime presentation events of one Agent Run shown in a Room.
      description: >-
        Returns committed events of the Run in ordinal order. agent_run.status_changed Room Events
        are wake signals carrying the latest ordinal; event ordinals and Segment IDs are the
        recovery, identity, and ordering authority.
      parameters:
        - name: after
          in: query
          required: false
          schema:
            allOf:
              - $ref: '../components/agent-runtime-state.yaml#/components/schemas/AgentRuntimeInt64'
            default: '0'
        - $ref: '../components/common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One ordered page of committed presentation events.
          content:
            application/json:
              schema:
                $ref: '../components/room-agent.yaml#/components/schemas/RuntimePresentationEventPage'
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '500':
          $ref: '../components/common.yaml#/components/responses/InternalError'
  /v0/rooms/{roomId}/voice-sessions:
    parameters:
