  /v0/tenants/{tenantId}/direct-rooms:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      tags: [Rooms]
      operationId: openDirectRoom
      summary: Open the unique Direct Room between the current Human and one Agent.
      description: >-
        Returns the existing Human-Agent Direct Room with the peer, or creates it atomically. The
        Agent peer must be workspace-visible, sponsored by the caller, or visible through a shared
        Room. Direct Room membership and metadata cannot be changed. Once the pair's Direct Room
        finished deletion, opening it creates a new one; while it is being deleted the request
        returns 409 DIRECT_ROOM_DELETING.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/domain.yaml#/components/schemas/DirectRoomOpenRequest'
      responses:
        '200':
          description: Existing Direct Room.
          content:
            application/json:
              schema:
                $ref: '../components/domain.yaml#/components/schemas/Room'
        '201':
          description: Newly created Direct Room.
          content:
            application/json:
              schema:
                $ref: '../components/domain.yaml#/components/schemas/Room'
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '409':
          $ref: '../components/common.yaml#/components/responses/Conflict'
  /v0/rooms/{roomId}/members:
