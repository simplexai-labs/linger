  /v0/voice-sessions/{voiceSessionId}/connection-credentials:
    parameters:
      - $ref: '#/components/parameters/VoiceSessionId'
    $ref: '../paths/teamhub-public-voice-media.yaml#/voiceSessionCredentials'
  /v0/voice-sessions/{voiceSessionId}/transcript-events:
    parameters:
      - $ref: '#/components/parameters/VoiceSessionId'
    $ref: '../paths/teamhub-public-voice-media.yaml#/voiceSessionTranscriptEvents'
  /v0/voice-sessions/{voiceSessionId}/dictation-commit:
    parameters:
      - $ref: '#/components/parameters/VoiceSessionId'
    $ref: '../paths/teamhub-public-voice-media.yaml#/voiceSessionDictationCommit'
  /v0/voice-sessions/{voiceSessionId}/events:
    parameters:
      - $ref: '#/components/parameters/VoiceSessionId'
    $ref: '../paths/teamhub-public-voice-media.yaml#/voiceSessionEvents'
  /v0/voice-sessions/{voiceSessionId}/events/stream:
    parameters:
      - $ref: '#/components/parameters/VoiceSessionId'
    $ref: '../paths/teamhub-public-voice-media.yaml#/voiceSessionEventsStream'
  /v0/voice-sessions/{voiceSessionId}/captures:
