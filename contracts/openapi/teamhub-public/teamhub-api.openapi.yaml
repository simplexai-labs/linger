      responses:
        '200':
          description: Current Binding record.
          content:
            application/json:
              schema:
                $ref: '../components/skills.yaml#/components/schemas/AgentSkillBinding'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
    put:
      tags: [Agents, Skills]
      operationId: putAgentSkillBinding
      summary: Enable, switch, configure, or disable one exact Skill Package for an Agent.
      description: >-
        A repeated submission carries a stale binding revision and fails with 409
        SKILL_BINDING_CONFLICT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/skills.yaml#/components/schemas/AgentSkillBindingPutRequest'
      responses:
        '200':
          description: Binding saved and the Agent binding revision advanced exactly once.
          content:
            application/json:
              schema:
                $ref: '../components/skills.yaml#/components/schemas/AgentSkillBinding'
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '409':
          $ref: '../components/common.yaml#/components/responses/Conflict'
    delete:
      tags: [Agents, Skills]
      operationId: deleteAgentSkillBinding
      summary: Delete one Agent-Skill Binding and advance the Agent binding revision.
      description: >-
        A repeated submission carries a stale binding revision and fails with 409
        SKILL_BINDING_CONFLICT.
      parameters:
        - name: expected_binding_version
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Binding deleted.
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '409':
          $ref: '../components/common.yaml#/components/responses/Conflict'
  /v0/tenants/{tenantId}/agents/{agentId}/skill-packages:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [Agents, Skills]
      operationId: uploadAgentSkillPackage
      summary: Upload a Skill ZIP or SKILL.md and bind it to this Agent.
      description: >-
        Human Sponsor only. The caller supplies only the package file. TeamHub
        parses SKILL.md, matches the runtime name against this Agent's explicit
        bindings, then either publishes a new immutable version for that Skill
        or creates a Sponsor-private Skill and binds it. Same-name platform
        default Skills cannot be replaced. Saving completes the configuration
        update without activating idle Contexts. Subsequent new ordinary Runs
        read the current configuration; active Runs, steer, and recovery of the
        same execution retain their loaded versions.
      parameters:
        - $ref: '../components/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '../components/skills.yaml#/components/schemas/AgentSkillPackageUploadRequest'
      responses:
        '201':
          description: Immutable version and the current Agent binding saved atomically. Not a Runtime activation receipt.
          headers:
            Idempotent-Replay:
              $ref: '../components/common.yaml#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema:
                $ref: '../components/skills.yaml#/components/schemas/AgentSkillBinding'
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '409':
          $ref: '../components/common.yaml#/components/responses/Conflict'
        '413':
          description: Package exceeds configured archive, expanded file, total size or file-count limits.
  /v0/tenants/{tenantId}/agent-templates:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Agents]
      operationId: listAgentTemplates
      summary: List reusable Agent templates available for Agent creation.
      description: >-
        Returns deployment built-in templates and every published template. Clients group the
        result by origin. Skill references are returned exactly as published and are resolved
        against this Tenant catalog only when an Agent is created.
      responses:
        '200':
          description: Built-in and published Agent templates in stable order.
          content:
            application/json:
              schema:
                $ref: '../components/agent-templates.yaml#/components/schemas/AgentTemplatePage'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
    post:
      tags: [Agents]
      operationId: publishAgentTemplate
      summary: Publish one reusable Agent template to the deployment template market.
      description: >-
        Any authenticated Human Actor in the Tenant may publish. The published definition becomes
        visible to every Tenant in this deployment, so callers must obtain explicit Human intent
        before sending it. Only the publisher may remove it afterwards. A repeated submission
        publishes another template.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/agent-templates.yaml#/components/schemas/AgentTemplatePublishRequest'
      responses:
        '201':
          description: Agent template published.
          content:
            application/json:
              schema:
                $ref: '../components/agent-templates.yaml#/components/schemas/AgentTemplate'
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '409':
          $ref: '../components/common.yaml#/components/responses/Conflict'
  /v0/tenants/{tenantId}/agent-templates/{templateId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/AgentTemplateId'
    delete:
      tags: [Agents]
      operationId: deleteAgentTemplate
      summary: Remove one published Agent template.
      description: >-
        Only the publishing Human Actor may remove a published template. Built-in templates are
        owned by the deployment and cannot be removed. Agents already created from the template
        keep their own configuration.
      responses:
        '204':
          description: Published template removed, or it was already absent.
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../components/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
  /v0/tenants/{tenantId}/agent-templates/{templateId}/skill-imports:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/AgentTemplateId'
    get:
      tags: [Agents, Skills]
      operationId: listAgentTemplateSkillImports
      summary: Preview which template Skills this caller would need copied into the Tenant.
      description: >-
        Read-only. Lists the template's Skill references that the caller cannot bind from this
        Tenant catalog, and whether each can be copied from the publishing Tenant. Publishing a
        template shares its Skill versions with every Tenant, so a Skill the publisher uploaded
        privately is importable while it stays sealed and active.
      responses:
        '200':
          description: Unresolvable template Skill references with importable or unavailable status.
          content:
            application/json:
              schema:
                $ref: '../components/agent-templates.yaml#/components/schemas/AgentTemplateSkillImportPage'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
    post:
      tags: [Agents, Skills]
      operationId: importAgentTemplateSkills
      summary: Copy the template's importable Skills into this Tenant as private Skills of the caller.
      description: >-
        Each importable source version becomes a sealed, owner-scoped Skill of the calling Human
        in this Tenant, reusing the immutable package files. A copy with identical package name and
        content that the caller already owns is reused, so repeating the import is harmless.
        Nothing is bound to an Agent here.
      responses:
        '200':
          description: Imported copies and references that stay unavailable.
          content:
            application/json:
              schema:
                $ref: '../components/agent-templates.yaml#/components/schemas/AgentTemplateSkillImportPage'
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '409':
          $ref: '../components/common.yaml#/components/responses/Conflict'
  /v0/tenants/{tenantId}/rooms:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Rooms]
      operationId: listRooms
      summary: List the Rooms where the caller is a current member.
      parameters:
        - $ref: '../components/common.yaml#/components/parameters/Cursor'
        - $ref: '../components/common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Current member-scoped Rooms.
          content:
            application/json:
              schema:
                $ref: '../components/domain.yaml#/components/schemas/RoomPage'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '503':
          $ref: '../components/common.yaml#/components/responses/ServiceUnavailable'
    post:
      tags: [Rooms]
      operationId: createRoom
      summary: Create a Room with the caller as its initial owner.
      description: >-
        Room names are unique among the Rooms the caller is in, so a repeated submission fails
        with 409 ROOM_NAME_TAKEN instead of creating a second Room.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/domain.yaml#/components/schemas/HumanRoomCreateRequest'
      responses:
        '201':
          description: Room created with its room.created event committed atomically.
          content:
            application/json:
              schema:
                $ref: '../components/domain.yaml#/components/schemas/Room'
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '409':
          $ref: '../components/common.yaml#/components/responses/Conflict'
  /v0/tenants/{tenantId}/messages/search:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Messages]
      operationId: searchTenantMessages
      summary: Search conversation Messages the caller can read across the Tenant by keyword.
      description: >-
        Matches the query as one case-insensitive substring of the Message body. Only
        conversation Messages take part, visibility follows the Room and Message listing
        rules, and results are newest first.
      parameters:
        - name: q
          in: query
          required: true
          description: Trimmed before matching; 1 to 200 characters after trimming.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - $ref: '../components/common.yaml#/components/parameters/Cursor'
        - $ref: '../components/common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Matching Messages newest first with the Room each one belongs to; no matches returns an empty items array.
          content:
            application/json:
              schema:
                $ref: '../components/messages.yaml#/components/schemas/MessageSearchPage'
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '503':
          description: SEARCH_TIMEOUT when the search runs past its five-second limit. Clients narrow the query instead of retrying.
          content:
            application/json:
              schema:
                $ref: '../components/common.yaml#/components/schemas/ErrorResponse'
  /v0/tenants/{tenantId}/room-activity:
    $ref: '../paths/room-run-control.yaml#/tenantRoomActivity'
  /v0/rooms/{roomId}/background-tasks:
    $ref: '../paths/room-run-control.yaml#/backgroundTasks'
  /v0/rooms/{roomId}/runs/{runId}/cancel:
    $ref: '../paths/room-run-control.yaml#/cancelRun'
  /v0/rooms/{roomId}/runs/{runId}/redeliver-unconfirmed-inputs:
