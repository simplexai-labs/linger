openapi: 3.1.0
info:
  title: TeamHub V0 API
  version: 0.1.0
  summary: Product API for Human clients and TeamHub-owned collaboration state.
  description: |
    Contract for browser and desktop clients. TeamHub is authoritative for Tenant-isolated product
    state. Human requests use a server-side Session cookie. All resource access is derived from the
    authenticated Account's Human Actor in the owning Tenant; client-supplied IDs never grant access.
    Cross-Tenant resources are rejected or hidden as 404 according to policy.

    Agents participate through Room Membership. Runtime lifecycle, message delivery and reply
    callbacks use a separate Agent contract that is not part of this document.
servers:
  - url: http://localhost:8080
    description: Local Docker Compose TeamHub
tags:
  - name: Authentication
    description: Human Account login, Session lifecycle, and current identity.
  - name: Tenants
    description: Tenant isolation boundary and its Actor directory.
  - name: Agents
    description: Tenant-scoped Agent collaboration identities and AgentManagement registration.
  - name: Local Computers
    description: User-owned Computer enrollment, inventory, and Local Agent placement.
  - name: Rooms
    description: Member-scoped collaboration spaces.
  - name: Room Members
    description: Room membership visibility and owner-managed access.
  - name: Messages
    description: Committed Human and Agent Room messages.
  - name: Room Events
    description: Persistent Room-scoped catch-up log.
  - name: Events
    description: The browser's single realtime stream of Room Events and invalidation hints.
  - name: Artifacts
    description: Logical Room tree and immutable content Versions.
  - name: Capture
    description: Recoverable Human audio Capture Sessions and immutable finalization.
  - name: Personal Wiki
    description: Human-owned input tree, immutable source Versions, refresh state, and read-only Markdown output.
  - name: External Sources
    description: Account-owned provider connections and deterministic imports into product-owned inputs.
  - name: Personal Profile
    description: Human-private Profile revisions and explicit supplement generations.
  - name: Pocket Notes
    description: Human-private daily scratch pages opened from the Another Me avatar.
  - name: Work Items
    description: Tenant-scoped Issues, collaboration, responsibility, and lifecycle.
  - name: Skills
    description: Tenant-scoped immutable Packages, lifecycle management, and Agent Bindings.
  - name: Routines
    description: Room-scoped recurring messages that fire into the Room timeline.
security:
  - sessionCookie: []
paths:
  /v0/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Create an independent server-side Session for this browser.
      description: >-
        Existing Sessions on other browsers and devices remain valid. Sessions default to a 30-day
        idle lifetime and may be renewed through user activity, up to 90 days after login.
        After ten failed attempts from one client address within 15 minutes, that address gets
        429 with Retry-After until the window ends; a successful login clears its count. The client
        address honors X-Forwarded-For only from configured trusted proxies. A login that waits too
        long for one of the server's bounded password-hash slots also gets 429.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/domain.yaml#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated. The HttpOnly Session cookie is set in Set-Cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Secure, HttpOnly, SameSite Session cookie; Secure may be disabled only locally.
          content:
            application/json:
              schema:
                $ref: '../components/domain.yaml#/components/schemas/Session'
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '429':
          $ref: '../components/common.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: '../components/common.yaml#/components/responses/InternalError'
  /v0/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current Session and clear its cookie.
      description: Idempotent; a previously revoked Session has the same outcome.
      security:
        - sessionCookie: []
        - {}
      responses:
        '204':
          description: Session revoked or already absent.
        '500':
          $ref: '../components/common.yaml#/components/responses/InternalError'
  /v0/session:
    post:
      tags: [Authentication]
      operationId: renewSession
      summary: Renew the current Session after foreground user activity.
      description: >-
        Extends the idle expiry, capped at 90 days after login. Expired or revoked Sessions cannot
        be renewed. Clients throttle activity requests to once per five minutes; background polls
        and stream heartbeats must not call this operation. GET remains read-only.
      responses:
        '200':
          description: Current Session with its renewed HttpOnly cookie. Renewal is throttled server-side.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../components/domain.yaml#/components/schemas/Session'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '500':
          $ref: '../components/common.yaml#/components/responses/InternalError'
    get:
      tags: [Authentication]
      operationId: getSession
      summary: Get the current server-side Session.
      responses:
        '200':
          description: Current Session and its expiry.
          content:
            application/json:
              schema:
                $ref: '../components/domain.yaml#/components/schemas/Session'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
  /v0/me:
    get:
      tags: [Authentication]
      operationId: getCurrentIdentity
      summary: Get the current Account and its Human Actor identities.
      responses:
        '200':
          description: Current identity.
          content:
            application/json:
              schema:
                $ref: '../components/domain.yaml#/components/schemas/CurrentIdentity'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
  /v0/events:
    get:
      tags: [Events]
      operationId: streamEvents
      summary: Follow Room Events and invalidation hints for the current Account over one SSE connection.
      description: >-
        For each room cursor the stream first replays that Room's events after the cursor from
        PostgreSQL, then follows them live as room.event, in room_seq order and at least once;
        a client pages GET /v0/rooms/{roomId}/events first when it is far behind. room_seq is
        allocated under the Room row lock held until commit, so a later commit can never take a
        lower room_seq than one already delivered. Every other change, including Room Events of
        Rooms without a cursor, arrives as resource.invalidated, which is not persisted. After the
        initial replay the stream sends stream.resync with reason connected, and again with
        hints_lost whenever hints may have been dropped. A cursor for a Room the Account cannot
        read yields one room invalidation and is ignored. Events carry no SSE id: a reconnect
        opens a new URL with the client's current cursors. The stream wakes only on commit
        notifications; heartbeats revalidate the Session and reread the cursor Rooms. A client
        that falls behind is not disconnected; it receives stream.resync instead.
      parameters:
        - name: room
          in: query
          required: false
          style: form
          explode: true
          description: Room cursor roomId:room_seq, the highest room_seq the client applied.
          schema:
            type: array
            maxItems: 50
            items:
              type: string
              maxLength: 85
              pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}:[0-9]{1,19}$"
      responses:
        '200':
          description: Room replay, live Room Events, invalidation hints, resync markers, heartbeat comments, and session controls.
          content:
            text/event-stream:
              schema:
                type: string
              x-sse-events:
                room.event:
                  $ref: '../components/room-events.yaml#/components/schemas/RoomEventEnvelope'
                resource.invalidated:
                  $ref: '../components/human-events.yaml#/components/schemas/ResourceInvalidatedSseEvent'
                stream.resync:
                  $ref: '../components/human-events.yaml#/components/schemas/StreamResyncSseEvent'
                session.expired:
                  $ref: '../components/room-events.yaml#/components/schemas/SessionExpiredSseEvent'
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
  /v0/account/password:
    post:
      tags: [Authentication]
      operationId: changePassword
      summary: Change the authenticated Account password and revoke other Sessions.
      description: >-
        Requires the current password and an active Session cookie. Account and Session identity
        come only from authentication. The current Session and its expiry are preserved.
        PasswordChangeRequest gives the new password's byte length. Invalid fields return
        INVALID_REQUEST; an incorrect current password returns INVALID_CURRENT_PASSWORD (400).
        At most five validly shaped attempts per Account are accepted in a ten-minute window,
        shared across Sessions and server instances. Rate limits survive server restarts. A request
        that waits too long for one of the server's bounded password-hash slots also gets 429.
        Password replacement and revocation commit atomically. Replaying a successful change
        with the old password fails; after response loss the new password can be used to sign in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/account-password.yaml#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: Password replaced; other Sessions revoked without renewing the current Session.
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '429':
          $ref: '../components/common.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: '../components/common.yaml#/components/responses/InternalError'
  /v0/tenants:
    get:
      tags: [Tenants]
      operationId: listTenants
      summary: List the deployment's Space, the only Tenant of the signed-in Human.
      responses:
        '200':
          description: The signed-in Human's Space.
          content:
            application/json:
              schema:
                $ref: '../components/domain.yaml#/components/schemas/TenantList'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
  /v0/tenants/{tenantId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Tenants]
      operationId: getTenant
      summary: Get the signed-in Human's Space.
      responses:
        '200':
          description: Tenant.
          content:
            application/json:
              schema:
                $ref: '../components/domain.yaml#/components/schemas/Tenant'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
  /v0/tenants/{tenantId}/actors:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Tenants]
      operationId: listActors
      summary: List Human and Agent Actors in an accessible Tenant.
      parameters:
        - $ref: '../components/common.yaml#/components/parameters/Cursor'
        - $ref: '../components/common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Tenant Actors.
          content:
            application/json:
              schema:
                $ref: '../components/domain.yaml#/components/schemas/ActorPage'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
  /v0/tenants/{tenantId}/actors/{actorId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ActorId'
    get:
      tags: [Tenants]
      operationId: getActor
      summary: Get an Actor in an accessible Tenant.
      responses:
        '200':
          description: Actor.
          content:
            application/json:
              schema:
                $ref: '../components/domain.yaml#/components/schemas/Actor'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
  /v0/tenants/{tenantId}/agents:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Agents]
      operationId: listTenantAgents
      summary: List every Agent Registration in an accessible Tenant.
      description: >-
        Returns complete Agent Registration records for every status. Product Clients use
        created_by and status to determine Sponsor-owned admission candidates.
      parameters:
        - $ref: '../components/common.yaml#/components/parameters/Cursor'
        - $ref: '../components/common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Tenant Agents in stable registration creation order.
          content:
            application/json:
              schema:
                $ref: '../components/domain.yaml#/components/schemas/TenantAgentPage'
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
    post:
      tags: [Agents]
      operationId: createTenantAgent
      summary: Create a Tenant Agent on one of the Sponsor's Computers.
      description: >-
        Any authenticated Human Actor in the Tenant may create an Agent in V0. TeamHub creates the
        collaboration Actor and its active registration in one transaction. The chosen Computer
        must belong to the Sponsor and offer the writable workspace grant, but it does not need to
        be online: the Agent waits for that Computer and can be used as soon as it connects.
        Room invitation is a later TeamHub-only operation. A repeated submission creates another
        Agent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/domain.yaml#/components/schemas/TenantAgentCreateRequest'
      responses:
        '201':
          description: Agent Actor and its registration created.
          content:
            application/json:
              schema:
                $ref: '../components/domain.yaml#/components/schemas/TenantAgent'
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '409':
          $ref: '../components/common.yaml#/components/responses/Conflict'
  /v0/tenants/{tenantId}/agent-availability:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Agents]
      operationId: listTenantAgentAvailability
      summary: List current runtime availability for accessible Tenant Agents.
      description: >-
        Returns the volatile execution and Local Computer projection separately from the persisted
        Agent directory. Clients should treat this endpoint as the authoritative availability snapshot.
      parameters:
        - $ref: '../components/common.yaml#/components/parameters/Cursor'
        - $ref: '../components/common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Tenant Agent availability in stable registration creation order.
          content:
            application/json:
              schema:
                $ref: '../components/domain.yaml#/components/schemas/TenantAgentAvailabilityPage'
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
  /v0/tenants/{tenantId}/another-me:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Agents]
      operationId: getAnotherMe
      summary: Read the current Human's Another Me and its Chat.
      description: >-
        Both fields are absent until the Human's Computer first comes online with a ready Runtime
        and a writable workspace, which creates the Another Me.
      responses:
        '200':
          description: The Another Me, or an empty object before it exists.
          content:
            application/json:
              schema:
                $ref: '../components/domain.yaml#/components/schemas/AnotherMe'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
  /v0/tenants/{tenantId}/agents/{agentId}/avatar-image:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [Agents]
      operationId: getTenantAgentAvatarImage
      summary: Read one Agent's uploaded avatar image.
      description: >-
        Returns the image bytes to any Human who can see the Agent in the Tenant directory.
        Clients request the versioned avatar_image_url from TenantAgent; a request for the
        current version is immutable and cacheable for a year, while a stale version answers
        with the current image and is not cached.
      parameters:
        - name: v
          in: query
          required: false
          description: Image version from avatar_image_url.
          schema: { type: string, maxLength: 64 }
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: The uploaded image.
          headers:
            Cache-Control:
              schema: { type: string }
            ETag:
              description: Strong quoted image version.
              schema: { type: string }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        '304':
          description: The cached version is current.
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
  /v0/tenants/{tenantId}/agents/{agentId}/avatar:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/AgentId'
    put:
      tags: [Agents]
      operationId: updateTenantAgentAvatar
      summary: Replace one Sponsor-owned Agent's avatar.
      description: >-
        Records the character or uploaded image, and its background, that every Human sees for
        this Agent. Unlike profile and Runtime updates it needs no configuration revision and
        succeeds while the Agent works.
        Builder and Another Me Agents keep their system avatar and answer 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/domain.yaml#/components/schemas/TenantAgentAvatarUpdateRequest'
      responses:
        '200':
          description: Agent with its new avatar and, when it has one, the new versioned avatar_image_url.
          content:
            application/json:
              schema:
                $ref: '../components/domain.yaml#/components/schemas/TenantAgent'
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../components/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '409':
          $ref: '../components/common.yaml#/components/responses/Conflict'
  /v0/tenants/{tenantId}/agents/{agentId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/AgentId'
    patch:
      tags: [Agents]
      operationId: updateTenantAgent
      summary: Update one Sponsor-owned Tenant Agent profile and Runtime.
      description: >-
        Applies a configuration-revision compare-and-swap in one TeamHub transaction. TeamHub
        rejects updates while the Agent has queued or running local work. The Sponsor may switch
        Runtime, and may move the Agent to another owned Computer that offers the chosen writable
        workspace grant; the target does not need to be online, and the Agent waits for it. A
        Computer that is removed or not owned by the Sponsor is refused with
        AGENT_PLACEMENT_TARGET_UNAVAILABLE. Work left on a previous Computer that is not online
        ends as failed so the move can proceed. A repeated submission carries a stale
        configuration revision and fails with 409 AGENT_CONFIGURATION_CONFLICT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/domain.yaml#/components/schemas/TenantAgentUpdateRequest'
      responses:
        '200':
          description: Agent profile and Runtime updated, or the exact request replayed.
          content:
            application/json:
              schema:
                $ref: '../components/domain.yaml#/components/schemas/TenantAgent'
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../components/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '409':
          $ref: '../components/common.yaml#/components/responses/Conflict'
    delete:
      tags: [Agents]
      operationId: deleteTenantAgent
      summary: Remove one Sponsor-owned Tenant Agent.
      description: >-
        TeamHub revokes the registration, cancels queued and running local work, and removes
        current Room memberships in one transaction while preserving the Actor and historical
        records; Agent Service then removes the Agent's Runner, on an offline Computer when it
        reconnects. Only the Agent Sponsor may perform this operation.
        Always retire the Sponsor's Direct Room with this Agent
        using the Room logical-deletion protocol. Other Humans' Direct Rooms and shared Rooms
        are retained. Agent revocation and Direct Room deletion admission commit together.
      responses:
        '204':
          description: Agent removed; its Direct Room, if any, is deleted.
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../components/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '409':
          $ref: '../components/common.yaml#/components/responses/Conflict'
  /v0/tenants/{tenantId}/local-computers:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Local Computers]
      operationId: listLocalComputers
      summary: List the current Human Actor's enrolled Local Computers, online or offline.
      responses:
        '200':
          description: Current Local Computer inventory.
          content:
            application/json:
              schema:
                $ref: '../components/domain.yaml#/components/schemas/LocalComputerPage'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '503':
          $ref: '../components/common.yaml#/components/responses/ServiceUnavailable'
  /v0/tenants/{tenantId}/local-computers/{computerId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ComputerId'
    delete:
      tags: [Local Computers]
      operationId: removeLocalComputer
      summary: Remove an unassigned Local Computer owned by the current Human Actor.
      responses:
        '204':
          description: Local Computer removed and its credential revoked.
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '409':
          $ref: '../components/common.yaml#/components/responses/Conflict'
        '503':
          $ref: '../components/common.yaml#/components/responses/ServiceUnavailable'
  /v0/tenants/{tenantId}/local-computers/{computerId}/skill-scans:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ComputerId'
    post:
      tags: [Local Computers, Skills]
      operationId: scanLocalSkills
      summary: Scan one owned Local Computer for user-level Runtime Skills.
      description: The scan only reads the Computer and is not stored; a retried request scans again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/local-skills.yaml#/components/schemas/LocalSkillScanRequest'
      responses:
        '200':
          description: A short-lived sanitized Skill candidate snapshot.
          content:
            application/json:
              schema:
                $ref: '../components/local-skills.yaml#/components/schemas/LocalSkillScan'
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '409':
          $ref: '../components/common.yaml#/components/responses/Conflict'
        '503':
          $ref: '../components/common.yaml#/components/responses/ServiceUnavailable'
  /v0/tenants/{tenantId}/local-computers/{computerId}/browser-connection:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ComputerId'
    get:
      tags: [Local Computers]
      operationId: getLocalComputerBrowserConnection
      summary: Read which browser the current Human's Agents drive on one owned Local Computer.
      responses:
        '200':
          description: Current browser connection status without the extension token.
          content:
            application/json:
              schema:
                $ref: '../components/browser-connection.yaml#/components/schemas/BrowserConnectionStatus'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '409':
          $ref: '../components/common.yaml#/components/responses/Conflict'
        '502':
          $ref: '../components/common.yaml#/components/responses/BadGateway'
        '503':
          $ref: '../components/common.yaml#/components/responses/ServiceUnavailable'
    put:
      tags: [Local Computers]
      operationId: putLocalComputerBrowserConnection
      summary: Connect browser tools on one owned Local Computer to the Human's Chrome.
      description: >-
        TeamHub normalizes the pasted Playwright Extension text, forwards the token to
        the Computer, and persists nothing. The Computer verifies the connection before
        answering, which can take up to one minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/browser-connection.yaml#/components/schemas/BrowserConnectionConfigureRequest'
      responses:
        '200':
