  /v0/documents/{documentId}/downloads:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [Documents]
      operationId: downloadLatestDocument
      summary: Download the latest available Document Content Head.
      parameters:
        - name: Range
          in: header
          required: false
          description: A single RFC 9110 byte range. Multipart ranges are not supported.
          schema: { type: string }
        - name: If-Range
          in: header
          required: false
          description: Strong resolved Content Head ETag controlling whether Range is honored.
          schema: { type: string }
      responses:
        '200':
          description: Exact immutable bytes for the current Content Head resolved by TeamHub.
          headers:
            X-Content-SHA256:
              description: Lowercase SHA-256 of the complete source file bytes after HTTP content decoding; independent of cache ETag transformations.
              schema: { type: string, pattern: '^[a-f0-9]{64}$' }
            Cache-Control:
              description: Latest is user-specific and mutable; clients must not reuse a stored response.
              schema: { type: string, enum: ['private, no-store'] }
            Accept-Ranges:
              schema: { type: string, enum: [bytes] }
            Content-Length:
              schema: { type: integer, format: int64 }
            Content-Type:
              schema: { type: string }
            ETag:
              description: Strong quoted SHA-256 digest.
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '202':
          description: Native latest changed throughout bounded rendering retries; retry after one second. No document bytes are returned.
          headers:
            Retry-After: { schema: { type: integer, enum: [1] } }
            Cache-Control: { schema: { type: string, enum: ['private, no-store'] } }
          content:
            application/json:
              schema: { $ref: '../components/common.yaml#/components/schemas/ErrorResponse' }
        '206':
          description: Exact bytes for the requested single range of the resolved Content Head.
          headers:
            X-Content-SHA256:
              description: Lowercase SHA-256 of the complete source file, not the partial range.
              schema: { type: string, pattern: '^[a-f0-9]{64}$' }
            Cache-Control:
              schema: { type: string, enum: ['private, no-store'] }
            Accept-Ranges:
              schema: { type: string, enum: [bytes] }
            Content-Length:
              schema: { type: integer, format: int64 }
            Content-Range:
              schema: { type: string }
            ETag:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          description: The Document does not exist or is intentionally hidden.
          headers:
            Cache-Control:
              schema: { type: string, enum: ['private, no-store'] }
          content:
            application/json:
              schema:
                $ref: '../components/common.yaml#/components/schemas/ErrorResponse'
        '503':
          description: The native projection materializer or Object Store is unavailable.
          headers:
            Cache-Control:
              schema: { type: string, enum: ['private, no-store'] }
          content:
            application/json:
              schema:
                $ref: '../components/common.yaml#/components/schemas/ErrorResponse'
        '416':
          description: The byte range is malformed, unsupported, or outside the resolved Content Head.
          headers:
            Cache-Control:
              schema: { type: string, enum: ['private, no-store'] }
            Accept-Ranges:
              schema: { type: string, enum: [bytes] }
            Content-Range:
              schema: { type: string }
