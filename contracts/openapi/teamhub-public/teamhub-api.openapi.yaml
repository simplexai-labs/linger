  /v0/external-connections:
    get:
      tags: [External Sources]
      operationId: listExternalConnections
      summary: List Account-owned external connections without credentials or upstream identifiers.
      responses:
        '200':
          description: Current persisted connection projections.
          content:
            application/json:
              schema: { $ref: '../components/external-sources.yaml#/components/schemas/ExternalConnectionList' }
        '401': { $ref: '../components/common.yaml#/components/responses/Unauthenticated' }
    post:
      tags: [External Sources]
      operationId: createExternalConnection
      summary: Create an Account-owned connection for a curated external application.
      description: A repeated submission creates another pending connection with its own Connect Link.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../components/external-sources.yaml#/components/schemas/CreateExternalConnectionRequest' }
      responses:
        '201':
          description: Pending external connection and short-lived Connect Link.
          content:
            application/json:
              schema: { $ref: '../components/external-sources.yaml#/components/schemas/ExternalConnection' }
        '400': { $ref: '../components/common.yaml#/components/responses/BadRequest' }
        '401': { $ref: '../components/common.yaml#/components/responses/Unauthenticated' }
        '409': { $ref: '../components/common.yaml#/components/responses/Conflict' }
        '503': { $ref: '../components/common.yaml#/components/responses/ServiceUnavailable' }
  /v0/external-connection-completions:
    post:
      tags: [External Sources]
      operationId: completeExternalConnectionAuthorization
      summary: Check the authorizations a returning Composio popup may have finished.
      description: >-
        The OAuth callback page calls this when the popup returns. TeamHub checks the pending
        connection or reauthorization whose upstream account is connected_account_id, or every
        pending one of the Account when the callback did not name it. Composio's account status
        decides the outcome; the callback is never evidence of success.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../components/external-sources.yaml#/components/schemas/CompleteExternalConnectionAuthorizationRequest' }
      responses:
        '204':
          description: The checks are due; their results arrive as connection changes.
        '400': { $ref: '../components/common.yaml#/components/responses/BadRequest' }
        '401': { $ref: '../components/common.yaml#/components/responses/Unauthenticated' }
        '404': { $ref: '../components/common.yaml#/components/responses/NotFound' }
  /v0/external-connections/{externalConnectionId}:
    parameters:
      - name: externalConnectionId
        in: path
        required: true
        schema:
          $ref: '../components/common.yaml#/components/schemas/Id'
    get:
      tags: [External Sources]
      operationId: getExternalConnection
      summary: Refresh and return an Account-owned external connection status.
      responses:
        '200':
          description: Current mapped connection status without credentials.
          content:
            application/json:
              schema:
                $ref: '../components/external-sources.yaml#/components/schemas/ExternalConnection'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '503':
          $ref: '../components/common.yaml#/components/responses/ServiceUnavailable'
  /v0/external-connections/{externalConnectionId}/auto-reminders:
    parameters:
      - name: externalConnectionId
        in: path
        required: true
        schema: { $ref: '../components/common.yaml#/components/schemas/Id' }
    put:
      tags: [External Sources]
      operationId: setExternalConnectionAutoReminders
      summary: Turn AnotherMe's auto reminders for this connection on or off.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/external-sources.yaml#/components/schemas/SetExternalConnectionAutoRemindersRequest'
      responses:
        '200':
          description: Connection after the idempotent update.
          content:
            application/json:
              schema:
                $ref: '../components/external-sources.yaml#/components/schemas/ExternalConnection'
        '400': { $ref: '../components/common.yaml#/components/responses/BadRequest' }
        '401': { $ref: '../components/common.yaml#/components/responses/Unauthenticated' }
        '404': { $ref: '../components/common.yaml#/components/responses/NotFound' }
  /v0/external-connections/{externalConnectionId}/agent-grants:
    parameters:
      - name: externalConnectionId
        in: path
        required: true
        schema: { $ref: '../components/common.yaml#/components/schemas/Id' }
    get:
      tags: [External Sources, Agents]
      operationId: listExternalConnectionAgentAccess
      summary: List the Agents that may use this connection and their current access.
      description: >-
        Lists the Account's AnotherMe identities, the general Agents that share a Room with its Human,
        and every Agent that already has a Grant. Only the owner's AnotherMe receives access
        automatically, when the connection first becomes active; other Agents get it through an
        authorization card or this endpoint.
      responses:
        '200':
          description: Eligible Agents and current explicit Grant state.
          content:
            application/json:
              schema:
                $ref: '../components/external-sources.yaml#/components/schemas/ExternalConnectionAgentAccessList'
        '401': { $ref: '../components/common.yaml#/components/responses/Unauthenticated' }
        '404': { $ref: '../components/common.yaml#/components/responses/NotFound' }
  /v0/external-connections/{externalConnectionId}/agent-grants/{agentActorId}:
    parameters:
      - name: externalConnectionId
        in: path
        required: true
        schema: { $ref: '../components/common.yaml#/components/schemas/Id' }
      - name: agentActorId
        in: path
        required: true
        schema: { $ref: '../components/common.yaml#/components/schemas/Id' }
    put:
      tags: [External Sources, Agents]
      operationId: setExternalConnectionAgentAccess
      summary: Grant or revoke one eligible Agent's access to this connection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/external-sources.yaml#/components/schemas/SetExternalConnectionAgentAccessRequest'
      responses:
        '200':
          description: Current explicit Grant state after the idempotent update.
          content:
            application/json:
              schema:
                $ref: '../components/external-sources.yaml#/components/schemas/ExternalConnectionAgentAccess'
        '400': { $ref: '../components/common.yaml#/components/responses/BadRequest' }
        '401': { $ref: '../components/common.yaml#/components/responses/Unauthenticated' }
        '404': { $ref: '../components/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../components/common.yaml#/components/responses/Conflict' }
  /v0/external-connections/{externalConnectionId}/disconnects:
    parameters:
      - name: externalConnectionId
        in: path
        required: true
        schema: { $ref: '../components/common.yaml#/components/schemas/Id' }
    post:
      tags: [External Sources]
      operationId: disconnectExternalConnection
      summary: Stop all connection access and revoke the Provider account in the background.
      description: A repeated submission carries a stale expected_revision and gets 409 STALE_REVISION.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../components/external-sources.yaml#/components/schemas/DisconnectExternalConnectionRequest' }
      responses:
        '202':
          description: Local Provider access is stopped; the connection is disconnecting until the remote revoke succeeds, then revoked.
          content:
            application/json:
              schema: { $ref: '../components/external-sources.yaml#/components/schemas/ExternalConnection' }
        '400': { $ref: '../components/common.yaml#/components/responses/BadRequest' }
        '401': { $ref: '../components/common.yaml#/components/responses/Unauthenticated' }
        '404': { $ref: '../components/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../components/common.yaml#/components/responses/Conflict' }
  /v0/external-connections/{externalConnectionId}/status-checks:
    parameters:
      - name: externalConnectionId
        in: path
        required: true
        schema: { $ref: '../components/common.yaml#/components/schemas/Id' }
    post:
      tags: [External Sources]
      operationId: createExternalConnectionStatusCheck
      description: A repeated submission keeps the check already requested and returns the connection.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../components/external-sources.yaml#/components/schemas/ExternalConnectionStatusCheckRequest' }
      responses:
        '202':
          description: The connection's status check is due at once; status_check_requested_at stays set until the check writes its result.
          content:
            application/json:
              schema: { $ref: '../components/external-sources.yaml#/components/schemas/ExternalConnection' }
        '400': { $ref: '../components/common.yaml#/components/responses/BadRequest' }
        '401': { $ref: '../components/common.yaml#/components/responses/Unauthenticated' }
        '404': { $ref: '../components/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../components/common.yaml#/components/responses/Conflict' }
  /v0/external-connections/{externalConnectionId}/reauthorizations:
    parameters:
      - name: externalConnectionId
        in: path
        required: true
        schema: { $ref: '../components/common.yaml#/components/schemas/Id' }
    post:
      tags: [External Sources]
      operationId: createExternalConnectionReauthorization
      description: A repeated submission reuses the reauthorization in progress and its Connect Link.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../components/external-sources.yaml#/components/schemas/CreateExternalConnectionReauthorizationRequest' }
      responses:
        '202':
          description: Candidate Connect Link created or reused without replacing the current upstream identity; the connection carries it while the reauthorization is in progress.
          content:
            application/json:
              schema: { $ref: '../components/external-sources.yaml#/components/schemas/ExternalConnection' }
        '400': { $ref: '../components/common.yaml#/components/responses/BadRequest' }
        '401': { $ref: '../components/common.yaml#/components/responses/Unauthenticated' }
        '404': { $ref: '../components/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../components/common.yaml#/components/responses/Conflict' }
        '503': { $ref: '../components/common.yaml#/components/responses/ServiceUnavailable' }
  /v0/external-connections/{externalConnectionId}/slack/conversations:
    parameters:
      - name: externalConnectionId
        in: path
        required: true
        schema: { $ref: '../components/common.yaml#/components/schemas/Id' }
    get:
      tags: [External Sources]
      operationId: listSlackConversations
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        '200':
          description: Account-owned Slack conversations visible to the authorized user.
          content:
            application/json:
              schema: { $ref: '../components/external-sources.yaml#/components/schemas/SlackConversationPage' }
        '401': { $ref: '../components/common.yaml#/components/responses/Unauthenticated' }
        '404': { $ref: '../components/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../components/common.yaml#/components/responses/Conflict' }
        '503': { $ref: '../components/common.yaml#/components/responses/ServiceUnavailable' }
  /v0/tenants/{tenantId}/skill-manifests:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Skills]
      operationId: listSkillManifests
      summary: List non-deleted immutable Skill Package versions in the Tenant market.
      parameters:
        - $ref: '../components/common.yaml#/components/parameters/Cursor'
        - $ref: '../components/common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Tenant-isolated versions, including disabled versions. Package scripts are inert.
          content:
            application/json:
              schema:
                $ref: '../components/skills.yaml#/components/schemas/SkillManifestPage'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
  /v0/tenants/{tenantId}/work-items:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Work Items]
      operationId: listWorkItems
      summary: List Work Items visible to the current Tenant Human.
      description: >-
        Returns Work Items in descending update order with an opaque stable cursor. Archived Work
        Items are excluded unless archived=true. Tenant scope preserves Tenant-wide Human
        visibility; personal scope is the current Human's Dashboard projection.
      parameters:
        - $ref: '../components/common.yaml#/components/parameters/Cursor'
        - $ref: '../components/common.yaml#/components/parameters/Limit'
        - name: scope
          in: query
          description: Tenant lists every readable Work Item; personal limits the Dashboard projection to Work Items related to the current Human or their sponsored Agents.
          schema:
            type: string
            enum: [tenant, personal]
            default: tenant
        - name: kind
          in: query
          schema:
            $ref: '../components/work-items.yaml#/components/schemas/WorkItemKind'
        - name: state
          in: query
          schema:
            $ref: '../components/work-items.yaml#/components/schemas/WorkItemState'
        - name: priority
          in: query
          schema:
            $ref: '../components/work-items.yaml#/components/schemas/WorkItemPriority'
        - name: execution_status
          in: query
          schema:
            $ref: '../components/task-executions.yaml#/components/schemas/TaskExecutionStatus'
        - name: pending_control
          in: query
          description: Filter Tasks by whether a control revision is waiting to be settled.
          schema:
            type: boolean
        - name: assignee_actor_id
          in: query
          schema:
            $ref: '../components/common.yaml#/components/schemas/Id'
        - name: origin_room_id
          in: query
          schema:
            $ref: '../components/common.yaml#/components/schemas/Id'
        - name: work_room_id
          in: query
          schema:
            $ref: '../components/common.yaml#/components/schemas/Id'
        - name: archived
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Cursor-paginated Tenant Work Items.
          content:
            application/json:
              schema:
                $ref: '../components/work-items.yaml#/components/schemas/WorkItemPage'
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
    post:
      tags: [Work Items]
      operationId: createWorkItem
      summary: Create a Tenant Issue as the current Human Actor; managed Tasks use Task creation approval.
      parameters:
        - $ref: '../components/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/work-items.yaml#/components/schemas/WorkItemCreateRequest'
      responses:
        '201':
          description: Work Item, Assignments, references, and creation activity committed atomically.
          headers:
            Idempotent-Replay:
              $ref: '../components/common.yaml#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema:
                $ref: '../components/work-items.yaml#/components/schemas/WorkItem'
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '409':
          $ref: '../components/common.yaml#/components/responses/Conflict'
        '503':
          $ref: '../components/common.yaml#/components/responses/ServiceUnavailable'
  /v0/rooms/{roomId}/documents:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [Documents]
      operationId: listRoomDocuments
      summary: List active Documents bound to the authorized Room for structured references.
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Stable page of active Room-bound Documents visible to the current Human.
          content:
            application/json:
              schema:
                $ref: '../components/room-documents.yaml#/components/schemas/DocumentPage'
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
    post:
      tags: [Documents]
      operationId: createRoomDocument
      summary: Create a Human-owned native Document bound to the authorized Room.
      description: A repeated submission creates another Document.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/room-documents.yaml#/components/schemas/ContextDocumentCreateRequest'
      responses:
        '201':
          description: Unified Document, initial Revision, Draft, owner root personal Placement, and Room Binding committed atomically.
          content:
            application/json:
              schema:
                $ref: '../components/room-documents.yaml#/components/schemas/Document'
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '409':
          $ref: '../components/common.yaml#/components/responses/Conflict'
        '503':
          $ref: '../components/common.yaml#/components/responses/ServiceUnavailable'
  /v0/rooms/{roomId}/documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/DocumentId'
    put:
      tags: [Documents]
      operationId: bindDocumentToRoom
      summary: Bind a shareable Document to the authorized Room with Viewer access, retaining any stronger existing Binding.
      description: A repeated submission finds the Binding active and returns the Document unchanged.
      responses:
        '200':
          description: Room Binding created, already active, or exactly replayed.
          content:
            application/json:
              schema:
                $ref: '../components/room-documents.yaml#/components/schemas/Document'
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '409':
          $ref: '../components/common.yaml#/components/responses/Conflict'
        '503':
          $ref: '../components/common.yaml#/components/responses/ServiceUnavailable'
  /v0/library/documents:
    get:
      tags: [Documents]
      operationId: listLibraryDocuments
      summary: List Documents visible to the current Human using a permission-safe smart view.
      parameters:
        - name: view
          in: query
          required: true
          schema:
            type: string
            enum: [recent, owned, shared, unfiled, shareable]
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Stable page of effective-access-filtered Documents.
          content:
            application/json:
              schema:
                $ref: '../components/room-documents.yaml#/components/schemas/DocumentPage'
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
  /v0/library/documents/search:
    get:
      tags: [Documents]
      operationId: searchLibraryDocuments
      summary: Search the Documents the caller reads by keyword in their visible text and indexed body.
      parameters:
        - name: q
          in: query
          required: true
          description: >-
            Case-insensitive substring matched against the title, the owner and creator display
            names, the names of bound Rooms the caller is a member of, the titles of bound Tasks,
            and the indexed body text. Formats, IDs and binding kinds are not matched. Trimmed
            before matching and 1 to 200 characters after trimming.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: tenant_id
          in: query
          description: Restrict results to one Tenant; without it the search spans every Tenant the caller belongs to.
          schema: { $ref: '../components/common.yaml#/components/schemas/Id' }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: >-
            Stable permission-safe search page; no matches returns an empty items array. A
            Document whose read access ends between the page query and its own read, such as a
            Direct share that just expired, is left out, so a page can hold fewer items than
            `limit` while `page.has_more` is true.
          content:
            application/json:
              schema:
                $ref: '../components/room-documents.yaml#/components/schemas/DocumentPage'
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '503':
          description: SEARCH_TIMEOUT when the search runs past its five-second limit. Clients narrow the query instead of retrying.
          content:
            application/json:
              schema:
                $ref: '../components/common.yaml#/components/schemas/ErrorResponse'
