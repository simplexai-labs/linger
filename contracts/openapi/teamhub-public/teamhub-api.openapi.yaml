  /v0/rooms/{roomId}/participation:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    put:
      tags: [Rooms]
      operationId: setRoomParticipation
      summary: Leave or rejoin an ordinary Room without changing the caller's membership role.
      description: >-
        Only existing Human members can change their own participation. Left members keep
        read access but cannot send Room or Thread messages and receive no Room delivery.
        Joining restores sending and delivery and advances the read cursor past the absence.
        Direct Rooms and Thread Rooms do not support independent participation changes. A repeated
        submission of the current status changes nothing and returns the Room.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/domain.yaml#/components/schemas/RoomParticipationRequest'
      responses:
        '200':
          description: Updated personal Room participation.
          content:
            application/json:
              schema:
                $ref: '../components/domain.yaml#/components/schemas/Room'
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '409':
          $ref: '../components/common.yaml#/components/responses/Conflict'
  /v0/rooms/{roomId}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [Rooms]
      operationId: getRoom
      summary: Get a Room where the caller is a current member.
      responses:
        '200':
          description: Room.
          content:
            application/json:
              schema:
                $ref: '../components/domain.yaml#/components/schemas/Room'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
    patch:
      tags: [Rooms]
      operationId: updateRoom
      summary: Update Room metadata.
      description: >-
        A repeated submission applies the same values again, returns the same Room and commits
        another room.updated event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/domain.yaml#/components/schemas/RoomUpdateRequest'
      responses:
        '200':
          description: Updated Room with room.updated committed atomically.
          content:
            application/json:
              schema:
                $ref: '../components/domain.yaml#/components/schemas/Room'
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../components/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '409':
          $ref: '../components/common.yaml#/components/responses/Conflict'
    delete:
      tags: [Rooms]
      operationId: deleteRoom
      summary: Logically delete a Room as a current owner.
      description: >-
        Logically deletes the Room in one transaction while retaining its persisted collaboration
        history for audit and later retention processing. Every membership is revoked and
        room.deleted is committed before the response; open Document connections of the Room's
        members are closed afterwards. Work Rooms cannot be deleted. Deletion cancels the queued
        and running Agent Runs of the Room. A repeated submission finds no Room and returns 404.
      responses:
        '204':
          description: Room deletion completed.
        '400':
          $ref: '../components/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '../components/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '409':
          $ref: '../components/common.yaml#/components/responses/Conflict'
  /v0/rooms/{roomId}/routines:
