      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Personal Profile]
      operationId: getPersonalProfile
      summary: Read the authenticated Human's current private Profile Revision.
      responses:
        '200':
          description: Current Revision and bounded history.
          content:
            application/json:
              schema: { $ref: '../components/personal-profile.yaml#/components/schemas/PersonalProfile' }
        '401': { $ref: '../components/common.yaml#/components/responses/Unauthenticated' }
        '404': { $ref: '../components/common.yaml#/components/responses/NotFound' }
  /v0/tenants/{tenantId}/personal-profile/revisions:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      tags: [Personal Profile]
      operationId: replacePersonalProfile
      summary: Replace the authenticated Human's Profile with their own edit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../components/personal-profile.yaml#/components/schemas/PersonalProfileReplaceRequest' }
      responses:
        '200':
          description: The current Revision after the edit; an unchanged Profile keeps its Revision.
          content:
            application/json:
              schema: { $ref: '../components/personal-profile.yaml#/components/schemas/PersonalProfileRevision' }
        '400': { $ref: '../components/common.yaml#/components/responses/BadRequest' }
        '401': { $ref: '../components/common.yaml#/components/responses/Unauthenticated' }
        '404': { $ref: '../components/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../components/common.yaml#/components/responses/Conflict' }
  /v0/tenants/{tenantId}/personal-insights:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Personal Profile]
      operationId: listPersonalInsights
      summary: Read the authenticated Human's current private Personal Insights.
      responses:
        '200':
          description: Current Personal Insights and the latest asynchronous generation state.
          content:
            application/json:
              schema:
                $ref: '../components/personal-profile.yaml#/components/schemas/PersonalInsightList'
        '401': { $ref: '../components/common.yaml#/components/responses/Unauthenticated' }
        '404': { $ref: '../components/common.yaml#/components/responses/NotFound' }
  /v0/tenants/{tenantId}/personal-insights/{personalInsightId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: personalInsightId
        in: path
        required: true
        schema: { $ref: '../components/common.yaml#/components/schemas/Id' }
    delete:
      tags: [Personal Profile]
      operationId: deletePersonalInsight
      summary: Hide one current Personal Insight and suppress the same content from regeneration.
      responses:
        '204':
          description: Personal Insight hidden from the current list.
        '401': { $ref: '../components/common.yaml#/components/responses/Unauthenticated' }
        '404': { $ref: '../components/common.yaml#/components/responses/NotFound' }
  /v0/tenants/{tenantId}/personal-profile-generations:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Personal Profile]
      operationId: listPersonalProfileGenerations
      summary: List the authenticated Human's Profile supplement generations.
      responses:
        '200':
          description: Generations for the current Human.
          content:
            application/json:
              schema:
                $ref: '../components/personal-profile.yaml#/components/schemas/PersonalProfileGenerationList'
        '401': { $ref: '../components/common.yaml#/components/responses/Unauthenticated' }
        '404': { $ref: '../components/common.yaml#/components/responses/NotFound' }
    post:
      tags: [Personal Profile]
      operationId: createPersonalProfileGeneration
      summary: Create one explicit Profile update generation from selected sources.
      description: A repeated submission queues another generation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/personal-profile.yaml#/components/schemas/PersonalProfileGenerationCreateRequest'
      responses:
        '201':
          description: Queued Profile generation that freezes the current baseline and selected sources.
          content:
            application/json:
              schema:
                $ref: '../components/personal-profile.yaml#/components/schemas/PersonalProfileGeneration'
        '400': { $ref: '../components/common.yaml#/components/responses/BadRequest' }
        '401': { $ref: '../components/common.yaml#/components/responses/Unauthenticated' }
        '404': { $ref: '../components/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../components/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../components/common.yaml#/components/responses/BadRequest' }
  /v0/external-apps:
    get:
      tags: [External Sources]
      operationId: listExternalApps
      summary: List the TeamHub-curated external application catalog.
      responses:
        '200':
          description: Curated applications, availability, and delivered capabilities.
          content:
            application/json:
              schema: { $ref: '../components/external-sources.yaml#/components/schemas/ExternalAppList' }
        '401': { $ref: '../components/common.yaml#/components/responses/Unauthenticated' }
  /v0/external-apps/provider-key:
    put:
      tags: [External Sources]
      operationId: saveExternalProviderKey
      summary: Save the deployment's Composio API key.
      description: >-
        For deployments without COMPOSIO_API_KEY. TeamHub checks the key by syncing the app
        catalog with it, then stores it encrypted with TEAMHUB_SECRET_ENCRYPTION_KEY. Any
        signed-in Human may save it; the key is never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../components/external-sources.yaml#/components/schemas/SaveExternalProviderKeyRequest' }
      responses:
        '200':
          description: Key status after saving.
          content:
            application/json:
              schema: { $ref: '../components/external-sources.yaml#/components/schemas/ExternalProviderKeyStatus' }
        '400': { $ref: '../components/common.yaml#/components/responses/BadRequest' }
        '401': { $ref: '../components/common.yaml#/components/responses/Unauthenticated' }
        '409': { $ref: '../components/common.yaml#/components/responses/Conflict' }
        '503': { $ref: '../components/common.yaml#/components/responses/ServiceUnavailable' }
  /v0/external-connections/{externalConnectionId}/discord/channels:
    parameters:
      - name: externalConnectionId
        in: path
        required: true
        schema: { $ref: '../components/common.yaml#/components/schemas/Id' }
    get:
      tags: [External Sources]
      operationId: listDiscordChannels
      responses:
        '200':
          description: Text-capable channels in the Discord Guild bound to this Account-owned connection.
          content:
            application/json:
              schema: { $ref: '../components/external-sources.yaml#/components/schemas/DiscordChannelList' }
        '401': { $ref: '../components/common.yaml#/components/responses/Unauthenticated' }
        '404': { $ref: '../components/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../components/common.yaml#/components/responses/Conflict' }
        '503': { $ref: '../components/common.yaml#/components/responses/ServiceUnavailable' }
  /v0/external-connections/{externalConnectionId}/github/repositories:
    parameters:
      - name: externalConnectionId
        in: path
        required: true
        schema: { $ref: '../components/common.yaml#/components/schemas/Id' }
    get:
      tags: [External Sources]
      operationId: listGitHubRepositories
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Public, owned, non-fork, non-archived repositories visible through this GitHub connection.
          content:
            application/json:
              schema: { $ref: '../components/external-sources.yaml#/components/schemas/GitHubRepositoryPage' }
        '400': { $ref: '../components/common.yaml#/components/responses/BadRequest' }
        '401': { $ref: '../components/common.yaml#/components/responses/Unauthenticated' }
        '404': { $ref: '../components/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../components/common.yaml#/components/responses/Conflict' }
        '503': { $ref: '../components/common.yaml#/components/responses/ServiceUnavailable' }
  /v0/external-connections/{externalConnectionId}/notion/resources:
    parameters:
      - name: externalConnectionId
        in: path
        required: true
        schema: { $ref: '../components/common.yaml#/components/schemas/Id' }
    get:
      tags: [External Sources]
      operationId: listNotionResources
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Pages and databases visible to the current Notion integration.
          content:
            application/json:
              schema: { $ref: '../components/external-sources.yaml#/components/schemas/NotionResourcePage' }
        '400': { $ref: '../components/common.yaml#/components/responses/BadRequest' }
        '401': { $ref: '../components/common.yaml#/components/responses/Unauthenticated' }
        '404': { $ref: '../components/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../components/common.yaml#/components/responses/Conflict' }
        '503': { $ref: '../components/common.yaml#/components/responses/ServiceUnavailable' }
  /v0/external-connections/{externalConnectionId}/google-calendar/calendars:
    parameters:
      - name: externalConnectionId
        in: path
        required: true
        schema: { $ref: '../components/common.yaml#/components/schemas/Id' }
    get:
      tags: [External Sources]
      operationId: listGoogleCalendars
      parameters:
        - { name: page_token, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 250, default: 100 } }
      responses:
        '200':
          description: Readable calendars visible through the Account-owned Google Calendar connection.
          content:
            application/json:
              schema: { $ref: '../components/external-sources.yaml#/components/schemas/GoogleCalendarPage' }
        '401': { $ref: '../components/common.yaml#/components/responses/Unauthenticated' }
        '404': { $ref: '../components/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../components/common.yaml#/components/responses/Conflict' }
        '503': { $ref: '../components/common.yaml#/components/responses/ServiceUnavailable' }
components:
  schemas:
    VoiceLiveClientEvent:
      $ref: '../components/voice-media.yaml#/components/schemas/VoiceLiveClientEvent'
    VoiceLiveRuntimeEvent:
