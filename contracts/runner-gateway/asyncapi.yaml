asyncapi: 3.0.0
info:
  title: Linger Runner Gateway
  version: 2.0.0
  description: >-
    Authenticated bidirectional Agent Runner desired state and Runtime operation
    protocol between Agent Service and a Local Computer Daemon. Every frame
    carries protocol_version 2. The only capabilities a Computer declares are
    host features (browser_connection and computer_permissions). A desktop
    upgrade can leave a newer Computer connected to an older Agent Service,
    so a frame family added within protocol 2 is gated: runner.welcome's
    service_features names each one the service accepts, and the Computer
    sends nothing from a family the list leaves out. The service sends the
    field only to a Computer release that decodes it, because an older
    Computer rejects unknown welcome keys.
    The Daemon initiates the WebSocket connection; the service-issued
    connection epoch fences commands and responses after reconnect. The
    Daemon receives runner.reconciled only after the service has completed
    operation reconciliation; runner.welcome alone is not readiness.
    Messages come in coarse families distinguished by one field: prepare and
    prepared (target operation or provider), cancel (target operation or
    model_invoke), execute and executed (kind session_compact, model_invoke,
    computer_tool, skills_scan, browser_connect, computer_permission,
    local_models, model_source, debug_history or
    cli_credential), agent_runner.state (state ready, removed or failed) and
    operation.input_result (outcome accepted, rejected or closed); the
    Operation family carries operation.start, operation.input, operation.ack,
    operation.accepted, operation.event and the three terminal outcomes.
    Unknown message types close the connection with protocol error 1002;
    prepared for a provider and executed for model_invoke are advisory.
    A Computer that connects with an older protocol is answered only with a
    runner.welcome carrying target_release, so it updates itself; it receives
    no work.
    A Context View is named only by its view_digest, the SHA-256 of its content
    manifest. Before a prepare, operation.start or operation.input reaches its
    Runtime, the Computer brings the View to that digest itself: it fetches
    views/<view_digest> and the files it lacks (files/<sha256>) from the
    context_content_url of the current runner.welcome, verifies every file's
    size and SHA-256, and fetches the named Skill packages from TeamHub with
    the Agent credential. A manifest may carry a TeamHub-trusted
    shared_task_scope, and the Computer links the shared Task directory into
    the playground.
    execute with kind model_invoke is a one-shot model call on the Computer's
    Codex, Claude or Pi Runtime that has no Context, takes no execution slot
    and is not in the Operation ledger. Its optional model selects the provider
    model explicitly (sent only to a Computer release that decodes it),
    matching Agent Runs and loading a named Pi library model on demand; when
    omitted, the Runtime uses its default. A Pi call has no workspace tools.
    The service sends Pi calls only to a
    Computer release that can decode them. The Agent Service's model scheduler
    decides when a call is sent; the Daemon runs every call it receives. Its
    optional session_key lets a Daemon answer the structured Codex calls of
    one session in one resident thread; the result is the same either way.
    cancel with target model_invoke stops one running call so the scheduler
    can swap it out; the call's executed model_invoke still follows. The
    service sends it only to a Computer release that decodes it. Extended
    model_invoke outcomes (context_too_long and unsupported) travel only after
    a runner.welcome whose service_features names model_invoke_outcomes.
    execute with kind
    computer_tool runs native browser actions, retained Task output reads,
    and Feishu Mail calls through the owner's own lark-cli login, limited to
    the owner's mailbox API paths.
    TeamHub resolves the owner, Agent and Task scope; the Computer checks its
    current assignment and retained scope. No Meta Context or model turn is
    started. Responses carry the same owner and connection epoch.
    Disconnect/timeout means an unknown outcome; the caller must inspect
    effects and must not automatically replay actions.
    execute with kind local_models acts on the Computer's localmodels
    library (download, cancel, load with unload_first, unload, remove, or
    refresh). The Computer answers executed with outcome accepted or refused
    at once and supervises the long-running localmodels job itself; progress
    and outcomes reach the service only as runner.local_models snapshots,
    which the Computer sends after a runner.welcome whose service_features
    names local_models, after every library change, and at most every 2
    seconds while a download or load runs. Extended diagnostic reasons,
    refusal codes, and optional debug-mode metadata travel only after a
    runner.welcome whose service_features names local_models_diagnostics.
    Per-model inference engine fields (engine, engine_label, concurrency,
    host_ram_bytes) travel only after a runner.welcome whose service_features
    names local_models_engine, advertised to Computer 0.61.0 and later.
    Per-model concurrency_probing (indicating a post-load max-concurrency probe
    is running before reporting loaded) travels only after a runner.welcome
    whose service_features names local_models_concurrency_probe, advertised to
    Computer 0.64.0 and later.
    execute with kind model_source reads or switches the Computer's model
    source. A BYOK input names its address as base_url, path and endpoint
    with an explicit protocol, and the Computer sends one request there; the
    service sends a BYOK input only to a Computer release that decodes it.
    The Computer's BYOK summary carries path and endpoint only after a
    runner.welcome whose service_features names byok_endpoint.
x-frame-limits:
  maxBytes: 4194304
  maxDepth: 32
  maxArrayItems: 1024
  maxObjectProperties: 256
  maxNodes: 65536
servers:
  production:
    host: agents.example.invalid
    pathname: /v1/runner-gateway
    protocol: wss
    security:
      - $ref: "#/components/securitySchemes/runnerBearer"
channels:
  runnerGateway:
    address: /v1/runner-gateway
    messages:
      agentToDaemon:
        $ref: "#/components/messages/AgentToDaemonEnvelope"
      daemonToAgent:
        $ref: "#/components/messages/DaemonToAgentEnvelope"
operations:
  agentServiceSends:
    action: send
    channel:
      $ref: "#/channels/runnerGateway"
    messages:
      - $ref: "#/channels/runnerGateway/messages/agentToDaemon"
  agentServiceReceives:
    action: receive
    channel:
      $ref: "#/channels/runnerGateway"
    messages:
      - $ref: "#/channels/runnerGateway/messages/daemonToAgent"
components:
  securitySchemes:
    runnerBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-runner-credential
      description: Send the pre-provisioned Runner credential as Authorization Bearer.
  messages:
    AgentToDaemonEnvelope:
      name: AgentToDaemonEnvelope
      contentType: application/json
      payload:
        $ref: "./envelope.schema.json#/$defs/AgentToDaemonEnvelope"
    DaemonToAgentEnvelope:
      name: DaemonToAgentEnvelope
      contentType: application/json
      payload:
        $ref: "./envelope.schema.json#/$defs/DaemonToAgentEnvelope"
